            description: |-
                Stops sending a webhook changes. Changes made while it is paused are not
                 sent; deliveries already pending wait. Idempotent.
            operationId: WebhookService_PauseWebhook
            parameters:
                - name: webhook
                  in: path
                  description: The webhook id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
