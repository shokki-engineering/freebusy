          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Rate Plan
    delete:
      tags:
        - Rate Plan Service
      description: |-
        Deletes a rate plan.

         Prefer archiving (state ARCHIVED) over deleting: a booking priced under a
         plan must stay explainable after the plan stops being offered, and a delete
         takes that record away.
      operationId: RatePlanService_DeleteRatePlan
      parameters:
        - name: ratePlan
          in: path
          description: The ratePlan id.
          required: true
          schema:
            type: string
        - name: etag
          in: query
          description: |-
            Opaque version read from the rate plan; the delete is rejected if it
             changed since (AIP-154).
