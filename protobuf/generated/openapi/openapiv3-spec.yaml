      description: |-
        Updates a rate plan.

         Editing a plan changes what future quotes cost; it does not reprice a
         booking already taken, which carries the components it was quoted under.
      operationId: RatePlanService_UpdateRatePlan
      parameters:
        - name: ratePlan
          in: path
          description: The ratePlan id.
          required: true
          schema:
            type: string
        - name: updateMask
          in: query
          description: Fields to update. An empty mask updates all mutable fields.
