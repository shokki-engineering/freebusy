# Base skeleton for the merged OpenAPI spec: everything that is fixed rather than
# derived from the per-service specs. Key order here is the output order.
# Embedded into the openapi tool (see main.go); override with `-base <file>`.
openapi: 3.0.0
info:
  title: FreeBusy API
  summary: Scheduling, availability, and booking platform API.
  description: |-
    FreeBusy is a scheduling platform that exposes resources, schedules, availability windows, bookings, organisations, and promotional codes over a RESTful, OpenAPI-described surface. This document is generated from Protocol Buffer service definitions and merged into a single specification.

    Authentication is performed via bearer tokens unless otherwise noted. All timestamps are RFC 3339 and all monetary amounts follow the associated currency's minor units.
  version: 1.0.0
  termsOfService: https://freebusy.oh-tarnished.dev/terms
  contact:
    name: FreeBusy API Support
    url: https://freebusy.oh-tarnished.dev/support
    email: support@oh-tarnished.dev
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
externalDocs:
  description: FreeBusy API documentation
  url: https://freebusy.oh-tarnished.dev/docs
servers:
  - url: https://freebusy.oh-tarnished.dev
    description: Production
  - url: https://staging.freebusy.oh-tarnished.dev
    description: Staging
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Allocation Service
  - name: Channel Service
  - name: Hold Service
  - name: Identity Service
  - name: Licence Service
  - name: Organisation Service
  - name: Promo Code Service
  - name: Quote Service
  - name: Rate Plan Service
  - name: Reservation Service
paths:
  /v1/organizationalUnits/{organizationalUnit}:checkAvailability:
    post:
      tags:
        - Allocation Service
      description: |-
        Checks one exact window for one exact quantity, with reasons when it fails.

         Advisory, not a reservation: the answer can be stale the instant it is
         returned. CreateHold is what actually secures anything.
      operationId: AllocationService_CheckAvailability
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Check Availability
  /v1/organizationalUnits/{organizationalUnit}:computeAvailability:
    post:
      tags:
        - Allocation Service
      description: Computes availability across a site's resources, bucketed by slot or day.
      operationId: AllocationService_ComputeAvailability
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Compute Availability
  /v1/organizations/{organization}:searchAvailability:
    post:
      tags:
        - Allocation Service
      description: |-
        Sweeps an operator for resources free across a window.

         The search entry point, where ComputeAvailability answers for a site the
         caller has already chosen. Paginated, since a large operator may match
         thousands of resources.
      operationId: AllocationService_SearchAvailability
      parameters:
        - name: organization
          in: path
          description: The organization id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Search Availability
  /v1/resources:batchCompute:
    post:
      tags:
        - Allocation Service
      description: |-
        Runs several availability computations in one round trip.

         Each entry is independent and may name a different site, window or
         granularity. Capped at 50 entries, because each one fans out across every
         candidate resource's calendar.
      operationId: AllocationService_BatchComputeAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchComputeAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchComputeAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Batch Compute Availability
  /v1/organizationalUnits/{organizationalUnit}/holds:
    get:
      tags:
        - Hold Service
      description: Lists the holds taken at a site.
      operationId: HoldService_ListHolds
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum holds to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListHoldsResponse.next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression, AIP-160, over the hold's own fields, e.g.
             `state=HOLD_STATE_ACTIVE`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHoldsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Holds
    post:
      tags:
        - Hold Service
      description: |-
        Takes a hold, allocating concrete resources for the window.

         The server chooses which resources are taken from the candidates offered,
         under a lock, so two callers racing for the last bay cannot both win.
         Requires an idempotency key: a retry after a timeout returns the original
         hold rather than taking a second one.
      operationId: HoldService_CreateHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: holdId
          in: query
          description: |-
            Client-assigned id, becoming the last segment of the hold name. The server
             generates one when empty.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hold'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Hold
  /v1/organizationalUnits/{organizationalUnit}/holds/{hold}:
    get:
      tags:
        - Hold Service
      description: |-
        Retrieves one hold.

         Authoritative on expiry: a hold whose expire_time has passed is reported
         EXPIRED here even if the sweeper has not yet written that state, so a
         caller never sees an ACTIVE hold that no longer reserves anything.
      operationId: HoldService_GetHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Hold
    delete:
      tags:
        - Hold Service
      description: |-
        Deletes a hold record.

         Housekeeping for terminal holds, not a way to free resources -- use
         ReleaseHold for that. Deleting an ACTIVE hold is rejected, so inventory is
         never freed by a path that leaves no audit trail.
      operationId: HoldService_DeleteHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
        - name: etag
          in: query
          description: |-
            Opaque version read from the hold; the delete is rejected if the hold
             changed since (AIP-154).
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Delete Hold
  /v1/organizationalUnits/{organizationalUnit}/holds/{hold}:extend:
    post:
      tags:
        - Hold Service
      description: |-
        Pushes a hold's expiry further out.

         Measured from now rather than from the current deadline, so repeated calls
         cannot accumulate an unbounded reservation. Fails on a hold that is not
         ACTIVE -- an expired hold is gone, not extendable.
      operationId: HoldService_ExtendHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendHoldRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Extend Hold
  /v1/organizationalUnits/{organizationalUnit}/holds/{hold}:release:
    post:
      tags:
        - Hold Service
      description: |-
        Gives a hold up before it expires, freeing its resources immediately.

         Idempotent: releasing an already-released or expired hold succeeds and
         changes nothing, because the caller's intent is already satisfied.
      operationId: HoldService_ReleaseHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseHoldRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Release Hold
  /v1/channels:
    get:
      tags:
        - Channel Service
      description: Lists channels.
      operationId: ChannelService_ListChannels
      parameters:
        - name: pageSize
          in: query
          description: Maximum number of channels to return. The server may cap this.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListChannels call's next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression (AIP-160), e.g. `property = "properties/9"`,
             `type = CHANNEL_TYPE_AGODA`, or `state = CHANNEL_STATE_CONNECTED`.
          schema:
            type: string
        - name: orderBy
          in: query
          description: Sort order, e.g. "create_time desc".
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChannelsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Channels
    post:
      tags:
        - Channel Service
      description: Creates a channel connection for a property.
      operationId: ChannelService_CreateChannel
      parameters:
        - name: channelId
          in: query
          description: Optional caller-chosen ID for the channel; the server generates one if unset.
          schema:
            type: string
        - name: requestId
          in: query
          description: Caller-supplied idempotency key; identical retries return the first result.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Channel
  /v1/channels/{channel}:
    get:
      tags:
        - Channel Service
      description: Gets a single channel.
      operationId: ChannelService_GetChannel
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Channel
    delete:
      tags:
        - Channel Service
      description: Deletes a channel connection.
      operationId: ChannelService_DeleteChannel
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: force
          in: query
          description: |-
            If true, delete the channel and its unit mappings; if false and mappings
             exist, the call fails.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Delete Channel
    patch:
      tags:
        - Channel Service
      description: Updates a channel.
      operationId: ChannelService_UpdateChannel
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: updateMask
          in: query
          description: Fields to overwrite. Omit to replace all mutable fields.
          schema:
            type: string
            format: field-mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Update Channel
  /v1/channels/{channel}/syncEvents:
    get:
      tags:
        - Channel Service
      description: Lists a channel's sync events.
      operationId: ChannelService_ListSyncEvents
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum number of events to return.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListSyncEvents call's next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression (AIP-160), e.g. `direction = SYNC_DIRECTION_OUTBOUND`,
             `state = SYNC_STATE_FAILED`.
          schema:
            type: string
        - name: orderBy
          in: query
          description: Sort order, e.g. "event_time desc".
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSyncEventsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Sync Events
  /v1/channels/{channel}/syncStatus:
    get:
      tags:
        - Channel Service
      description: Reports a channel's sync health.
      operationId: ChannelService_GetChannelSyncStatus
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSyncStatus'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Channel Sync Status
  /v1/channels/{channel}/unitMappings:
    get:
      tags:
        - Channel Service
      description: Lists the unit mappings on a channel.
      operationId: ChannelService_ListUnitMappings
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum number of mappings to return.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListUnitMappings call's next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: Filter expression (AIP-160), e.g. `state = MAPPING_STATE_UNMAPPED`.
          schema:
            type: string
        - name: orderBy
          in: query
          description: Sort order.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUnitMappingsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Unit Mappings
    post:
      tags:
        - Channel Service
      description: Maps a unit to the channel's external room type / rate plan.
      operationId: ChannelService_CreateUnitMapping
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: unitMappingId
          in: query
          description: Optional caller-chosen ID for the mapping; the server generates one if unset.
          schema:
            type: string
        - name: requestId
          in: query
          description: Caller-supplied idempotency key; identical retries return the first result.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitMapping'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitMapping'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Unit Mapping
  /v1/channels/{channel}/unitMappings/{unitMapping}:
    get:
      tags:
        - Channel Service
      description: Gets a single unit mapping.
      operationId: ChannelService_GetUnitMapping
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: unitMapping
          in: path
          description: The unitMapping id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitMapping'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Unit Mapping
    delete:
      tags:
        - Channel Service
      description: Deletes a unit mapping.
      operationId: ChannelService_DeleteUnitMapping
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: unitMapping
          in: path
          description: The unitMapping id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Delete Unit Mapping
    patch:
      tags:
        - Channel Service
      description: Updates a unit mapping.
      operationId: ChannelService_UpdateUnitMapping
      parameters:
        - name: channel
          in: path
          description: The channel id.
          required: true
          schema:
            type: string
        - name: unitMapping
          in: path
          description: The unitMapping id.
          required: true
          schema:
            type: string
        - name: updateMask
          in: query
          description: Fields to overwrite. Omit to replace all mutable fields.
          schema:
            type: string
            format: field-mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitMapping'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitMapping'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Update Unit Mapping
  /v1/channels/{channel}:disable:
    post:
      tags:
        - Channel Service
      description: Disables a channel, pausing ARI push and reservation pull.
