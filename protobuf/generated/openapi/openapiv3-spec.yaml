                $ref: '#/components/schemas/BookingGuests'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Booking Guests
    patch:
      tags:
        - Scheduling Service
      description: Replaces the staying party (guests and occupancy) on a booking.
      operationId: SchedulingService_UpdateBookingGuests
      parameters:
        - name: booking
          in: path
