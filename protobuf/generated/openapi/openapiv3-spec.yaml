            type: string
        - name: filter
          in: query
          description: Filter expression, AIP-160 <https://aip.dev/160>.
          schema:
            type: string
        - name: showDeleted
          in: query
          description: Include soft-deleted resources in the result. AIP-164 <https://aip.dev/164>.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResourcesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Resources
    post:
      tags:
        - Resources
      description: |-
        Creates a resource.

           POST /v1/resources
           body: the resource itself

         Server-assigned fields on the request body are ignored: `name`, `uid`,
         `etag` and the timestamps are set by the server regardless of what is
         sent. Supply `resource_id` to choose the final path segment; leave it
         empty and the server generates one.

         Not idempotent. Retrying after a timeout may create a second resource;
         supply `resource_id` if the caller needs retry safety.

           ALREADY_EXISTS     that resource_id is taken
           INVALID_ARGUMENT   a field violates its buf.validate constraint
           PERMISSION_DENIED  caller may not create here
      operationId: Resources_CreateResource
      parameters:
        - name: resourceId
          in: query
          description: |-
            Client-assigned id, becoming the last segment of the resource name. The
             server generates one when empty.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Resource
  /v1/resources/{resource}:
    get:
      tags:
        - Resources
      description: |-
        Retrieves one resource.

           GET /v1/{name=resources/*}

         Safe and idempotent. Returns the resource as stored; no field is computed
         per-caller. Read the `etag` here and pass it back on update or delete to
         make the write conditional.

           NOT_FOUND          no such resource, or it is soft-deleted and `show_deleted` was not set
           INVALID_ARGUMENT   name does not match resources/*
           PERMISSION_DENIED  caller may not read it
      operationId: Resources_GetResource
      parameters:
        - name: resource
          in: path
          description: The resource id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Resource
    delete:
      tags:
        - Resources
      description: |-
        Deletes a resource.

           DELETE /v1/{name=resources/*}

         Soft delete: the resource is marked deleted, disappears from List unless
         `show_deleted` is set, and is purged at `expire_time`. Recover it with
         Undelete before then. Bookings already on its calendar are untouched --
         retiring a bay does not cancel what is parked on it.

         Idempotent in effect but not in reporting: a second delete returns
         NOT_FOUND rather than succeeding silently.

           NOT_FOUND          no such resource
           ABORTED            etag does not match
           PERMISSION_DENIED  caller may not delete it
      operationId: Resources_DeleteResource
      parameters:
        - name: resource
          in: path
          description: The resource id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Delete Resource
    patch:
      tags:
        - Resources
      description: |-
        Updates a resource.

           PATCH /v1/{resource.name=resources/*}
           body: the resource itself

         A partial update: only fields named in `update_mask` are written. An
         empty mask writes every mutable field, which will clear anything the
         caller left unset -- pass a mask unless that is the intent. OUTPUT_ONLY
         and IMMUTABLE fields are rejected rather than silently dropped.

         Idempotent. Pass the `etag` read from Get to make the write conditional.

           NOT_FOUND          no such resource
           ABORTED            etag does not match the stored resource
           INVALID_ARGUMENT   mask names an unknown or immutable field
           PERMISSION_DENIED  caller may not modify it
      operationId: Resources_UpdateResource
      parameters:
        - name: resource
          in: path
          description: The resource id.
          required: true
          schema:
            type: string
        - name: updateMask
          in: query
          description: Fields to update. An empty mask updates all mutable fields.
          schema:
            type: string
            format: field-mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Update Resource
  /v1/resources/{resource}:undelete:
    post:
      tags:
        - Resources
      description: |-
        Restores a soft-deleted resource.

           POST /v1/{name=resources/*}:undelete

         Valid only before `expire_time`; after that the resource is gone and this
         returns NOT_FOUND. Clears `delete_time` and `expire_time` and returns the
         resource as it was.

           NOT_FOUND          no such resource, or already purged
           ALREADY_EXISTS     the resource is not deleted
           PERMISSION_DENIED  caller may not restore it
      operationId: Resources_UndeleteResource
      parameters:
        - name: resource
          in: path
          description: The resource id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndeleteResourceRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Undelete Resource
components: {schemas: {AvailabilityBucket: {type: object, properties: {window: {allOf: [{$ref: '#/components/schemas/Interval'}], description: "The span this bucket covers: one slot, or one calendar day in the target\n time zone, per the request's granularity."}, freeCount: {type: integer, description: How many candidate resources are free across the whole span., format: int32}, totalCount: {type: integer, description: "How many candidates were considered. `free_count` out of this is the\n \"5 of 12 free\" a caller renders.", format: int32}, freeResources: {type: array, items: {type: string}, description: "Which resources are free, when the request asked for them. Omitted by\n default: a car park with 200 bays would otherwise repeat 200 names in\n every bucket of every day.\n Format: resources/{resource}"}}, description: "One slice of an availability answer: how many resources are free across a\n span, and which ones.\n\n This is where pooling happens. No RFC counts inventory -- RFC 5545 and 7953\n are one-calendar-one-timeline -- so a count is produced by asking each\n resource's calendar whether it is free and totalling the answers, rather than\n by storing a capacity number anywhere."}, AvailabilityMatch: {type: object, properties: {resource: {type: string, description: "The free resource.\n Format: resources/{resource}"}, organizationalUnit: {type: string, description: "The site it belongs to.\n Format: organizationalUnits/{organizational_unit}"}, window: {allOf: [{$ref: '#/components/schemas/Interval'}], description: 'The span it is free for, which may be narrower than the searched window.'}, resourceTypes: {type: array, items: {type: string}, description: "RESOURCE-TYPE values carried by the resource, RFC 9073 section 6.3, echoed\n so a caller can group results without re-fetching each resource."}, displayName: {type: string, description: 'The resource''s display name, echoed for the same reason.'}}, description: 'One resource that satisfies a search, with the