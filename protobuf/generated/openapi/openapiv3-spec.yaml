  /v1/organizationalUnits/{organizationalUnit}/reservations:
    get:
      tags:
        - Reservation Service
      description: Lists a site's reservations.
      operationId: ReservationService_ListReservations
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum reservations to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListReservationsResponse.next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression, AIP-160, e.g.
             `state = RESERVATION_STATE_CONFIRMED AND start_time >= "2026-11-10T00:00:00Z"`.
          schema:
            type: string
        - name: orderBy
          in: query
          description: Ordering, AIP-132, e.g. `start_time desc`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReservationsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Reservations
    post:
      tags:
        - Reservation Service
      description: |-
        Makes a reservation from a live hold, converting the hold so its
         resources stay taken.

         Idempotent: a hold backs at most one reservation, so a retry returns the
         reservation the first call made. Fails with FAILED_PRECONDITION when the
         hold has lapsed or been released.
      operationId: ReservationService_CreateReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservationId
          in: query
          description: |-
            Client-assigned id, becoming the last segment of the reservation name.
             Defaults to the hold's id. A hold backs at most one reservation whatever
             its id, so naming a hold that already has one returns that reservation.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Reservation
  /v1/organizationalUnits/{organizationalUnit}/reservations/{reservation}:
    get:
      tags:
        - Reservation Service
      description: Retrieves one reservation.
      operationId: ReservationService_GetReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservation
          in: path
          description: The reservation id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Reservation
  /v1/organizationalUnits/{organizationalUnit}/reservations/{reservation}:cancel:
    post:
      tags:
        - Reservation Service
      description: |-
        Cancels a reservation, freeing its resources.

         Idempotent: cancelling a cancelled reservation succeeds and changes
         nothing.
      operationId: ReservationService_CancelReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservation
          in: path
          description: The reservation id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Cancel Reservation
  /v1/organizationalUnits/{organizationalUnit}/reservations/{reservation}:reschedule:
    post:
      tags:
        - Reservation Service
      description: |-
        Moves a confirmed reservation onto a new hold, returning the reservation
         that replaces it.

         The replacement is a new reservation made from the new hold, linked both
         ways (`replaces`, `replacement`); the original ends RESCHEDULED. The
         original keeps its resources until the replacement is confirmed, so a
         failure part-way -- the new hold lapsing, a crash -- leaves the customer
         with their old booking, never with neither. Idempotent: repeating the call
         with the same hold returns the same replacement.
      operationId: ReservationService_RescheduleReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservation
          in: path
          description: The reservation id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleReservationRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Reschedule Reservation
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using a JWT access token.
  schemas:
    AvailabilityBucket:
      type: object
      properties:
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: |-
            The span this bucket covers: one slot, or one calendar day in the target
             time zone, per the request's granularity.
        freeCount:
          type: integer
          description: How many candidate resources are free across the whole span.
          format: int32
        totalCount:
          type: integer
          description: |-
            How many candidates were considered. `free_count` out of this is the
             "5 of 12 free" a caller renders.
          format: int32
        freeResources:
          type: array
          items:
            type: string
          description: |-
            Which resources are free, when the request asked for them. Omitted by
             default: a car park with 200 bays would otherwise repeat 200 names in
             every bucket of every day.
             Format: resources/{resource}
      description: |-
        One slice of an availability answer: how many resources are free across a
         span, and which ones.

         This is where pooling happens. No RFC counts inventory -- RFC 5545 and 7953
         are one-calendar-one-timeline -- so a count is produced by asking each
         resource's calendar whether it is free and totalling the answers, rather than
         by storing a capacity number anywhere.
    AvailabilityMatch:
      type: object
      properties:
        resource:
          type: string
          description: |-
            The free resource.
             Format: resources/{resource}
        organizationalUnit:
          type: string
          description: |-
            The site it belongs to.
             Format: organizationalUnits/{organizational_unit}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The span it is free for, which may be narrower than the searched window.
        resourceTypes:
          type: array
          items:
            type: string
          description: |-
            RESOURCE-TYPE values carried by the resource, RFC 9073 section 6.3, echoed
             so a caller can group results without re-fetching each resource.
      description: One resource that satisfies a search, with the window it is free for.
    BatchComputeAvailabilityRequest:
      required:
        - requests
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/ComputeAvailabilityRequest'
          description: |-
            The computations to run. Capped at 50 to bound the calendar reads a single
             call can trigger.
      description: |-
        Request message for AllocationService.BatchComputeAvailability. Each entry is
         a full ComputeAvailabilityRequest, so sites, windows and granularities may
         differ within one batch.
    BatchComputeAvailabilityResponse:
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/ComputeAvailabilityResponse'
          description: One response per request, in the order requested.
      description: Response message for AllocationService.BatchComputeAvailability.
    CheckAvailabilityRequest:
      required:
        - parent
        - window
      type: object
      properties:
        parent:
          type: string
          description: |-
            The site whose resources to check.
             Format: organizationalUnits/{organizational_unit}
        resources:
          type: array
          items:
            type: string
          description: |-
            Restrict the check to these resources. Empty means every resource the site
             holds.
             Format: resources/{resource}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The exact window to check.
        quantity:
          type: integer
          description: How many resources are needed. Defaults to 1.
          format: int32
      description: Request message for AllocationService.CheckAvailability.
    CheckAvailabilityResponse:
      type: object
      properties:
        bookable:
          type: boolean
          description: Whether `quantity` resources can be held for the window right now.
        freeCount:
          type: integer
          description: How many are actually free, which may be fewer than requested.
          format: int32
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/UnbookableReason'
          description: Why not, when bookable is false. Empty when it is true.
        candidateResources:
          type: array
          items:
            type: string
          description: |-
            Which resources would be taken, in the order the allocator would pick
             them. Advisory: another caller may take one before a hold is created.
             Format: resources/{resource}
      description: Response message for AllocationService.CheckAvailability.
    ComputeAvailabilityRequest:
      required:
        - parent
        - window
      type: object
      properties:
        parent:
          type: string
          description: |-
            The site whose resources to compute over.
             Format: organizationalUnits/{organizational_unit}
        resources:
          type: array
          items:
            type: string
          description: |-
            Restrict the computation to these resources. Empty means every resource
             the site holds.
             Format: resources/{resource}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The window to compute over.
        granularity:
          type: integer
          description: How to slice the window. Defaults by window length.
          format: enum
        slotDuration:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: Slot length for SLOT granularity. Ignored for DAY.
        timeZone:
          type: string
          description: |-
            IANA time zone the day boundaries are drawn in, e.g. "Asia/Kolkata".
             Defaults to the site's zone. Required in effect for DAY granularity, since
             "a night" has no meaning without one.
        includeFreeResources:
          type: boolean
          description: |-
            Populate AvailabilityBucket.free_resources. Off by default: a large site
             would otherwise repeat every resource name in every bucket.
      description: Request message for AllocationService.ComputeAvailability.
    ComputeAvailabilityResponse:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityBucket'
          description: One bucket per slot or day, in ascending time order.
        totalCount:
          type: integer
          description: How many resources were considered across the whole window.
          format: int32
      description: Response message for AllocationService.ComputeAvailability.
    GoogleProtobufAny:
      type: object
      properties:
        '@type':
          type: string
          description: The type of the serialized message.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    Interval:
      type: object
      properties:
        startTime:
          type: string
          description: |-
            Optional. Inclusive start of the interval.

             If specified, a Timestamp matching this interval will have to be the same
             or after the start.
          format: date-time
        endTime:
          type: string
          description: |-
            Optional. Exclusive end of the interval.

             If specified, a Timestamp matching this interval will have to be before the
             end.
          format: date-time
      description: |-
        Represents a time interval, encoded as a Timestamp start (inclusive) and a
         Timestamp end (exclusive).

         The start must be less than or equal to the end.
         When the start equals the end, the interval is empty (matches no time).
         When both start and end are unspecified, the interval matches any time.
    SearchAvailabilityRequest:
      required:
        - parent
        - window
      type: object
      properties:
        parent:
          type: string
          description: |-
            The operator to search within.
             Format: organizations/{organization}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The window that must be free.
        organizationalUnits:
          type: array
          items:
            type: string
          description: |-
            Restrict to sites, e.g. one car park or one hotel. Empty searches all.
             Format: organizationalUnits/{organizational_unit}
        resourceTypes:
          type: array
          items:
            type: string
          description: |-
            Restrict to RESOURCE-TYPE values, RFC 9073 section 6.3, e.g. "room" or
             "parking-bay". Empty matches every type.
        quantity:
          type: integer
          description: |-
            How many resources must be free together at one site for it to match.
             Defaults to 1.
          format: int32
        pageSize:
          type: integer
          description: Maximum matches to return. Defaults to 50, capped at 1000.
          format: int32
        pageToken:
          type: string
          description: Page token from a previous SearchAvailabilityResponse.next_page_token.
      description: |-
        Request message for AllocationService.SearchAvailability. Sweeps a whole
         operator for resources free across a window, where ComputeAvailability
         answers for one site already chosen.
    SearchAvailabilityResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityMatch'
          description: The free resources found.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for AllocationService.SearchAvailability.
    Status:
      type: object
      properties:
        code:
          type: integer
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          format: int32
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/GoogleProtobufAny'
          description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
      description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
    UnbookableReason:
      type: object
      properties:
        code:
          type: integer
          description: What went wrong, as a code a caller can branch on.
          format: enum
        message:
          type: string
          description: Human-readable detail for logs and support, not for parsing.
        resource:
          type: string
          description: |-
            The resource this reason is about, when it concerns one in particular.
             Format: resources/{resource}
      description: Why a requested window is not bookable.
    ExtendHoldRequest:
      required:
        - name
        - duration
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the hold to extend.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        duration:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: |-
            How much further out to push expire_time, measured from now rather than
             from the current deadline, so repeated extensions cannot accumulate.
        etag:
          type: string
          description: |-
            Opaque version read from the hold; the extension is rejected if the hold
             changed since (AIP-154).
      description: Request message for HoldService.ExtendHold.
    Hold:
      required:
        - window
      type: object
      properties:
        name:
          type: string
          description: |-
            The hold name. Nested under the site whose resources it takes, so a hold
             is listed and swept per site without joining through every resource.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        resources:
          readOnly: true
          type: array
          items:
            type: string
          description: |-
            The concrete resources this hold has taken, one per unit of `quantity`.
             Chosen by the server from the candidates the request offered.
             Format: resources/{resource}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: |-
            The window held. Immutable: moving it is a different allocation, so
             release this hold and take another.
        candidateResources:
          type: array
          items:
            type: string
          description: |-
            Candidate resources the allocator may choose from, supplied on create.
             Empty offers every resource the site holds. Immutable: the choice is made
             once, and re-offering a different set is a different allocation.
             Format: resources/{resource}
        quantity:
          type: integer
          description: |-
            How many resources to take, supplied on create; defaults to 1. Once the
             hold is ACTIVE this equals the length of `resources`.
          format: int32
        expireTime:
          readOnly: true
          type: string
          description: |-
            When the hold lapses if nothing confirms it. Extend it with ExtendHold;
             past this instant the hold no longer reserves anything, whether or not the
             sweeper has yet marked it EXPIRED.
          format: date-time
        state:
          readOnly: true
          type: integer
          description: Lifecycle state. New holds start ACTIVE.
          format: enum
        idempotencyKey:
          type: string
          description: |-
            Caller-supplied key making CreateHold safe to retry. A repeat with the same
             key returns the original hold rather than taking a second one.
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          readOnly: true
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: |-
        A Hold is a temporary, expiring claim on one or more bookable resources for a
         window, taken before payment or confirmation so two callers cannot be sold
         the same thing.

         Native, with no RFC behind it, and the comment says why (the same trade
         protobuf.shared.project.v1 records upstream). RFC 5545 section 3.2.12's
         PARTSTAT=TENTATIVE can express that a claim is provisional, and RFC 5546's
         iTIP can carry the request that created it, but neither specifies a lapse
         time, and an expiring claim is the one thing a commercial booking engine
         cannot do without. The resources held are RFC 9073 VRESOURCEs and the window
         is measured against their RFC 7953 availability; only the clock is ours.

         Holds are allocated, not requested: CreateHold names candidate resources and
         a quantity, and the server decides which concrete resources are taken. That
         keeps "which bay did I get" a server decision made under a lock, rather than
         a client guess that races.
    ListHoldsResponse:
      type: object
      properties:
        holds:
          type: array
          items:
            $ref: '#/components/schemas/Hold'
          description: The holds on this page.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for HoldService.ListHolds, AIP-132.
    ReleaseHoldRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the hold to release.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        etag:
          type: string
          description: |-
            Opaque version read from the hold; the release is rejected if the hold
             changed since (AIP-154).
      description: Request message for HoldService.ReleaseHold.
    AriUpdate:
      required:
        - unit
        - date
      type: object
      properties:
        unit:
          type: string
          description: |-
            The unit this update is for.
             Format: resources/{resource}
        date:
          type: string
          description: The date (in the unit's timezone) the values apply to.
          format: date
        available:
          type: integer
          description: Number of units available to sell on this date.
          format: int32
        rate:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Nightly rate to publish for this date.
        restrictions:
          allOf:
            - $ref: '#/components/schemas/Restrictions'
          description: Booking restrictions to publish for this date.
      description: |-
        One day's availability, rate, and restrictions for a unit — the atomic unit of
         an outbound ARI push. It is the channel-facing projection of the unit's price
         and its Schedule's stay constraints for a single date.
    Channel:
      required:
        - property
        - type
      type: object
      properties:
        name:
          type: string
          description: |-
            The channel name.
             Format: channels/{channel}
        property:
          type: string
          description: |-
            The property this channel distributes.
             Format: organizationalUnits/{organizational_unit}
        type:
          type: integer
          description: |-
            Which OTA/GDS this connects to. Immutable: the adapter and external ID space
             are fixed per channel.
          format: enum
        displayName:
          type: string
          description: Human-friendly label (e.g. "Booking.com — Goa Resort").
        externalPropertyId:
          type: string
          description: The channel's own code for this hotel (e.g. the Booking.com hotel id).
        credentialRef:
          type: string
          description: |-
            Opaque handle to the stored credentials for this connection (a secret-manager
             key or vault path). The secrets themselves are never returned by the API.
        state:
          readOnly: true
          type: integer
          description: Connection state.
          format: enum
        lastSyncTime:
          readOnly: true
          type: string
          description: When ARI/reservations last synced successfully.
          format: date-time
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: |-
        A connection between one property and one distribution channel (OTA/GDS). It
         is the anchor for 2-way ARI: availability/rates/inventory are pushed out per
         mapped unit, and reservations made on the channel are pulled in as bookings.
         Credentials are never carried in the API — only an opaque handle to where they
         are stored.
    ChannelSyncStatus:
      type: object
      properties:
        name:
          type: string
          description: |-
            The sync-status name.
             Format: channels/{channel}/syncStatus
        state:
          readOnly: true
          type: integer
          description: Current connection state.
          format: enum
        lastSyncTime:
          type: string
          description: When ARI/reservations last synced successfully.
          format: date-time
        pendingCount:
          type: integer
          description: Count of updates still queued.
          format: int32
        failedCount:
          type: integer
          description: Count of updates that failed since the last success.
          format: int32
        lastError:
          type: string
          description: Most recent error message, when the last sync failed.
      description: |-
        A rollup of a channel's sync health, modeled as a singleton sub-resource of the
         channel (one per channel) and read via GetChannelSyncStatus.
    Contact:
      type: object
      properties:
        displayName:
          type: string
          description: Full name of the guest.
        email:
          type: string
          description: Email address for the confirmation and any follow-ups.
        phoneNumber:
          type: string
          description: Phone number in E.164 form (e.g. "+14155552671").
      description: |-
        Contact details for the person a booking is for. When a booking carries a
         `customer` (a users/{user} reference) these typically mirror the user's
         profile; for walk-in or email-only bookings made by someone who is not a
         registered user, this is the only contact information captured. The server
         requires at least one reachable channel (email or phone) when no customer is
         set.
    DateRange:
      required:
        - startDate
        - endDate
      type: object
      properties:
        startDate:
          type: string
          description: Inclusive first date of the range.
          format: date
        endDate:
          type: string
          description: Exclusive end date of the range.
          format: date
      description: |-
        A half-open range of calendar dates [start_date, end_date), evaluated in the
         resource's local timezone. The natural query and exception shape for NIGHTLY
         resources: end_date is the check-out date and is not itself included.
    DisableChannelRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: |-
            The channel to disable (pause ARI push and reservation pull).
             Format: channels/{channel}
      description: Request message for DisableChannel.
    EnableChannelRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: |-
            The channel to enable (resume ARI push and reservation pull).
             Format: channels/{channel}
      description: Request message for EnableChannel.
    ExternalReservation:
      required:
        - channel
        - externalId
        - unit
        - stay
        - op
      type: object
      properties:
        channel:
          type: string
          description: |-
            The channel the reservation came from.
             Format: channels/{channel}
        externalId:
          type: string
          description: |-
            The channel's own id for this reservation (used for idempotency and
             modify/cancel matching).
        unit:
          type: string
          description: |-
            The resolved freebusy unit being booked.
             Format: resources/{resource}
        guest:
          allOf:
            - $ref: '#/components/schemas/Contact'
          description: Guest contact details supplied by the channel.
        stay:
          allOf:
            - $ref: '#/components/schemas/DateRange'
          description: 'The stay: check-in to check-out (end_date is the check-out date).'
        units:
          type: integer
          description: Number of units / rooms reserved. Defaults to 1.
          format: int32
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The reservation total as charged on the channel.
        op:
          type: integer
          description: Whether this is a create, modify, or cancel.
          format: enum
      description: |-
        A reservation as it exists on the channel, landed inbound so it can be
         reconciled into a freebusy Booking. The unit is resolved from the channel's
         external ids via the UnitMapping.
    ImportReservationRequest:
      required:
        - reservation
      type: object
      properties:
        reservation:
          allOf:
            - $ref: '#/components/schemas/ExternalReservation'
          description: The reservation as it exists on the channel.
      description: |-
        Request message for ImportReservation. Lands a reservation made on a channel so
         it reconciles into a freebusy Booking (create/modify/cancel).
    ImportReservationResponse:
      type: object
      properties:
        booking:
          type: string
          description: |-
            The freebusy booking created or updated from the reservation.
             Format: bookings/{booking}
      description: Response message for ImportReservation.
    ListChannelsResponse:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
          description: The page of channels.
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
      description: Response message for ListChannels.
    ListSyncEventsResponse:
      type: object
      properties:
        syncEvents:
          type: array
          items:
            $ref: '#/components/schemas/SyncEvent'
          description: The page of sync events.
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
      description: Response message for ListSyncEvents.
    ListUnitMappingsResponse:
      type: object
      properties:
        unitMappings:
          type: array
          items:
            $ref: '#/components/schemas/UnitMapping'
          description: The page of unit mappings.
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
      description: Response message for ListUnitMappings.
    Money:
      type: object
      properties:
        currencyCode:
          type: string
          description: The three-letter currency code defined in ISO 4217.
        units:
          type: string
          description: |-
            The whole units of the amount.
             For example if `currencyCode` is `"USD"`, then 1 unit is one US dollar.
        nanos:
          type: integer
          description: |-
            Number of nano (10^-9) units of the amount.
             The value must be between -999,999,999 and +999,999,999 inclusive.
             If `units` is positive, `nanos` must be positive or zero.
             If `units` is zero, `nanos` can be positive, zero, or negative.
             If `units` is negative, `nanos` must be negative or zero.
             For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
          format: int32
      description: Represents an amount of money with its currency type.
    PushAriRequest:
      required:
        - channel
        - updates
      type: object
      properties:
        channel:
          type: string
          description: |-
            The channel to push to.
             Format: channels/{channel}
        updates:
          type: array
          items:
            $ref: '#/components/schemas/AriUpdate'
          description: The per-unit, per-date updates to publish.
      description: |-
        Request message for PushAri. Pushes availability/rate/restriction updates for a
         channel's mapped units (AIP-231 batch shape). Unmapped units are rejected.
    PushAriResponse:
      type: object
      properties:
        accepted:
          type: integer
          description: Number of updates accepted for publishing.
          format: int32
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEvent'
          description: Per-update sync events (queued or failed), for observability.
      description: Response message for PushAri.
    Restrictions:
      type: object
      properties:
        minStay:
          type: integer
          description: Minimum length of stay. Zero means no minimum.
          format: int32
        maxStay:
          type: integer
          description: Maximum length of stay. Zero means no maximum.
          format: int32
        arrivalClosed:
          type: boolean
          description: 'Closed to arrival: a stay may not start on this date.'
        departureClosed:
          type: boolean
          description: 'Closed to departure: a stay may not end on this date.'
        stopSell:
          type: boolean
          description: 'Stop-sell: the unit is not sellable on this date regardless of inventory.'
      description: Sell restrictions published to a channel for a date.
    SyncEvent:
      type: object
      properties:
        direction:
          type: integer
          description: Whether this was an outbound push or an inbound pull.
          format: enum
        channel:
          type: string
          description: |-
            The channel involved.
             Format: channels/{channel}
        unit:
          type: string
          description: |-
            The unit involved, when the event is unit-scoped.
             Format: resources/{resource}
        date:
          type: string
          description: The date the event concerned, when applicable.
          format: date
        state:
          readOnly: true
          type: integer
          description: Outcome.
          format: enum
        error:
          type: string
          description: Human-readable error when state is FAILED.
        eventTime:
          type: string
          description: When the event occurred.
          format: date-time
      description: |-
        A record of one sync attempt, for observability of the ARI push / reservation
         pull. Returned by ListSyncEvents; not a standalone resource.
    UnitMapping:
      required:
        - unit
        - externalRoomTypeId
      type: object
      properties:
        name:
          type: string
          description: |-
            The mapping name.
             Format: channels/{channel}/unitMappings/{unit_mapping}
        unit:
          type: string
          description: |-
            The freebusy unit being mapped.
             Format: resources/{resource}
        externalRoomTypeId:
          type: string
          description: The channel's room-type id this unit maps to.
        externalRatePlanId:
          type: string
          description: The channel's rate-plan id this unit maps to.
        state:
          readOnly: true
          type: integer
          description: Mapping state.
          format: enum
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: |-
        Maps a freebusy Unit to its counterpart on the channel. ARI for a unit only
         flows once a MAPPED mapping exists: the external room-type and rate-plan ids
         key the availability/rate/restriction push and resolve inbound reservations
         back to the right unit.
    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The page of users.
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
      description: Response message for ListUsers.
    User:
      type: object
      properties:
        name:
          type: string
          description: |-
            The user name. The alias "users/me" resolves to the caller.
             Format: users/{user}
        email:
          readOnly: true
          type: string
          description: Email address, sourced from the IdP.
        displayName:
          type: string
          description: Display name.
        avatarUrl:
          type: string
          description: Avatar image URL.
        locale:
          type: string
          description: BCP 47 locale (e.g. "en-US").
        timeZone:
          type: string
          description: IANA time zone (e.g. "America/New_York").
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update.
      description: |-
        A signed-in person. Identity is deliberately thin: actual login is an OIDC
         redirect flow handled over plain HTTP by the IdP, so most of "auth" never
         appears as an RPC. Email and identity come from the IdP and are read-only
         here; only profile preferences are editable.
    InviteMemberRequest:
      required:
        - parent
        - email
        - role
      type: object
      properties:
        parent:
          type: string
          description: |-
            The organisation to invite the member to.
             Format: organisations/{organisation}
        email:
          type: string
          description: Email address to invite.
        role:
          type: integer
          description: Role to grant on acceptance.
          format: enum
        requestId:
          type: string
          description: Caller-supplied idempotency key; identical retries return the first result.
      description: Request message for InviteMember.
    InviteMemberResponse:
      type: object
      properties:
        member:
          allOf:
            - $ref: '#/components/schemas/Member'
          description: The created member (in INVITED state).
      description: Response message for InviteMember.
    ListMembersResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          description: The page of members.
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
      description: Response message for ListMembers.
    ListOrganisationsResponse:
      type: object
      properties:
        organisations:
          type: array
          items:
            $ref: '#/components/schemas/Organisation'
          description: The page of organisations (those the caller belongs to).
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
      description: Response message for ListOrganisations.
    Member:
      required:
        - email
        - role
      type: object
      properties:
        name:
          type: string
          description: |-
            The member name.
             Format: organisations/{organisation}/members/{member}
        user:
          readOnly: true
          type: string
          description: |-
            The user, once the invite is accepted.
             Format: users/{user}
        email:
          type: string
          description: |-
            The invited email address. Format is enforced at the entry point
             (InviteMemberRequest.email), not on the stored field, so legacy rows
             never brick a role update.
        displayName:
          readOnly: true
          type: string
          description: Cached display name of the member.
        role:
          type: integer
          description: The member's role in the organisation.
          format: enum
        state:
          readOnly: true
          type: integer
          description: |-
            Confirmation state of the membership. New members start INVITED
             (database default).
          format: enum
        inviter:
          readOnly: true
          type: string
          description: |-
            The user who issued the invite.
             Format: users/{user}
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp (when the invite was created).
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: The membership of a user in an organisation, with their role.
    Organisation:
      required:
        - displayName
      type: object
      properties:
        name:
          type: string
          description: |-
            The organisation name.
             Format: organisations/{organisation}
        displayName:
          type: string
          description: Human-friendly organisation name (e.g. "Acme Inc.").
        slug:
          type: string
          description: URL-safe slug, unique across organisations.
        billingEmail:
          type: string
          description: |-
            Billing contact email. Format is validated where the value enters the
             system (request-entry), not here — a stored value predating stricter rules
             must never brick an unrelated update.
        state:
          readOnly: true
          type: integer
          description: Lifecycle state. New organisations start ACTIVE (database default).
          format: enum
        settings:
          type: object
          description: Arbitrary organisation-level settings.
        memberCount:
          readOnly: true
          type: string
          description: Number of members across all states.
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: |-
        A chain: the hotel brand/company that owns one or more properties, and the
         unit of multi-tenancy. The shell enforces isolation with row-level security
         keyed off the caller's organisation. Each Property references the Organisation
         it belongs to; members here are the chain's administrators, not its guests
         (guests relate to a property only through bookings).
    Adjustment:
      type: object
      properties:
        percentDelta:
          type: integer
          description: 'Percent to move the running price by: 20 raises it a fifth, -15 cuts it.'
          format: int32
        amountDelta:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Flat amount to add, negative to subtract.
      description: |-
        A price adjustment expressed as a proportion or a flat amount. Exactly one is
         set; both may be negative, which is how a discount is written.
    DynamicBand:
      required:
        - minThreshold
        - adjustment
      type: object
      properties:
        minThreshold:
          type: integer
          description: |-
            Inclusive lower bound of the measured value.

             The unit is the rule's trigger and nothing else says so: percent for
             OCCUPANCY, whole days for LEAD_TIME, nights for LENGTH_OF_STAY. A single
             pair of ints across three units is the cost of keeping bands comparable and
             sortable; the alternative was a oneof per trigger, which makes every reader
             switch on a type to ask "is this band above that one".
          format: int32
        maxThreshold:
          type: integer
          description: |-
            Exclusive upper bound. Zero means unbounded above, so the last band of a
             ladder needs no sentinel.
          format: int32
        adjustment:
          allOf:
            - $ref: '#/components/schemas/Adjustment'
          description: What the price does inside this band.
        displayName:
          type: string
          description: |-
            Human-readable label carried onto the quote line, e.g. "high occupancy" or
             "booked within 3 days". A dynamic charge a guest cannot see the reason for
             is a complaint; this is what makes it explainable.
      description: |-
        One threshold band of a DynamicRule: the range the measured value must fall
         in, and what happens to the price when it does.
    DynamicRule:
      required:
        - trigger
        - bands
      type: object
      properties:
        trigger:
          type: integer
          description: What this rule measures.
          format: enum
        bands:
          type: array
          items:
            $ref: '#/components/schemas/DynamicBand'
          description: |-
            The ladder. Overlapping bands are a configuration error: the first match in
             declaration order wins, so an overlap silently makes a later band dead
             rather than failing, and a quote is the wrong place to discover that.
      description: |-
        A rule that moves price according to something measured at quote time.

         Bands are evaluated against the trigger's measured value and at most one band
         matches per rule, because bands of a single rule partition a range. Rules
         compound across triggers; bands do not compound within one.
    Fee:
      required:
        - code
      type: object
      properties:
        code:
          type: string
          description: Stable machine code, e.g. "cleaning_fee".
        displayName:
          type: string
          description: Human-readable label for receipts.
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Flat fee amount.
        percent:
          type: integer
          description: Percent of the base subtotal, when charging proportionally.
          format: int32
        pricingUnit:
          type: integer
          description: What the fee is charged per. Defaults to per booking.
          format: enum
        taxable:
          type: boolean
          description: Whether this fee joins the taxable base.
      description: |-
        A charge added on top of the base subtotal. Exactly one of `amount` or
         `percent` is set.
    ListRatePlansResponse:
      type: object
      properties:
        ratePlans:
          type: array
          items:
            $ref: '#/components/schemas/RatePlan'
          description: The rate plans on this page.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for RatePlanService.ListRatePlans, AIP-132.
    LosDiscount:
      required:
        - minNights
      type: object
      properties:
        minNights:
          type: integer
          description: Minimum nights before the discount applies.
          format: int32
        percentOff:
          type: integer
          description: Percent off the subtotal, when discounting proportionally.
          format: int32
        amountOff:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Fixed amount off the subtotal, when discounting by a flat sum.
      description: |-
        A discount applied once a stay reaches `min_nights`. Exactly one of
         `percent_off` or `amount_off` is set.
    PriceBounds:
      type: object
      properties:
        floor:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Never quote below this. Unset means no floor.
        ceiling:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |-
            Never quote above this. Unset means no ceiling — reasonable only for a plan
             with no dynamic rules.
      description: |-
        Hard limits on a computed price, applied last — after every override,
         discount, dynamic rule and fee, and before tax.

         Applied last on purpose: bounding an intermediate step would let a later rule
         carry the price back out of range, which is exactly the failure the bounds
         exist to prevent.
    RateOverride:
      required:
        - price
      type: object
      properties:
        dateRange:
          allOf:
            - $ref: '#/components/schemas/DateRange'
          description: |-
            Dates the override covers. Unset means every date, making this a pure
             weekday rule.
        weekdays:
          type: array
          items:
            type: integer
            format: enum
          description: |-
            Weekdays it covers. Empty means every day inside `date_range`.

             google.type.DayOfWeek rather than an enum of our own: it is the shared
             vocabulary the RFC packages already use for recurrence, and google.* is the
             one exemption to the cross-package rule.
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The price in effect while this override matches.
      description: |-
        A price that replaces a plan's base rate for a span of dates, specific
         weekdays, or both.
    RatePlan:
      required:
        - resource
        - displayName
        - price
      type: object
      properties:
        name:
          type: string
          description: |-
            The rate plan name.
             Format: ratePlans/{rate_plan}
        resource:
          type: string
          description: |-
            The bookable resource this plan prices.
             Format: resources/{resource}
        displayName:
          type: string
          description: Human-friendly name, e.g. "Flexible", "Non-refundable", "Early Bird".
        description:
          type: string
          description: Free-form description shown with the offer.
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |-
            The default price, interpreted per `pricing_unit`. Overrides in
             `rate_overrides` replace it where they match; this applies where none do.
        pricingUnit:
          type: integer
          description: What `price` is charged per. Defaults to per booking.
          format: enum
        rateOverrides:
          type: array
          items:
            $ref: '#/components/schemas/RateOverride'
          description: |-
            The rate calendar: date- and weekday-scoped replacements for `price`.
             Later-listed overrides win where two match the same date.
        losDiscounts:
          type: array
          items:
            $ref: '#/components/schemas/LosDiscount'
          description: |-
            Discounts applied once a stay reaches a minimum length. The most generous
             matching discount applies; they do not stack.
        fees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
          description: Fees added on top of the base subtotal.
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
          description: |-
            Taxes applied to the taxable base — the subtotal plus every fee marked
             taxable.
        dynamicRules:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRule'
          description: |-
            Rules that move the price by the state of the world rather than by the
             calendar — occupancy, lead time, length of stay. Empty means static
             pricing, which is the default and stays a first-class choice.

             Every matching rule applies, in order, each compounding on the running
             price. That is a deliberate choice over "most specific wins": revenue
             management is genuinely multiplicative — a last-minute booking into a
             nearly-full house is both — and a winner-takes-all rule would silently
             discard one of the two signals.
        bounds:
          allOf:
            - $ref: '#/components/schemas/PriceBounds'
          description: |-
            Hard bounds on any computed price. Strongly recommended once
             `dynamic_rules` is non-empty.

             Compounding rules multiply, and multiplication runs away: three rules at
             +25% each is +95%, not +75%, and a mispriced band is discovered by a guest
             rather than by a test. Bounds are the blast radius — they cap what any
             arithmetic error can charge, and floor what a stacked discount can give
             away.
        state:
          readOnly: true
          type: integer
          description: Lifecycle state. New plans start ACTIVE.
          format: enum
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          readOnly: true
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: |-
        A RatePlan is what a bookable resource costs: a base price, the calendar of
         overrides that move it, and the fees and taxes layered on top.

         Native, with no RFC behind it, and this is the one gap the audit could not
         close. The IETF has never standardised commerce — RFC 8905's `payto:` names a
         payment *address*, not an amount — so while every statement this engine makes
         about time comes from a published RFC, every statement it makes about money is
         ours. `google.type.Money` carries the amounts, which is the closest thing to a
         standard available and is exempt from the cross-package rule.

         A resource of its own rather than fields on the thing being priced: the same
         resource is sold at different rates to different channels and seasons, a rate
         plan is edited on a cadence entirely unlike the resource's, and a booking must
         still be explainable under the plan that priced it long after that plan stops
         being offered. Pricing attaches to a resource by reference, so an RFC 9073
         VRESOURCE stays a description of a bookable thing and never grows a price.
    Tax:
      required:
        - code
        - percent
      type: object
      properties:
        code:
          type: string
          description: Stable machine code, e.g. "occupancy_tax" or "gst".
        displayName:
          type: string
          description: Human-readable label for receipts.
        percent:
          type: number
          description: Rate as a percentage, e.g. 12 for 12% GST.
          format: double
      description: A tax on the taxable base — the subtotal plus every fee marked taxable.
    ComputeQuoteRequest:
      required:
        - ratePlan
        - window
      type: object
      properties:
        ratePlan:
          type: string
          description: |-
            The rate plan to price under.
             Format: ratePlans/{rate_plan}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The window being priced. Nights are counted in the resource's time zone.
        quantity:
          type: integer
          description: How many resources are being booked. Defaults to 1.
          format: int32
        partySize:
          type: integer
          description: Party size, for PER_PERSON pricing. Defaults to 1.
          format: int32
        occupancyPercent:
          type: integer
          description: |-
            Occupancy across the window, 0-100, for a DYNAMIC_TRIGGER_OCCUPANCY rule.

             Normally left unset: the server measures it from the allocation engine,
             which is the only place that knows what is actually taken. Supply it to ask
             a what-if — "what would this cost at 90% full" — for a rate-card preview or
             a pricing simulation, without moving any inventory to find out.

             Optional rather than an oneof against a "measure it" flag: unset already
             means "measure it", and zero occupancy is a real value a caller may want to
             model, so presence is read rather than the value.
          format: int32
        promotionCodes:
          type: array
          items:
            type: string
          description: |-
            Promotion codes to attempt. Each is validated and either applied as a
             COMPONENT_TYPE_PROMOTION line or reported in `rejected_promotion_codes`;
             an invalid code never fails the quote, because a mistyped code should
             re-render a price, not an error page.
      description: Request message for QuoteService.ComputeQuote.
    ComputeQuoteResponse:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/QuoteComponent'
          description: |-
            Every line, in the order applied: base, overrides, discounts, promotions,
             fees, then taxes. Summing them yields `total`.
        subtotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Sum of every component before fees and taxes.
        taxTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Sum of every tax line.
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: What the guest pays.
        rejectedPromotionCodes:
          type: array
          items:
            $ref: '#/components/schemas/RejectedPromotionCode'
          description: |-
            Promotion codes that did not apply, with the reason, so a caller can tell
             the guest why rather than silently dropping the code.
      description: Response message for QuoteService.ComputeQuote.
    QuoteComponent:
      type: object
      properties:
        type:
          type: integer
          description: What kind of line this is.
          format: enum
        code:
          type: string
          description: |-
            Stable machine code of the rule behind it — a fee's `code`, a tax's `code`,
             or a promotion's code. Empty for the base rate.
        displayName:
          type: string
          description: Human-readable label for receipts.
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The amount, negative for discounts.
      description: |-
        One line of a quote: what it is, what it came from, and what it cost.

         A quote is an audit trail, not just a total. Every component names the rule
         that produced it, so a guest disputing a charge months later can be shown
         which override or fee applied rather than a number nobody can reconstruct.
    RejectedPromotionCode:
      type: object
      properties:
        code:
          type: string
          description: The code as supplied.
        reason:
          type: string
          description: Why it did not apply, e.g. "expired", "minimum stay not met".
      description: A promotion code that was offered but did not apply.
    Discount:
      type: object
      properties:
        percentOff:
          type: integer
          description: Percentage off the subtotal (1-100).
          format: int32
        amountOff:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |-
            Fixed amount off the subtotal.
             Normalized into the shared common.moneys table (belongs-to via amount_off_id).
      description: |-
        Discount describes how a promo code reduces a subtotal. Nested value object →
         belongs-to child table promocode.discounts (FK discount_id on promo_codes).
         Exactly one of percent_off / amount_off is set; the oneof case is the
         discriminator, so no separate type enum is needed.
    ListPromoCodesResponse:
      type: object
      properties:
        promoCodes:
          type: array
          items:
            $ref: '#/components/schemas/PromoCode'
          description: The page of promo codes.
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
        totalSize:
          type: integer
          description: |-
            Total number of promo codes matching the filter across all pages, when the
             server computes it; 0 if unknown. Useful for rendering page counts (AIP-132).
          format: int32
      description: Response message for ListPromoCodes.
    ListRedemptionsResponse:
      type: object
      properties:
        redemptions:
          type: array
          items:
            $ref: '#/components/schemas/Redemption'
          description: The page of redemptions, newest first by default.
        nextPageToken:
          type: string
          description: Token to pass as page_token to retrieve the next page; empty when no more.
        totalSize:
          type: integer
          description: |-
            Total number of redemptions for the promo code, when the server computes it;
             0 if unknown.
          format: int32
      description: Response message for ListRedemptions.
    PromoCode:
      required:
        - discount
      type: object
      properties:
        name:
          type: string
          description: |-
            The promo code name.
             Format: promoCodes/{promo_code}
        code:
          type: string
          description: |-
            The human-entered code, unique across all promo codes (e.g. "SUMMER25").
             Leave empty on create to have the server generate one; `code_generation`
             then records that it did.
        displayName:
          type: string
          description: Internal display name (not shown to customers).
        description:
          type: string
          description: Free-form description.
        discount:
          allOf:
            - $ref: '#/components/schemas/Discount'
          description: How the discount is computed → belongs-to child table promocode.discounts.
        window:
          allOf:
            - $ref: '#/components/schemas/RedemptionWindow'
          description: When the code is redeemable → belongs-to promocode.redemption_windows.
        limits:
          allOf:
            - $ref: '#/components/schemas/UsageLimits'
          description: Redemption caps → belongs-to promocode.usage_limits.
        scope:
          allOf:
            - $ref: '#/components/schemas/Scope'
          description: What the code applies to (eligibility) → belongs-to promocode.scopes.
        redemptionCount:
          readOnly: true
          type: string
          description: |-
            How many times the code has been redeemed. Cheap summary on the resource;
             the individual redemptions are a paginated sub-collection
             (promoCodes/{promo_code}/redemptions) listed via ListRedemptions, not inlined
             here, so reads stay bounded as redemptions accumulate.
        state:
          readOnly: true
          type: integer
          description: |-
            Derived lifecycle state, recomputed on every read/validate (no background
             job): DISABLED when `disabled` is set; EXPIRED once now > window.end_time
             (the expiry) or the code is out of redemptions; otherwise ACTIVE. This is how
             a code auto-disables at its expiry without a stored flag to flip.
          format: enum
        disabled:
          type: boolean
          description: If true, the code is manually disabled regardless of its window and caps.
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
        codeGeneration:
          readOnly: true
          type: integer
          description: |-
            How `code` was chosen: MANUAL when the caller supplied it, AUTO when the
             server generated it. Set once, on create.
          format: enum
      description: |-
        A redeemable discount applied to a booking's subtotal. Scoped by a redemption
         window, usage caps, a minimum subtotal, and an optional set of properties /
         units it applies to.
    Redemption:
      required:
        - customer
        - reservation
      type: object
      properties:
        name:
          type: string
          description: |-
            The redemption resource name.
             Format: promoCodes/{promo_code}/redemptions/{redemption}
        customer:
          type: string
          description: |-
            The customer who redeemed the code.
             Format: users/{user}
        reservation:
          type: string
          description: |-
            The reservation the code was applied to.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
        redeemedTime:
          readOnly: true
          type: string
          description: When the code was redeemed.
          format: date-time
        amountApplied:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The discount actually applied at redemption.
      description: |-
        Redemption is a single use of a promo code, modeled as a sub-resource of
         PromoCode rather than an inline list — so it has its own name/lifecycle and is
         listed with paging (ListRedemptions). The {promo_code} parent segment
         generates the promo_code_id FK back to the owning code (1:n into
         promocode.redemptions); amount_applied is the shared google.type.Money in
         common.moneys. Redemptions are recorded when a booking's payment settles, never
         created directly.
    RedemptionWindow:
      type: object
      properties:
        startTime:
          type: string
          description: Earliest the code can be redeemed. Unset means no lower bound.
          format: date-time
        endTime:
          type: string
          description: |-
            The code's expiry: the latest moment it can be redeemed. Once now passes
             this, the derived PromoCode.state becomes EXPIRED. Unset means never expires.
          format: date-time
      description: |-
        RedemptionWindow bounds when a code can be redeemed; an unset bound is
         open-ended. Nested value object → belongs-to promocode.redemption_windows.
    Scope:
      type: object
      properties:
        minSubtotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |-
            Minimum subtotal required for the code to apply.
             Normalized into the shared common.moneys table (belongs-to via min_subtotal_id).
        applicableProperties:
          type: array
          items:
            type: string
          description: |-
            Properties the code applies to. Empty means all properties.
             Format: organizationalUnits/{organizational_unit}
        applicableUnits:
          type: array
          items:
            type: string
          description: |-
            Units the code applies to. Empty means all units.
             Format: resources/{resource}
      description: |-
        Scope restricts which bookings a code applies to. Nested value object →
         belongs-to promocode.scopes. Its repeated resource references and Money
         normalize one level deeper (array columns / common.moneys).
    UsageLimits:
      type: object
      properties:
        maxRedemptions:
          type: string
          description: Maximum total redemptions across all customers. Unset means unlimited.
        perCustomerLimit:
          type: integer
          description: Maximum redemptions per customer. Unset means unlimited.
          format: int32
      description: |-
        UsageLimits caps how often a code can be redeemed. Nested value object →
         belongs-to promocode.usage_limits. The caps are wrapper types so "unset"
         (unlimited) is distinct from an explicit value, including 0.
    ValidatePromoCodeRequest:
      required:
        - code
        - subtotal
      type: object
      properties:
        code:
          type: string
          description: The human-entered code to validate (e.g. "SUMMER25").
        subtotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Subtotal the discount would apply to.
        property:
          type: string
          description: |-
            Property being booked, for scope checks.
             Format: organizationalUnits/{organizational_unit}
        unit:
          type: string
          description: |-
            Unit being booked, for scope checks.
             Format: resources/{resource}
        customer:
          type: string
          description: |-
            Customer redeeming the code, for per-customer limit checks.
             Format: users/{user}
      description: |-
        Request message for ValidatePromoCode. Computes the discount a code would
         apply to a prospective booking without redeeming it.
    ValidatePromoCodeResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the code is valid and applicable to the given context.
        invalidReason:
          type: integer
          description: |-
            Structured reason the code is not valid, when valid is false; branch on this
             rather than parsing `reason`. UNSPECIFIED when valid is true.
          format: enum
        reason:
          type: string
          description: |-
            Human-readable detail for invalid_reason, suitable for display
             (e.g. "Minimum subtotal of $50 not met"). Empty when valid is true.
        promoCode:
          type: string
          description: |-
            The resolved promo code, when valid.
             Format: promoCodes/{promo_code}
        discountAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Discount the code applies to the subtotal.
        finalTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Subtotal minus the discount.
      description: Response message for ValidatePromoCode.
    Attachment:
      type: object
      properties:
        filename:
          type: string
          description: Original filename as uploaded.
        mimeType:
          type: string
          description: MIME type of the file (e.g. "application/pdf", "image/jpeg").
        sizeBytes:
          type: string
          description: Size of the file in bytes.
        content:
          type: string
          description: |-
            Raw file content, stored inline in the database. Cleared once the file is
             migrated to object storage, at which point `uri` takes over.
          format: bytes
        uri:
          type: string
          description: |-
            Location of the file once moved to object storage (e.g. an s3:// or
             https:// URL). Unset while the file lives inline in `content`.
        uploadTime:
          readOnly: true
          type: string
          description: When the file was uploaded.
          format: date-time
      description: |-
        An uploaded file attached to a document- or licence-carrying record (e.g. a
         guest's IdDocument scan, or a property/unit licence certificate). The bytes
         are stored inline in `content` today; `uri` is populated once the file is
         migrated to object storage (S3 or any CDN-fronted host). At most one of the
         two is authoritative at a time — prefer `uri` when both are set.
    Licence:
      required:
        - type
      type: object
      properties:
        name:
          type: string
          description: |-
            The licence name.
             Format: organizationalUnits/{organizational_unit}/licences/{licence}
        target:
          readOnly: true
          type: integer
          description: |-
            What the licence covers: the whole property, or the single unit named in
             `unit`. Derived from whether `unit` is set at create time.
          format: enum
        unit:
          type: string
          description: |-
            The bookable resource this licence covers, for a LICENCE_TARGET_UNIT
             licence; unset for a site-wide one. Must belong to the parent site.

             An RFC 9073 VRESOURCE, named rather than embedded: AIP-215 says to refer to
             a resource by name, and the catalogue is served by the RFC Resources
             service, not by this one.
             Format: resources/{resource}
        type:
          type: integer
          description: What kind of licence/certificate this is.
          format: enum
        licenceNumber:
          type: string
          description: Licence/certificate number as printed by the issuing authority.
        issuingAuthority:
          type: string
          description: The authority or body that issued the licence (e.g. "Municipal Corporation of Goa").
        issueDate:
          type: string
          description: Date the licence was issued.
          format: date
        expiryDate:
          type: string
          description: |-
            Date the licence expires. List calls may filter on this field (e.g.
             `expiry_date <= 2026-08-01`) to find licences due for renewal.
          format: date
        attachment:
          allOf:
            - $ref: '#/components/schemas/Attachment'
          description: Scanned copy of the licence certificate.
        notes:
          type: string
          description: Any additional free-text notes.
        state:
          readOnly: true
          type: integer
          description: Lifecycle state. New licences start ACTIVE (database default).
          format: enum
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: |-
        A regulatory licence or certificate held by a site or one of its bookable
         resources (e.g. trade licence, fire safety NOC, per-room liquor licence).

         Native, and it stays native because no RFC covers it: the IETF standardises
         calendars and directories, not the paperwork a jurisdiction demands to
         operate. It parents onto an RFC 4519 organizationalUnit and names an RFC 9073
         resource, so the only thing freebusy defines here is the licence itself.

         One resource covers both scopes: `target` says which, and a resource-scoped
         licence names it in `unit`. `expiry_date` is filterable so renewals due can be
         listed; the certificate itself rides in `attachment`.
    ListLicencesResponse:
      type: object
      properties:
        licences:
          type: array
          items:
            $ref: '#/components/schemas/Licence'
          description: The page of licences.
        nextPageToken:
          type: string
          description: Next page token. Omitted if this is the last page.
      description: Response message for ListLicences.
    CancelReservationRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: 'Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
        reason:
          type: string
          description: Why, in the canceller's words. Recorded, never parsed.
        etag:
          type: string
          description: |-
            Opaque version read from the reservation; the cancel is rejected if it
             changed since (AIP-154).
      description: Request message for ReservationService.CancelReservation.
    ListReservationsResponse:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
          description: The reservations on this page.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for ReservationService.ListReservations, AIP-132.
    RescheduleReservationRequest:
      required:
        - name
        - hold
      type: object
      properties:
        name:
          type: string
          description: |-
            The confirmed reservation to move.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
        hold:
          type: string
          description: |-
            A live hold at the same site on the new window, taken by the caller with
             HoldService.CreateHold. Taking it first is what makes the move safe: the
             new slot is secured before the old one is let go.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        etag:
          type: string
          description: |-
            Opaque version read from the reservation; the move is rejected if it
             changed since (AIP-154).
      description: Request message for ReservationService.RescheduleReservation.
    Reservation:
      required:
        - hold
      type: object
      properties:
        name:
          type: string
          description: |-
            The reservation name. Its id is the caller's reservation_id, or else the
             id of the hold it was made from.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
        hold:
          type: string
          description: |-
            The hold this reservation was made from, at the same site.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        resources:
          readOnly: true
          type: array
          items:
            type: string
          description: |-
            The resources taken, copied from the hold.
             Format: resources/{resource}
        startTime:
          readOnly: true
          type: string
          description: Start of the reserved window, copied from the hold.
          format: date-time
        endTime:
          readOnly: true
          type: string
          description: End of the reserved window, exclusive, copied from the hold.
          format: date-time
        customer:
          type: string
          description: |-
            Who the reservation is for, by name in the user service.
             Format: users/{user}
        state:
          readOnly: true
          type: integer
          description: Lifecycle state.
          format: enum
        attributes:
          type: object
          description: |-
            Whatever a vertical needs to keep with the reservation: a party size, a
             payment reference, a licence plate. Opaque to the engine.
        cancelReason:
          readOnly: true
          type: string
          description: Why it was cancelled, in the canceller's words. Set by CancelReservation.
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        confirmTime:
          readOnly: true
          type: string
          description: When it was confirmed.
          format: date-time
        cancelTime:
          readOnly: true
          type: string
          description: When it was cancelled.
          format: date-time
        etag:
          readOnly: true
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on cancel.
        replaces:
          readOnly: true
          type: string
          description: |-
            The reservation this one replaced, set when it was made by
             RescheduleReservation.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
        replacement:
          readOnly: true
          type: string
          description: |-
            The reservation replacing this one, set when RescheduleReservation began.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
      description: |-
        A Reservation is a confirmed booking: a hold made permanent.

         It is the last step of booking, not the first. The caller checks
         availability, takes a hold, settles whatever its vertical needs settled --
         payment, a guest list, a waiver -- and then creates a reservation from the
         hold. The reservation records the outcome; the engine already holds the
         resources.

         Deliberately thin. Price, discount, promo code, refund, guests and occupancy
         are what would make it a hotel booking, and none of them is here: money belongs to the payment service and people to the user
         service, both referenced by name (AIP-215), and anything else a vertical
         needs to remember rides in `attributes`.
