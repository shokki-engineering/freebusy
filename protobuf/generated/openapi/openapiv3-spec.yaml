              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Release Hold
  /v1/organizationalUnits/{organizationalUnit}/reservations:
    get:
      tags:
