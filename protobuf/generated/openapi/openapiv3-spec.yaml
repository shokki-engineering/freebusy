# Base skeleton for the merged OpenAPI spec: everything that is fixed rather than
# derived from the per-service specs. Key order here is the output order.
# Embedded into the openapi tool (see main.go); override with `-base <file>`.
openapi: 3.0.0
info:
  title: FreeBusy API
  description: |-
    freebusy decides what can be booked, when it is free, and who is holding it: RFC 9073 resources with RFC 5545 calendars and RFC 7953 availability, searched, held and reserved without double booking, with webhooks for every change. This document is generated from the Protocol Buffer service definitions and merged into a single specification.

    All timestamps are RFC 3339. The API carries no authentication yet: serve it on a private network.
  version: 1.0.0
  termsOfService: https://freebusy.shokki.engineering/terms
  contact:
    name: FreeBusy API Support
    url: https://freebusy.shokki.engineering/support
    email: support@shokki.engineering
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-mermaid:
    - diagram: |
        erDiagram
            Hold {
                string name PK "IDENTIFIER"
                string[] resources FK "OUTPUT_ONLY"
                Interval window "REQUIRED, IMMUTABLE"
                string[] candidate_resources FK "OPTIONAL, IMMUTABLE"
                int32 quantity "OPTIONAL, IMMUTABLE"
                Timestamp expire_time "OUTPUT_ONLY"
                HoldState state "OUTPUT_ONLY"
                string idempotency_key "OPTIONAL, IMMUTABLE"
                Timestamp create_time "OUTPUT_ONLY"
                Timestamp update_time "OUTPUT_ONLY"
                string etag "OUTPUT_ONLY"
                string replaces "OPTIONAL, IMMUTABLE"
                string candidate_filter "OPTIONAL, IMMUTABLE"
            }
            Allocation {
                string name PK "IDENTIFIER"
                string resource FK "REQUIRED"
                Timestamp start_time "REQUIRED"
                Timestamp end_time "REQUIRED"
                Timestamp expire_time "OUTPUT_ONLY"
                Timestamp create_time "OUTPUT_ONLY"
                string hold FK "OUTPUT_ONLY"
            }
            OrganizationalUnit ||--o{ Hold : "holds"
            Hold }o--o{ Resource : "resources"
            Hold }o--o{ Resource : "candidate_resources"
            OrganizationalUnit ||--o{ Allocation : "allocations"
            Allocation }o--|| Resource : "resource"
            Allocation }o--o| Hold : "hold"
      title: Resources
      type: erDiagram
    - diagram: |
        stateDiagram-v2
            state "ACTIVE" as HOLD_STATE_ACTIVE
            state "RELEASED" as HOLD_STATE_RELEASED
            state "EXPIRED" as HOLD_STATE_EXPIRED
            state "CONVERTED" as HOLD_STATE_CONVERTED
            [*] --> HOLD_STATE_ACTIVE: CreateHold
            HOLD_STATE_ACTIVE --> HOLD_STATE_RELEASED: ReleaseHold
            HOLD_STATE_ACTIVE --> HOLD_STATE_RELEASED: reservation failed
            HOLD_STATE_ACTIVE --> HOLD_STATE_EXPIRED: sweeper [expire_time passed]
            HOLD_STATE_ACTIVE --> HOLD_STATE_CONVERTED: CreateReservation
            HOLD_STATE_RELEASED --> [*]
            HOLD_STATE_EXPIRED --> [*]
            HOLD_STATE_CONVERTED --> [*]
      title: HoldState
      type: stateDiagram-v2
    - diagram: |
        erDiagram
            Reservation {
                string name PK "IDENTIFIER"
                string hold FK "REQUIRED, IMMUTABLE"
                string[] resources FK "OUTPUT_ONLY"
                Timestamp start_time "OUTPUT_ONLY"
                Timestamp end_time "OUTPUT_ONLY"
                string customer FK "OPTIONAL"
                ReservationState state "OUTPUT_ONLY"
                Struct attributes "OPTIONAL"
                string cancel_reason "OUTPUT_ONLY"
                Timestamp create_time "OUTPUT_ONLY"
                Timestamp update_time "OUTPUT_ONLY"
                Timestamp confirm_time "OUTPUT_ONLY"
                Timestamp cancel_time "OUTPUT_ONLY"
                string etag "OUTPUT_ONLY"
                string replaces "OUTPUT_ONLY"
                string replacement "OUTPUT_ONLY"
                Change last_change "OUTPUT_ONLY"
            }
            OrganizationalUnit ||--o{ Reservation : "reservations"
            Reservation }o--|| Hold : "hold"
            Reservation }o--o{ Resource : "resources"
            Reservation }o--o| User : "customer"
      title: Resources
      type: erDiagram
    - diagram: |
        sequenceDiagram
            participant Client
            participant AllocationService
            participant HoldService
            participant ReservationService
            participant Webhooks
            Client->>+AllocationService: SearchAvailability
            AllocationService-->>-Client: SearchAvailabilityResponse
            Client->>+AllocationService: CheckAvailability
            Note over Client,AllocationService: advisory only
            AllocationService-->>-Client: CheckAvailabilityResponse
            Note right of Client: CreateHold is idempotent on hold_id / idempotency_key, so a retry is safe
            alt enough capacity
                Client->>+HoldService: CreateHold
                HoldService-->>-Client: Hold (ACTIVE)
                alt hold still ACTIVE
                    Client->>+ReservationService: CreateReservation
                    Note over Client,ReservationService: the hold becomes CONVERTED
                    ReservationService-->>-Client: Reservation (CONFIRMED)
                    ReservationService-)Webhooks: freebusy.reservation.confirmed
                else hold expired or released
                    Client->>+ReservationService: CreateReservation
                    ReservationService--x-Client: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
                end
            else capacity taken
                Client->>+HoldService: CreateHold
                HoldService--x-Client: FAILED_PRECONDITION (CAPACITY_EXHAUSTED)
            end
      title: Book a resource
      type: sequenceDiagram
    - diagram: |
        stateDiagram-v2
            state "PENDING" as RESERVATION_STATE_PENDING
            state "CONFIRMED" as RESERVATION_STATE_CONFIRMED
            state "CANCELLING" as RESERVATION_STATE_CANCELLING
            state "CANCELLED" as RESERVATION_STATE_CANCELLED
            state "FAILED" as RESERVATION_STATE_FAILED
            state "RESCHEDULING" as RESERVATION_STATE_RESCHEDULING
            state "RESCHEDULED" as RESERVATION_STATE_RESCHEDULED
            [*] --> RESERVATION_STATE_PENDING: CreateReservation
            RESERVATION_STATE_PENDING --> RESERVATION_STATE_CONFIRMED: hold converted
            RESERVATION_STATE_RESCHEDULING --> RESERVATION_STATE_CONFIRMED: reconciler [replacement's hold lapsed]
            RESERVATION_STATE_CONFIRMED --> RESERVATION_STATE_CANCELLING: CancelReservation
            RESERVATION_STATE_CANCELLING --> RESERVATION_STATE_CANCELLED: resources freed
            RESERVATION_STATE_PENDING --> RESERVATION_STATE_FAILED: reconciler [hold lapsed or released]
            RESERVATION_STATE_CONFIRMED --> RESERVATION_STATE_RESCHEDULING: RescheduleReservation
            RESERVATION_STATE_RESCHEDULING --> RESERVATION_STATE_RESCHEDULED: replacement confirmed
            RESERVATION_STATE_CANCELLED --> [*]
            RESERVATION_STATE_FAILED --> [*]
            RESERVATION_STATE_RESCHEDULED --> [*]
      title: ReservationState
      type: stateDiagram-v2
    - diagram: |
        erDiagram
            IdempotencyKey {
                string name PK "IDENTIFIER"
                string method "REQUIRED"
                string request_id "REQUIRED"
                IdempotencyState state "OUTPUT_ONLY"
                string response "OPTIONAL"
                Timestamp create_time "OUTPUT_ONLY"
                Timestamp update_time "OUTPUT_ONLY"
            }
      title: Resources
      type: erDiagram
    - diagram: |
        erDiagram
            Delivery {
                string name PK "IDENTIFIER"
                string event_id "OUTPUT_ONLY"
                string event_type "OUTPUT_ONLY"
                string subject "OUTPUT_ONLY"
                string payload "OUTPUT_ONLY"
                DeliveryState state "OUTPUT_ONLY"
                int32 attempt_count "OUTPUT_ONLY"
                Timestamp next_attempt_time "OUTPUT_ONLY"
                int32 response_code "OUTPUT_ONLY"
                string error_message "OUTPUT_ONLY"
                Timestamp create_time "OUTPUT_ONLY"
                Timestamp update_time "OUTPUT_ONLY"
                Timestamp deliver_time "OUTPUT_ONLY"
                string etag "OUTPUT_ONLY"
            }
            FeedCursor {
                string name PK "IDENTIFIER"
                Timestamp position_time "REQUIRED"
                Timestamp update_time "OUTPUT_ONLY"
                string etag "OUTPUT_ONLY"
            }
            Webhook {
                string name PK "IDENTIFIER"
                string display_name "OPTIONAL"
                string uri "REQUIRED"
                string[] event_types "OPTIONAL"
                string organizational_unit FK "OPTIONAL"
                WebhookState state "OUTPUT_ONLY"
                string secret "OUTPUT_ONLY"
                string previous_secret "OUTPUT_ONLY"
                Timestamp rotate_time "OUTPUT_ONLY"
                Timestamp create_time "OUTPUT_ONLY"
                Timestamp update_time "OUTPUT_ONLY"
                string etag "OUTPUT_ONLY"
            }
            Webhook ||--o{ Delivery : "deliveries"
            Webhook }o--o| OrganizationalUnit : "organizational_unit"
      title: Resources
      type: erDiagram
    - diagram: |
        stateDiagram-v2
            state "PENDING" as DELIVERY_STATE_PENDING
            state "SUCCEEDED" as DELIVERY_STATE_SUCCEEDED
            state "FAILED" as DELIVERY_STATE_FAILED
            [*] --> DELIVERY_STATE_PENDING: change recorded
            DELIVERY_STATE_PENDING --> DELIVERY_STATE_PENDING: attempt failed [attempts left]
            DELIVERY_STATE_FAILED --> DELIVERY_STATE_PENDING: RetryDelivery
            DELIVERY_STATE_SUCCEEDED --> DELIVERY_STATE_PENDING: RetryDelivery
            DELIVERY_STATE_PENDING --> DELIVERY_STATE_SUCCEEDED: endpoint answered 2xx
            DELIVERY_STATE_PENDING --> DELIVERY_STATE_FAILED: attempt failed [no attempts left]
      title: DeliveryState
      type: stateDiagram-v2
    - diagram: |
        stateDiagram-v2
            state "ACTIVE" as WEBHOOK_STATE_ACTIVE
            state "PAUSED" as WEBHOOK_STATE_PAUSED
            [*] --> WEBHOOK_STATE_ACTIVE: CreateWebhook
            WEBHOOK_STATE_PAUSED --> WEBHOOK_STATE_ACTIVE: ResumeWebhook
            WEBHOOK_STATE_ACTIVE --> WEBHOOK_STATE_PAUSED: PauseWebhook
      title: WebhookState
      type: stateDiagram-v2
externalDocs:
  description: FreeBusy API documentation
  url: https://freebusy.shokki.engineering/docs
# freebusy is self-hosted: the server is your own deployment's REST port
# (8080 by default). No security scheme yet: there is no authentication
# until OIDC lands, and a scheme here would tell clients to send a token
# nothing checks.
servers:
  - url: http://localhost:8080
    description: A local deployment (the release default port)
tags:
  - name: Allocation Service
    description: |-
      AllocationService is the read-only half of the engine: it answers how much is
      free, and never changes anything. HoldService is the half that takes.

      The counting is done here rather than stored anywhere. No RFC models an
      inventory count -- RFC 5545 and RFC 7953 are one-calendar-one-timeline -- so
      "5 of 12 free" is produced by asking each RFC 9073 resource's calendar
      whether it is free across the window and totalling the answers. RFC 7953's
      VAVAILABILITY says when a resource was on offer at all; bookings on its
      calendar say what has since been taken; the difference is availability.

      Every operation is a custom method (AIP-136): they compute rather than fetch,
      so they take neither the standard-method names nor their shapes.
  - name: Availabilities
  - name: Calendars
  - name: Events
  - name: Hold Service
    description: |-
      HoldService takes and releases expiring claims on resources. It is the only
      thing in this API that mutates availability.

      Two things are deliberately not RPCs: the sweeper that expires lapsed holds
      is an internal job, not a call, and conversion to a confirmed booking is
      driven by ReservationService, so a hold is never converted by a caller
      reaching in here.

      There is no UpdateHold. A hold's window and resources are immutable by
      construction -- changing either is a different allocation -- so the only
      mutations are the two custom methods below.

      ### Flow: Hold expiry

      A hold nobody confirms lapses at `expire_time`; ExtendHold pushes the
      deadline out while it is still ACTIVE.

      Reads are authoritative on expiry, so a caller never sees an ACTIVE hold
      that no longer holds anything, even before the sweeper runs.

      ```mermaid
      sequenceDiagram
          participant Client
          participant HoldService
          participant Sweeper
          participant Webhooks
          Client->>+HoldService: CreateHold
          HoldService-->>-Client: Hold (ACTIVE)
          opt the caller needs more time
              Client->>+HoldService: ExtendHold
              HoldService-->>-Client: Hold (later expire_time)
          end
          Sweeper->>HoldService: expire lapsed holds
          Note over Sweeper,HoldService: expire_time passed#59; the claims stop counting
          HoldService-)Webhooks: freebusy.hold.expired
          Client->>+HoldService: GetHold
          HoldService-->>-Client: Hold (EXPIRED)
          Client->>+HoldService: ExtendHold
          HoldService--x-Client: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
      ```
    x-mermaid:
      - diagram: |
          sequenceDiagram
              participant Client
              participant HoldService
              participant Sweeper
              participant Webhooks
              Client->>+HoldService: CreateHold
              HoldService-->>-Client: Hold (ACTIVE)
              opt the caller needs more time
                  Client->>+HoldService: ExtendHold
                  HoldService-->>-Client: Hold (later expire_time)
              end
              Sweeper->>HoldService: expire lapsed holds
              Note over Sweeper,HoldService: expire_time passed#59; the claims stop counting
              HoldService-)Webhooks: freebusy.hold.expired
              Client->>+HoldService: GetHold
              HoldService-->>-Client: Hold (EXPIRED)
              Client->>+HoldService: ExtendHold
              HoldService--x-Client: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
        title: Hold expiry
        type: sequenceDiagram
  - name: Organizational Units
  - name: Organizations
  - name: Reservation Service
    description: |-
      ReservationService turns holds into confirmed bookings, updates and cancels
      them.

      It is where HoldService's conversion is driven from: a hold is never
      converted by a caller reaching into HoldService, only by a reservation being
      made of it. UpdateReservation changes only what the engine does not own --
      the customer and the attributes. The window and resources are the hold's,
      and changing either is a new hold and a new reservation, which is exactly
      what RescheduleReservation does.

      ### Flow: Reschedule a reservation

      Moves a booking onto a new hold. The original keeps its resources until
      the replacement is confirmed, so a failure part-way leaves the old
      booking in place.

      ```mermaid
      sequenceDiagram
          participant Client
          participant ReservationService
          participant HoldService
          participant Webhooks
          Client->>+ReservationService: GetReservation
          ReservationService-->>-Client: Reservation (CONFIRMED)
          Client->>+HoldService: CreateHold
          Note over Client,HoldService: hold.replaces = the reservation's hold
          HoldService-->>-Client: Hold (ACTIVE)
          Note right of Client: the original goes RESCHEDULING and keeps its resources meanwhile
          alt new hold still active
              Client->>+ReservationService: RescheduleReservation
              Note over Client,ReservationService: original becomes RESCHEDULED
              ReservationService-->>-Client: replacement Reservation (CONFIRMED)
              ReservationService-)Webhooks: freebusy.reservation.rescheduled
          else new hold lapsed
              Client->>+ReservationService: RescheduleReservation
              Note over Client,ReservationService: original back to CONFIRMED
              ReservationService--x-Client: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
          end
      ```

      ### Flow: Cancel a reservation

      Cancelling frees the resources; repeating it changes nothing.

      ```mermaid
      sequenceDiagram
          participant Client
          participant ReservationService
          participant Webhooks
          Client->>+ReservationService: CancelReservation
          Note over Client,ReservationService: CONFIRMED -> CANCELLING -> CANCELLED
          ReservationService-->>-Client: Reservation (CANCELLED)
          ReservationService-)Webhooks: freebusy.reservation.cancelled
          Client->>+ReservationService: CancelReservation
          Note over Client,ReservationService: idempotent#59; no second event
          ReservationService-->>-Client: Reservation (CANCELLED)
      ```
    x-mermaid:
      - diagram: |
          sequenceDiagram
              participant Client
              participant ReservationService
              participant HoldService
              participant Webhooks
              Client->>+ReservationService: GetReservation
              ReservationService-->>-Client: Reservation (CONFIRMED)
              Client->>+HoldService: CreateHold
              Note over Client,HoldService: hold.replaces = the reservation's hold
              HoldService-->>-Client: Hold (ACTIVE)
              Note right of Client: the original goes RESCHEDULING and keeps its resources meanwhile
              alt new hold still active
                  Client->>+ReservationService: RescheduleReservation
                  Note over Client,ReservationService: original becomes RESCHEDULED
                  ReservationService-->>-Client: replacement Reservation (CONFIRMED)
                  ReservationService-)Webhooks: freebusy.reservation.rescheduled
              else new hold lapsed
                  Client->>+ReservationService: RescheduleReservation
                  Note over Client,ReservationService: original back to CONFIRMED
                  ReservationService--x-Client: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
              end
        title: Reschedule a reservation
        type: sequenceDiagram
      - diagram: |
          sequenceDiagram
              participant Client
              participant ReservationService
              participant Webhooks
              Client->>+ReservationService: CancelReservation
              Note over Client,ReservationService: CONFIRMED -> CANCELLING -> CANCELLED
              ReservationService-->>-Client: Reservation (CANCELLED)
              ReservationService-)Webhooks: freebusy.reservation.cancelled
              Client->>+ReservationService: CancelReservation
              Note over Client,ReservationService: idempotent#59; no second event
              ReservationService-->>-Client: Reservation (CANCELLED)
        title: Cancel a reservation
        type: sequenceDiagram
  - name: Resources
  - name: Webhook Service
    description: |-
      WebhookService subscribes endpoints to changes in holds, reservations and
      inventory, and shows what was sent to each.

      ### Flow: Webhook delivery

      Every change a webhook subscribes to is recorded as a Delivery and sent
      as a signed CloudEvent (Standard Webhooks). Failed deliveries are retried
      with backoff, and can be sent again by hand.

      ```mermaid
      sequenceDiagram
          participant Client
          participant WebhookService
          participant ReservationService
          participant Dispatcher
          participant Endpoint
          Client->>+WebhookService: CreateWebhook
          WebhookService-->>-Client: Webhook (ACTIVE)
          ReservationService->>Dispatcher: change recorded (e.g. reservation confirmed)
          Note over ReservationService,Dispatcher: one Delivery per matching webhook, PENDING
          Dispatcher->>Endpoint: POST signed CloudEvent
          alt 2xx
              Endpoint->>Dispatcher: 2xx
              Note over Endpoint,Dispatcher: Delivery SUCCEEDED
          else error or timeout
              Endpoint->>Dispatcher: 5xx / timeout
              Note over Endpoint,Dispatcher: retried with backoff#59; FAILED when no attempts are left
              Client->>+WebhookService: ListDeliveries
              Note over Client,WebhookService: filter state = FAILED
              WebhookService-->>-Client: ListDeliveriesResponse
              Client->>+WebhookService: RetryDelivery
              WebhookService-->>-Client: Delivery (PENDING)
          end
      ```
    x-mermaid:
      - diagram: |
          sequenceDiagram
              participant Client
              participant WebhookService
              participant ReservationService
              participant Dispatcher
              participant Endpoint
              Client->>+WebhookService: CreateWebhook
              WebhookService-->>-Client: Webhook (ACTIVE)
              ReservationService->>Dispatcher: change recorded (e.g. reservation confirmed)
              Note over ReservationService,Dispatcher: one Delivery per matching webhook, PENDING
              Dispatcher->>Endpoint: POST signed CloudEvent
              alt 2xx
                  Endpoint->>Dispatcher: 2xx
                  Note over Endpoint,Dispatcher: Delivery SUCCEEDED
              else error or timeout
                  Endpoint->>Dispatcher: 5xx / timeout
                  Note over Endpoint,Dispatcher: retried with backoff#59; FAILED when no attempts are left
                  Client->>+WebhookService: ListDeliveries
                  Note over Client,WebhookService: filter state = FAILED
                  WebhookService-->>-Client: ListDeliveriesResponse
                  Client->>+WebhookService: RetryDelivery
                  WebhookService-->>-Client: Delivery (PENDING)
              end
        title: Webhook delivery
        type: sequenceDiagram
paths:
  /v1/organizationalUnits/{organizationalUnit}:checkAvailability:
    post:
      tags:
        - Allocation Service
      description: |-
        Checks one exact window for one exact quantity, with reasons when it fails.

         Advisory, not a reservation: the answer can be stale the instant it is
         returned. CreateHold is what actually secures anything.
      operationId: AllocationService_CheckAvailability
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Check Availability
  /v1/organizationalUnits/{organizationalUnit}:computeAvailability:
    post:
      tags:
        - Allocation Service
      description: Computes availability across a site's resources, bucketed by slot or day.
      operationId: AllocationService_ComputeAvailability
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Compute Availability
  /v1/organizations/{organization}:searchAvailability:
    post:
      tags:
        - Allocation Service
      description: |-
        Sweeps an operator for resources free across a window.

         The search entry point, where ComputeAvailability answers for a site the
         caller has already chosen. Paginated, since a large operator may match
         thousands of resources.
      operationId: AllocationService_SearchAvailability
      parameters:
        - name: organization
          in: path
          description: The organization id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Search Availability
  /v1/resources:batchCompute:
    post:
      tags:
        - Allocation Service
      description: |-
        Runs several availability computations in one round trip.

         Each entry is independent and may name a different site, window or
         granularity. Capped at 50 entries, because each one fans out across every
         candidate resource's calendar.
      operationId: AllocationService_BatchComputeAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchComputeAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchComputeAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Batch Compute Availability
  /v1/organizationalUnits/{organizationalUnit}/holds:
    get:
      tags:
        - Hold Service
      description: Lists the holds taken at a site.
      operationId: HoldService_ListHolds
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum holds to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListHoldsResponse.next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression, AIP-160, over the hold's own fields, e.g.
             `state=HOLD_STATE_ACTIVE`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHoldsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Holds
    post:
      tags:
        - Hold Service
      description: |-
        Takes a hold, allocating concrete resources for the window.

         The server chooses which resources are taken from the candidates offered,
         under a lock, so two callers racing for the last bay cannot both win.
         Requires an idempotency key: a retry after a timeout returns the original
         hold rather than taking a second one.
      operationId: HoldService_CreateHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: holdId
          in: query
          description: |-
            Client-assigned id, becoming the last segment of the hold name. The server
             generates one when empty.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hold'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
