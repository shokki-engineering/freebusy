(matches no time).\n When both start and end are unspecified, the interval matches any time."}, SearchAvailabilityRequest: {required: [parent, window], type: object, properties: {parent: {type: string, description: "The operator to search within.\n Format: organizations/{organization}"}, window: {allOf: [{$ref: '#/components/schemas/Interval'}], description: The window that must be free.}, organizationalUnits: {type: array, items: {type: string}, description: "Restrict to sites, e.g. one car park or one venue. Empty searches all.\n Format: organizationalUnits/{organizational_unit}"}, resourceTypes: {type: array, items: {type: string}, description: "Restrict to RESOURCE-TYPE values, RFC 9073 section 6.3, e.g. \"room\" or\n \"parking-bay\": a resource matches when it carries any of them. Empty\n matches every type."}, quantity: {type: integer, description: "How many resources must be free together at one site for it to match.\n Defaults to 1.", format: int32}, pageSize: {type: integer, description: 'Maximum matches to return. Defaults to 50, capped at 1000.', format: int32}, pageToken: {type: string, description: "Page token from a previous SearchAvailabilityResponse.next_page_token.\n Every other field must be the same as in the call that returned it."}, filter: {type: string, description: "An AIP-160 filter over each resource's search record (ResourceDay): its\n `resource_types`, its STRUCTURED-DATA under `attributes` (any path, e.g.\n `attributes.view = \"river\" AND attributes.max_occupancy >= 3`), its\n `display_name` (a bare word matches it) and `organizational_unit`. Terms\n are ANDed unless joined with OR. Empty matches every resource."}, orderBy: {type: string, description: "AIP-132 order of the matches: a comma-separated list of `resource`,\n `organizational_unit`, `display_name`, `free_fraction` (the share of\n the window's first UTC day that is free) and `attributes.max_occupancy`\n (the booking profile's, as a number), each optionally followed by\n ` desc`, e.g. `free_fraction desc, display_name`. Defaults to\n `organizational_unit, resource`. When quantity is above 1, matches are\n grouped by site first, and the order applies within a site."}, facets: {type: array, items: {type: string}, description: "Fields to count matching resources by, returned in\n SearchAvailabilityResponse.facets: `resource_types`,\n `organizational_unit` or an `attributes.<path>`, e.g.\n [\"resource_types\", \"attributes.view\"]. At most 10."}}, description: "Request message for AllocationService.SearchAvailability. Sweeps a whole\n operator for resources free across a window, where ComputeAvailability\n answers for one site already chosen."}, SearchAvailabilityResponse: {type: object, properties: {matches: {type: array, items: {$ref: '#/components/schemas/AvailabilityMatch'}, description: The free resources found.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}, facets: {type: array, items: {$ref: '#/components/schemas/SearchFacet'}, description: "One entry per field the request named in `facets`, in that order: how\n many resources matching the filter have that window free in their\n standing availability, by value. Counts come from the search records\n and do not subtract live holds, so they can run slightly above what a\n hold would get; the matches themselves are exact."}}, description: Response message for AllocationService.SearchAvailability.}, SearchFacet: {type: object, properties: {field: {type: string, description: 'The field counted, as the request named it, e.g. "attributes.view".'}, buckets: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}, description: 'The most frequent values, most frequent first, at most 20.'}}, description: "The counts of one facet of a search: how many matching resources carry\n each value of one field."}, Status: {type: object, properties: {code: {type: integer, description: 'The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].', format: int32}, message: {type: string, description: 'A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.'}, details: {type: array, items: {$ref: '#/components/schemas/GoogleProtobufAny'}, description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.}}, description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'}, UnbookableReason: {type: object, properties: {code: {type: integer, description: 'What went wrong, as a code a caller can branch on.', format: enum}, message: {type: string, description: 'Human-readable detail for logs and support, not for parsing.'}, resource: {type: string, description: "The resource this reason is about, when it concerns one in particular.\n Format: resources/{resource}"}}, description: Why a requested window is not bookable.}, ExtendHoldRequest: {required: [name, duration], type: object, properties: {name: {type: string, description: "Name of the hold to extend.\n Format: organizationalUnits/{organizational_unit}/holds/{hold}"}, duration: {pattern: '^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$', type: string, description: "How much further out to push expire_time, measured from now rather than\n from the current deadline, so repeated extensions cannot accumulate."}, etag: {type: string, description: "Opaque version read from the hold; the extension is rejected if the hold\n changed since (AIP-154)."}}, description: Request message for HoldService.ExtendHold.}, Hold: {required: [window], type: object, properties: {name: {type: string, description: "The hold name. Nested under the site whose resources it takes, so a hold\n is listed and swept per site without joining through every resource.\n Format: organizationalUnits/{organizational_unit}/holds/{hold}"}, resources: {readOnly: true, type: array, items: {type: string}, description: "The concrete resources this hold has taken, one per unit of `quantity`.\n Chosen by the server from the candidates the request offered.\n Format: resources/{resource}"}, window: {allOf: [{$ref: '#/components/schemas/Interval'}], description: "The window held. Immutable: moving it is a different allocation, so\n release this hold and take another.\n\n Stored as text, its two ends in RFC 3339 joined by \"/\"."}, candidateResources: {type: array, items: {type: string}, description: "Candidate resources the allocator may choose from, supplied on create.\n Empty offers every resource the site holds. Immutable: the choice is made\n once, and re-offering a different set is a different allocation.\n Format: resources/{resource}"}, quantity: {type: integer, description: "How many resources to take, supplied on create; defaults to 1. Once the\n hold is ACTIVE this equals the length of `resources`.", format: int32}, expireTime: {readOnly: true, type: string, description: "When the hold lapses if nothing confirms it. Extend it with ExtendHold;\n past this instant the hold no longer reserves anything, whether or not the\n sweeper has yet marked it EXPIRED.", format: date-time}, state: {readOnly: true, type: integer, description: Lifecycle state. New holds start ACTIVE., format: enum}, idempotencyKey: {type: string, description: "Caller-supplied key making CreateHold safe to retry. A repeat with the same\n key returns the original hold rather than taking a second one."}, createTime: {readOnly: true, type: string, description: Creation timestamp., format: date-time}, updateTime: {readOnly: true, type: string, description: Last-modification timestamp., format: date-time}, etag: {readOnly: true, type: string, description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.}, replaces: {type: string, description: "The hold of the reservation this hold is taken to replace with\n RescheduleReservation: that reservation's `hold`, converted and at the\n same site. Its claims do not count against this hold, so a new window\n overlapping the old one -- an extension, a shift by an hour -- can keep\n the same resources. Until the move completes this hold claims only the\n time the old one does not; RescheduleReservation hands the rest over in\n the write that ends the old hold, so no one else can take it in between.\n Such a hold can only be used to reschedule that reservation. (A hold,\n though no resource_reference says so: AIP-121 allows no cycle of mutable\n references, and this one is a hold naming a hold.)\n Format: organizationalUnits/{organizational_unit}/holds/{hold}"}, candidateFilter: {type: string, description: "An AIP-160 filter narrowing the resources the allocator may choose from,\n supplied on create, alongside `candidate_resources`: the same filter\n SearchAvailability takes, over each resource's `resource_types`,\n `attributes` (its STRUCTURED-DATA, e.g. `attributes.view = \"river\"`) and\n `display_name`. Empty narrows nothing. Immutable, like the candidates."}}, description: "A Hold is a temporary, expiring claim on one or more bookable resources for a\n window, taken before payment or confirmation so two callers cannot be sold\n the same thing.\n\n Native, with no RFC behind it, and the comment says why (the same trade\n protobuf.shared.project.v1 records upstream). RFC 5545 section 3.2.12's\n PARTSTAT=TENTATIVE can express that a claim is provisional, and RFC 5546's\n iTIP can carry the request that created it, but neither specifies a lapse\n time, and an expiring claim is the one thing a commercial booking engine\n cannot do without. The resources held are RFC 9073 VRESOURCEs and the window\n is measured against their RFC 7953 availability; only the clock is ours.\n\n Holds are allocated, not requested: CreateHold names candidate resources and\n a quantity, and the server decides which concrete resources are taken. That\n keeps \"which bay did I get\" a server decision made under a lock, rather than\n a client guess that races."}, ListHoldsResponse: {type: object, properties: {holds: {type: array, items: {$ref: '#/components/schemas/Hold'}, description: The holds on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for HoldService.ListHolds, AIP-132.'}, ReleaseHoldRequest: {required: [name], type: object, properties: {name: {type: string, description: "Name of the hold to release.\n Format: organizationalUnits/{organizational_unit}/holds/{hold}"}, etag: {type: string, description: "Opaque version read from the hold; the release is rejected if the hold\n changed since (AIP-154)."}}, description: Request message for HoldService.ReleaseHold.}, CancelReservationRequest: {required: [name], type: object, properties: {name: {type: string, description: 'Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'}, reason: {type: string, description: 'Why, in the canceller''s words. Recorded, never parsed.'}, etag: {type: string, description: "Opaque version read from the reservation; the cancel is rejected if it\n changed since (AIP-154)."}}, description: Request message for ReservationService.CancelReservation.}, ListReservationsResponse: {type: object, properties: {reservations: {type: array, items: {$ref: '#/components/schemas/Reservation'}, description: The reservations on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for ReservationService.ListReservations, AIP-132.'}, RescheduleReservationRequest: {required: [name, hold], type: object, properties: {name: {type: string, description: "The confirmed reservation to move.\n Format: organizationalUnits/{organizational_unit}/reservations/{reservation}"}, hold: {type: string, description: "A live hold at the same site on the new window, taken by the caller with\n HoldService.CreateHold. Taking it first is what makes the move safe: the\n new slot is secured before the old one is let go.\n Format: organizationalUnits/{organizational_unit}/holds/{hold}"}, etag: {type: string, description: "Opaque version read from the reservation; the move is rejected if it\n changed since (AIP-154)."}}, description: Request message for ReservationService.RescheduleReservation.}, Reservation: {required: [hold], type: object, properties: {name: {type: string, description: "The reservation name. Its id is the caller's reservation_id, or else the\n id of the hold it was made from.\n Format: organizationalUnits/{organizational_unit}/reservations/{reservation}"}, hold: {type: string, description: "The hold this reservation was made from, at the same site.\n Format: organizationalUnits/{organizational_unit}/holds/{hold}"}, resources: {readOnly: true, type: array, items: {type: string}, description: "The resources taken, copied from the hold.\n Format: resources/{resource}"}, startTime: {readOnly: true, type: string, description: 'Start of the reserved window, copied from the hold.', format: date-time}, endTime: {readOnly: true, type: string, description: 'End of the reserved window, exclusive, copied from the hold.', format: date-time}, customer: {type: string, description: "Who the reservation is for, by name in the user service. freebusy does\n not keep users: when a resolver for the type is registered (config\n `reference_services`) a create or update checks the name with that service, and a deleted user leaves the\n reservation as it is.\n Format: users/{user}"}, state: {readOnly: true, type: integer, description: Lifecycle state., format: enum}, attributes: {type: object, description: "Whatever a vertical needs to keep with the reservation: a party size, a\n payment reference, a licence plate. Opaque to the engine."}, cancelReason: {readOnly: true, type: string, description: 'Why it was cancelled, in the canceller''s words. Set by CancelReservation.'}, createTime: {readOnly: true, type: string, description: Creation timestamp., format: date-time}, updateTime: {readOnly: true, type: string, description: Last-modification timestamp., format: date-time}, confirmTime: {readOnly: true, type: string, description: When it was confirmed., format: date-time}, cancelTime: {readOnly: true, type: string, description: When it was cancelled., format: date-time}, etag: {readOnly: true, type: string, description: Opaque version for optimistic concurrency (AIP-154); echo on cancel.}, replaces: {readOnly: true, type: string, description: "The reservation this one replaced, set when it was made by\n RescheduleReservation.\n Format: organizationalUnits/{organizational_unit}/reservations/{reservation}"}, replacement: {readOnly: true, type: string, description: "The reservation replacing this one, set when RescheduleReservation began.\n Format: organizationalUnits/{organizational_unit}/reservations/{reservation}"}, lastChange: {readOnly: true, type: integer, description: "What the last write to this reservation changed. A webhook is sent\n freebusy.reservation.updated exactly when it is CHANGE_DETAILS, and the\n event of the new state otherwise.", format: enum}}, description: "A Reservation is a confirmed booking: a hold made permanent.\n\n It is the last step of booking, not the first. The caller checks\n availability, takes a hold, settles whatever its vertical needs settled --\n payment, a guest list, a waiver -- and then creates a reservation from the\n hold. The reservation records the outcome; the engine already holds the\n resources.\n\n Deliberately thin. Price, discount, promo code, refund, guests and occupancy\n are what would tie it to one vertical, and none of them is here: money belongs to the payment service and people to the user\n service, both referenced by name (AIP-215), and anything else a vertical\n needs to remember rides in `attributes`."}, Delivery: {type: object, properties: {name: {type: string, description: "The delivery name. The final segment is a digest of (webhook, event_id).\n Format: webhooks/{webhook}/deliveries/{delivery}"}, eventId: {readOnly: true, type: string, description: "The CloudEvents id, the same for every webhook sent this change: a digest\n of the record's name and etag. Receivers deduplicate on it."}, eventType: {readOnly: true, type: string, description: 'The CloudEvents type, e.g. "freebusy.reservation.confirmed".'}, subject: {readOnly: true, type: string, description: "The record that changed.\n Format: organizationalUnits/{organizational_unit}/reservations/{reservation}\n or organizationalUnits/{organizational_unit}/holds/{hold}"}, payload: {readOnly: true, type: string, description: "The request body sent: a CloudEvents 1.0 JSON document whose data is the\n record as it stood."}, state: {readOnly: true, type: integer, description: Where sending stands., format: enum}, attemptCount: {readOnly: true, type: integer, description: Attempts made so far., format: int32}, nextAttemptTime: {readOnly: true, type: string, description: 'When the next attempt is due, while PENDING.', format: date-time}, responseCode: {readOnly: true, type: integer, description: HTTP status of the last attempt; 0 when it got no response., format: int32}, errorMessage: {readOnly: true, type: string, description: 'Why the last attempt failed, empty after a success.'}, createTime: {readOnly: true, type: string, description: When the change was recorded for this webhook., format: date-time}, updateTime: {readOnly: true, type: string, description: Last-modification timestamp., format: date-time}, deliverTime: {readOnly: true, type: string, description: When the endpoint accepted it., format: date-time}, etag: {readOnly: true, type: string, description: Opaque version for optimistic concurrency (AIP-154).}}, description: "One event owed to one webhook, and how sending it went.\n\n The id is derived, not random: a digest of the webhook and the event, so\n recording the same change twice -- a rescan, or two servers scanning at once\n -- loses the race on the primary key instead of sending the event twice."}, ListDeliveriesResponse: {type: object, properties: {deliveries: {type: array, items: {$ref: '#/components/schemas/Delivery'}, description: The deliveries on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for WebhookService.ListDeliveries, AIP-132.'}, ListWebhooksResponse: {type: object, properties: {webhooks: {type: array, items: {$ref: '#/components/schemas/Webhook'}, description: The webhooks on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for WebhookService.ListWebhooks, AIP-132.'}, PauseWebhookRequest: {required: [name], type: object, properties: {name: {type: string, description: 'Format: webhooks/{webhook}'}}, description: Request message for WebhookService.PauseWebhook.}, ResumeWebhookRequest: {required: [name], type: object, properties: {name: {type: string, description: 'Format: webhooks/{webhook}'}}, description: Request message for WebhookService.ResumeWebhook.}, RetryDeliveryRequest: {required: [name], type: object, properties: {name: {type: string, description: 'Format: webhooks/{webhook}/deliveries/{delivery}'}}, description: Request message for WebhookService.RetryDelivery.}, RotateWebhookSecretRequest: {required: [name], type: object, properties: {name: {type: string, description: 'Format: webhooks/{webhook}'}}, description: Request message for WebhookService.RotateWebhookSecret.}, Webhook: {required: [uri], type: object, properties: {name: {type: string, description: "The webhook name.\n Format: webhooks/{webhook}"}, displayName: {type: string, description: 'Human-readable name, for the operator''s own reference.'}, uri: {type: string, description: "The endpoint each event is POSTed to. HTTPS, except to a loopback host\n when the server allows insecure endpoints for development. Required on\n create; an update that leaves it out keeps the current one."}, eventTypes: {type: array, items: {type: string}, description: "The event types sent, e.g. \"freebusy.reservation.confirmed\" or\n \"freebusy.event.deleted\". Empty sends every type. A type is\n \"freebusy.<record>.<what happened>\": holds are active, released, expired\n and converted; reservations pending, confirmed, cancelling, cancelled,\n failed, rescheduling and rescheduled, and updated exactly when\n UpdateReservation changed its customer or attributes -- the reservation's\n last_change is CHANGE_DETAILS (freebusy.reservation.updated);\n resources, calendars, events and availabilities created, updated and\n deleted."}, organizationalUnit: {type: string, description: "Limits events to one site's holds, reservations and resources. Empty\n sends every site's. Calendars, events and availabilities belong to no\n site, so a webhook limited to one is not sent them.\n Format: organizationalUnits/{organizational_unit}"}, state: {readOnly: true, type: integer, description: "Whether changes are sent. Set by PauseWebhook and ResumeWebhook; pausing\n keeps the webhook and its history.", format: enum}, secret: {readOnly: true, type: string, description: "The key every delivery is signed with, in the Standard Webhooks form: a\n \"whsec_\" prefix and the encoded key. Returned by CreateWebhook and\n RotateWebhookSecret only; every other read leaves it empty."}, previousSecret: {readOnly: true, type: string, description: "The key the secret replaced, which also signs deliveries for a day after\n a rotation so a receiver can switch keys without dropping one. Never\n returned."}, rotateTime: {readOnly: true, type: string, description: When the secret was last rotated., format: date-time}, createTime: {readOnly: true, type: string, description: Creation timestamp., format: date-time}, updateTime: {readOnly: true, type: string, description: Last-modification timestamp., format: date-time}, etag: {readOnly: true, type: string, description: Opaque version for optimistic concurrency (AIP-154).}}, description: "A Webhook sends an HTTPS endpoint each change to holds, reservations and the\n inventory they draw on -- resources, calendars, calendar events and\n availability -- as a signed CloudEvent: how a payment service learns a hold\n lapsed, or a booking layer that a reservation was confirmed or a court was\n closed for maintenance, without polling.\n\n Changes are read from the records themselves, not announced by the writes,\n so a change cannot be lost to a crash between a write and its\n announcement. The price is coalescing: two transitions of one record in\n quick succession may arrive as one event carrying the later state. Every\n event carries the whole record, so a receiver acts on what is, not on a\n diff."}, ListOrganizationsResponse: {type: object, properties: {organizations: {type: array, items: {$ref: '#/components/schemas/Organization'}, description: The organizations on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for Organizations.ListOrganizations, AIP-132 <https://aip.dev/132>.'}, Organization: {required: [displayNames], type: object, properties: {name: {type: string, description: 'Resource name, "organizations/{organization}".'}, uid: {readOnly: true, type: string, description: Server-assigned unique id.}, displayNames: {type: array, items: {type: string}, description: '''o'', section 2.19 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.19>. The only attribute section 3.8 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.8> makes mandatory.'}, descriptions: {type: array, items: {type: string}, description: '''description'', section 2.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.5>.'}, businessCategories: {type: array, items: {type: string}, description: '''businessCategory'', section 2.1 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.1>.'}, seeAlso: {type: array, items: {type: string}, description: "'seeAlso', section 2.30 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.30>. Distinguished names of related entries, kept as\n opaque strings: an LDAP DN is not a resource name and does not resolve\n through this API."}, createTime: {readOnly: true, type: string, description: When the organization was created., format: date-time}, updateTime: {readOnly: true, type: string, description: When the organization was last modified., format: date-time}, etag: {readOnly: true, type: string, description: "Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an\n update or delete to make the write conditional: if the resource changed\n since it was read, the request fails instead of overwriting."}, deleteTime: {readOnly: true, type: string, description: 'When the organization was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.', format: date-time}, expireTime: {readOnly: true, type: string, description: 'When a soft-deleted organization is purged for good. AIP-164 <https://aip.dev/164>.', format: date-time}}, description: "Organization is the LDAP 'organization' object class, RFC 4519 section 3.8 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.8>.\n\n Attributes are repeated because LDAP attribute types are multi-valued by\n default. Section 3.8 lists twenty-one optional attributes; the four here\n are the ones that carry meaning outside a directory server.\n\n Reference: RFC 4519 \"LDAP: Schema for User Applications\", section 3.8.\n https://www.rfc-editor.org/rfc/rfc4519.html#section-3.8"}, UndeleteOrganizationRequest: {required: [name], type: object, properties: {name: {type: string, description: Name of the soft-deleted organization to restore.}}, description: 'Request message for Organizations.UndeleteOrganization, AIP-164 <https://aip.dev/164>.'}, ListOrganizationalUnitsResponse: {type: object, properties: {organizationalUnits: {type: array, items: {$ref: '#/components/schemas/OrganizationalUnit'}, description: The organizational units on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for OrganizationalUnits.ListOrganizationalUnits, AIP-132 <https://aip.dev/132>.'}, OrganizationalUnit: {required: [displayNames], type: object, properties: {name: {type: string, description: 'Resource name, "organizationalUnits/{organizationalUnit}".'}, uid: {readOnly: true, type: string, description: Server-assigned unique id.}, displayNames: {type: array, items: {type: string}, description: '''ou'', section 2.20 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.20>. The only attribute section 3.11 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11> makes mandatory.'}, descriptions: {type: array, items: {type: string}, description: '''description'', section 2.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.5>.'}, businessCategories: {type: array, items: {type: string}, description: '''businessCategory'', section 2.1 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.1>.'}, seeAlso: {type: array, items: {type: string}, description: "'seeAlso', section 2.30 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.30>. Distinguished names of related entries, kept as\n opaque strings: an LDAP DN is not a resource name and does not resolve\n through this API."}, organization: {type: string, description: "The organization this unit belongs to.\n\n Native: section 3.11's MAY list has no 'o' attribute, unlike groupOfNames\n -- organizationalUnit's placement under an organization is a DIT\n convention, not a schema attribute. Left unset, this resource is\n undiscoverable from its organization, which defeats the reason for\n building it (see the plan's \"the one that makes the hierarchy real\"),\n so the field exists despite having no RFC attribute behind it."}, createTime: {readOnly: true, type: string, description: When the organizational unit was created., format: date-time}, updateTime: {readOnly: true, type: string, description: When the organizational unit was last modified., format: date-time}, etag: {readOnly: true, type: string, description: "Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an\n update or delete to make the write conditional: if the resource changed\n since it was read, the request fails instead of overwriting."}, deleteTime: {readOnly: true, type: string, description: 'When the organizational unit was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.', format: date-time}, expireTime: {readOnly: true, type: string, description: 'When a soft-deleted organizational unit is purged for good. AIP-164 <https://aip.dev/164>.', format: date-time}}, description: "OrganizationalUnit is the LDAP 'organizationalUnit' object class, RFC 4519\n section 3.11 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11>.\n\n A flat resource, \"organizationalUnits/{organizationalUnit}\", not nested\n under Organization: section 3.11 defines MUST and MAY attributes and says\n nothing about DIT placement, so \"organizations/{o}/organizationalUnits/{ou}\"\n would assert a hierarchy the RFC does not require. Group faced the same\n question for its own optional 'o' reference and was built flat for the\n same reason -- this resource follows that precedent instead of inventing a\n new one.\n\n Attributes are repeated because LDAP attribute types are multi-valued by\n default. Section 3.11 lists twenty MAY attributes; the three modelled here\n -- description, businessCategory, seeAlso -- are the ones Organization\n already carries, kept identical rather than picking a different subset for\n two object classes whose optional attributes overlap this heavily.\n\n Reference: RFC 4519 \"LDAP: Schema for User Applications\", section 3.11.\n https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11"}, UndeleteOrganizationalUnitRequest: {required: [name], type: object, properties: {name: {type: string, description: Name of the soft-deleted organizational unit to restore.}}, description: 'Request message for OrganizationalUnits.UndeleteOrganizationalUnit, AIP-164 <https://aip.dev/164>.'}, Calendar: {required: [displayName], type: object, properties: {name: {type: string, description: 'Resource name, "calendars/{calendar}".'}, uid: {readOnly: true, type: string, description: Server-assigned unique id.}, displayName: {type: string, description: "NAME, RFC 7986 section 5.1 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.1>. RFC 5545 gives the calendar object no\n human-readable name at all; 7986 added one because every client needed\n to label a calendar in a list.\n\n REQUIRED here is ours, not the RFC's: 7986 makes NAME optional, but a\n calendar with no label is unusable in any list UI, so this API insists."}, description: {type: string, description: 'DESCRIPTION, RFC 7986 section 5.2 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.2>.'}, scale: {type: integer, description: 'CALSCALE, section 3.7.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.1>.', format: enum}, timeZone: {allOf: [{$ref: '#/components/schemas/TimeZone'}], description: "Default time zone for events that do not carry their own.\n\n google.type.TimeZone rather than a bare string with a regex: it carries\n the IANA database version alongside the id, and the same zone id can mean\n different offsets across tzdata releases. Section 3.6.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.5> answers this\n with an embedded VTIMEZONE component, which restates a database IANA\n already publishes."}, etag: {readOnly: true, type: string, description: "Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an\n update or delete to make the write conditional: if the resource changed\n since it was read, the request fails instead of overwriting."}, deleteTime: {readOnly: true, type: string, description: 'When the calendar was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.', format: date-time}, expireTime: {readOnly: true, type: string, description: 'When a soft-deleted calendar is purged for good. AIP-164 <https://aip.dev/164>.', format: date-time}, createTime: {readOnly: true, type: string, description: When the calendar was created., format: date-time}, updateTime: {readOnly: true, type: string, description: When the calendar was last modified., format: date-time}, extensions: {type: array, items: {$ref: '#/components/schemas/ExtensionProperty'}, description: "Properties this schema does not model, section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2>.\n X-WR-CALNAME and friends live here."}, maxResourceSize: {readOnly: true, type: string, description: "CALDAV:max-resource-size, RFC 4791 section 5.2.5 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.5>. Largest calendar\n object resource, in octets, the server accepts on this calendar.\n\n This and the three fields after it are CalDAV per-collection limits,\n RFC 4791 section 5.2 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2>. Server capability rather than calendar content,\n which is why they waited: a consumer that enforces request bounds against\n them now exists. Each is OUTPUT_ONLY because section 5.2 requires the\n properties be protected -- a client reads them and obeys them, and a\n PROPPATCH on one fails per section 5.2.10 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.10>. Unset means the server\n declares no limit, which section 5.2 permits: every one of them is MAY.\n\n int64 rather than int32: the value is a byte count with no ceiling in the\n specification, and AIP-141 <https://aip.dev/141> rules out the unsigned types that would\n otherwise cover the range."}, minDateTime: {readOnly: true, type: string, description: "CALDAV:min-date-time, RFC 4791 section 5.2.6 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.6>. Earliest DATE or\n DATE-TIME the server accepts on this calendar, in UTC.", format: date-time}, maxDateTime: {readOnly: true, type: string, description: "CALDAV:max-date-time, RFC 4791 section 5.2.7 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.7>. Latest DATE or\n DATE-TIME the server accepts on this calendar, in UTC.", format: date-time}, maxInstances: {readOnly: true, type: integer, description: "CALDAV:max-instances, RFC 4791 section 5.2.8 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.8>. Most recurrence\n instances a single calendar object resource here may generate.", format: int32}, maxAttendeesPerInstance: {readOnly: true, type: integer, description: "CALDAV:max-attendees-per-instance, RFC 4791 section 5.2.9 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.9>. Most\n ATTENDEE properties allowed in any one instance.", format: int32}}, description: "Calendar is the iCalendar object, RFC 5545 section 3.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.4>.\n\n The collection an Event belongs to. Event's resource name is\n \"calendars/{calendar}/events/{event}\", so this is the parent that name\n refers to; without it every event would live under a collection nothing\n could create or delete.\n\n PRODID (section 3.7.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.3>) and VERSION (section 3.7.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.4>) are deliberately absent.\n Both describe the iCalendar *stream* rather than the calendar -- which\n product wrote the file, and which version of the format it used -- so they\n belong to the codec that produces the stream, not to a stored resource.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.4.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.4"}, ExtensionProperty: {required: [key], type: object, properties: {key: {type: string, description: "The property name: an IANA-registered token or an X- name, e.g.\n \"X-WR-CALNAME\". Not called `name`, which would make api-linter treat this\n message as a resource."}, values: {type: array, items: {type: string}, description: "The property's values, one entry per comma-separated component. The\n schema cannot know the structure of a property it does not model, so\n these stay unparsed."}, parameters: {type: object, additionalProperties: {type: string}, description: 'Property parameters, section 3.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2>, e.g. {"TZID": "Europe/London"}.'}}, description: "CalendarScale is the CALSCALE property, RFC 5545 section 3.7.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.1>.\n\n ExtensionProperty carries an iCalendar property this schema does not model.\n\n Not a hole punched in a typed schema: RFC 5545 section 3.8.8.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.1> reserves\n IANA-registered properties and section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2> non-standard X- properties,\n and requires that applications ignore what they do not recognise rather than\n reject it. A calendar that round-trips without them is lossy by\n construction.\n\n It is also what keeps the modelled properties honest. Anything the schema\n has not earned a typed field for survives here instead of forcing a\n speculative field table, and a property graduates out of this message when a\n consumer needs to query it.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.8.8.2.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2"}, FreeBusyPeriod: {type: object, properties: {period: {allOf: [{$ref: '#/components/schemas/Interval'}], description: "The interval, half-open: busy_type applies from `start_time` up to but\n not including `end_time`."}, busyType: {type: integer, description: Why the interval is reported busy., format: enum}}, description: "FreeBusyPeriod is one interval from a free/busy query result, structurally\n what the FREEBUSY property, RFC 5545 section 3.8.4.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3>, carries -- but\n computed on demand from stored events, not itself stored. VFREEBUSY\n (section 3.6.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.4>) has no existence independent of the events it\n summarises, so this schema gives it no resource, only this query result.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.8.4.3.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3"}, ListCalendarsResponse: {type: object, properties: {calendars: {type: array, items: {$ref: '#/components/schemas/Calendar'}, description: The calendars on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for Calendars.ListCalendars, AIP-132 <https://aip.dev/132>.'}, QueryFreeBusyRequest: {required: [name, window], type: object, properties: {name: {type: string, description: 'The calendar to query, "calendars/{calendar}".'}, window: {allOf: [{$ref: '#/components/schemas/Interval'}], description: "The window to report busy periods within. Required, and both bounds with\n it, for the same reason as ExpandEventRequest.window: an open-ended query\n over every event ever scheduled has no sensible default."}}, description: "Request message for Calendars.QueryFreeBusy, RFC 4791 section 7.10 <https://www.rfc-editor.org/rfc/rfc4791.html#section-7.10> (the\n free-busy-query REPORT)."}, QueryFreeBusyResponse: {type: object, properties: {periods: {type: array, items: {$ref: '#/components/schemas/FreeBusyPeriod'}, description: "The busy periods found within the requested window. Free time is not\n listed; its absence from this result is what \"free\" means."}}, description: Response message for Calendars.QueryFreeBusy.}, TimeZone: {type: object, properties: {id: {type: string, description: IANA Time Zone Database time zone. For example "America/New_York".}, version: {type: string, description: Optional. IANA Time Zone Database version number. For example "2019a".}}, description: "Represents a time zone from the\n [IANA Time Zone Database](https://www.iana.org/time-zones)."}, UndeleteCalendarRequest: {required: [name], type: object, properties: {name: {type: string, description: Name of the soft-deleted calendar to restore.}}, description: 'Request message for Calendars.UndeleteCalendar, AIP-164 <https://aip.dev/164>.'}, Alarm: {required: [action], type: object, properties: {action: {type: integer, description: 'ACTION, section 3.8.6.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.6.1>. Decides which other fields are required.', format: enum}, triggerOffset: {pattern: '^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$', type: string, description: "A duration relative to `trigger_relation`. Negative fires before --\n \"-PT15M\" is the familiar fifteen-minute warning."}, triggerTime: {type: string, description: "An absolute instant, independent of the component's own times.\n\n A Timestamp, not the CalendarTime the other calendar fields use, and\n deliberately so: section 3.8.6.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.6.3> requires an absolute TRIGGER to be a\n UTC-formatted DATE-TIME. Floating and zone-referenced forms are invalid\n here, so the narrower type is the accurate one.", format: date-time}, triggerRelation: {type: integer, description: "RELATED, section 3.2.14 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.14>. Whether trigger_offset counts from the\n component's start or its end. Meaningless when trigger_time is set.", format: enum}, repeatInterval: {pattern: '^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$', type: string, description: "DURATION, section 3.8.2.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.5>. Gap between repeats. Required if\n repeat_count is set."}, repeatCount: {type: integer, description: "REPEAT, section 3.8.6.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.6.2>. How many additional times the alarm\n fires after the first.", format: int32}, description: {type: string, description: "DESCRIPTION, section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>. The text shown, or the body of the\n email. Required for DISPLAY and EMAIL."}, summary: {type: string, description: 'SUMMARY, section 3.8.1.12 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.12>. The email subject. Required for EMAIL.'}, attendees: {type: array, items: {$ref: '#/components/schemas/Attendee'}, description: "ATTENDEE, section 3.8.4.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.1>. Who the email goes to. Required for\n EMAIL, meaningless otherwise."}, icalUid: {type: string, description: "UID, RFC 9074 section 4 <https://www.rfc-editor.org/rfc/rfc9074.html#section-4>. Cardinality *1.\n\n RFC 5545 gave VALARM no identity, which is why an alarm could not be\n acknowledged or snoozed across devices: there was nothing to name. Same\n two-identifier split as Event.ical_uid -- this is whatever the\n originating system chose and must survive a round trip unchanged."}, acknowledgedTime: {type: string, description: "ACKNOWLEDGED, RFC 9074 section 6.1 <https://www.rfc-editor.org/rfc/rfc9074.html#section-6.1>. Cardinality *1. When this alarm\n was last dismissed, in UTC.\n\n A Timestamp and not CalendarTime, deliberately: section 6.1 fixes the\n value as a UTC DATE-TIME, so none of the floating or zoned forms that\n forced CalendarTime elsewhere can occur here.", format: date-time}, proximity: {type: integer, description: "PROXIMITY, RFC 9074 section 8.1 <https://www.rfc-editor.org/rfc/rfc9074.html#section-8.1>. Cardinality *1. Fires the alarm on\n a location change rather than at a time.\n\n Section 8.1 pairs this with a VLOCATION component (RFC 9073) naming the\n place. VLOCATION is not modelled yet, so a proximity alarm currently\n carries the trigger kind without the place it refers to.", format: enum}, snoozedAlarmUid: {type: string, description: "RELATED-TO with RELTYPE=SNOOZE, RFC 9074 sections 5 <https://www.rfc-editor.org/rfc/rfc9074.html#section-5> and 7.1 <https://www.rfc-editor.org/rfc/rfc9074.html#section-7.1>. The\n ical_uid of the alarm this one is a snooze of.\n\n Modelled as a single reference rather than a general RELATED-TO list:\n section 7.1 registers SNOOZE as a relationship from exactly one snoozing\n alarm to exactly one original. A general relationship list arrives with\n RFC 9253 and belongs on the component, not here."}}, description: "Alarm is the VALARM component, RFC 5545 section 3.6.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.6>, as extended by\n RFC 9074 <https://www.rfc-editor.org/rfc/rfc9074.html>.\n\n A sub-component of VEVENT and VTODO, not a component of its own. It is a\n value object here for the same reason: an alarm has no identity, is never\n addressed, and disappears with the event that owns it. It gets no resource,\n no service and no messages file.\n\n Which properties are required depends on `action`, which section 3.6.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.6>\n specifies as three different property sets rather than one with optional\n members. That is expressed here as documented constraints rather than a\n oneof, because the shared properties -- trigger, repeat -- apply to all\n three and a oneof would force them to be repeated per branch.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.6.6.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.6"}, Attendee: {required: [address], type: object, properties: {address: {type: string, description: 'The CAL-ADDRESS itself, e.g. "mailto:jane@example.com".'}, displayName: {type: string, description: 'CN, section 3.2.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.2>. The name to show instead of the address.'}, role: {type: integer, description: 'ROLE, section 3.2.16 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.16>.', format: enum}, participation: {type: integer, description: 'PARTSTAT, section 3.2.12 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.12>. Whether they have replied, and how.', format: enum}, userType: {type: integer, description: 'CUTYPE, section 3.2.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.3>. A room and a person are both attendees.', format: enum}, rsvp: {type: boolean, description: "RSVP, section 3.2.17 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.17>. Whether a reply is expected. This asks for\n one; it does not record whether one arrived -- that is participation."}, delegatees: {type: array, items: {type: string}, description: 'DELEGATED-TO ("Delegatees"), section 3.2.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.5>. Addresses this attendee delegated to.'}, delegators: {type: array, items: {type: string}, description: "DELEGATED-FROM (\"Delegators\"), section 3.2.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.4>. Addresses that delegated to this\n attendee."}}, description: "Attendee is the ATTENDEE property, RFC 5545 section 3.8.4.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.1>.\n\n The property value is a CAL-ADDRESS -- in practice a mailto: URI -- and\n everything that makes an attendee useful is carried in its parameters\n rather than its value. Those parameters are the fields below.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.8.4.1.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.1"}, BatchGetEventsResponse: {type: object, properties: {events: {type: array, items: {$ref: '#/components/schemas/Event'}, description: "The events, in the order their names were requested. AIP-231 <https://aip.dev/231> requires\n the ordering so a caller can zip the two lists without matching on name."}}, description: 'Response message for Events.BatchGetEvents, AIP-231 <https://aip.dev/231>.'}, CalendarTime: {type: object, properties: {date: {type: string, description: 'DATE, section 3.3.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.4>. An all-day value: no time, no zone.', format: date}, dateTime: {type: string, description: 'DATE-TIME, section 3.3.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.5>.', format: date-time}}, description: "Confirmation is the STATUS property for a VEVENT, RFC 5545 section\n 3.8.1.11.\n\n Not named Status or State. AIP-216 <https://aip.dev/216> reserves both for server-owned lifecycle\n enums and requires such a field to be OUTPUT_ONLY, but an organiser sets\n this one -- moving an event from tentative to confirmed is the whole point.\n The name describes what the property records; the values are the RFC's.\n\n ExtensionProperty carries an iCalendar property this schema does not model.\n\n Not a hole punched in a typed schema: RFC 5545 section 3.8.8.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.1> reserves\n IANA-registered properties and section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2> non-standard X- properties,\n and requires that applications ignore what they do not recognise rather than\n reject it. A calendar that round-trips without them is lossy by\n construction.\n\n It is also what keeps the modelled properties honest. Anything the schema\n has not earned a typed field for survives here instead of forcing a\n speculative field table, and a property graduates out of this message when a\n consumer needs to query it.\n\n CalendarTime is an iCalendar DATE or DATE-TIME value, RFC 5545\n sections 3.3.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.4> and 3.3.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.5>.\n\n google.protobuf.Timestamp cannot express what iCalendar needs. Section\n 3.3.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.5> gives DATE-TIME three forms and a Timestamp holds only one:\n\n   form #1, floating    local time, no zone -- \"09:00 wherever you are\"\n   form #2, UTC         an absolute instant\n   form #3, with TZID   local time plus a zone reference\n\n The difference is not academic. A recurring 09:00 standup is floating time:\n it stays at 09:00 across a DST boundary, where an absolute instant shifts\n by an hour. Section 3.3.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.4> adds a fourth case, the all-day DATE, which a\n Timestamp can only approximate by picking a midnight in some zone.\n\n google.type.DateTime carries all three date-time forms: omit its\n time_offset for floating, set utc_offset for absolute, set time_zone for a\n zone reference. It is a google.* type, so AIP-215 <https://aip.dev/215> permits referencing\n it across packages -- which is the only reason this value object can be\n built from shared parts rather than hand-rolled.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.3.5.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.5"}, Event: {required: [start], type: object, properties: {name: {type: string, description: 'Resource name, "calendars/{calendar}/events/{event}".'}, uid: {readOnly: true, type: string, description: Server-assigned unique id.}, icalUid: {type: string, description: "UID, section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. The interchange identity, distinct from uid above.\n\n Two identifiers because they answer different questions. uid is ours and\n is a UUID4 because AIP-148 <https://aip.dev/148> says so. This one arrives inside an imported\n .ics file, is whatever the originating system chose, and must survive a\n round trip unchanged or every re-import duplicates the calendar."}, summary: {type: string, description: 'SUMMARY, section 3.8.1.12 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.12>. The short title.'}, description: {type: string, description: 'DESCRIPTION, section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>.'}, location: {type: string, description: 'LOCATION, section 3.8.1.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.7>.'}, start: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: "DTSTART, section 3.8.2.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.4>. For a recurring event this is the\n first instance, and the recurrence rule is evaluated relative to it."}, end: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: "DTEND, section 3.8.2.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.2>. Exclusive: an event ending at 10:00 does not\n occupy 10:00."}, duration: {pattern: '^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$', type: string, description: 'DURATION, section 3.8.2.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.5>.'}, confirmation: {type: integer, description: 'STATUS, section 3.8.1.11 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.11>.', format: enum}, classification: {type: integer, description: 'CLASS, section 3.8.1.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.3>.', format: enum}, transparency: {type: integer, description: 'TRANSP, section 3.8.2.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.7>.', format: enum}, recurrence: {allOf: [{$ref: '#/components/schemas/Recurrence'}], description: 'RRULE, section 3.8.5.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.5.3>. Absent means the event happens once.'}, excludedTimes: {type: array, items: {$ref: '#/components/schemas/CalendarTime'}, description: "EXDATE, section 3.8.5.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.5.1>. Instances the rule would generate but that do\n not occur -- a cancelled week in an otherwise weekly series."}, additionalTimes: {type: array, items: {$ref: '#/components/schemas/CalendarTime'}, description: 'RDATE, section 3.8.5.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.5.2>. Extra instances outside the rule.'}, originalStart: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: "RECURRENCE-ID, section 3.8.4.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.4>. Set on an override: an event sharing\n its series' ical_uid that replaces the one instance whose start, as the\n series generated it, was this -- moved, retimed, or cancelled with\n confirmation CANCELLED. Absent on the series itself and on an event that\n happens once. original_start_range widens it to every later instance."}, originalStartRange: {type: integer, description: "The RANGE parameter on RECURRENCE-ID, section 3.2.13 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.13>. Unspecified, the\n override replaces the one instance original_start names; THIS_AND_FUTURE\n makes it apply to that instance and every later one, which a server\n stores by splitting the series at original_start. Meaningless, and\n rejected by a codec, without original_start.", format: enum}, sequence: {type: integer, description: "SEQUENCE, section 3.8.7.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.7.4>. Incremented by the organiser on each\n significant revision, so an attendee can tell a stale invitation from a\n current one.", format: int32}, createTime: {readOnly: true, type: string, description: When the event was created., format: date-time}, updateTime: {readOnly: true, type: string, description: When the event was last modified., format: date-time}, organizer: {allOf: [{$ref: '#/components/schemas/Organizer'}], description: "ORGANIZER, section 3.8.4.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3>. Who owns the event and receives\n iTIP replies about it."}, attendees: {type: array, items: {$ref: '#/components/schemas/Attendee'}, description: 'ATTENDEE, section 3.8.4.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.1>. Who is invited, and how each replied.'}, alarms: {type: array, items: {$ref: '#/components/schemas/Alarm'}, description: "VALARM sub-components, section 3.6.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.6>. Reminders attached to this\n event. Not resources: an alarm has no identity and dies with its event."}, etag: {readOnly: true, type: string, description: "Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an\n update or delete to make the write conditional: if the resource changed\n since it was read, the request fails instead of overwriting."}, deleteTime: {readOnly: true, type: string, description: 'When the event was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.', format: date-time}, expireTime: {readOnly: true, type: string, description: 'When a soft-deleted event is purged for good. AIP-164 <https://aip.dev/164>.', format: date-time}, extensions: {type: array, items: {$ref: '#/components/schemas/ExtensionProperty'}, description: "Properties this schema does not model, section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2>.\n Preserved verbatim so an imported .ics survives a round trip."}, position: {allOf: [{$ref: '#/components/schemas/LatLng'}], description: "GEO, section 3.8.1.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.6>. Where the event happens, as latitude and\n longitude.\n\n google.type.LatLng, because section 3.8.1.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.6> is a semicolon-separated\n float pair and that is exactly what LatLng holds. Note this does not\n generalise to vCard: RFC 6350 section 6.5.2 types GEO as a single URI --\n usually a geo: URI per RFC 5870, but explicitly not necessarily -- so\n typing that one as coordinates would reject conforming values."}, concepts: {type: array, items: {type: string}, description: "CONCEPT, RFC 9253 section 8.1 <https://www.rfc-editor.org/rfc/rfc9253.html#section-8.1>. Formal categories, each a URI.\n\n Distinct from CATEGORIES (section 3.8.1.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.2>), which is free-text\n tagging: a CONCEPT names a term in a controlled vocabulary that both\n ends agree on, which is what makes it worth resolving."}, links: {type: array, items: {$ref: '#/components/schemas/Link'}, description: "LINK, RFC 9253 section 8.2 <https://www.rfc-editor.org/rfc/rfc9253.html#section-8.2>. Typed references to related\n information."}, refids: {type: array, items: {type: string}, description: "REFID, RFC 9253 section 8.3 <https://www.rfc-editor.org/rfc/rfc9253.html#section-8.3>. An arbitrary key grouping entities\n that belong together across components, so they can be retrieved as a\n set. Free text, and not a UID: section 8.3 puts no uniqueness\n requirement on it, which is the point -- many components share one."}, participants: {type: array, items: {$ref: '#/components/schemas/Participant'}, description: "PARTICIPANT, RFC 9073 section 7.1 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.1>. Who the event involves, as\n distinct from `attendees`, who are invited and reply. See Participant\n for why the two are separate rather than one list."}, structuredLocations: {type: array, items: {$ref: '#/components/schemas/Location'}, description: "VLOCATION, RFC 9073 section 7.2 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.2>. Structured places, as distinct\n from `location` above, which is section 3.8.1.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.7>'s single free-text\n line. An event may have several -- venue, car park, station.\n\n This is also what RFC 9074's Alarm.proximity refers to: a proximity\n alarm names the place it triggers near, and until now there was no\n place for it to name."}, resources: {type: array, items: {$ref: '#/components/schemas/Resource'}, description: "VRESOURCE, RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>. What the event needs that is\n neither a person nor a place."}, styledDescriptions: {type: array, items: {$ref: '#/components/schemas/StyledDescription'}, description: "STYLED-DESCRIPTION, RFC 9073 section 6.5 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.5>. Rich text supplementing\n `description`, which section 6.5 requires to stay populated so a client\n that cannot render markup still has something to show."}, structuredData: {type: array, items: {$ref: '#/components/schemas/StructuredData'}, description: "STRUCTURED-DATA, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>. Machine-readable data about\n the event for a consumer that understands the named schema."}}, description: "Event is the VEVENT component, RFC 5545 section 3.6.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.1>.\n\n Unlike User, which wraps an RFC-shaped value object, the calendar\n properties sit directly on the resource. VEVENT has no separable property\n bag: DTSTART, RRULE and STATUS are what an event *is*, not a payload it\n carries. Recurrence is the only part with enough structure to be its own\n type.\n\n Scope is the properties a scheduler needs. Section 3.6.1 permits about\n thirty more -- ATTENDEE, ORGANIZER, ATTACH, CATEGORIES, VALARM\n sub-components -- added when a consumer needs them.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.6.1.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.1"}, ExpandEventRequest: {required: [name, window], type: object, properties: {name: {type: string, description: The recurring event to expand.}, window: {allOf: [{$ref: '#/components/schemas/Interval'}], description: "The time window to expand over: instances starting at or after\n `start_time` and strictly before `end_time`.\n\n google.type.Interval rather than two loose timestamps. It documents the\n half-open convention upstream instead of in a comment here, and it makes\n \"both bounds or neither\" a property of the type rather than a CEL rule\n that has to be written and can silently be wrong.\n\n Required, and both bounds with it. An unbounded rule has infinitely many\n instances, so there is no sensible default and a missing bound is a\n caller bug worth reporting rather than one the server guesses around."}, pageSize: {type: integer, description: 'Maximum instances to return. Defaults to 250, capped at 2500.', format: int32}, pageToken: {type: string, description: Page token from a previous ExpandEventResponse.next_page_token.}}, description: 'Request message for Events.ExpandEvent, AIP-136 <https://aip.dev/136>.'}, ExpandEventResponse: {type: object, properties: {events: {type: array, items: {$ref: '#/components/schemas/Event'}, description: "The materialised occurrences, with EXDATE exclusions removed and RDATE\n additions folded in. Each carries the start and end of one instance;\n none is a stored resource, so none has a resource name."}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: Response message for Events.ExpandEvent.}, LatLng: {type: object, properties: {latitude: {type: number, description: 'The latitude in degrees. It must be in the range [-90.0, +90.0].', format: double}, longitude: {type: number, description: 'The longitude in degrees. It must be in the range [-180.0, +180.0].', format: double}}, description: "An object that represents a latitude/longitude pair. This is expressed as a\n pair of doubles to represent degrees latitude and degrees longitude. Unless\n specified otherwise, this object must conform to the\n <a href=\"https://en.wikipedia.org/wiki/World_Geodetic_System#1984_version\">\n WGS84 standard</a>. Values must be within normalized ranges."}, Link: {required: [relation], type: object, properties: {uri: {type: string, description: 'VALUE=URI. The default form: a reference to an external resource.'}, icalUid: {type: string, description: "VALUE=UID, RFC 9253 section 7.1 <https://www.rfc-editor.org/rfc/rfc9253.html#section-7.1>. The UID of another component in\n the same collection, rather than a resolvable address.\n\n Named ical_uid, not uid: AIP-148 <https://aip.dev/148> reserves `uid` for a server-assigned\n UUID4, and this is whatever the originating calendar chose. Same split\n as Event.ical_uid and Alarm.ical_uid."}, xmlReference: {type: string, description: "VALUE=XML-REFERENCE, RFC 9253 section 7.2 <https://www.rfc-editor.org/rfc/rfc9253.html#section-7.2>. A URI with an XPointer\n anchor naming a fragment of an XML document."}, relation: {type: string, description: "LINKREL parameter, RFC 9253 section 6.1 <https://www.rfc-editor.org/rfc/rfc9253.html#section-6.1>. What the referenced data is\n to this component.\n\n Section 6.1 requires it on every LINK, and takes either a relation\n registered by RFC 8288 <https://www.rfc-editor.org/rfc/rfc8288.html> --\n \"about\", \"describedby\", \"alternate\" -- or an extension relation given as\n a URI. Free text for that reason: the IANA link-relation registry grows\n without an RFC, so an enum would reject values section 6.1 accepts."}, formatType: {type: string, description: "FMTTYPE parameter, RFC 5545 section 3.2.8 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.8>. The media type of the\n referenced data, as an RFC 6838 <https://www.rfc-editor.org/rfc/rfc6838.html> type/subtype."}, label: {type: string, description: "LABEL parameter, RFC 7986 section 6.1 <https://www.rfc-editor.org/rfc/rfc7986.html#section-6.1>. Human-readable text for the\n link, for display in place of the raw reference."}, languageCode: {type: string, description: "LANGUAGE parameter, RFC 5545 section 3.2.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.10>. The language of\n `label`, as a BCP 47 tag, RFC 5646 <https://www.rfc-editor.org/rfc/rfc5646.html>."}}, description: "Link is the LINK property, RFC 9253 section 8.2 <https://www.rfc-editor.org/rfc/rfc9253.html#section-8.2>.\n\n A reference to information related to the component. Section 8.2 gives it\n three value types -- URI, UID and XML-REFERENCE -- and requires VALUE to\n say which, so the oneof carries the same distinction rather than guessing\n from the string's shape.\n\n This is deliberately not the same thing as ATTACH (RFC 5545 section 3.8.1.1\n <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.1>). ATTACH\n carries a document belonging to the event; LINK states a typed relationship\n to something else, which is what `relation` names.\n\n Reference: RFC 9253 \"Support for iCalendar Relationships\", section 8.2.\n https://www.rfc-editor.org/rfc/rfc9253.html#section-8.2"}, ListEventsResponse: {type: object, properties: {events: {type: array, items: {$ref: '#/components/schemas/Event'}, description: The events on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for Events.ListEvents, AIP-132 <https://aip.dev/132>.'}, Location: {type: object, properties: {icalUid: {type: string, description: "UID, RFC 5545 section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. Required by RFC 9073 section 7.2 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.2>.\n\n Interchange identity, not ours -- rule 9's `<format>_uid` split, the same\n as Event.ical_uid and Alarm.ical_uid."}, displayName: {type: string, description: "NAME, RFC 7986 section 5.2 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.2>. What to call this place.\n\n Named display_name, not name: AIP-122 <https://aip.dev/122> reserves `name` for a resource\n identifier, and api-linter treats a message carrying one as a resource."}, description: {type: string, description: 'DESCRIPTION, RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>.'}, locationTypes: {type: array, items: {type: string}, description: "LOCATION-TYPE, RFC 9073 section 6.1 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.1>. What kind of place this is,\n e.g. \"venue\", \"parking\", \"restaurant\".\n\n Free text rather than an enum: section 6.1 defers the value set to the\n IANA Location Types registry, which grows without an RFC, so an enum here\n would reject values the RFC accepts."}, position: {allOf: [{$ref: '#/components/schemas/LatLng'}], description: "GEO, RFC 5545 section 3.8.1.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.6>. Coordinates for this place, as\n a latitude/longitude pair."}, structuredData: {type: array, items: {$ref: '#/components/schemas/StructuredData'}, description: "STRUCTURED-DATA, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>. Machine-readable detail\n about the place, e.g. a schema.org Place object."}}, description: "Location is the VLOCATION component, RFC 9073 section 7.2 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.2>.\n\n Structured location information, as opposed to Event.location, which is RFC\n 5545 section 3.8.1.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.7>'s single free-text line. An event may have\n several -- a venue, its car park, the station to arrive at -- and\n `location_type` says which is which, so a client can route to the right one\n rather than guessing from prose.\n\n Reference: RFC 9073 \"Event Publishing Extensions to iCalendar\", section 7.2.\n https://www.rfc-editor.org/rfc/rfc9073.html#section-7.2"}, Organizer: {required: [address], type: object, properties: {address: {type: string, description: The CAL-ADDRESS itself.}, displayName: {type: string, description: 'CN, section 3.2.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.2>.'}, sender: {type: string, description: "SENT-BY, section 3.2.18 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.18>. The address that actually sent this on\n the organizer's behalf -- an assistant scheduling for an executive."}}, description: "Organizer is the ORGANIZER property, RFC 5545 section 3.8.4.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3>.\n\n Distinct from an Attendee with ROLE=CHAIR: the organizer owns the event and\n is who iTIP replies are addressed to, which is a scheduling fact rather than\n a statement about who runs the meeting.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.8.4.3.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3"}, Participant: {required: [participantTypes], type: object, properties: {icalUid: {type: string, description: "UID, RFC 5545 section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. Required by RFC 9073 section 7.1 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.1>.\n\n Interchange identity, not ours -- rule 9's `<format>_uid` split."}, participantTypes: {type: array, items: {type: integer, format: enum}, description: "PARTICIPANT-TYPE, RFC 9073 section 6.2 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.2>. Required by section 7.1 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.1>: a\n participant with no stated role says nothing the attendee list did not."}, calendarAddress: {type: string, description: "CALENDAR-ADDRESS, RFC 9073 section 6.4 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.4>, e.g.\n \"mailto:jane@example.com\".\n\n Optional, unlike Attendee.address, which is required. That difference is\n the point of the component: a speaker listed in a published programme\n often has no calendar address, and demanding one would make them\n unrepresentable."}, summary: {type: string, description: "SUMMARY, RFC 5545 section 3.8.1.12 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.12>. The participant's name as\n shown, e.g. \"Dr Jane Rodríguez\"."}, description: {type: string, description: 'DESCRIPTION, RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>. A biography or note.'}, url: {type: string, description: 'URL, RFC 5545 section 3.8.4.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.6>. A page about this participant.'}, position: {allOf: [{$ref: '#/components/schemas/LatLng'}], description: "GEO, RFC 5545 section 3.8.1.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.6>. Where the participant is, for a\n distributed event where that is not the event's own location."}, structuredData: {type: array, items: {$ref: '#/components/schemas/StructuredData'}, description: "STRUCTURED-DATA, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>. Machine-readable detail,\n e.g. a vCard for the participant."}, styledDescriptions: {type: array, items: {$ref: '#/components/schemas/StyledDescription'}, description: 'STYLED-DESCRIPTION, RFC 9073 section 6.5 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.5>. A rich-text biography.'}, structuredLocations: {type: array, items: {$ref: '#/components/schemas/Location'}, description: "VLOCATION, RFC 9073 section 7.2 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.2>. Section 7.1's grammar is\n `partprop *locationc *resourcec`, so a participant carries its own\n places -- where a speaker presents from, which need not be where the\n event is."}, resources: {type: array, items: {$ref: '#/components/schemas/Resource'}, description: "VRESOURCE, RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>. What this participant needs,\n e.g. a signer or a microphone."}}, description: "Participant is the PARTICIPANT component, RFC 9073 section 7.1 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.1>.\n\n **Not an Attendee.** RFC 5545 section 3.8.4.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.1>'s ATTENDEE is a scheduling\n party: someone iTIP sends invitations to and collects replies from, keyed\n on a calendar address they must have. A Participant is someone the event\n *involves* -- a speaker, a sponsor, a performer, an emergency contact --\n who may have no calendar address at all and is never sent a REQUEST.\n\n The two overlap without either containing the other, which is why RFC 9073\n added a component instead of a parameter on ATTENDEE, and why this is a\n separate message rather than a field on Attendee. A person who both speaks\n at an event and is invited to it appears as both, and that is correct.\n\n Reference: RFC 9073 \"Event Publishing Extensions to iCalendar\", section 7.1.\n https://www.rfc-editor.org/rfc/rfc9073.html#section-7.1"}, Recurrence: {required: [frequency], type: object, properties: {frequency: {type: integer, description: FREQ. The only mandatory part of a recurrence rule., format: enum}, until: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: "UNTIL. The last instant an instance may start.\n\n Section 3.3.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10> requires this to have the same value type as the\n component's DTSTART, and a DATE-TIME here MUST be in UTC form -- so set\n date when DTSTART is a date, and date_time with utc_offset zero\n otherwise."}, count: {type: integer, description: COUNT. How many instances the rule generates., format: int32}, interval: {type: integer, description: INTERVAL. How many frequency units between instances. Defaults to 1., format: int32}, secondNumbers: {type: array, items: {type: integer, format: int32}, description: 'BYSECOND, values 0-60. Second 60 is a leap second.'}, minuteNumbers: {type: array, items: {type: integer, format: int32}, description: 'BYMINUTE, values 0-59.'}, hourNumbers: {type: array, items: {type: integer, format: int32}, description: 'BYHOUR, values 0-23.'}, weekdays: {type: array, items: {$ref: '#/components/schemas/WeekdayNum'}, description: BYDAY.}, monthDays: {type: array, items: {type: integer, format: int32}, description: 'BYMONTHDAY, values 1-31 or -31 to -1 counting from the month''s end.'}, yearDays: {type: array, items: {type: integer, format: int32}, description: 'BYYEARDAY, values 1-366 or -366 to -1 counting from the year''s end.'}, weekNumbers: {type: array, items: {type: integer, format: int32}, description: "BYWEEKNO, values 1-53 or -53 to -1. Only meaningful when frequency is\n FREQUENCY_YEARLY."}, months: {type: array, items: {type: integer, format: enum}, description: "BYMONTH. Typed rather than an int in 1-12, so the range is enforced by\n the type instead of by a constraint that has to be kept in step with it."}, setPositions: {type: array, items: {type: integer, format: int32}, description: "BYSETPOS, values 1-366 or -366 to -1. Selects from the set an expanded\n rule produces -- \"the last weekday of the month\" is BYDAY=MO,TU,WE,TH,FR\n with BYSETPOS=-1."}, weekStart: {type: integer, description: "WKST. Which day starts the week, affecting how BYWEEKNO and a WEEKLY\n INTERVAL are counted. Defaults to Monday per section 3.3.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10>.", format: enum}, rscale: {type: string, description: "RSCALE, RFC 7529 section 4 <https://www.rfc-editor.org/rfc/rfc7529.html#section-4>. The calendar system the rule is\n evaluated in, as a CLDR calendar name -- CHINESE, HEBREW, ISLAMIC-CIVIL,\n ETHIOPIC. Empty means Gregorian, which is RFC 5545's only option.\n\n Free text rather than an enum: section 4 defers the value set to the CLDR\n registry, which grows without an RFC, and permits experimental names\n besides. An enum here would reject values the RFC accepts."}, skip: {type: integer, description: "SKIP, RFC 7529 section 4 <https://www.rfc-editor.org/rfc/rfc7529.html#section-4>. What to do when an occurrence lands on a\n date the calendar system does not have. Section 4 requires this to be\n absent unless rscale is set.", format: enum}, leapMonths: {type: array, items: {type: integer, format: enum}, description: "The leap-month half of BYMONTH, RFC 7529 section 4 <https://www.rfc-editor.org/rfc/rfc7529.html#section-4>.\n\n Section 4 extends BYMONTH so a month number may carry an \"L\" suffix,\n meaning the leap month of that number -- \"5L\" in a Hebrew or Chinese\n year that has one. google.type.Month is a plain 1-12 enum and cannot\n express the suffix, so the leap months are listed here instead of being\n lost. A month appearing in both fields means the rule matches the\n ordinary month and the leap month."}}, description: "Recurrence is the RECUR value type, RFC 5545 section 3.3.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10>, carried by the\n RRULE property of section 3.8.5.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.5.3>.\n\n Structured rather than the raw \"FREQ=MONTHLY;BYDAY=-1FR\" string. The string\n is what iCalendar puts on the wire, but it is opaque to a database: a\n structured rule is what makes \"which billing schedules fire on the last\n Friday\" answerable without parsing every row.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.3.10.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10"}, Resource: {type: object, properties: {icalUid: {type: string, description: 'UID, RFC 5545 section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. Required by RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>.'}, displayName: {type: string, description: "NAME, RFC 7986 section 5.2 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.2>. See Location.display_name for why this\n is not called `name`."}, description: {type: string, description: 'DESCRIPTION, RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>.'}, resourceTypes: {type: array, items: {type: string}, description: "RESOURCE-TYPE, RFC 9073 section 6.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.3>, e.g. \"projector\", \"room\",\n \"remote-conference-audio\". Free text, for the same registry reason as\n Location.location_types."}, position: {allOf: [{$ref: '#/components/schemas/LatLng'}], description: "GEO, RFC 5545 section 3.8.1.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.6>. Where the resource is, when\n that differs from where the event is."}, structuredData: {type: array, items: {$ref: '#/components/schemas/StructuredData'}, description: 'STRUCTURED-DATA, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>.'}}, description: "Resource is the VRESOURCE component, RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>.\n\n Something the event needs that is not a person and not a place: a\n projector, a minibus, a signer. RFC 5545 section 3.8.1.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.10> already had a\n free-text RESOURCES property; this is its structured replacement, and that\n one is deliberately not modelled rather than carried alongside as a second\n way to say the same thing.\n\n Reference: RFC 9073 \"Event Publishing Extensions to iCalendar\", section 7.3.\n https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3"}, StructuredData: {type: object, properties: {text: {type: string, description: 'The data inline, as text.'}, uri: {type: string, description: A URI the data lives at.}, binary: {type: string, description: "The data inline, as bytes. Section 6.6 carries this base64-encoded with\n ENCODING=BASE64 on the wire; it is decoded here, because a protobuf\n `bytes` field is already binary and re-encoding it would be a second\n representation of the same thing.", format: bytes}, formatType: {type: string, description: "FMTTYPE parameter, RFC 5545 section 3.2.8 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.8>. The data's media type,\n e.g. \"application/ld+json\"."}, schema: {type: string, description: "SCHEMA parameter, RFC 9073 section 5.2 <https://www.rfc-editor.org/rfc/rfc9073.html#section-5.2>. A URI naming the schema the\n data conforms to, e.g. \"https://schema.org/Event\". Without it the media\n type alone rarely says enough to parse the payload."}}, description: "StructuredData is the STRUCTURED-DATA property, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>.\n\n Machine-readable data about the component, for a consumer that understands\n the named schema -- a schema.org Event, a vCard, a JSON-LD graph. It is the\n escape hatch for publishing detail iCalendar has no property for, and is\n deliberately opaque here: this schema does not parse it.\n\n Reference: RFC 9073 \"Event Publishing Extensions to iCalendar\", section 6.6.\n https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6"}, StyledDescription: {type: object, properties: {text: {type: string, description: The marked-up text itself.}, uri: {type: string, description: A URI the styled description lives at.}, formatType: {type: string, description: "FMTTYPE parameter, RFC 5545 section 3.2.8 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.8>. The markup's media\n type, RFC 6838 <https://www.rfc-editor.org/rfc/rfc6838.html>, e.g. \"text/html\". Section 6.5 defaults it to\n \"text/plain\", which would make the property pointless, so a producer of\n styled text sets this."}, derived: {type: boolean, description: "DERIVED parameter, RFC 9073 section 5.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-5.3>. True when this was\n generated from the plain DESCRIPTION rather than authored, so a client\n knows it carries no information the plain text does not."}}, description: "StyledDescription is the STYLED-DESCRIPTION property, RFC 9073\n section 6.5 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.5>.\n\n A rich-text description, where RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>'s DESCRIPTION is\n plain text only. Section 6.5 requires that a component carrying one also\n carry a plain DESCRIPTION saying the same thing, so a client that cannot\n render HTML is never left with nothing -- which is why this supplements\n Event.description rather than replacing it.\n\n Reference: RFC 9073 \"Event Publishing Extensions to iCalendar\", section 6.5.\n https://www.rfc-editor.org/rfc/rfc9073.html#section-6.5"}, UndeleteEventRequest: {required: [name], type: object, properties: {name: {type: string, description: 'Name of the soft-deleted event to restore, "calendars/{calendar}/events/{event}".'}}, description: 'Request message for UndeleteEvent, AIP-164 <https://aip.dev/164>.'}, WeekdayNum: {required: [day], type: object, properties: {day: {type: integer, description: "The day itself.\n\n google.type.DayOfWeek rather than an enum of our own. AIP-215 exempts\n google.* from the cross-package ban, so this is the one kind of value\n type that can be shared between packages instead of copied into each --\n which matters the moment RRULE lands on Todo.", format: enum}, ordinal: {type: integer, description: "Which occurrence of that day, e.g. 1 for the first, -1 for the last.\n Zero means every occurrence. Only meaningful when the rule's frequency\n is monthly or yearly.", format: int32}}, description: "WeekdayNum is one BYDAY entry, RFC 5545 section 3.3.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10>.\n\n Reference: RFC 5545 \"Internet Calendaring and Scheduling Core Object Specification (iCalendar)\", section 3.3.10.\n https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10"}, Availability: {type: object, properties: {name: {type: string, description: 'Resource name, "calendars/{calendar}/availabilities/{availability}".'}, uid: {readOnly: true, type: string, description: Server-assigned unique id.}, icalUid: {type: string, description: "UID, RFC 5545 section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. Required by RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1>.\n Interchange identity, distinct from uid above: it arrives inside an\n imported .ics and must survive a round trip."}, busyType: {type: integer, description: "BUSYTYPE, RFC 7953 section 3.2 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.2>. How time inside this range but\n outside every AvailablePeriod counts. Unset means BUSY-UNAVAILABLE.", format: enum}, start: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: "DTSTART, RFC 5545 section 3.8.2.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.4>. When this pattern takes\n effect. Optional per RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1>: absent means it has always\n applied."}, end: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: "DTEND, RFC 5545 section 3.8.2.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.2>. When the pattern stops\n applying. Absent means it applies indefinitely."}, duration: {pattern: '^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$', type: string, description: 'DURATION, RFC 5545 section 3.8.2.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.5>, measured from start.'}, availablePeriods: {type: array, items: {$ref: '#/components/schemas/AvailablePeriod'}, description: "The free windows inside this range, RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1>. An\n Availability with none declares its whole range unavailable, which is a\n legitimate thing to say."}, summary: {type: string, description: 'SUMMARY, RFC 5545 section 3.8.1.12 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.12>, e.g. "Working hours".'}, description: {type: string, description: 'DESCRIPTION, RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>.'}, organizer: {type: string, description: "ORGANIZER, RFC 5545 section 3.8.4.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3>. The calendar user address\n whose availability this is, e.g. \"mailto:jane@example.com\"."}, priority: {type: integer, description: "PRIORITY, RFC 5545 section 3.8.1.9 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.9>. Which pattern wins where two\n overlap: RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1> makes 1 the highest and 9 the lowest,\n with 0 meaning undefined.", format: int32}, categories: {type: array, items: {type: string}, description: 'CATEGORIES, RFC 5545 section 3.8.1.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.2>.'}, etag: {readOnly: true, type: string, description: "Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an\n update or delete to make the write conditional."}, deleteTime: {readOnly: true, type: string, description: 'When this availability was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.', format: date-time}, expireTime: {readOnly: true, type: string, description: 'When a soft-deleted availability is purged for good. AIP-164 <https://aip.dev/164>.', format: date-time}, createTime: {readOnly: true, type: string, description: When this availability was created., format: date-time}, updateTime: {readOnly: true, type: string, description: When this availability was last modified., format: date-time}, extensions: {type: array, items: {$ref: '#/components/schemas/ExtensionProperty'}, description: "Properties this schema does not model, RFC 5545 section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2>.\n Preserved verbatim so an imported .ics survives a round trip."}}, description: "Availability is the VAVAILABILITY component, RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1>.\n\n When someone is willing to be scheduled, as distinct from when they happen\n to be free. An Event says \"this time is taken\"; this says \"this time was\n never on offer\" -- a weekend, or the hours outside a working day.\n\n The polarity is inverted from everything else in the calendar, and section\n 3.1 is explicit about it: the whole range is **busy by default**, and each\n AvailablePeriod carves out a window that is not. `busy_type` names how the\n uncarved remainder counts, defaulting to BUSY-UNAVAILABLE.\n\n A resource of its own rather than a value object on Calendar, because it\n has identity and lifecycle: an availability pattern is created, listed,\n amended and revoked independently of any calendar entry, which is rule 8's\n test. It sits under a calendar, so the pattern is nested.\n\n Free-busy consumers: RFC 7953 section 5 <https://www.rfc-editor.org/rfc/rfc7953.html#section-5> layers these under the events,\n so a free-busy reply computes availability first and then overlays actual\n bookings. protobuf.rfc5545.calendar.v1's Calendars.QueryFreeBusy is where\n that combination surfaces; it does not reference this package, per AIP-215 <https://aip.dev/215>.\n\n Reference: RFC 7953 \"Calendar Availability\", section 3.1.\n https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1"}, AvailablePeriod: {required: [start], type: object, properties: {icalUid: {type: string, description: "UID, RFC 5545 section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. Required by RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1>.\n\n Interchange identity, not ours: it arrives inside an imported .ics and\n must survive a round trip unchanged."}, start: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: "DTSTART, RFC 5545 section 3.8.2.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.4>. When the free period begins.\n Required by RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1>."}, end: {allOf: [{$ref: '#/components/schemas/CalendarTime'}], description: 'DTEND, RFC 5545 section 3.8.2.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.2>. When the free period ends.'}, duration: {pattern: '^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$', type: string, description: "DURATION, RFC 5545 section 3.8.2.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.2.5>. How long it lasts, measured\n from start."}, summary: {type: string, description: 'SUMMARY, RFC 5545 section 3.8.1.12 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.12>, e.g. "Office hours".'}, description: {type: string, description: 'DESCRIPTION, RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>.'}, location: {type: string, description: "LOCATION, RFC 5545 section 3.8.1.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.7>. Where the person is\n available, which need not be where the enclosing Availability says."}, recurrenceRule: {type: string, description: "RRULE, RFC 5545 section 3.8.5.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.5.3>, as an unparsed rule string.\n\n A string rather than the structured Recurrence of\n protobuf.rfc5545.event.v1: that message is roughly 160 lines and AIP-215\n forbids referencing it across packages, so modelling it here means\n copying it whole. Availability recurrence is in practice a weekly office\n -hours pattern, and no consumer has yet needed to query inside the rule.\n Promote it to a structured type when one does -- rule 13."}, categories: {type: array, items: {type: string}, description: 'CATEGORIES, RFC 5545 section 3.8.1.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.2>.'}, comments: {type: array, items: {type: string}, description: 'COMMENT, RFC 5545 section 3.8.1.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.4>.'}, extensions: {type: array, items: {$ref: '#/components/schemas/ExtensionProperty'}, description: "Properties this schema does not model, RFC 5545 section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2>.\n Preserved verbatim so an imported .ics survives a round trip."}}, description: "AvailablePeriod is the AVAILABLE sub-component, RFC 7953 section 3.1 <https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1>.\n\n A window of free time inside an Availability. The enclosing VAVAILABILITY\n declares its whole range busy by default, and each of these carves out a\n period that is not -- so an ordinary working week is one Availability with\n one recurring AvailablePeriod, not five hundred separate ones.\n\n A value object, not a resource: section 3.1 defines it only as a\n sub-component of VAVAILABILITY, and it has no identity or lifecycle apart\n from its parent. Its own UID (`ical_uid`) is interchange identity, the same\n distinction rule 9 draws everywhere else.\n\n Named AvailablePeriod rather than Available: AIP-140 <https://aip.dev/140> wants a noun, and a\n bare adjective names no thing.\n\n Reference: RFC 7953 \"Calendar Availability\", section 3.1.\n https://www.rfc-editor.org/rfc/rfc7953.html#section-3.1"}, ListAvailabilitiesResponse: {type: object, properties: {availabilities: {type: array, items: {$ref: '#/components/schemas/Availability'}, description: The availabilities on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for Availabilities.ListAvailabilities, AIP-132 <https://aip.dev/132>.'}, UndeleteAvailabilityRequest: {required: [name], type: object, properties: {name: {type: string, description: Name of the soft-deleted availability to restore.}}, description: 'Request message for Availabilities.UndeleteAvailability, AIP-164 <https://aip.dev/164>.'}, ListResourcesResponse: {type: object, properties: {resources: {type: array, items: {$ref: '#/components/schemas/Resource'}, description: The resources on this page.}, nextPageToken: {type: string, description: 'Token for the next page, empty when this is the last page.'}}, description: 'Response message for Resources.ListResources, AIP-132 <https://aip.dev/132>.'}, UndeleteResourceRequest: {required: [name], type: object, properties: {name: {type: string, description: Name of the soft-deleted resource to restore.}}, description: 'Request message for Resources.UndeleteResource, AIP-164 <https://aip.dev/164>.'}}}
