# Base skeleton for the merged OpenAPI spec: everything that is fixed rather than
# derived from the per-service specs. Key order here is the output order.
# Embedded into the openapi tool (see main.go); override with `-base <file>`.
openapi: 3.0.0
info:
  title: FreeBusy API
  summary: A generalized availability and booking engine.
  description: |-
    freebusy decides what can be booked, when it is free, and who is holding it: RFC 9073 resources with RFC 5545 calendars and RFC 7953 availability, searched, held and reserved without double booking, with webhooks for every change. This document is generated from the Protocol Buffer service definitions and merged into a single specification.

    All timestamps are RFC 3339. The API carries no authentication yet: serve it on a private network.
  version: 1.0.0
  termsOfService: https://freebusy.shokki.engineering/terms
  contact:
    name: FreeBusy API Support
    url: https://freebusy.shokki.engineering/support
    email: support@shokki.engineering
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
externalDocs:
  description: FreeBusy API documentation
  url: https://freebusy.shokki.engineering/docs
servers:
  - url: https://freebusy.shokki.engineering
    description: Production
  - url: https://staging.freebusy.shokki.engineering
    description: Staging
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Allocation Service
  - name: Hold Service
  - name: Reservation Service
  - name: Webhook Service
paths:
  /v1/organizationalUnits/{organizationalUnit}:checkAvailability:
    post:
      tags:
        - Allocation Service
      description: |-
        Checks one exact window for one exact quantity, with reasons when it fails.

         Advisory, not a reservation: the answer can be stale the instant it is
         returned. CreateHold is what actually secures anything.
      operationId: AllocationService_CheckAvailability
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Check Availability
  /v1/organizationalUnits/{organizationalUnit}:computeAvailability:
    post:
      tags:
        - Allocation Service
      description: Computes availability across a site's resources, bucketed by slot or day.
      operationId: AllocationService_ComputeAvailability
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Compute Availability
  /v1/organizations/{organization}:searchAvailability:
    post:
      tags:
        - Allocation Service
      description: |-
        Sweeps an operator for resources free across a window.

         The search entry point, where ComputeAvailability answers for a site the
         caller has already chosen. Paginated, since a large operator may match
         thousands of resources.
      operationId: AllocationService_SearchAvailability
      parameters:
        - name: organization
          in: path
          description: The organization id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Search Availability
  /v1/resources:batchCompute:
    post:
      tags:
        - Allocation Service
      description: |-
        Runs several availability computations in one round trip.

         Each entry is independent and may name a different site, window or
         granularity. Capped at 50 entries, because each one fans out across every
         candidate resource's calendar.
      operationId: AllocationService_BatchComputeAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchComputeAvailabilityRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchComputeAvailabilityResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Batch Compute Availability
  /v1/organizationalUnits/{organizationalUnit}/holds:
    get:
      tags:
        - Hold Service
      description: Lists the holds taken at a site.
      operationId: HoldService_ListHolds
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum holds to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListHoldsResponse.next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression, AIP-160, over the hold's own fields, e.g.
             `state=HOLD_STATE_ACTIVE`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHoldsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Holds
    post:
      tags:
        - Hold Service
      description: |-
        Takes a hold, allocating concrete resources for the window.

         The server chooses which resources are taken from the candidates offered,
         under a lock, so two callers racing for the last bay cannot both win.
         Requires an idempotency key: a retry after a timeout returns the original
         hold rather than taking a second one.
      operationId: HoldService_CreateHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: holdId
          in: query
          description: |-
            Client-assigned id, becoming the last segment of the hold name. The server
             generates one when empty.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hold'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Hold
  /v1/organizationalUnits/{organizationalUnit}/holds/{hold}:
    get:
      tags:
        - Hold Service
      description: |-
        Retrieves one hold.

         Authoritative on expiry: a hold whose expire_time has passed is reported
         EXPIRED here even if the sweeper has not yet written that state, so a
         caller never sees an ACTIVE hold that no longer reserves anything.
      operationId: HoldService_GetHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Hold
    delete:
      tags:
        - Hold Service
      description: |-
        Deletes a hold record.

         Housekeeping for terminal holds, not a way to free resources -- use
         ReleaseHold for that. Deleting an ACTIVE hold is rejected, so inventory is
         never freed by a path that leaves no audit trail.
      operationId: HoldService_DeleteHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
        - name: etag
          in: query
          description: |-
            Opaque version read from the hold; the delete is rejected if the hold
             changed since (AIP-154).
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Delete Hold
  /v1/organizationalUnits/{organizationalUnit}/holds/{hold}:extend:
    post:
      tags:
        - Hold Service
      description: |-
        Pushes a hold's expiry further out.

         Measured from now rather than from the current deadline, so repeated calls
         cannot accumulate an unbounded reservation. Fails on a hold that is not
         ACTIVE -- an expired hold is gone, not extendable.
      operationId: HoldService_ExtendHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendHoldRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Extend Hold
  /v1/organizationalUnits/{organizationalUnit}/holds/{hold}:release:
    post:
      tags:
        - Hold Service
      description: |-
        Gives a hold up before it expires, freeing its resources immediately.

         Idempotent: releasing an already-released or expired hold succeeds and
         changes nothing, because the caller's intent is already satisfied.
      operationId: HoldService_ReleaseHold
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: hold
          in: path
          description: The hold id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseHoldRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Release Hold
  /v1/organizationalUnits/{organizationalUnit}/reservations:
    get:
      tags:
        - Reservation Service
      description: Lists a site's reservations.
      operationId: ReservationService_ListReservations
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum reservations to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListReservationsResponse.next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression, AIP-160, e.g.
             `state = RESERVATION_STATE_CONFIRMED AND start_time >= "2026-11-10T00:00:00Z"`.
          schema:
            type: string
        - name: orderBy
          in: query
          description: Ordering, AIP-132, e.g. `start_time desc`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReservationsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Reservations
    post:
      tags:
        - Reservation Service
      description: |-
        Makes a reservation from a live hold, converting the hold so its
         resources stay taken.

         Idempotent: a hold backs at most one reservation, so a retry returns the
         reservation the first call made. Fails with FAILED_PRECONDITION when the
         hold has lapsed or been released.
      operationId: ReservationService_CreateReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservationId
          in: query
          description: |-
            Client-assigned id, becoming the last segment of the reservation name.
             Defaults to the hold's id. A hold backs at most one reservation whatever
             its id, so naming a hold that already has one returns that reservation.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Reservation
  /v1/organizationalUnits/{organizationalUnit}/reservations/{reservation}:
    get:
      tags:
        - Reservation Service
      description: Retrieves one reservation.
      operationId: ReservationService_GetReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservation
          in: path
          description: The reservation id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Reservation
  /v1/organizationalUnits/{organizationalUnit}/reservations/{reservation}:cancel:
    post:
      tags:
        - Reservation Service
      description: |-
        Cancels a reservation, freeing its resources.

         Idempotent: cancelling a cancelled reservation succeeds and changes
         nothing.
      operationId: ReservationService_CancelReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservation
          in: path
          description: The reservation id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Cancel Reservation
  /v1/organizationalUnits/{organizationalUnit}/reservations/{reservation}:reschedule:
    post:
      tags:
        - Reservation Service
      description: |-
        Moves a confirmed reservation onto a new hold, returning the reservation
         that replaces it.

         The replacement is a new reservation made from the new hold, linked both
         ways (`replaces`, `replacement`); the original ends RESCHEDULED. The
         original keeps its resources until the replacement is confirmed, so a
         failure part-way -- the new hold lapsing, a crash -- leaves the customer
         with their old booking, never with neither. Idempotent: repeating the call
         with the same hold returns the same replacement.
      operationId: ReservationService_RescheduleReservation
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: reservation
          in: path
          description: The reservation id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleReservationRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Reschedule Reservation
  /v1/webhooks:
    get:
      tags:
        - Webhook Service
      description: Lists webhooks, without their secrets.
      operationId: WebhookService_ListWebhooks
      parameters:
        - name: pageSize
          in: query
          description: Maximum webhooks to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListWebhooksResponse.next_page_token.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhooksResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Webhooks
    post:
      tags:
        - Webhook Service
      description: |-
        Creates a webhook. The response carries its signing secret, which no
         later read returns.
      operationId: WebhookService_CreateWebhook
      parameters:
        - name: webhookId
          in: query
          description: |-
            Client-assigned id, becoming the last segment of the webhook name.
             Server-assigned when empty.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Create Webhook
  /v1/webhooks/{webhook}:
    get:
      tags:
        - Webhook Service
      description: Retrieves one webhook, without its secret.
      operationId: WebhookService_GetWebhook
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Webhook
    delete:
      tags:
        - Webhook Service
      description: Deletes a webhook; with force, its deliveries too.
      operationId: WebhookService_DeleteWebhook
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
        - name: etag
          in: query
          description: |-
            Opaque version read from the webhook; the delete is rejected if it
             changed since (AIP-154).
          schema:
            type: string
        - name: force
          in: query
          description: |-
            Deletes the webhook's deliveries with it. Without it, a webhook that has
             any is not deleted (AIP-135); pausing it stops new ones.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Delete Webhook
    patch:
      tags:
        - Webhook Service
      description: 'Updates a webhook: its endpoint, event types or site.'
      operationId: WebhookService_UpdateWebhook
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
        - name: updateMask
          in: query
          description: |-
            Fields to update: display_name, uri, event_types, organizational_unit.
             Empty updates every one of them.
          schema:
            type: string
            format: field-mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Update Webhook
  /v1/webhooks/{webhook}/deliveries:
    get:
      tags:
        - Webhook Service
      description: Lists a webhook's deliveries.
      operationId: WebhookService_ListDeliveries
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum deliveries to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListDeliveriesResponse.next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: Filter expression, AIP-160, e.g. `state = DELIVERY_STATE_FAILED`.
          schema:
            type: string
        - name: orderBy
          in: query
          description: Ordering, AIP-132, e.g. `create_time desc`. Defaults to newest first.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeliveriesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: List Deliveries
  /v1/webhooks/{webhook}/deliveries/{delivery}:
    get:
      tags:
        - Webhook Service
      description: Retrieves one delivery.
      operationId: WebhookService_GetDelivery
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
        - name: delivery
          in: path
          description: The delivery id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Delivery
  /v1/webhooks/{webhook}/deliveries/{delivery}:retry:
    post:
      tags:
        - Webhook Service
      description: |-
        Sends a delivery again, whatever its state: it goes back to PENDING with
         its attempts reset and is attempted at once. The payload is the one
         recorded, not the record as it stands now.
      operationId: WebhookService_RetryDelivery
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
        - name: delivery
          in: path
          description: The delivery id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryDeliveryRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Retry Delivery
  /v1/webhooks/{webhook}:pause:
    post:
      tags:
        - Webhook Service
      description: |-
        Stops sending a webhook changes. Changes made while it is paused are not
         sent; deliveries already pending wait. Idempotent.
      operationId: WebhookService_PauseWebhook
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseWebhookRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Pause Webhook
  /v1/webhooks/{webhook}:resume:
    post:
      tags:
        - Webhook Service
      description: Starts sending a paused webhook changes again, from now on. Idempotent.
      operationId: WebhookService_ResumeWebhook
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeWebhookRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Resume Webhook
  /v1/webhooks/{webhook}:rotateSecret:
    post:
      tags:
        - Webhook Service
      description: |-
        Replaces a webhook's signing secret, returning the new one. For a day the
         old secret signs deliveries too -- Standard Webhooks carries several
         signatures in one header -- so a receiver can switch without missing one.
      operationId: WebhookService_RotateWebhookSecret
      parameters:
        - name: webhook
          in: path
          description: The webhook id.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateWebhookSecretRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Rotate Webhook Secret
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using a JWT access token.
  schemas:
    AvailabilityBucket:
      type: object
      properties:
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: |-
            The span this bucket covers: one slot, or one calendar day in the target
             time zone, per the request's granularity.
        freeCount:
          type: integer
          description: How many candidate resources are free across the whole span.
          format: int32
        totalCount:
          type: integer
          description: |-
            How many candidates were considered. `free_count` out of this is the
             "5 of 12 free" a caller renders.
          format: int32
        freeResources:
          type: array
          items:
            type: string
          description: |-
            Which resources are free, when the request asked for them. Omitted by
             default: a car park with 200 bays would otherwise repeat 200 names in
             every bucket of every day.
             Format: resources/{resource}
      description: |-
        One slice of an availability answer: how many resources are free across a
         span, and which ones.

         This is where pooling happens. No RFC counts inventory -- RFC 5545 and 7953
         are one-calendar-one-timeline -- so a count is produced by asking each
         resource's calendar whether it is free and totalling the answers, rather than
         by storing a capacity number anywhere.
    AvailabilityMatch:
      type: object
      properties:
        resource:
          type: string
          description: |-
            The free resource.
             Format: resources/{resource}
        organizationalUnit:
          type: string
          description: |-
            The site it belongs to.
             Format: organizationalUnits/{organizational_unit}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The span it is free for, which may be narrower than the searched window.
        resourceTypes:
          type: array
          items:
            type: string
          description: |-
            RESOURCE-TYPE values carried by the resource, RFC 9073 section 6.3, echoed
             so a caller can group results without re-fetching each resource.
      description: One resource that satisfies a search, with the window it is free for.
    BatchComputeAvailabilityRequest:
      required:
        - requests
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/ComputeAvailabilityRequest'
          description: |-
            The computations to run. Capped at 50 to bound the calendar reads a single
             call can trigger.
      description: |-
        Request message for AllocationService.BatchComputeAvailability. Each entry is
         a full ComputeAvailabilityRequest, so sites, windows and granularities may
         differ within one batch.
    BatchComputeAvailabilityResponse:
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/ComputeAvailabilityResponse'
          description: One response per request, in the order requested.
      description: Response message for AllocationService.BatchComputeAvailability.
    CheckAvailabilityRequest:
      required:
        - parent
        - window
      type: object
      properties:
        parent:
          type: string
          description: |-
            The site whose resources to check.
             Format: organizationalUnits/{organizational_unit}
        resources:
          type: array
          items:
            type: string
          description: |-
            Restrict the check to these resources. Empty means every resource the site
             holds.
             Format: resources/{resource}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The exact window to check.
        quantity:
          type: integer
          description: How many resources are needed. Defaults to 1.
          format: int32
      description: Request message for AllocationService.CheckAvailability.
    CheckAvailabilityResponse:
      type: object
      properties:
        bookable:
          type: boolean
          description: Whether `quantity` resources can be held for the window right now.
        freeCount:
          type: integer
          description: How many are actually free, which may be fewer than requested.
          format: int32
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/UnbookableReason'
          description: Why not, when bookable is false. Empty when it is true.
        candidateResources:
          type: array
          items:
            type: string
          description: |-
            Which resources would be taken, in the order the allocator would pick
             them. Advisory: another caller may take one before a hold is created.
             Format: resources/{resource}
      description: Response message for AllocationService.CheckAvailability.
    ComputeAvailabilityRequest:
      required:
        - parent
        - window
      type: object
      properties:
        parent:
          type: string
          description: |-
            The site whose resources to compute over.
             Format: organizationalUnits/{organizational_unit}
        resources:
          type: array
          items:
            type: string
          description: |-
            Restrict the computation to these resources. Empty means every resource
             the site holds.
             Format: resources/{resource}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The window to compute over.
        granularity:
          type: integer
          description: How to slice the window. Defaults by window length.
          format: enum
        slotDuration:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: Slot length for SLOT granularity. Ignored for DAY.
        timeZone:
          type: string
          description: |-
            IANA time zone the day boundaries are drawn in, e.g. "Asia/Kolkata".
             Defaults to the site's zone. Required in effect for DAY granularity, since
             "a night" has no meaning without one.
        includeFreeResources:
          type: boolean
          description: |-
            Populate AvailabilityBucket.free_resources. Off by default: a large site
             would otherwise repeat every resource name in every bucket.
      description: Request message for AllocationService.ComputeAvailability.
    ComputeAvailabilityResponse:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityBucket'
          description: One bucket per slot or day, in ascending time order.
        totalCount:
          type: integer
          description: How many resources were considered across the whole window.
          format: int32
      description: Response message for AllocationService.ComputeAvailability.
    GoogleProtobufAny:
      type: object
      properties:
        '@type':
          type: string
          description: The type of the serialized message.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    Interval:
      type: object
      properties:
        startTime:
          type: string
          description: |-
            Optional. Inclusive start of the interval.

             If specified, a Timestamp matching this interval will have to be the same
             or after the start.
          format: date-time
        endTime:
          type: string
          description: |-
            Optional. Exclusive end of the interval.

             If specified, a Timestamp matching this interval will have to be before the
             end.
          format: date-time
      description: |-
        Represents a time interval, encoded as a Timestamp start (inclusive) and a
         Timestamp end (exclusive).

         The start must be less than or equal to the end.
         When the start equals the end, the interval is empty (matches no time).
         When both start and end are unspecified, the interval matches any time.
    SearchAvailabilityRequest:
      required:
        - parent
        - window
      type: object
      properties:
        parent:
          type: string
          description: |-
            The operator to search within.
             Format: organizations/{organization}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: The window that must be free.
        organizationalUnits:
          type: array
          items:
            type: string
          description: |-
            Restrict to sites, e.g. one car park or one venue. Empty searches all.
             Format: organizationalUnits/{organizational_unit}
        resourceTypes:
          type: array
          items:
            type: string
          description: |-
            Restrict to RESOURCE-TYPE values, RFC 9073 section 6.3, e.g. "room" or
             "parking-bay". Empty matches every type.
        quantity:
          type: integer
          description: |-
            How many resources must be free together at one site for it to match.
             Defaults to 1.
          format: int32
        pageSize:
          type: integer
          description: Maximum matches to return. Defaults to 50, capped at 1000.
          format: int32
        pageToken:
          type: string
          description: Page token from a previous SearchAvailabilityResponse.next_page_token.
      description: |-
        Request message for AllocationService.SearchAvailability. Sweeps a whole
         operator for resources free across a window, where ComputeAvailability
         answers for one site already chosen.
    SearchAvailabilityResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityMatch'
          description: The free resources found.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for AllocationService.SearchAvailability.
    Status:
      type: object
      properties:
        code:
          type: integer
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          format: int32
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/GoogleProtobufAny'
          description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
      description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
    UnbookableReason:
      type: object
      properties:
        code:
          type: integer
          description: What went wrong, as a code a caller can branch on.
          format: enum
        message:
          type: string
          description: Human-readable detail for logs and support, not for parsing.
        resource:
          type: string
          description: |-
            The resource this reason is about, when it concerns one in particular.
             Format: resources/{resource}
      description: Why a requested window is not bookable.
    ExtendHoldRequest:
      required:
        - name
        - duration
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the hold to extend.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        duration:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: |-
            How much further out to push expire_time, measured from now rather than
             from the current deadline, so repeated extensions cannot accumulate.
        etag:
          type: string
          description: |-
            Opaque version read from the hold; the extension is rejected if the hold
             changed since (AIP-154).
      description: Request message for HoldService.ExtendHold.
    Hold:
      required:
        - window
      type: object
      properties:
        name:
          type: string
          description: |-
            The hold name. Nested under the site whose resources it takes, so a hold
             is listed and swept per site without joining through every resource.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        resources:
          readOnly: true
          type: array
          items:
            type: string
          description: |-
            The concrete resources this hold has taken, one per unit of `quantity`.
             Chosen by the server from the candidates the request offered.
             Format: resources/{resource}
        window:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: |-
            The window held. Immutable: moving it is a different allocation, so
             release this hold and take another.
        candidateResources:
          type: array
          items:
            type: string
          description: |-
            Candidate resources the allocator may choose from, supplied on create.
             Empty offers every resource the site holds. Immutable: the choice is made
             once, and re-offering a different set is a different allocation.
             Format: resources/{resource}
        quantity:
          type: integer
          description: |-
            How many resources to take, supplied on create; defaults to 1. Once the
             hold is ACTIVE this equals the length of `resources`.
          format: int32
        expireTime:
          readOnly: true
          type: string
          description: |-
            When the hold lapses if nothing confirms it. Extend it with ExtendHold;
             past this instant the hold no longer reserves anything, whether or not the
             sweeper has yet marked it EXPIRED.
          format: date-time
        state:
          readOnly: true
          type: integer
          description: Lifecycle state. New holds start ACTIVE.
          format: enum
        idempotencyKey:
          type: string
          description: |-
            Caller-supplied key making CreateHold safe to retry. A repeat with the same
             key returns the original hold rather than taking a second one.
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          readOnly: true
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
      description: |-
        A Hold is a temporary, expiring claim on one or more bookable resources for a
         window, taken before payment or confirmation so two callers cannot be sold
         the same thing.

         Native, with no RFC behind it, and the comment says why (the same trade
         protobuf.shared.project.v1 records upstream). RFC 5545 section 3.2.12's
         PARTSTAT=TENTATIVE can express that a claim is provisional, and RFC 5546's
         iTIP can carry the request that created it, but neither specifies a lapse
         time, and an expiring claim is the one thing a commercial booking engine
         cannot do without. The resources held are RFC 9073 VRESOURCEs and the window
         is measured against their RFC 7953 availability; only the clock is ours.

         Holds are allocated, not requested: CreateHold names candidate resources and
         a quantity, and the server decides which concrete resources are taken. That
         keeps "which bay did I get" a server decision made under a lock, rather than
         a client guess that races.
    ListHoldsResponse:
      type: object
      properties:
        holds:
          type: array
          items:
            $ref: '#/components/schemas/Hold'
          description: The holds on this page.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for HoldService.ListHolds, AIP-132.
    ReleaseHoldRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the hold to release.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        etag:
          type: string
          description: |-
            Opaque version read from the hold; the release is rejected if the hold
             changed since (AIP-154).
      description: Request message for HoldService.ReleaseHold.
    CancelReservationRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: 'Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
        reason:
          type: string
          description: Why, in the canceller's words. Recorded, never parsed.
        etag:
          type: string
          description: |-
            Opaque version read from the reservation; the cancel is rejected if it
             changed since (AIP-154).
      description: Request message for ReservationService.CancelReservation.
    ListReservationsResponse:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
          description: The reservations on this page.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for ReservationService.ListReservations, AIP-132.
    RescheduleReservationRequest:
      required:
        - name
        - hold
      type: object
      properties:
        name:
          type: string
          description: |-
            The confirmed reservation to move.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
        hold:
          type: string
          description: |-
            A live hold at the same site on the new window, taken by the caller with
             HoldService.CreateHold. Taking it first is what makes the move safe: the
             new slot is secured before the old one is let go.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        etag:
          type: string
          description: |-
            Opaque version read from the reservation; the move is rejected if it
             changed since (AIP-154).
      description: Request message for ReservationService.RescheduleReservation.
    Reservation:
      required:
        - hold
      type: object
      properties:
        name:
          type: string
          description: |-
            The reservation name. Its id is the caller's reservation_id, or else the
             id of the hold it was made from.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
        hold:
          type: string
          description: |-
            The hold this reservation was made from, at the same site.
             Format: organizationalUnits/{organizational_unit}/holds/{hold}
        resources:
          readOnly: true
          type: array
          items:
            type: string
          description: |-
            The resources taken, copied from the hold.
             Format: resources/{resource}
        startTime:
          readOnly: true
          type: string
          description: Start of the reserved window, copied from the hold.
          format: date-time
        endTime:
          readOnly: true
          type: string
          description: End of the reserved window, exclusive, copied from the hold.
          format: date-time
        customer:
          type: string
          description: |-
            Who the reservation is for, by name in the user service.
             Format: users/{user}
        state:
          readOnly: true
          type: integer
          description: Lifecycle state.
          format: enum
        attributes:
          type: object
          description: |-
            Whatever a vertical needs to keep with the reservation: a party size, a
             payment reference, a licence plate. Opaque to the engine.
        cancelReason:
          readOnly: true
          type: string
          description: Why it was cancelled, in the canceller's words. Set by CancelReservation.
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        confirmTime:
          readOnly: true
          type: string
          description: When it was confirmed.
          format: date-time
        cancelTime:
          readOnly: true
          type: string
          description: When it was cancelled.
          format: date-time
        etag:
          readOnly: true
          type: string
          description: Opaque version for optimistic concurrency (AIP-154); echo on cancel.
        replaces:
          readOnly: true
          type: string
          description: |-
            The reservation this one replaced, set when it was made by
             RescheduleReservation.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
        replacement:
          readOnly: true
          type: string
          description: |-
            The reservation replacing this one, set when RescheduleReservation began.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
      description: |-
        A Reservation is a confirmed booking: a hold made permanent.

         It is the last step of booking, not the first. The caller checks
         availability, takes a hold, settles whatever its vertical needs settled --
         payment, a guest list, a waiver -- and then creates a reservation from the
         hold. The reservation records the outcome; the engine already holds the
         resources.

         Deliberately thin. Price, discount, promo code, refund, guests and occupancy
         are what would tie it to one vertical, and none of them is here: money belongs to the payment service and people to the user
         service, both referenced by name (AIP-215), and anything else a vertical
         needs to remember rides in `attributes`.
    Delivery:
      type: object
      properties:
        name:
          type: string
          description: |-
            The delivery name. The final segment is a digest of (webhook, event_id).
             Format: webhooks/{webhook}/deliveries/{delivery}
        eventId:
          readOnly: true
          type: string
          description: |-
            The CloudEvents id, the same for every webhook sent this change: a digest
             of the record's name and etag. Receivers deduplicate on it.
        eventType:
          readOnly: true
          type: string
          description: The CloudEvents type, e.g. "freebusy.reservation.confirmed".
        subject:
          readOnly: true
          type: string
          description: |-
            The record that changed.
             Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
             or organizationalUnits/{organizational_unit}/holds/{hold}
        payload:
          readOnly: true
          type: string
          description: |-
            The request body sent: a CloudEvents 1.0 JSON document whose data is the
             record as it stood.
        state:
          readOnly: true
          type: integer
          description: Where sending stands.
          format: enum
        attemptCount:
          readOnly: true
          type: integer
          description: Attempts made so far.
          format: int32
        nextAttemptTime:
          readOnly: true
          type: string
          description: When the next attempt is due, while PENDING.
          format: date-time
        responseCode:
          readOnly: true
          type: integer
          description: HTTP status of the last attempt; 0 when it got no response.
          format: int32
        errorMessage:
          readOnly: true
          type: string
          description: Why the last attempt failed, empty after a success.
        createTime:
          readOnly: true
          type: string
          description: When the change was recorded for this webhook.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        deliverTime:
          readOnly: true
          type: string
          description: When the endpoint accepted it.
          format: date-time
        etag:
          readOnly: true
          type: string
          description: Opaque version for optimistic concurrency (AIP-154).
      description: |-
        One event owed to one webhook, and how sending it went.

         The id is derived, not random: a digest of the webhook and the event, so
         recording the same change twice -- a rescan, or two servers scanning at once
         -- loses the race on the primary key instead of sending the event twice.
    ListDeliveriesResponse:
      type: object
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
          description: The deliveries on this page.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for WebhookService.ListDeliveries, AIP-132.
    ListWebhooksResponse:
      type: object
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
          description: The webhooks on this page.
        nextPageToken:
          type: string
          description: Token for the next page, empty when this is the last page.
      description: Response message for WebhookService.ListWebhooks, AIP-132.
    PauseWebhookRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: 'Format: webhooks/{webhook}'
      description: Request message for WebhookService.PauseWebhook.
    ResumeWebhookRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: 'Format: webhooks/{webhook}'
      description: Request message for WebhookService.ResumeWebhook.
    RetryDeliveryRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: 'Format: webhooks/{webhook}/deliveries/{delivery}'
      description: Request message for WebhookService.RetryDelivery.
    RotateWebhookSecretRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: 'Format: webhooks/{webhook}'
      description: Request message for WebhookService.RotateWebhookSecret.
    Webhook:
      required:
        - uri
      type: object
      properties:
        name:
          type: string
          description: |-
            The webhook name.
             Format: webhooks/{webhook}
        displayName:
          type: string
          description: Human-readable name, for the operator's own reference.
        uri:
          type: string
          description: |-
            The endpoint each event is POSTed to. HTTPS, except to a loopback host
             when the server allows insecure endpoints for development. Required on
             create; an update that leaves it out keeps the current one.
        eventTypes:
          type: array
          items:
            type: string
          description: |-
            The event types sent, e.g. "freebusy.reservation.confirmed" or
             "freebusy.event.deleted". Empty sends every type. A type is
             "freebusy.<record>.<what happened>": holds are active, released, expired
             and converted; reservations pending, confirmed, cancelling, cancelled,
             failed, rescheduling and rescheduled; resources, calendars, events and
             availabilities created, updated and deleted.
        organizationalUnit:
          type: string
          description: |-
            Limits events to one site's holds, reservations and resources. Empty
             sends every site's. Calendars, events and availabilities belong to no
             site, so a webhook limited to one is not sent them.
             Format: organizationalUnits/{organizational_unit}
        state:
          readOnly: true
          type: integer
          description: |-
            Whether changes are sent. Set by PauseWebhook and ResumeWebhook; pausing
             keeps the webhook and its history.
          format: enum
        secret:
          readOnly: true
          type: string
          description: |-
            The key every delivery is signed with, in the Standard Webhooks form: a
             "whsec_" prefix and the encoded key. Returned by CreateWebhook and
             RotateWebhookSecret only; every other read leaves it empty.
        previousSecret:
          readOnly: true
          type: string
          description: |-
            The key the secret replaced, which also signs deliveries for a day after
             a rotation so a receiver can switch keys without dropping one. Never
             returned.
        rotateTime:
          readOnly: true
          type: string
          description: When the secret was last rotated.
          format: date-time
        createTime:
          readOnly: true
          type: string
          description: Creation timestamp.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Last-modification timestamp.
          format: date-time
        etag:
          readOnly: true
          type: string
          description: Opaque version for optimistic concurrency (AIP-154).
      description: |-
        A Webhook sends an HTTPS endpoint each change to holds, reservations and the
         inventory they draw on -- resources, calendars, calendar events and
         availability -- as a signed CloudEvent: how a payment service learns a hold
         lapsed, or a booking layer that a reservation was confirmed or a court was
         closed for maintenance, without polling.

         Changes are read from the records themselves, not announced by the writes,
         so a change cannot be lost to a crash between a write and its
         announcement. The price is coalescing: two transitions of one record in
         quick succession may arrive as one event carrying the later state. Every
         event carries the whole record, so a receiver acts on what is, not on a
         diff.
