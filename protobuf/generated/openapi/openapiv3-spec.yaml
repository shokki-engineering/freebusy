      description: Lists a site's reservations.
      operationId: ReservationService_ListReservations
      parameters:
        - name: organizationalUnit
          in: path
          description: The organizationalUnit id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum reservations to return. Defaults to 50, capped at 1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Page token from a previous ListReservationsResponse.next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Filter expression, AIP-160, e.g.
             `state = RESERVATION_STATE_CONFIRMED AND start_time >= "2026-11-10T00:00:00Z"`.
          schema:
            type: string
        - name: orderBy
          in: query
          description: Ordering, AIP-132, e.g. `start_time desc`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReservationsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
