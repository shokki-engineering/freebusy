        - Rate Plan Service
      description: Retrieves one rate plan.
      operationId: RatePlanService_GetRatePlan
      parameters:
        - name: ratePlan
          in: path
          description: The ratePlan id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatePlan'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Get Rate Plan
    delete:
      tags:
        - Rate Plan Service
      description: |-
        Deletes a rate plan.

         Prefer archiving (state ARCHIVED) over deleting: a booking priced under a
         plan must stay explainable after the plan stops being offered, and a delete
         takes that record away.
      operationId: RatePlanService_DeleteRatePlan
      parameters:
        - name: ratePlan
          in: path
          description: The ratePlan id.
          required: true
          schema:
            type: string
        - name: etag
          in: query
          description: |-
            Opaque version read from the rate plan; the delete is rejected if it
             changed since (AIP-154).
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Delete Rate Plan
    patch:
      tags:
        - Rate Plan Service
      description: |-
        Updates a rate plan.

         Editing a plan changes what future quotes cost; it does not reprice a
         booking already taken, which carries the components it was quoted under.
      operationId: RatePlanService_UpdateRatePlan
      parameters:
        - name: ratePlan
          in: path
          description: The ratePlan id.
          required: true
          schema:
            type: string
        - name: updateMask
          in: query
          description: Fields to update. An empty mask updates all mutable fields.
          schema:
            type: string
            format: field-mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatePlan'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatePlan'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      summary: Update Rate Plan
