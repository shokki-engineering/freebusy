components:
  schemas:
    freebusy.webhook.v1.CreateWebhookRequest:
      description: Request message for WebhookService.CreateWebhook, AIP-133.
      properties:
        webhook:
          description: The webhook to create. `uri` is required.
          properties:
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            displayName:
              description: Human-readable name, for the operator's own reference.
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154).
              type: string
            eventTypes:
              description: 'The event types sent, e.g. "freebusy.reservation.confirmed"
                or "freebusy.event.deleted". Empty sends every type. A type is "freebusy.<record>.<what
                happened>": holds are active, released, expired and converted; reservations
                pending, confirmed, cancelling, cancelled, failed, rescheduling and
                rescheduled; resources, calendars, events and availabilities created,
                updated and deleted.'
              items:
                type: string
              type: array
            name:
              description: 'The webhook name. Format: webhooks/{webhook}'
              type: string
            organizationalUnit:
              description: 'Limits events to one site''s holds, reservations and resources.
                Empty sends every site''s. Calendars, events and availabilities belong
                to no site, so a webhook limited to one is not sent them. Format:
                organizationalUnits/{organizational_unit}'
              type: string
            previousSecret:
              description: The key the secret replaced, which also signs deliveries
                for a day after a rotation so a receiver can switch keys without dropping
                one. Never returned.
              type: string
            rotateTime:
              description: When the secret was last rotated.
              format: date-time
              type: string
            secret:
              description: 'The key every delivery is signed with, in the Standard
                Webhooks form: a "whsec_" prefix and the encoded key. Returned by
                CreateWebhook and RotateWebhookSecret only; every other read leaves
                it empty.'
              type: string
            state:
              description: Whether changes are sent. Set by PauseWebhook and ResumeWebhook;
                pausing keeps the webhook and its history.
              enum:
              - WEBHOOK_STATE_UNSPECIFIED
              - WEBHOOK_STATE_ACTIVE
              - WEBHOOK_STATE_PAUSED
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
            uri:
              description: The endpoint each event is POSTed to. HTTPS, except to
                a loopback host when the server allows insecure endpoints for development.
                Required on create; an update that leaves it out keeps the current
                one.
              type: string
          type: object
        webhookId:
          description: Client-assigned id, becoming the last segment of the webhook
            name. Server-assigned when empty.
          type: string
      type: object
    freebusy.webhook.v1.DeleteWebhookRequest:
      description: Request message for WebhookService.DeleteWebhook, AIP-135.
      properties:
        etag:
          description: Opaque version read from the webhook; the delete is rejected
            if it changed since (AIP-154).
          type: string
        force:
          description: Deletes the webhook's deliveries with it. Without it, a webhook
            that has any is not deleted (AIP-135); pausing it stops new ones.
          type: boolean
        name:
          description: 'Format: webhooks/{webhook}'
          type: string
      type: object
    freebusy.webhook.v1.GetDeliveryRequest:
      description: Request message for WebhookService.GetDelivery, AIP-131.
      properties:
        name:
          description: 'Format: webhooks/{webhook}/deliveries/{delivery}'
          type: string
      type: object
    freebusy.webhook.v1.GetWebhookRequest:
      description: Request message for WebhookService.GetWebhook, AIP-131.
      properties:
        name:
          description: 'Format: webhooks/{webhook}'
          type: string
      type: object
    freebusy.webhook.v1.ListDeliveriesRequest:
      description: Request message for WebhookService.ListDeliveries, AIP-132.
      properties:
        filter:
          description: Filter expression, AIP-160, e.g. `state = DELIVERY_STATE_FAILED`.
          type: string
        orderBy:
          description: Ordering, AIP-132, e.g. `create_time desc`. Defaults to newest
            first.
          type: string
        pageSize:
          description: Maximum deliveries to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListDeliveriesResponse.next_page_token.
          type: string
        parent:
          description: 'Format: webhooks/{webhook}'
          type: string
      type: object
    freebusy.webhook.v1.ListDeliveriesResponse:
      description: Response message for WebhookService.ListDeliveries, AIP-132.
      properties:
        deliveries:
          description: The deliveries on this page.
          items:
            description: One event owed to one webhook, and how sending it went.
            properties:
              attemptCount:
                description: Attempts made so far.
                format: int32
                type: integer
              createTime:
                description: When the change was recorded for this webhook.
                format: date-time
                type: string
              deliverTime:
                description: When the endpoint accepted it.
                format: date-time
                type: string
              errorMessage:
                description: Why the last attempt failed, empty after a success.
                type: string
              etag:
                description: Opaque version for optimistic concurrency (AIP-154).
                type: string
              eventId:
                description: 'The CloudEvents id, the same for every webhook sent
                  this change: a digest of the record''s name and etag. Receivers
                  deduplicate on it.'
                type: string
              eventType:
                description: The CloudEvents type, e.g. "freebusy.reservation.confirmed".
                type: string
              name:
                description: 'The delivery name. The final segment is a digest of
                  (webhook, event_id). Format: webhooks/{webhook}/deliveries/{delivery}'
                type: string
              nextAttemptTime:
                description: When the next attempt is due, while PENDING.
                format: date-time
                type: string
              payload:
                description: 'The request body sent: a CloudEvents 1.0 JSON document
                  whose data is the record as it stood.'
                type: string
              responseCode:
                description: HTTP status of the last attempt; 0 when it got no response.
                format: int32
                type: integer
              state:
                description: Where sending stands.
                enum:
                - DELIVERY_STATE_UNSPECIFIED
                - DELIVERY_STATE_PENDING
                - DELIVERY_STATE_SUCCEEDED
                - DELIVERY_STATE_FAILED
                type: string
              subject:
                description: 'The record that changed. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
                  or organizationalUnits/{organizational_unit}/holds/{hold}'
                type: string
              updateTime:
                description: Last-modification timestamp.
                format: date-time
                type: string
            type: object
          type: array
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
      type: object
    freebusy.webhook.v1.ListWebhooksRequest:
      description: Request message for WebhookService.ListWebhooks, AIP-132.
      properties:
        pageSize:
          description: Maximum webhooks to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListWebhooksResponse.next_page_token.
          type: string
      type: object
    freebusy.webhook.v1.ListWebhooksResponse:
      description: Response message for WebhookService.ListWebhooks, AIP-132.
      properties:
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
        webhooks:
          description: The webhooks on this page.
          items:
            description: 'A Webhook sends an HTTPS endpoint each change to holds,
              reservations and the inventory they draw on -- resources, calendars,
              calendar events and availability -- as a signed CloudEvent: how a payment
              service learns a hold lapsed, or a booking layer that a reservation
              was confirmed or a court was closed for maintenance, without polling.'
            properties:
              createTime:
                description: Creation timestamp.
                format: date-time
                type: string
              displayName:
                description: Human-readable name, for the operator's own reference.
                type: string
              etag:
                description: Opaque version for optimistic concurrency (AIP-154).
                type: string
              eventTypes:
                description: 'The event types sent, e.g. "freebusy.reservation.confirmed"
                  or "freebusy.event.deleted". Empty sends every type. A type is "freebusy.<record>.<what
                  happened>": holds are active, released, expired and converted; reservations
                  pending, confirmed, cancelling, cancelled, failed, rescheduling
                  and rescheduled; resources, calendars, events and availabilities
                  created, updated and deleted.'
                items:
                  type: string
                type: array
              name:
                description: 'The webhook name. Format: webhooks/{webhook}'
                type: string
              organizationalUnit:
                description: 'Limits events to one site''s holds, reservations and
                  resources. Empty sends every site''s. Calendars, events and availabilities
                  belong to no site, so a webhook limited to one is not sent them.
                  Format: organizationalUnits/{organizational_unit}'
                type: string
              previousSecret:
                description: The key the secret replaced, which also signs deliveries
                  for a day after a rotation so a receiver can switch keys without
                  dropping one. Never returned.
                type: string
              rotateTime:
                description: When the secret was last rotated.
                format: date-time
                type: string
              secret:
                description: 'The key every delivery is signed with, in the Standard
                  Webhooks form: a "whsec_" prefix and the encoded key. Returned by
                  CreateWebhook and RotateWebhookSecret only; every other read leaves
                  it empty.'
                type: string
              state:
                description: Whether changes are sent. Set by PauseWebhook and ResumeWebhook;
                  pausing keeps the webhook and its history.
                enum:
                - WEBHOOK_STATE_UNSPECIFIED
                - WEBHOOK_STATE_ACTIVE
                - WEBHOOK_STATE_PAUSED
                type: string
              updateTime:
                description: Last-modification timestamp.
                format: date-time
                type: string
              uri:
                description: The endpoint each event is POSTed to. HTTPS, except to
                  a loopback host when the server allows insecure endpoints for development.
                  Required on create; an update that leaves it out keeps the current
                  one.
                type: string
            type: object
          type: array
      type: object
    freebusy.webhook.v1.PauseWebhookRequest:
      description: Request message for WebhookService.PauseWebhook.
      properties:
        name:
          description: 'Format: webhooks/{webhook}'
          type: string
      type: object
    freebusy.webhook.v1.ResumeWebhookRequest:
      description: Request message for WebhookService.ResumeWebhook.
      properties:
        name:
          description: 'Format: webhooks/{webhook}'
          type: string
      type: object
    freebusy.webhook.v1.RetryDeliveryRequest:
      description: Request message for WebhookService.RetryDelivery.
      properties:
        name:
          description: 'Format: webhooks/{webhook}/deliveries/{delivery}'
          type: string
      type: object
    freebusy.webhook.v1.RotateWebhookSecretRequest:
      description: Request message for WebhookService.RotateWebhookSecret.
      properties:
        name:
          description: 'Format: webhooks/{webhook}'
          type: string
      type: object
    freebusy.webhook.v1.UpdateWebhookRequest:
      description: Request message for WebhookService.UpdateWebhook, AIP-134.
      properties:
        updateMask:
          description: 'Fields to update: display_name, uri, event_types, organizational_unit.
            Empty updates every one of them.'
          properties:
            paths:
              description: The set of field mask paths.
              items:
                type: string
              type: array
          type: object
        webhook:
          description: The webhook, its name identifying which. `etag`, when set,
            must match.
          properties:
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            displayName:
              description: Human-readable name, for the operator's own reference.
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154).
              type: string
            eventTypes:
              description: 'The event types sent, e.g. "freebusy.reservation.confirmed"
                or "freebusy.event.deleted". Empty sends every type. A type is "freebusy.<record>.<what
                happened>": holds are active, released, expired and converted; reservations
                pending, confirmed, cancelling, cancelled, failed, rescheduling and
                rescheduled; resources, calendars, events and availabilities created,
                updated and deleted.'
              items:
                type: string
              type: array
            name:
              description: 'The webhook name. Format: webhooks/{webhook}'
              type: string
            organizationalUnit:
              description: 'Limits events to one site''s holds, reservations and resources.
                Empty sends every site''s. Calendars, events and availabilities belong
                to no site, so a webhook limited to one is not sent them. Format:
                organizationalUnits/{organizational_unit}'
              type: string
            previousSecret:
              description: The key the secret replaced, which also signs deliveries
                for a day after a rotation so a receiver can switch keys without dropping
                one. Never returned.
              type: string
            rotateTime:
              description: When the secret was last rotated.
              format: date-time
              type: string
            secret:
              description: 'The key every delivery is signed with, in the Standard
                Webhooks form: a "whsec_" prefix and the encoded key. Returned by
                CreateWebhook and RotateWebhookSecret only; every other read leaves
                it empty.'
              type: string
            state:
              description: Whether changes are sent. Set by PauseWebhook and ResumeWebhook;
                pausing keeps the webhook and its history.
              enum:
              - WEBHOOK_STATE_UNSPECIFIED
              - WEBHOOK_STATE_ACTIVE
              - WEBHOOK_STATE_PAUSED
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
            uri:
              description: The endpoint each event is POSTed to. HTTPS, except to
                a loopback host when the server allows insecure endpoints for development.
                Required on create; an update that leaves it out keeps the current
                one.
              type: string
          type: object
      type: object
