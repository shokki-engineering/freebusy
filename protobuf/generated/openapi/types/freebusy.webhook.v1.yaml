tags:
- description: |-
    WebhookService subscribes endpoints to changes in holds, reservations and
    inventory, and shows what was sent to each.

    ### Flow: Webhook delivery

    Every change a webhook subscribes to is recorded as a Delivery and sent
    as a signed CloudEvent (Standard Webhooks). Failed deliveries are retried
    with backoff, and can be sent again by hand.

    ```mermaid
    sequenceDiagram
        participant Client
        participant WebhookService
        participant ReservationService
        participant Dispatcher
        participant Endpoint
        Client->>+WebhookService: CreateWebhook
        WebhookService-->>-Client: Webhook (ACTIVE)
        ReservationService->>Dispatcher: change recorded (e.g. reservation confirmed)
        Note over ReservationService,Dispatcher: one Delivery per matching webhook, PENDING
        Dispatcher->>Endpoint: POST signed CloudEvent
        alt 2xx
            Endpoint->>Dispatcher: 2xx
            Note over Endpoint,Dispatcher: Delivery SUCCEEDED
        else error or timeout
            Endpoint->>Dispatcher: 5xx / timeout
            Note over Endpoint,Dispatcher: retried with backoff#59; FAILED when no attempts are left
            Client->>+WebhookService: ListDeliveries
            Note over Client,WebhookService: filter state = FAILED
            WebhookService-->>-Client: ListDeliveriesResponse
            Client->>+WebhookService: RetryDelivery
            WebhookService-->>-Client: Delivery (PENDING)
        end
    ```
