      description: |-
        Whether a Webhook is sent changes.

        ```mermaid
        stateDiagram-v2
            state "ACTIVE" as WEBHOOK_STATE_ACTIVE
            state "PAUSED" as WEBHOOK_STATE_PAUSED
            [*] --> WEBHOOK_STATE_ACTIVE: CreateWebhook
            WEBHOOK_STATE_PAUSED --> WEBHOOK_STATE_ACTIVE: ResumeWebhook
