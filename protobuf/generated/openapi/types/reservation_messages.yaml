components:
  schemas:
    freebusy.reservation.v1.CancelReservationRequest:
      description: Request message for ReservationService.CancelReservation.
      properties:
        etag:
          description: Opaque version read from the reservation; the cancel is rejected
            if it changed since (AIP-154).
          type: string
        name:
          description: 'Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
          type: string
        reason:
          description: Why, in the canceller's words. Recorded, never parsed.
          type: string
      type: object
    freebusy.reservation.v1.CreateReservationRequest:
      description: Request message for ReservationService.CreateReservation, AIP-133.
      properties:
        parent:
          description: 'The site the hold was taken at. Format: organizationalUnits/{organizational_unit}'
          type: string
        reservation:
          description: The reservation to make. `hold` is required; `customer` and
            `attributes` are optional.
          properties:
            attributes:
              description: 'Whatever a vertical needs to keep with the reservation:
                a party size, a payment reference, a licence plate. Opaque to the
                engine.'
              type: object
              x-kubernetes-preserve-unknown-fields: true
            cancelReason:
              description: Why it was cancelled, in the canceller's words. Set by
                CancelReservation.
              type: string
            cancelTime:
              description: When it was cancelled.
              format: date-time
              type: string
            confirmTime:
              description: When it was confirmed.
              format: date-time
              type: string
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            customer:
              description: 'Who the reservation is for, by name in the user service.
                Format: users/{user}'
              type: string
            endTime:
              description: End of the reserved window, exclusive, copied from the
                hold.
              format: date-time
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154); echo
                on cancel.
              type: string
            hold:
              description: 'The hold this reservation was made from, at the same site.
                Format: organizationalUnits/{organizational_unit}/holds/{hold}'
              type: string
            name:
              description: 'The reservation name. Its id is always the id of the hold
                it was made from, so a retried CreateReservation finds the reservation
                the first attempt wrote instead of making a second. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
              type: string
            replacedBy:
              description: 'The reservation replacing this one, set when RescheduleReservation
                began. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
              type: string
            replaces:
              description: 'The reservation this one replaced, set when it was made
                by RescheduleReservation. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
              type: string
            resources:
              description: 'The resources taken, copied from the hold. Format: resources/{resource}'
              items:
                type: string
              type: array
            startTime:
              description: Start of the reserved window, copied from the hold.
              format: date-time
              type: string
            state:
              description: Lifecycle state.
              enum:
              - RESERVATION_STATE_UNSPECIFIED
              - RESERVATION_STATE_PENDING
              - RESERVATION_STATE_CONFIRMED
              - RESERVATION_STATE_CANCELLING
              - RESERVATION_STATE_CANCELLED
              - RESERVATION_STATE_FAILED
              - RESERVATION_STATE_RESCHEDULING
              - RESERVATION_STATE_RESCHEDULED
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.reservation.v1.GetReservationRequest:
      description: Request message for ReservationService.GetReservation, AIP-131.
      properties:
        name:
          description: 'Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
          type: string
      type: object
    freebusy.reservation.v1.ListReservationsRequest:
      description: Request message for ReservationService.ListReservations, AIP-132.
      properties:
        filter:
          description: Filter expression, AIP-160, e.g. `state = RESERVATION_STATE_CONFIRMED
            AND start_time >= "2026-11-10T00:00:00Z"`.
          type: string
        orderBy:
          description: Ordering, AIP-132, e.g. `start_time desc`.
          type: string
        pageSize:
          description: Maximum reservations to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListReservationsResponse.next_page_token.
          type: string
        parent:
          description: 'Format: organizationalUnits/{organizational_unit}'
          type: string
      type: object
    freebusy.reservation.v1.ListReservationsResponse:
      description: Response message for ReservationService.ListReservations, AIP-132.
      properties:
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
        reservations:
          description: The reservations on this page.
          items:
            description: 'A Reservation is a confirmed booking: a hold made permanent.'
            properties:
              attributes:
                description: 'Whatever a vertical needs to keep with the reservation:
                  a party size, a payment reference, a licence plate. Opaque to the
                  engine.'
                type: object
                x-kubernetes-preserve-unknown-fields: true
              cancelReason:
                description: Why it was cancelled, in the canceller's words. Set by
                  CancelReservation.
                type: string
              cancelTime:
                description: When it was cancelled.
                format: date-time
                type: string
              confirmTime:
                description: When it was confirmed.
                format: date-time
                type: string
              createTime:
                description: Creation timestamp.
                format: date-time
                type: string
              customer:
                description: 'Who the reservation is for, by name in the user service.
                  Format: users/{user}'
                type: string
              endTime:
                description: End of the reserved window, exclusive, copied from the
                  hold.
                format: date-time
                type: string
              etag:
                description: Opaque version for optimistic concurrency (AIP-154);
                  echo on cancel.
                type: string
              hold:
                description: 'The hold this reservation was made from, at the same
                  site. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
                type: string
              name:
                description: 'The reservation name. Its id is always the id of the
                  hold it was made from, so a retried CreateReservation finds the
                  reservation the first attempt wrote instead of making a second.
                  Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
                type: string
              replacedBy:
                description: 'The reservation replacing this one, set when RescheduleReservation
                  began. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
                type: string
              replaces:
                description: 'The reservation this one replaced, set when it was made
                  by RescheduleReservation. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
                type: string
              resources:
                description: 'The resources taken, copied from the hold. Format: resources/{resource}'
                items:
                  type: string
                type: array
              startTime:
                description: Start of the reserved window, copied from the hold.
                format: date-time
                type: string
              state:
                description: Lifecycle state.
                enum:
                - RESERVATION_STATE_UNSPECIFIED
                - RESERVATION_STATE_PENDING
                - RESERVATION_STATE_CONFIRMED
                - RESERVATION_STATE_CANCELLING
                - RESERVATION_STATE_CANCELLED
                - RESERVATION_STATE_FAILED
                - RESERVATION_STATE_RESCHEDULING
                - RESERVATION_STATE_RESCHEDULED
                type: string
              updateTime:
                description: Last-modification timestamp.
                format: date-time
                type: string
            type: object
          type: array
      type: object
    freebusy.reservation.v1.RescheduleReservationRequest:
      description: Request message for ReservationService.RescheduleReservation.
      properties:
        etag:
          description: Opaque version read from the reservation; the move is rejected
            if it changed since (AIP-154).
          type: string
        hold:
          description: 'A live hold at the same site on the new window, taken by the
            caller with HoldService.CreateHold. Taking it first is what makes the
            move safe: the new slot is secured before the old one is let go. Format:
            organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
        name:
          description: 'The confirmed reservation to move. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
          type: string
      type: object
info:
  title: OpenAPI Spec for Solo APIs.
  version: v1
openapi: 3.0.1
paths: null
