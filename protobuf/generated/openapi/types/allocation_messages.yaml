components:
  schemas:
    freebusy.allocation.v1.BatchComputeAvailabilityRequest:
      description: Request message for AllocationService.BatchComputeAvailability.
        Each entry is a full ComputeAvailabilityRequest, so sites, windows and granularities
        may differ within one batch.
      properties:
        requests:
          description: The computations to run. Capped at 50 to bound the calendar
            reads a single call can trigger.
          items:
            description: Request message for AllocationService.ComputeAvailability.
            properties:
              granularity:
                description: How to slice the window. Defaults by window length.
                enum:
                - AVAILABILITY_GRANULARITY_UNSPECIFIED
                - AVAILABILITY_GRANULARITY_SLOT
                - AVAILABILITY_GRANULARITY_DAY
                type: string
              includeFreeResources:
                description: 'Populate AvailabilityBucket.free_resources. Off by default:
                  a large site would otherwise repeat every resource name in every
                  bucket.'
                type: boolean
              parent:
                description: 'The site whose resources to compute over. Format: organizationalUnits/{organizational_unit}'
                type: string
              resources:
                description: 'Restrict the computation to these resources. Empty means
                  every resource the site holds. Format: resources/{resource}'
                items:
                  type: string
                type: array
              slotDuration:
                description: Slot length for SLOT granularity. Ignored for DAY.
                type: string
              timeZone:
                description: IANA time zone the day boundaries are drawn in, e.g.
                  "Asia/Kolkata". Defaults to the site's zone. Required in effect
                  for DAY granularity, since "a night" has no meaning without one.
                type: string
              window:
                description: The window to compute over.
                properties:
                  endTime:
                    description: Optional. Exclusive end of the interval.
                    format: date-time
                    type: string
                  startTime:
                    description: Optional. Inclusive start of the interval.
                    format: date-time
                    type: string
                type: object
            type: object
          type: array
      type: object
    freebusy.allocation.v1.BatchComputeAvailabilityResponse:
      description: Response message for AllocationService.BatchComputeAvailability.
      properties:
        responses:
          description: One response per request, in the order requested.
          items:
            description: Response message for AllocationService.ComputeAvailability.
            properties:
              buckets:
                description: One bucket per slot or day, in ascending time order.
                items:
                  description: 'One slice of an availability answer: how many resources
                    are free across a span, and which ones.'
                  properties:
                    freeCount:
                      description: How many candidate resources are free across the
                        whole span.
                      format: int32
                      type: integer
                    freeResources:
                      description: 'Which resources are free, when the request asked
                        for them. Omitted by default: a car park with 200 bays would
                        otherwise repeat 200 names in every bucket of every day. Format:
                        resources/{resource}'
                      items:
                        type: string
                      type: array
                    totalCount:
                      description: How many candidates were considered. `free_count`
                        out of this is the "5 of 12 free" a caller renders.
                      format: int32
                      type: integer
                    window:
                      description: 'The span this bucket covers: one slot, or one
                        calendar day in the target time zone, per the request''s granularity.'
                      properties:
                        endTime:
                          description: Optional. Exclusive end of the interval.
                          format: date-time
                          type: string
                        startTime:
                          description: Optional. Inclusive start of the interval.
                          format: date-time
                          type: string
                      type: object
                  type: object
                type: array
              totalCount:
                description: How many resources were considered across the whole window.
                format: int32
                type: integer
            type: object
          type: array
      type: object
    freebusy.allocation.v1.CheckAvailabilityRequest:
      description: Request message for AllocationService.CheckAvailability.
      properties:
        parent:
          description: 'The site whose resources to check. Format: organizationalUnits/{organizational_unit}'
          type: string
        quantity:
          description: How many resources are needed. Defaults to 1.
          format: int32
          type: integer
        resources:
          description: 'Restrict the check to these resources. Empty means every resource
            the site holds. Format: resources/{resource}'
          items:
            type: string
          type: array
        window:
          description: The exact window to check.
          properties:
            endTime:
              description: Optional. Exclusive end of the interval.
              format: date-time
              type: string
            startTime:
              description: Optional. Inclusive start of the interval.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.CheckAvailabilityResponse:
      description: Response message for AllocationService.CheckAvailability.
      properties:
        bookable:
          description: Whether `quantity` resources can be held for the window right
            now.
          type: boolean
        candidateResources:
          description: 'Which resources would be taken, in the order the allocator
            would pick them. Advisory: another caller may take one before a hold is
            created. Format: resources/{resource}'
          items:
            type: string
          type: array
        freeCount:
          description: How many are actually free, which may be fewer than requested.
          format: int32
          type: integer
        reasons:
          description: Why not, when bookable is false. Empty when it is true.
          items:
            description: Why a requested window is not bookable.
            properties:
              code:
                description: What went wrong, as a code a caller can branch on.
                enum:
                - UNBOOKABLE_REASON_CODE_UNSPECIFIED
                - UNBOOKABLE_REASON_CODE_NO_CAPACITY
                - UNBOOKABLE_REASON_CODE_OUTSIDE_AVAILABILITY
                - UNBOOKABLE_REASON_CODE_HELD
                - UNBOOKABLE_REASON_CODE_BOOKED
                - UNBOOKABLE_REASON_CODE_WINDOW_TOO_SHORT
                - UNBOOKABLE_REASON_CODE_WINDOW_TOO_LONG
                - UNBOOKABLE_REASON_CODE_LEAD_TIME
                - UNBOOKABLE_REASON_CODE_RESOURCE_INACTIVE
                type: string
              message:
                description: Human-readable detail for logs and support, not for parsing.
                type: string
              resource:
                description: 'The resource this reason is about, when it concerns
                  one in particular. Format: resources/{resource}'
                type: string
            type: object
          type: array
      type: object
    freebusy.allocation.v1.ComputeAvailabilityRequest:
      description: Request message for AllocationService.ComputeAvailability.
      properties:
        granularity:
          description: How to slice the window. Defaults by window length.
          enum:
          - AVAILABILITY_GRANULARITY_UNSPECIFIED
          - AVAILABILITY_GRANULARITY_SLOT
          - AVAILABILITY_GRANULARITY_DAY
          type: string
        includeFreeResources:
          description: 'Populate AvailabilityBucket.free_resources. Off by default:
            a large site would otherwise repeat every resource name in every bucket.'
          type: boolean
        parent:
          description: 'The site whose resources to compute over. Format: organizationalUnits/{organizational_unit}'
          type: string
        resources:
          description: 'Restrict the computation to these resources. Empty means every
            resource the site holds. Format: resources/{resource}'
          items:
            type: string
          type: array
        slotDuration:
          description: Slot length for SLOT granularity. Ignored for DAY.
          type: string
        timeZone:
          description: IANA time zone the day boundaries are drawn in, e.g. "Asia/Kolkata".
            Defaults to the site's zone. Required in effect for DAY granularity, since
            "a night" has no meaning without one.
          type: string
        window:
          description: The window to compute over.
          properties:
            endTime:
              description: Optional. Exclusive end of the interval.
              format: date-time
              type: string
            startTime:
              description: Optional. Inclusive start of the interval.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.ComputeAvailabilityResponse:
      description: Response message for AllocationService.ComputeAvailability.
      properties:
        buckets:
          description: One bucket per slot or day, in ascending time order.
          items:
            description: 'One slice of an availability answer: how many resources
              are free across a span, and which ones.'
            properties:
              freeCount:
                description: How many candidate resources are free across the whole
                  span.
                format: int32
                type: integer
              freeResources:
                description: 'Which resources are free, when the request asked for
                  them. Omitted by default: a car park with 200 bays would otherwise
                  repeat 200 names in every bucket of every day. Format: resources/{resource}'
                items:
                  type: string
                type: array
              totalCount:
                description: How many candidates were considered. `free_count` out
                  of this is the "5 of 12 free" a caller renders.
                format: int32
                type: integer
              window:
                description: 'The span this bucket covers: one slot, or one calendar
                  day in the target time zone, per the request''s granularity.'
                properties:
                  endTime:
                    description: Optional. Exclusive end of the interval.
                    format: date-time
                    type: string
                  startTime:
                    description: Optional. Inclusive start of the interval.
                    format: date-time
                    type: string
                type: object
            type: object
          type: array
        totalCount:
          description: How many resources were considered across the whole window.
          format: int32
          type: integer
      type: object
    freebusy.allocation.v1.SearchAvailabilityRequest:
      description: Request message for AllocationService.SearchAvailability. Sweeps
        a whole operator for resources free across a window, where ComputeAvailability
        answers for one site already chosen.
      properties:
        organizationalUnits:
          description: 'Restrict to sites, e.g. one car park or one venue. Empty searches
            all. Format: organizationalUnits/{organizational_unit}'
          items:
            type: string
          type: array
        pageSize:
          description: Maximum matches to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous SearchAvailabilityResponse.next_page_token.
          type: string
        parent:
          description: 'The operator to search within. Format: organizations/{organization}'
          type: string
        quantity:
          description: How many resources must be free together at one site for it
            to match. Defaults to 1.
          format: int32
          type: integer
        resourceTypes:
          description: Restrict to RESOURCE-TYPE values, RFC 9073 section 6.3, e.g.
            "room" or "parking-bay". Empty matches every type.
          items:
            type: string
          type: array
        window:
          description: The window that must be free.
          properties:
            endTime:
              description: Optional. Exclusive end of the interval.
              format: date-time
              type: string
            startTime:
              description: Optional. Inclusive start of the interval.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.SearchAvailabilityResponse:
      description: Response message for AllocationService.SearchAvailability.
      properties:
        matches:
          description: The free resources found.
          items:
            description: One resource that satisfies a search, with the window it
              is free for.
            properties:
              organizationalUnit:
                description: 'The site it belongs to. Format: organizationalUnits/{organizational_unit}'
                type: string
              resource:
                description: 'The free resource. Format: resources/{resource}'
                type: string
              resourceTypes:
                description: RESOURCE-TYPE values carried by the resource, RFC 9073
                  section 6.3, echoed so a caller can group results without re-fetching
                  each resource.
                items:
                  type: string
                type: array
              window:
                description: The span it is free for, which may be narrower than the
                  searched window.
                properties:
                  endTime:
                    description: Optional. Exclusive end of the interval.
                    format: date-time
                    type: string
                  startTime:
                    description: Optional. Inclusive start of the interval.
                    format: date-time
                    type: string
                type: object
            type: object
          type: array
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
      type: object
info:
  title: OpenAPI Spec for Solo APIs.
  version: v1
openapi: 3.0.1
paths: null
