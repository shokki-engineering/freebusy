components:
  schemas:
    freebusy.allocation.v1.Allocation:
      description: |-
        An Allocation is one resource taken by one hold for one span: the row the
        engine counts when it asks what is already claimed.

        Storage-only. No RPC returns it -- callers see a Hold and its `resources` --
        but a Hold cannot answer "who has bay 14 at 10:00" on its own: its window is
        one value and its resources a list, so an overlap query over holds would
        have to unpack both on every row. One row per resource, with the span as two
        indexed instants, makes that query a plain range scan on either backend.

        The span and `expire_time` are copies of the hold's, written in the same
        write as the hold. The copy is the point: a claim stops counting the instant
        `expire_time` passes, with no sweeper write needed, because every read
        filters on it.

        It is top-level and names its hold, rather than nesting under the hold: the
        engine asks about allocations by resource and time, never hold by hold, and
        a hold with child resources would owe DeleteHold a `force` flag guarding
        rows no caller can see.
      properties:
        createTime:
          description: Creation timestamp.
          format: date-time
          type: string
        endTime:
          description: End of the span taken, exclusive. A copy of the hold's window
            end.
          format: date-time
          type: string
        expireTime:
          description: |-
            When this claim stops counting. A copy of the hold's expire_time while it
            is ACTIVE; set to the release instant on release; unset once the hold is
            CONVERTED, which is the one outcome that keeps the resource taken. Always
            the server's to write, never a caller's.
          format: date-time
          type: string
        hold:
          description: |-
            The hold that took it. Deleting the hold deletes its allocations with it.
            Format: holds/{hold}
          type: string
        name:
          description: |-
            The allocation name.
            Format: allocations/{allocation}
          type: string
        resource:
          description: |-
            The resource taken.
            Format: resources/{resource}
          type: string
        startTime:
          description: Start of the span taken, inclusive. A copy of the hold's window
            start.
          format: date-time
          type: string
      type: object
    freebusy.allocation.v1.AvailabilityBucket:
      description: |-
        One slice of an availability answer: how many resources are free across a
        span, and which ones.

        This is where pooling happens. No RFC counts inventory -- RFC 5545 and 7953
        are one-calendar-one-timeline -- so a count is produced by asking each
        resource's calendar whether it is free and totalling the answers, rather than
        by storing a capacity number anywhere.
      properties:
        freeCount:
          description: How many candidate resources are free across the whole span.
          format: int32
          type: integer
        freeResources:
          description: |-
            Which resources are free, when the request asked for them. Omitted by
            default: a car park with 200 bays would otherwise repeat 200 names in
            every bucket of every day.
            Format: resources/{resource}
          items:
            type: string
          type: array
        totalCount:
          description: |-
            How many candidates were considered. `free_count` out of this is the
            "5 of 12 free" a caller renders.
          format: int32
          type: integer
        window:
          description: |-
            The span this bucket covers: one slot, or one calendar day in the target
            time zone, per the request's granularity.
          properties:
            endTime:
              description: |-
                Optional. Exclusive end of the interval.

                If specified, a Timestamp matching this interval will have to be before the
                end.
              format: date-time
              type: string
            startTime:
              description: |-
                Optional. Inclusive start of the interval.

                If specified, a Timestamp matching this interval will have to be the same
                or after the start.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.AvailabilityGranularity:
      description: The slicing of an availability answer over a window.
      enum:
      - AVAILABILITY_GRANULARITY_UNSPECIFIED
      - AVAILABILITY_GRANULARITY_SLOT
      - AVAILABILITY_GRANULARITY_DAY
      type: string
    freebusy.allocation.v1.AvailabilityMatch:
      description: One resource that satisfies a search, with the window it is free
        for.
      properties:
        displayName:
          description: The resource's display name, echoed for the same reason.
          type: string
        resource:
          description: |-
            The free resource.
            Format: resources/{resource}
          type: string
        resourceTypes:
          description: |-
            RESOURCE-TYPE values carried by the resource, RFC 9073 section 6.3, echoed
            so a caller can group results without re-fetching each resource.
          items:
            type: string
          type: array
        window:
          description: The span it is free for, which may be narrower than the searched
            window.
          properties:
            endTime:
              description: |-
                Optional. Exclusive end of the interval.

                If specified, a Timestamp matching this interval will have to be before the
                end.
              format: date-time
              type: string
            startTime:
              description: |-
                Optional. Inclusive start of the interval.

                If specified, a Timestamp matching this interval will have to be the same
                or after the start.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.BatchComputeAvailabilityRequest:
      description: |-
        Request message for AllocationService.BatchComputeAvailability. Each entry is
        a full ComputeAvailabilityRequest, so resources, windows and granularities
        may differ within one batch.
      properties:
        requests:
          description: |-
            The computations to run. Capped at 50 to bound the calendar reads a single
            call can trigger.
          items:
            description: Request message for AllocationService.ComputeAvailability.
            properties:
              filter:
                description: |-
                  An AIP-160 filter over each resource's search record (ResourceDay): its
                  `resource_types`, its STRUCTURED-DATA under `attributes` (any path, e.g.
                  `attributes.view = "river" AND attributes.max_occupancy >= 3`), its
                  `display_name` (a bare word matches it) and `organizational_unit` (the
                  resource's own, as data). Terms are ANDed unless joined with OR. Empty
                  matches every resource.
                  Only matching resources are computed over or counted.
                type: string
              granularity:
                description: How to slice the window. Defaults by window length.
                enum:
                - AVAILABILITY_GRANULARITY_UNSPECIFIED
                - AVAILABILITY_GRANULARITY_SLOT
                - AVAILABILITY_GRANULARITY_DAY
                type: string
              includeFreeResources:
                description: |-
                  Populate AvailabilityBucket.free_resources. Off by default: a large pool
                  would otherwise repeat every resource name in every bucket.
                type: boolean
              resources:
                description: |-
                  Restrict the computation to these resources. Empty means every resource
                  `filter` matches.
                  Format: resources/{resource}
                items:
                  type: string
                type: array
              slotDuration:
                description: Slot length for SLOT granularity. Ignored for DAY.
                type: string
              timeZone:
                description: |-
                  IANA time zone the day boundaries are drawn in, e.g. "Asia/Kolkata".
                  Defaults to the zone of the first resource's calendar. Required in effect
                  for DAY granularity, since "a night" has no meaning without one.
                type: string
              window:
                description: The window to compute over.
                properties:
                  endTime:
                    description: |-
                      Optional. Exclusive end of the interval.

                      If specified, a Timestamp matching this interval will have to be before the
                      end.
                    format: date-time
                    type: string
                  startTime:
                    description: |-
                      Optional. Inclusive start of the interval.

                      If specified, a Timestamp matching this interval will have to be the same
                      or after the start.
                    format: date-time
                    type: string
                type: object
            type: object
          type: array
      type: object
    freebusy.allocation.v1.BatchComputeAvailabilityResponse:
      description: Response message for AllocationService.BatchComputeAvailability.
      properties:
        responses:
          description: One response per request, in the order requested.
          items:
            description: Response message for AllocationService.ComputeAvailability.
            properties:
              buckets:
                description: One bucket per slot or day, in ascending time order.
                items:
                  description: |-
                    One slice of an availability answer: how many resources are free across a
                    span, and which ones.

                    This is where pooling happens. No RFC counts inventory -- RFC 5545 and 7953
                    are one-calendar-one-timeline -- so a count is produced by asking each
                    resource's calendar whether it is free and totalling the answers, rather than
                    by storing a capacity number anywhere.
                  properties:
                    freeCount:
                      description: How many candidate resources are free across the
                        whole span.
                      format: int32
                      type: integer
                    freeResources:
                      description: |-
                        Which resources are free, when the request asked for them. Omitted by
                        default: a car park with 200 bays would otherwise repeat 200 names in
                        every bucket of every day.
                        Format: resources/{resource}
                      items:
                        type: string
                      type: array
                    totalCount:
                      description: |-
                        How many candidates were considered. `free_count` out of this is the
                        "5 of 12 free" a caller renders.
                      format: int32
                      type: integer
                    window:
                      description: |-
                        The span this bucket covers: one slot, or one calendar day in the target
                        time zone, per the request's granularity.
                      properties:
                        endTime:
                          description: |-
                            Optional. Exclusive end of the interval.

                            If specified, a Timestamp matching this interval will have to be before the
                            end.
                          format: date-time
                          type: string
                        startTime:
                          description: |-
                            Optional. Inclusive start of the interval.

                            If specified, a Timestamp matching this interval will have to be the same
                            or after the start.
                          format: date-time
                          type: string
                      type: object
                  type: object
                type: array
              totalCount:
                description: How many resources were considered across the whole window.
                format: int32
                type: integer
            type: object
          type: array
      type: object
    freebusy.allocation.v1.CheckAvailabilityRequest:
      description: Request message for AllocationService.CheckAvailability.
      properties:
        filter:
          description: |-
            An AIP-160 filter over each resource's search record (ResourceDay): its
            `resource_types`, its STRUCTURED-DATA under `attributes` (any path, e.g.
            `attributes.view = "river" AND attributes.max_occupancy >= 3`), its
            `display_name` (a bare word matches it) and `organizational_unit` (the
            resource's own, as data). Terms are ANDed unless joined with OR. Empty
            matches every resource.
            Only matching resources are checked.
          type: string
        quantity:
          description: How many resources are needed. Defaults to 1.
          format: int32
          type: integer
        resources:
          description: |-
            Restrict the check to these resources. Empty means every resource
            `filter` matches.
            Format: resources/{resource}
          items:
            type: string
          type: array
        window:
          description: The exact window to check.
          properties:
            endTime:
              description: |-
                Optional. Exclusive end of the interval.

                If specified, a Timestamp matching this interval will have to be before the
                end.
              format: date-time
              type: string
            startTime:
              description: |-
                Optional. Inclusive start of the interval.

                If specified, a Timestamp matching this interval will have to be the same
                or after the start.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.CheckAvailabilityResponse:
      description: Response message for AllocationService.CheckAvailability.
      properties:
        bookable:
          description: Whether `quantity` resources can be held for the window right
            now.
          type: boolean
        candidateResources:
          description: |-
            Which resources would be taken, in the order the allocator would pick
            them. Advisory: another caller may take one before a hold is created.
            Format: resources/{resource}
          items:
            type: string
          type: array
        freeCount:
          description: How many are actually free, which may be fewer than requested.
          format: int32
          type: integer
        reasons:
          description: Why not, when bookable is false. Empty when it is true.
          items:
            description: Why a requested window is not bookable.
            properties:
              code:
                description: What went wrong, as a code a caller can branch on.
                enum:
                - UNBOOKABLE_REASON_CODE_UNSPECIFIED
                - UNBOOKABLE_REASON_CODE_NO_CAPACITY
                - UNBOOKABLE_REASON_CODE_OUTSIDE_AVAILABILITY
                - UNBOOKABLE_REASON_CODE_HELD
                - UNBOOKABLE_REASON_CODE_BOOKED
                - UNBOOKABLE_REASON_CODE_WINDOW_TOO_SHORT
                - UNBOOKABLE_REASON_CODE_WINDOW_TOO_LONG
                - UNBOOKABLE_REASON_CODE_LEAD_TIME
                - UNBOOKABLE_REASON_CODE_RESOURCE_INACTIVE
                type: string
              message:
                description: Human-readable detail for logs and support, not for parsing.
                type: string
              resource:
                description: |-
                  The resource this reason is about, when it concerns one in particular.
                  Format: resources/{resource}
                type: string
            type: object
          type: array
      type: object
    freebusy.allocation.v1.ComputeAvailabilityRequest:
      description: Request message for AllocationService.ComputeAvailability.
      properties:
        filter:
          description: |-
            An AIP-160 filter over each resource's search record (ResourceDay): its
