                    format: date-time
                    type: string
                type: object
            type: object
          type: array
        totalCount:
          description: How many resources were considered across the whole window.
          format: int32
          type: integer
      type: object
    freebusy.allocation.v1.CreateHoldRequest:
      description: |-
        Request message for HoldService.CreateHold, AIP-133.

        The allocating call, in standard-method clothing: the caller states what it
        wants on the Hold -- window, quantity, and which resources it will accept --
        and the server picks the concrete resources under a lock. There is
        deliberately no separate Allocate method, so there is one place where the
        race is handled.
      properties:
        hold:
          description: |-
            The hold to take. Its window is required; quantity defaults to 1 and
            candidate_resources empty offers every resource candidate_filter matches.
            Supply idempotency_key to make a retry safe.
          properties:
            candidateFilter:
              description: |-
                An AIP-160 filter narrowing the resources the allocator may choose from,
                supplied on create, alongside `candidate_resources`: the same filter
                SearchAvailability takes, over each resource's `resource_types`,
                `attributes` (its STRUCTURED-DATA, e.g. `attributes.view = "river"`) and
                `display_name`. Empty narrows nothing. Immutable, like the candidates.
              type: string
            candidateResources:
              description: |-
                Candidate resources the allocator may choose from, supplied on create.
                Empty offers every resource, narrowed by `candidate_filter`. Immutable: the choice is made
                once, and re-offering a different set is a different allocation.
                Format: resources/{resource}
              items:
                type: string
              type: array
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154); echo
                on update/delete.
              type: string
            expireTime:
              description: |-
                When the hold lapses if nothing confirms it. Extend it with ExtendHold;
                past this instant the hold no longer reserves anything, whether or not the
                sweeper has yet marked it EXPIRED.
              format: date-time
              type: string
            idempotencyKey:
              description: |-
                Caller-supplied key making CreateHold safe to retry. A repeat with the same
                key returns the original hold rather than taking a second one.
              type: string
            name:
              description: |-
                The hold name. Top-level: a hold takes resources wherever they are, and
                grouping them by place is the business of whatever is built on top.
                Format: holds/{hold}
              type: string
            quantity:
              description: |-
                How many resources to take, supplied on create; defaults to 1. Once the
                hold is ACTIVE this equals the length of `resources`.
              format: int32
              type: integer
            replaces:
              description: |-
                The hold of the reservation this hold is taken to replace with
                RescheduleReservation: that reservation's `hold`, converted. Its claims do not count against this hold, so a new window
                overlapping the old one -- an extension, a shift by an hour -- can keep
                the same resources. Until the move completes this hold claims only the
                time the old one does not; RescheduleReservation hands the rest over in
                the write that ends the old hold, so no one else can take it in between.
                Such a hold can only be used to reschedule that reservation. (A hold,
                though no resource_reference says so: AIP-121 allows no cycle of mutable
                references, and this one is a hold naming a hold.)
                Format: holds/{hold}
              type: string
            resources:
              description: |-
                The concrete resources this hold has taken, one per unit of `quantity`.
                Chosen by the server from the candidates the request offered.
                Format: resources/{resource}
              items:
                type: string
              type: array
            state:
              description: Lifecycle state. New holds start ACTIVE.
              enum:
              - HOLD_STATE_UNSPECIFIED
              - HOLD_STATE_ACTIVE
              - HOLD_STATE_RELEASED
              - HOLD_STATE_EXPIRED
              - HOLD_STATE_CONVERTED
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
            window:
              description: |-
                The window held. Immutable: moving it is a different allocation, so
                release this hold and take another.

                Stored as text, its two ends in RFC 3339 joined by "/".
              properties:
                endTime:
                  description: |-
                    Optional. Exclusive end of the interval.

                    If specified, a Timestamp matching this interval will have to be before the
                    end.
                  format: date-time
                  type: string
                startTime:
                  description: |-
                    Optional. Inclusive start of the interval.

                    If specified, a Timestamp matching this interval will have to be the same
                    or after the start.
                  format: date-time
                  type: string
              type: object
          type: object
        holdId:
          description: |-
            Client-assigned id, becoming the last segment of the hold name. The server
            generates one when empty.
          type: string
      type: object
    freebusy.allocation.v1.DeleteHoldRequest:
      description: Request message for HoldService.DeleteHold, AIP-135.
      properties:
        etag:
          description: |-
            Opaque version read from the hold; the delete is rejected if the hold
            changed since (AIP-154).
          type: string
        name:
          description: |-
            Name of the hold to delete.
            Format: holds/{hold}
          type: string
      type: object
    freebusy.allocation.v1.ErrorReason:
      description: |-
        The reasons freebusy returns for availability and holds: the
        google.rpc.ErrorInfo reasons (AIP-193) in the freebusy.dev domain. They are
        part of the API: clients branch on them, never on a message.
        protoc-gen-service renders them as Go constants, sentinels and the tables of
        docs/errors.md.
      enum:
      - ERROR_REASON_UNSPECIFIED
      - ERROR_REASON_INVALID_TIME_ZONE
      - ERROR_REASON_TOO_MANY_BUCKETS
      - ERROR_REASON_INVALID_FILTER
      - ERROR_REASON_FILTER_UNSUPPORTED
      - ERROR_REASON_INVALID_ORDER_BY
      - ERROR_REASON_ORDER_BY_UNSUPPORTED
      - ERROR_REASON_INVALID_FACET
      - ERROR_REASON_INVALID_PAGE_TOKEN
      - ERROR_REASON_WINDOW_BEYOND_HORIZON
      - ERROR_REASON_ENGINE_BUSY
      - ERROR_REASON_CAPACITY_EXHAUSTED
      - ERROR_REASON_OUTSIDE_AVAILABILITY
      - ERROR_REASON_INVALID_HOLD_EXTENSION
      - ERROR_REASON_HOLD_NOT_ACTIVE
      - ERROR_REASON_HOLD_CONVERTED
      - ERROR_REASON_HOLD_ACTIVE
      - ERROR_REASON_REPLACED_HOLD_NOT_BOOKED
      type: string
    freebusy.allocation.v1.ExtendHoldRequest:
      description: Request message for HoldService.ExtendHold.
      properties:
        duration:
          description: |-
            How much further out to push expire_time, measured from now rather than
            from the current deadline, so repeated extensions cannot accumulate.
          type: string
        etag:
          description: |-
            Opaque version read from the hold; the extension is rejected if the hold
            changed since (AIP-154).
          type: string
        name:
          description: |-
            Name of the hold to extend.
            Format: holds/{hold}
          type: string
      type: object
    freebusy.allocation.v1.FacetBucket:
      description: One value of a facet and how many resources carry it.
      properties:
        count:
          description: How many matching resources carry it.
          format: int64
          type: integer
          x-kubernetes-int-or-string: true
        value:
          description: 'The value, as text: "river", "22", "true".'
          type: string
      type: object
    freebusy.allocation.v1.GetHoldRequest:
      description: Request message for HoldService.GetHold, AIP-131.
      properties:
        name:
          description: |-
            Name of the hold to retrieve.
            Format: holds/{hold}
          type: string
      type: object
    freebusy.allocation.v1.Hold:
      description: |-
        A Hold is a temporary, expiring claim on one or more bookable resources for a
        window, taken before payment or confirmation so two callers cannot be sold
        the same thing.

        Native, with no RFC behind it, and the comment says why (the same trade
        protobuf.shared.project.v1 records upstream). RFC 5545 section 3.2.12's
        PARTSTAT=TENTATIVE can express that a claim is provisional, and RFC 5546's
        iTIP can carry the request that created it, but neither specifies a lapse
        time, and an expiring claim is the one thing a commercial booking engine
        cannot do without. The resources held are RFC 9073 VRESOURCEs and the window
        is measured against their RFC 7953 availability; only the clock is ours.

        Holds are allocated, not requested: CreateHold names candidate resources and
        a quantity, and the server decides which concrete resources are taken. That
        keeps "which bay did I get" a server decision made under a lock, rather than
        a client guess that races.
      properties:
        candidateFilter:
          description: |-
            An AIP-160 filter narrowing the resources the allocator may choose from,
            supplied on create, alongside `candidate_resources`: the same filter
            SearchAvailability takes, over each resource's `resource_types`,
            `attributes` (its STRUCTURED-DATA, e.g. `attributes.view = "river"`) and
            `display_name`. Empty narrows nothing. Immutable, like the candidates.
          type: string
        candidateResources:
          description: |-
            Candidate resources the allocator may choose from, supplied on create.
            Empty offers every resource, narrowed by `candidate_filter`. Immutable: the choice is made
            once, and re-offering a different set is a different allocation.
            Format: resources/{resource}
          items:
            type: string
          type: array
        createTime:
          description: Creation timestamp.
          format: date-time
          type: string
        etag:
          description: Opaque version for optimistic concurrency (AIP-154); echo on
            update/delete.
          type: string
        expireTime:
          description: |-
            When the hold lapses if nothing confirms it. Extend it with ExtendHold;
            past this instant the hold no longer reserves anything, whether or not the
            sweeper has yet marked it EXPIRED.
          format: date-time
          type: string
        idempotencyKey:
          description: |-
            Caller-supplied key making CreateHold safe to retry. A repeat with the same
            key returns the original hold rather than taking a second one.
          type: string
        name:
          description: |-
            The hold name. Top-level: a hold takes resources wherever they are, and
            grouping them by place is the business of whatever is built on top.
            Format: holds/{hold}
          type: string
        quantity:
          description: |-
            How many resources to take, supplied on create; defaults to 1. Once the
            hold is ACTIVE this equals the length of `resources`.
          format: int32
          type: integer
        replaces:
          description: |-
            The hold of the reservation this hold is taken to replace with
            RescheduleReservation: that reservation's `hold`, converted. Its claims do not count against this hold, so a new window
            overlapping the old one -- an extension, a shift by an hour -- can keep
            the same resources. Until the move completes this hold claims only the
            time the old one does not; RescheduleReservation hands the rest over in
            the write that ends the old hold, so no one else can take it in between.
            Such a hold can only be used to reschedule that reservation. (A hold,
            though no resource_reference says so: AIP-121 allows no cycle of mutable
            references, and this one is a hold naming a hold.)
            Format: holds/{hold}
          type: string
        resources:
          description: |-
            The concrete resources this hold has taken, one per unit of `quantity`.
            Chosen by the server from the candidates the request offered.
            Format: resources/{resource}
          items:
            type: string
          type: array
        state:
          description: Lifecycle state. New holds start ACTIVE.
          enum:
          - HOLD_STATE_UNSPECIFIED
          - HOLD_STATE_ACTIVE
          - HOLD_STATE_RELEASED
          - HOLD_STATE_EXPIRED
          - HOLD_STATE_CONVERTED
          type: string
        updateTime:
          description: Last-modification timestamp.
          format: date-time
          type: string
        window:
          description: |-
            The window held. Immutable: moving it is a different allocation, so
            release this hold and take another.

            Stored as text, its two ends in RFC 3339 joined by "/".
          properties:
            endTime:
              description: |-
                Optional. Exclusive end of the interval.

                If specified, a Timestamp matching this interval will have to be before the
                end.
              format: date-time
              type: string
            startTime:
              description: |-
                Optional. Inclusive start of the interval.

                If specified, a Timestamp matching this interval will have to be the same
                or after the start.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.HoldState:
      description: |-
        Lifecycle of a Hold. A hold is the only thing in this API that expires on its
        own: RFC 5545 section 3.2.12's PARTSTAT=TENTATIVE says a tentative claim
        exists, but no RFC says when it lapses, so the clock is ours.

        ```mermaid
        stateDiagram-v2
            state "ACTIVE" as HOLD_STATE_ACTIVE
            state "RELEASED" as HOLD_STATE_RELEASED
            state "EXPIRED" as HOLD_STATE_EXPIRED
            state "CONVERTED" as HOLD_STATE_CONVERTED
            [*] --> HOLD_STATE_ACTIVE: CreateHold
            HOLD_STATE_ACTIVE --> HOLD_STATE_RELEASED: ReleaseHold
            HOLD_STATE_ACTIVE --> HOLD_STATE_RELEASED: reservation failed
            HOLD_STATE_ACTIVE --> HOLD_STATE_EXPIRED: sweeper [expire_time passed]
            HOLD_STATE_ACTIVE --> HOLD_STATE_CONVERTED: CreateReservation
            HOLD_STATE_RELEASED --> [*]
            HOLD_STATE_EXPIRED --> [*]
            HOLD_STATE_CONVERTED --> [*]
        ```
      enum:
      - HOLD_STATE_UNSPECIFIED
      - HOLD_STATE_ACTIVE
      - HOLD_STATE_RELEASED
      - HOLD_STATE_EXPIRED
      - HOLD_STATE_CONVERTED
      type: string
      x-mermaid:
      - diagram: |
          stateDiagram-v2
              state "ACTIVE" as HOLD_STATE_ACTIVE
              state "RELEASED" as HOLD_STATE_RELEASED
              state "EXPIRED" as HOLD_STATE_EXPIRED
              state "CONVERTED" as HOLD_STATE_CONVERTED
              [*] --> HOLD_STATE_ACTIVE: CreateHold
              HOLD_STATE_ACTIVE --> HOLD_STATE_RELEASED: ReleaseHold
              HOLD_STATE_ACTIVE --> HOLD_STATE_RELEASED: reservation failed
              HOLD_STATE_ACTIVE --> HOLD_STATE_EXPIRED: sweeper [expire_time passed]
              HOLD_STATE_ACTIVE --> HOLD_STATE_CONVERTED: CreateReservation
              HOLD_STATE_RELEASED --> [*]
              HOLD_STATE_EXPIRED --> [*]
              HOLD_STATE_CONVERTED --> [*]
        title: HoldState
        type: stateDiagram-v2
    freebusy.allocation.v1.ListHoldsRequest:
      description: Request message for HoldService.ListHolds, AIP-132.
      properties:
        filter:
          description: |-
            Filter expression, AIP-160, over the hold's own fields, e.g.
            `state=HOLD_STATE_ACTIVE`.
          type: string
        pageSize:
          description: Maximum holds to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListHoldsResponse.next_page_token.
          type: string
      type: object
    freebusy.allocation.v1.ListHoldsResponse:
      description: Response message for HoldService.ListHolds, AIP-132.
      properties:
        holds:
          description: The holds on this page.
          items:
            description: |-
              A Hold is a temporary, expiring claim on one or more bookable resources for a
              window, taken before payment or confirmation so two callers cannot be sold
              the same thing.

              Native, with no RFC behind it, and the comment says why (the same trade
              protobuf.shared.project.v1 records upstream). RFC 5545 section 3.2.12's
              PARTSTAT=TENTATIVE can express that a claim is provisional, and RFC 5546's
              iTIP can carry the request that created it, but neither specifies a lapse
              time, and an expiring claim is the one thing a commercial booking engine
              cannot do without. The resources held are RFC 9073 VRESOURCEs and the window
              is measured against their RFC 7953 availability; only the clock is ours.

              Holds are allocated, not requested: CreateHold names candidate resources and
              a quantity, and the server decides which concrete resources are taken. That
              keeps "which bay did I get" a server decision made under a lock, rather than
              a client guess that races.
            properties:
              candidateFilter:
                description: |-
                  An AIP-160 filter narrowing the resources the allocator may choose from,
                  supplied on create, alongside `candidate_resources`: the same filter
                  SearchAvailability takes, over each resource's `resource_types`,
                  `attributes` (its STRUCTURED-DATA, e.g. `attributes.view = "river"`) and
                  `display_name`. Empty narrows nothing. Immutable, like the candidates.
                type: string
              candidateResources:
                description: |-
                  Candidate resources the allocator may choose from, supplied on create.
                  Empty offers every resource, narrowed by `candidate_filter`. Immutable: the choice is made
                  once, and re-offering a different set is a different allocation.
                  Format: resources/{resource}
                items:
                  type: string
                type: array
              createTime:
                description: Creation timestamp.
                format: date-time
                type: string
              etag:
                description: Opaque version for optimistic concurrency (AIP-154);
                  echo on update/delete.
                type: string
              expireTime:
                description: |-
                  When the hold lapses if nothing confirms it. Extend it with ExtendHold;
                  past this instant the hold no longer reserves anything, whether or not the
                  sweeper has yet marked it EXPIRED.
                format: date-time
                type: string
              idempotencyKey:
                description: |-
                  Caller-supplied key making CreateHold safe to retry. A repeat with the same
                  key returns the original hold rather than taking a second one.
                type: string
              name:
                description: |-
                  The hold name. Top-level: a hold takes resources wherever they are, and
                  grouping them by place is the business of whatever is built on top.
                  Format: holds/{hold}
                type: string
              quantity:
                description: |-
                  How many resources to take, supplied on create; defaults to 1. Once the
                  hold is ACTIVE this equals the length of `resources`.
                format: int32
                type: integer
              replaces:
                description: |-
                  The hold of the reservation this hold is taken to replace with
                  RescheduleReservation: that reservation's `hold`, converted. Its claims do not count against this hold, so a new window
                  overlapping the old one -- an extension, a shift by an hour -- can keep
                  the same resources. Until the move completes this hold claims only the
                  time the old one does not; RescheduleReservation hands the rest over in
                  the write that ends the old hold, so no one else can take it in between.
                  Such a hold can only be used to reschedule that reservation. (A hold,
                  though no resource_reference says so: AIP-121 allows no cycle of mutable
                  references, and this one is a hold naming a hold.)
                  Format: holds/{hold}
                type: string
              resources:
                description: |-
                  The concrete resources this hold has taken, one per unit of `quantity`.
                  Chosen by the server from the candidates the request offered.
                  Format: resources/{resource}
                items:
                  type: string
                type: array
              state:
                description: Lifecycle state. New holds start ACTIVE.
                enum:
                - HOLD_STATE_UNSPECIFIED
                - HOLD_STATE_ACTIVE
                - HOLD_STATE_RELEASED
                - HOLD_STATE_EXPIRED
                - HOLD_STATE_CONVERTED
                type: string
              updateTime:
                description: Last-modification timestamp.
                format: date-time
                type: string
              window:
                description: |-
                  The window held. Immutable: moving it is a different allocation, so
                  release this hold and take another.

                  Stored as text, its two ends in RFC 3339 joined by "/".
                properties:
                  endTime:
                    description: |-
                      Optional. Exclusive end of the interval.

                      If specified, a Timestamp matching this interval will have to be before the
                      end.
                    format: date-time
                    type: string
                  startTime:
                    description: |-
                      Optional. Inclusive start of the interval.

                      If specified, a Timestamp matching this interval will have to be the same
                      or after the start.
                    format: date-time
                    type: string
                type: object
            type: object
          type: array
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
      type: object
    freebusy.allocation.v1.ReleaseHoldRequest:
      description: Request message for HoldService.ReleaseHold.
      properties:
        etag:
          description: |-
            Opaque version read from the hold; the release is rejected if the hold
            changed since (AIP-154).
          type: string
        name:
          description: |-
            Name of the hold to release.
            Format: holds/{hold}
          type: string
      type: object
    freebusy.allocation.v1.ResourceDay:
      description: |-
        A ResourceDay is one resource's standing free time on one UTC day: the
        availability read model SearchAvailability, ComputeAvailability,
        CheckAvailability and CreateHold read their candidates from, instead of
        evaluating every resource there is.

        Storage-only, and derived: no RPC takes or returns it. It is a projection
        of the resources, their calendars, RFC 7953 availability, RFC 5545
        events and the claims of converted holds, rewritten in the same transaction
        as every write to those (on Hasura, a single write projects in a request of
        its own right after it), for every day of a rolling horizon. `free` is
        offered time less booked time; live holds are not subtracted, and neither
        is a resource's booking policy applied, because both change with the
        clock. The engine evaluates every candidate the projection returns before
        answering, so an answer never depends on the projection being current; a
        stale row can only make a search miss a resource or read one it then
        drops.
      properties:
        attributes:
          description: |-
            Every JSON object the resource's RFC 9073 STRUCTURED-DATA carries as
            inline text, merged in order (a later key wins): freebusy's booking
            profile and any vertical's own attributes. Searched with AIP-160 paths
            such as `attributes.view = "river"` or `attributes.charger_kw >= 22`.
          type: object
          x-kubernetes-preserve-unknown-fields: true
        calendar:
          description: |-
            The resource's calendar, "calendars/{calendar}": what an event or an
            availability on that calendar re-projects.
          type: string
        day:
          description: The UTC calendar day this row covers.
          properties:
            day:
              description: |-
                Day of a month. Must be from 1 to 31 and valid for the year and month, or 0
                to specify a year by itself or a year and month where the day isn't
                significant.
              format: int32
              type: integer
            month:
              description: |-
                Month of a year. Must be from 1 to 12, or 0 to specify a year without a
                month and day.
              format: int32
              type: integer
            year:
              description: |-
                Year of the date. Must be from 1 to 9999, or 0 to specify a date without
                a year.
              format: int32
              type: integer
          type: object
        displayName:
          description: The resource's display name, matched by a bare word in a filter.
          type: string
        free:
          description: |-
            The resource's free time within the day, [day 00:00Z, next day 00:00Z):
            offered by its availability, less confirmed events on its calendar and
            the claims of converted holds. Live holds are not subtracted.
          items:
            description: |-
              Represents a time interval, encoded as a Timestamp start (inclusive) and a
              Timestamp end (exclusive).

              The start must be less than or equal to the end.
              When the start equals the end, the interval is empty (matches no time).
              When both start and end are unspecified, the interval matches any time.
            properties:
              endTime:
                description: |-
                  Optional. Exclusive end of the interval.

                  If specified, a Timestamp matching this interval will have to be before the
                  end.
                format: date-time
                type: string
              startTime:
                description: |-
                  Optional. Inclusive start of the interval.

                  If specified, a Timestamp matching this interval will have to be the same
                  or after the start.
                format: date-time
                type: string
            type: object
          type: array
        freeFraction:
          description: |-
            The share of the day that is free, from 0 to 1, for ordering by how open
            a resource is.
          type: number
        organizationalUnit:
          description: |-
            The resource's own organizational_unit, copied as data for filtering:
            freebusy does not check or scope by it.
          type: string
        resource:
          description: |-
            The resource, "resources/{resource}". Not a resource reference: a
            projection row must never keep its source from being purged.
          type: string
        resourceTypes:
          description: RFC 9073 RESOURCE-TYPE values the resource carries.
          items:
            type: string
          type: array
      type: object
    freebusy.allocation.v1.SearchAvailabilityRequest:
      description: |-
        Request message for AllocationService.SearchAvailability. Searches every
        resource for those free across a window, where ComputeAvailability counts
        over resources already chosen.
      properties:
        facets:
          description: |-
            Fields to count matching resources by, returned in
            SearchAvailabilityResponse.facets: `resource_types`,
            `organizational_unit` or an `attributes.<path>`, e.g.
            ["resource_types", "attributes.view"]. At most 10.
          items:
            type: string
          type: array
        filter:
          description: |-
            An AIP-160 filter over each resource's search record (ResourceDay): its
            `resource_types`, its STRUCTURED-DATA under `attributes` (any path, e.g.
            `attributes.view = "river" AND attributes.max_occupancy >= 3`), its
            `display_name` (a bare word matches it) and `organizational_unit` (the
            resource's own, as data). Terms are ANDed unless joined with OR. Empty
            matches every resource.
          type: string
        orderBy:
          description: |-
            AIP-132 order of the matches: a comma-separated list of `resource`,
            `organizational_unit`, `display_name`, `free_fraction` (the share of
            the window's first UTC day that is free) and `attributes.max_occupancy`
            (the booking profile's, as a number), each optionally followed by
            ` desc`, e.g. `free_fraction desc, display_name`. Defaults to
            `resource`.
          type: string
        pageSize:
          description: Maximum matches to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: |-
            Page token from a previous SearchAvailabilityResponse.next_page_token.
            Every other field must be the same as in the call that returned it.
          type: string
        resourceTypes:
          description: |-
            Restrict to RESOURCE-TYPE values, RFC 9073 section 6.3, e.g. "room" or
            "parking-bay": a resource matches when it carries any of them. Empty
            matches every type.
          items:
            type: string
          type: array
        window:
          description: The window that must be free.
          properties:
            endTime:
              description: |-
                Optional. Exclusive end of the interval.

                If specified, a Timestamp matching this interval will have to be before the
                end.
              format: date-time
              type: string
            startTime:
              description: |-
                Optional. Inclusive start of the interval.

                If specified, a Timestamp matching this interval will have to be the same
                or after the start.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.SearchAvailabilityResponse:
      description: Response message for AllocationService.SearchAvailability.
      properties:
        facets:
          description: |-
            One entry per field the request named in `facets`, in that order: how
            many resources matching the filter have that window free in their
            standing availability, by value. Counts come from the search records
            and do not subtract live holds, so they can run slightly above what a
            hold would get; the matches themselves are exact.
          items:
            description: |-
              The counts of one facet of a search: how many matching resources carry
              each value of one field.
            properties:
              buckets:
                description: The most frequent values, most frequent first, at most
                  20.
                items:
                  description: One value of a facet and how many resources carry it.
                  properties:
                    count:
                      description: How many matching resources carry it.
                      format: int64
                      type: integer
                      x-kubernetes-int-or-string: true
                    value:
                      description: 'The value, as text: "river", "22", "true".'
                      type: string
                  type: object
                type: array
              field:
                description: The field counted, as the request named it, e.g. "attributes.view".
                type: string
            type: object
          type: array
        matches:
          description: The free resources found.
          items:
            description: One resource that satisfies a search, with the window it
              is free for.
            properties:
              displayName:
                description: The resource's display name, echoed for the same reason.
                type: string
              resource:
                description: |-
                  The free resource.
                  Format: resources/{resource}
                type: string
              resourceTypes:
                description: |-
                  RESOURCE-TYPE values carried by the resource, RFC 9073 section 6.3, echoed
                  so a caller can group results without re-fetching each resource.
                items:
                  type: string
                type: array
              window:
                description: The span it is free for, which may be narrower than the
                  searched window.
                properties:
                  endTime:
                    description: |-
                      Optional. Exclusive end of the interval.

                      If specified, a Timestamp matching this interval will have to be before the
                      end.
                    format: date-time
                    type: string
                  startTime:
                    description: |-
                      Optional. Inclusive start of the interval.

                      If specified, a Timestamp matching this interval will have to be the same
                      or after the start.
                    format: date-time
                    type: string
                type: object
            type: object
          type: array
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
      type: object
    freebusy.allocation.v1.SearchFacet:
      description: |-
        The counts of one facet of a search: how many matching resources carry
        each value of one field.
      properties:
        buckets:
          description: The most frequent values, most frequent first, at most 20.
          items:
            description: One value of a facet and how many resources carry it.
            properties:
              count:
                description: How many matching resources carry it.
                format: int64
                type: integer
                x-kubernetes-int-or-string: true
              value:
                description: 'The value, as text: "river", "22", "true".'
                type: string
            type: object
          type: array
        field:
          description: The field counted, as the request named it, e.g. "attributes.view".
          type: string
      type: object
    freebusy.allocation.v1.UnbookableReason:
      description: Why a requested window is not bookable.
      properties:
        code:
          description: What went wrong, as a code a caller can branch on.
          enum:
          - UNBOOKABLE_REASON_CODE_UNSPECIFIED
          - UNBOOKABLE_REASON_CODE_NO_CAPACITY
          - UNBOOKABLE_REASON_CODE_OUTSIDE_AVAILABILITY
          - UNBOOKABLE_REASON_CODE_HELD
          - UNBOOKABLE_REASON_CODE_BOOKED
          - UNBOOKABLE_REASON_CODE_WINDOW_TOO_SHORT
          - UNBOOKABLE_REASON_CODE_WINDOW_TOO_LONG
          - UNBOOKABLE_REASON_CODE_LEAD_TIME
          - UNBOOKABLE_REASON_CODE_RESOURCE_INACTIVE
          type: string
        message:
          description: Human-readable detail for logs and support, not for parsing.
          type: string
        resource:
          description: |-
            The resource this reason is about, when it concerns one in particular.
            Format: resources/{resource}
          type: string
      type: object
    freebusy.allocation.v1.UnbookableReasonCode:
      description: |-
        Why a window could not be booked. Returned by CheckAvailability so a caller
        can say what to change rather than only that it failed.
      enum:
      - UNBOOKABLE_REASON_CODE_UNSPECIFIED
      - UNBOOKABLE_REASON_CODE_NO_CAPACITY
      - UNBOOKABLE_REASON_CODE_OUTSIDE_AVAILABILITY
      - UNBOOKABLE_REASON_CODE_HELD
      - UNBOOKABLE_REASON_CODE_BOOKED
      - UNBOOKABLE_REASON_CODE_WINDOW_TOO_SHORT
      - UNBOOKABLE_REASON_CODE_WINDOW_TOO_LONG
      - UNBOOKABLE_REASON_CODE_LEAD_TIME
      - UNBOOKABLE_REASON_CODE_RESOURCE_INACTIVE
      type: string
info:
  description: |-
    ## Resources

    ```mermaid
    erDiagram
        Hold {
            string name PK "IDENTIFIER"
            string[] resources FK "OUTPUT_ONLY"
            Interval window "REQUIRED, IMMUTABLE"
            string[] candidate_resources FK "OPTIONAL, IMMUTABLE"
            int32 quantity "OPTIONAL, IMMUTABLE"
            Timestamp expire_time "OUTPUT_ONLY"
            HoldState state "OUTPUT_ONLY"
            string idempotency_key "OPTIONAL, IMMUTABLE"
            Timestamp create_time "OUTPUT_ONLY"
            Timestamp update_time "OUTPUT_ONLY"
            string etag "OUTPUT_ONLY"
            string replaces "OPTIONAL, IMMUTABLE"
            string candidate_filter "OPTIONAL, IMMUTABLE"
        }
        Allocation {
            string name PK "IDENTIFIER"
            string resource FK "REQUIRED"
            Timestamp start_time "REQUIRED"
            Timestamp end_time "REQUIRED"
            Timestamp expire_time "OUTPUT_ONLY"
            Timestamp create_time "OUTPUT_ONLY"
            string hold FK "OUTPUT_ONLY"
        }
        Hold }o--o{ Resource : "resources"
        Hold }o--o{ Resource : "candidate_resources"
        Allocation }o--|| Resource : "resource"
        Allocation }o--o| Hold : "hold"
    ```

    ## Flows

    - **Hold expiry** (`hold-expiry`, tag HoldService): A hold nobody confirms lapses at `expire_time`; ExtendHold pushes the deadline out while it is still ACTIVE.
