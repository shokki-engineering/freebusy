components:
  schemas:
    freebusy.webhook.v1.Delivery:
      description: One event owed to one webhook, and how sending it went.
      properties:
        attemptCount:
          description: Attempts made so far.
          format: int32
          type: integer
        createTime:
          description: When the change was recorded for this webhook.
          format: date-time
          type: string
        deliverTime:
          description: When the endpoint accepted it.
          format: date-time
          type: string
        errorMessage:
          description: Why the last attempt failed, empty after a success.
          type: string
        etag:
          description: Opaque version for optimistic concurrency (AIP-154).
          type: string
        eventId:
          description: 'The CloudEvents id, the same for every webhook sent this change:
            a digest of the record''s name and etag. Receivers deduplicate on it.'
          type: string
        eventType:
          description: The CloudEvents type, e.g. "freebusy.reservation.confirmed".
          type: string
        name:
          description: 'The delivery name. The final segment is a digest of (webhook,
            event_id). Format: webhooks/{webhook}/deliveries/{delivery}'
          type: string
        nextAttemptTime:
          description: When the next attempt is due, while PENDING.
          format: date-time
          type: string
        payload:
          description: 'The request body sent: a CloudEvents 1.0 JSON document whose
            data is the record as it stood.'
          type: string
        responseCode:
          description: HTTP status of the last attempt; 0 when it got no response.
          format: int32
          type: integer
        state:
          description: Where sending stands.
          enum:
          - DELIVERY_STATE_UNSPECIFIED
          - DELIVERY_STATE_PENDING
          - DELIVERY_STATE_SUCCEEDED
          - DELIVERY_STATE_FAILED
          type: string
        subject:
          description: 'The record that changed. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
            or organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
        updateTime:
          description: Last-modification timestamp.
          format: date-time
          type: string
      type: object
    freebusy.webhook.v1.FeedCursor:
      description: 'How far the dispatcher has read one change feed: every record
        of the feed last modified before position_time has been recorded for every
        webhook. Storage only -- no service exposes it.'
      properties:
        etag:
          description: Opaque version for optimistic concurrency (AIP-154).
          type: string
        name:
          description: 'The cursor name; the final segment names the feed, e.g. "reservations".
            Format: feedCursors/{feed_cursor}'
          type: string
        positionTime:
          description: Records modified before this have been recorded.
          format: date-time
          type: string
        updateTime:
          description: Last-modification timestamp.
          format: date-time
          type: string
      type: object
info:
  title: OpenAPI Spec for Solo APIs.
  version: v1
openapi: 3.0.1
paths: null
