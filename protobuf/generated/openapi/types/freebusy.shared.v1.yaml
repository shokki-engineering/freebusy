  description: |-
    ## Resources

    ```mermaid
    erDiagram
        IdempotencyKey {
            string name PK "IDENTIFIER"
            string method "REQUIRED"
            string request_id "REQUIRED"
            IdempotencyState state "OUTPUT_ONLY"
            string response "OPTIONAL"
            Timestamp create_time "OUTPUT_ONLY"
            Timestamp update_time "OUTPUT_ONLY"
        }
    ```
  title: OpenAPI Spec for Solo APIs.
  version: v1
  x-mermaid:
  - diagram: |
      erDiagram
          IdempotencyKey {
              string name PK "IDENTIFIER"
              string method "REQUIRED"
              string request_id "REQUIRED"
