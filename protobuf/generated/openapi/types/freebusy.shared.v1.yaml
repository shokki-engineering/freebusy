components:
  schemas:
    freebusy.shared.v1.ErrorReason:
      description: |-
        The reasons freebusy returns for the resources, calendars, events and
        availability freebusy serves, and any call: the
        google.rpc.ErrorInfo reasons (AIP-193) in the freebusy.shokki.engineering domain. They are
        part of the API: clients branch on them, never on a message.
        protoc-gen-service renders them as Go constants, sentinels and the tables of
        docs/errors.md.
      enum:
      - ERROR_REASON_UNSPECIFIED
      - ERROR_REASON_CALENDAR_NOT_FOUND
      - ERROR_REASON_CALENDAR_DELETED
      - ERROR_REASON_CALENDAR_NOT_EMPTY
      - ERROR_REASON_NAME_NOT_UNDER_PARENT
      - ERROR_REASON_NOT_RECURRING
      - ERROR_REASON_SERIES_NOT_FOUND
      - ERROR_REASON_NOT_AN_INSTANCE
      - ERROR_REASON_RANGE_NOT_SUPPORTED
      - ERROR_REASON_INVALID_EVENT
      - ERROR_REASON_UNSUPPORTED_RECURRENCE
      - ERROR_REASON_WINDOW_INCOMPLETE
      - ERROR_REASON_WINDOW_BACKWARDS
      - ERROR_REASON_WINDOW_TOO_LONG
      - ERROR_REASON_UNIMPLEMENTED
      type: string
    freebusy.shared.v1.IdempotencyKey:
      description: |-
        The record behind every `request_id` field in this API: it remembers what the
        first call with a given id returned, so a retry replays that response instead
        of attempting the write twice. Storage only — no service exposes it, and no
        caller constructs one. It lives in freebusy.shared.v1 because request_id is
        an API-wide convention any RPC may opt into, and one interceptor records them
        all; homing it in any single service's package would make every other
        service import that service to dedupe its own writes. HoldService.CreateHold
        declares it; CreateReservation needs none, since a hold backs at most one
        reservation.

        The id is derived, not random: it is a digest of (method, request_id), so the
        primary key itself is the uniqueness constraint that makes a concurrent
        duplicate lose the race rather than double-write.
      properties:
        createTime:
          description: When the key was claimed.
          format: date-time
          type: string
        method:
          description: |-
            Fully-qualified RPC that was called, e.g.
            "/freebusy.allocation.v1.HoldService/CreateHold". Part of the key: the
            same request_id replayed against a different method is a different request.
          type: string
        name:
          description: |-
            The key name. The final segment is a digest of (method, request_id).
            Format: idempotencyKeys/{idempotency_key}
          type: string
        requestId:
          description: |-
            The caller-supplied idempotency key, verbatim from the request's
            `request_id` field.
          type: string
        response:
          description: |-
            What the first call returned: a google.protobuf.Any holding the response
            message, encoded as protojson. Empty while IN_FLIGHT. Stored as text rather
            than bytes so it round-trips identically through GORM and through Hasura's
            GraphQL, and self-describing (the Any carries its @type) so a replay can
            rebuild the exact response message without knowing which RPC wrote it.
          type: string
        state:
          description: |-
            Whether the first call is still running or has settled. Output only
            (AIP-216): only the server writes it, through the store's output-only
            update path when a call settles.
          enum:
          - IDEMPOTENCY_STATE_UNSPECIFIED
          - IDEMPOTENCY_STATE_IN_FLIGHT
          - IDEMPOTENCY_STATE_DONE
          type: string
        updateTime:
          description: When the key settled to DONE.
          format: date-time
          type: string
      type: object
    freebusy.shared.v1.IdempotencyState:
      description: |-
        Lifecycle of a recorded request. A key is claimed IN_FLIGHT before the
        handler runs and settles to DONE once its response is recorded; a handler
        that fails deletes its key, so the caller may genuinely retry.
      enum:
      - IDEMPOTENCY_STATE_UNSPECIFIED
      - IDEMPOTENCY_STATE_IN_FLIGHT
      - IDEMPOTENCY_STATE_DONE
      type: string
