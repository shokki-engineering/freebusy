    freebusy.reservation.v1.ReservationState:
      description: |-
        Lifecycle of a Reservation.

        Two of these states are in-between states, and they are why a crash never
        leaves the books wrong. Confirming takes two writes -- this record and the
        hold's conversion -- as does cancelling, and no transaction spans the engine
        and this table on every backend. So each transition is written down before it
        is carried out: a reservation seen PENDING or CANCELLING says what was being
        attempted, and the reconciler finishes it.

        ```mermaid
        stateDiagram-v2
            state "PENDING" as RESERVATION_STATE_PENDING
            state "CONFIRMED" as RESERVATION_STATE_CONFIRMED
            state "CANCELLING" as RESERVATION_STATE_CANCELLING
            state "CANCELLED" as RESERVATION_STATE_CANCELLED
            state "FAILED" as RESERVATION_STATE_FAILED
            state "RESCHEDULING" as RESERVATION_STATE_RESCHEDULING
            state "RESCHEDULED" as RESERVATION_STATE_RESCHEDULED
            [*] --> RESERVATION_STATE_PENDING: CreateReservation
            RESERVATION_STATE_PENDING --> RESERVATION_STATE_CONFIRMED: hold converted
            RESERVATION_STATE_RESCHEDULING --> RESERVATION_STATE_CONFIRMED: reconciler [replacement's hold lapsed]
            RESERVATION_STATE_CONFIRMED --> RESERVATION_STATE_CANCELLING: CancelReservation
            RESERVATION_STATE_CANCELLING --> RESERVATION_STATE_CANCELLED: resources freed
            RESERVATION_STATE_PENDING --> RESERVATION_STATE_FAILED: reconciler [hold lapsed or released]
            RESERVATION_STATE_CONFIRMED --> RESERVATION_STATE_RESCHEDULING: RescheduleReservation
            RESERVATION_STATE_RESCHEDULING --> RESERVATION_STATE_RESCHEDULED: replacement confirmed
            RESERVATION_STATE_CANCELLED --> [*]
            RESERVATION_STATE_FAILED --> [*]
            RESERVATION_STATE_RESCHEDULED --> [*]
        ```
      enum:
      - RESERVATION_STATE_UNSPECIFIED
      - RESERVATION_STATE_PENDING
      - RESERVATION_STATE_CONFIRMED
      - RESERVATION_STATE_CANCELLING
      - RESERVATION_STATE_CANCELLED
      - RESERVATION_STATE_FAILED
      - RESERVATION_STATE_RESCHEDULING
      - RESERVATION_STATE_RESCHEDULED
      type: string
      x-mermaid:
      - diagram: |
          stateDiagram-v2
              state "PENDING" as RESERVATION_STATE_PENDING
              state "CONFIRMED" as RESERVATION_STATE_CONFIRMED
              state "CANCELLING" as RESERVATION_STATE_CANCELLING
              state "CANCELLED" as RESERVATION_STATE_CANCELLED
              state "FAILED" as RESERVATION_STATE_FAILED
              state "RESCHEDULING" as RESERVATION_STATE_RESCHEDULING
              state "RESCHEDULED" as RESERVATION_STATE_RESCHEDULED
              [*] --> RESERVATION_STATE_PENDING: CreateReservation
              RESERVATION_STATE_PENDING --> RESERVATION_STATE_CONFIRMED: hold converted
              RESERVATION_STATE_RESCHEDULING --> RESERVATION_STATE_CONFIRMED: reconciler [replacement's hold lapsed]
              RESERVATION_STATE_CONFIRMED --> RESERVATION_STATE_CANCELLING: CancelReservation
              RESERVATION_STATE_CANCELLING --> RESERVATION_STATE_CANCELLED: resources freed
              RESERVATION_STATE_PENDING --> RESERVATION_STATE_FAILED: reconciler [hold lapsed or released]
              RESERVATION_STATE_CONFIRMED --> RESERVATION_STATE_RESCHEDULING: RescheduleReservation
              RESERVATION_STATE_RESCHEDULING --> RESERVATION_STATE_RESCHEDULED: replacement confirmed
              RESERVATION_STATE_CANCELLED --> [*]
              RESERVATION_STATE_FAILED --> [*]
              RESERVATION_STATE_RESCHEDULED --> [*]
        title: ReservationState
        type: stateDiagram-v2
    freebusy.reservation.v1.UpdateReservationRequest:
      description: |-
        Request message for ReservationService.UpdateReservation, AIP-134.

        The reservation's own field rules are not applied: a partial update leaves
        out `hold`, which a create must send. Instead this message checks
        `reservation.name` and `reservation.customer`, and the service checks the
        mask.
      properties:
        reservation:
          description: |-
            The reservation, its name identifying which. Only the fields update_mask
            names are read. `etag`, when set, must match the stored one (AIP-154).
          properties:
            attributes:
              description: |-
                Whatever a vertical needs to keep with the reservation: a party size, a
                payment reference, a licence plate. Opaque to the engine.
              type: object
