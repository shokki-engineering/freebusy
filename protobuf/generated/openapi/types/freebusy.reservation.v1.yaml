                not keep users: when a resolver for the type is registered (config
                `reference_services`) a create or update checks the name with that service, and a deleted user leaves the
                reservation as it is.
                Format: users/{user}
              type: string
            endTime:
              description: End of the reserved window, exclusive, copied from the
                hold.
              format: date-time
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154); echo
                on cancel.
              type: string
            hold:
              description: |-
                The hold this reservation was made from.
                Format: holds/{hold}
              type: string
            lastChange:
              description: |-
                What the last write to this reservation changed. A webhook is sent
                freebusy.reservation.updated exactly when it is CHANGE_DETAILS, and the
                event of the new state otherwise.
              enum:
              - CHANGE_UNSPECIFIED
              - CHANGE_STATE
              - CHANGE_DETAILS
              type: string
            name:
              description: |-
                The reservation name. Its id is the caller's reservation_id, or else the
                id of the hold it was made from.
                Format: reservations/{reservation}
              type: string
            replacement:
              description: |-
                The reservation replacing this one, set when RescheduleReservation began.
                Format: reservations/{reservation}
              type: string
            replaces:
              description: |-
                The reservation this one replaced, set when it was made by
                RescheduleReservation.
                Format: reservations/{reservation}
              type: string
            resources:
              description: |-
                The resources taken, copied from the hold.
                Format: resources/{resource}
              items:
                type: string
              type: array
            startTime:
              description: Start of the reserved window, copied from the hold.
              format: date-time
              type: string
            state:
              description: Lifecycle state.
              enum:
              - RESERVATION_STATE_UNSPECIFIED
              - RESERVATION_STATE_PENDING
              - RESERVATION_STATE_CONFIRMED
              - RESERVATION_STATE_CANCELLING
              - RESERVATION_STATE_CANCELLED
              - RESERVATION_STATE_FAILED
              - RESERVATION_STATE_RESCHEDULING
              - RESERVATION_STATE_RESCHEDULED
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
          type: object
        updateMask:
          description: |-
            The fields to change: `customer`, `attributes`, or both; `*` is both.
            It must be sent -- an update never guesses what was meant from the
            fields that happen to be set -- and an empty one is rejected with
            REQUIRED_FIELD. Any other field is rejected with UNKNOWN_MASK_PATH.
          properties:
            paths:
              description: The set of field mask paths.
              items:
                type: string
              type: array
          type: object
      type: object
info:
  description: |-
    ## Resources

    ```mermaid
    erDiagram
        Reservation {
            string name PK "IDENTIFIER"
            string hold FK "REQUIRED, IMMUTABLE"
            string[] resources FK "OUTPUT_ONLY"
            Timestamp start_time "OUTPUT_ONLY"
            Timestamp end_time "OUTPUT_ONLY"
            string customer FK "OPTIONAL"
            ReservationState state "OUTPUT_ONLY"
            Struct attributes "OPTIONAL"
            string cancel_reason "OUTPUT_ONLY"
            Timestamp create_time "OUTPUT_ONLY"
            Timestamp update_time "OUTPUT_ONLY"
            Timestamp confirm_time "OUTPUT_ONLY"
            Timestamp cancel_time "OUTPUT_ONLY"
            string etag "OUTPUT_ONLY"
            string replaces "OUTPUT_ONLY"
            string replacement "OUTPUT_ONLY"
            Change last_change "OUTPUT_ONLY"
        }
        Reservation }o--|| Hold : "hold"
        Reservation }o--o{ Resource : "resources"
        Reservation }o--o| User : "customer"
    ```

    ## Flows

    - **Book a resource** (`book`, this API): Search, check, hold, then confirm. Only the hold secures capacity: search and check are advisory and can be stale the instant they answer.
    - **Reschedule a reservation** (`reschedule`, tag ReservationService): Moves a booking onto a new hold. The original keeps its resources until the replacement is confirmed, so a failure part-way leaves the old booking in place.
    - **Cancel a reservation** (`cancel`, tag ReservationService): Cancelling frees the resources; repeating it changes nothing.

    ### Flow: Book a resource

    Search, check, hold, then confirm. Only the hold secures capacity: search
    and check are advisory and can be stale the instant they answer.

    ```mermaid
    sequenceDiagram
        participant Client
        participant AllocationService
        participant HoldService
        participant ReservationService
        participant Webhooks
        Client->>+AllocationService: SearchAvailability
        AllocationService-->>-Client: SearchAvailabilityResponse
        Client->>+AllocationService: CheckAvailability
        Note over Client,AllocationService: advisory only
        AllocationService-->>-Client: CheckAvailabilityResponse
        Note right of Client: CreateHold is idempotent on hold_id / idempotency_key, so a retry is safe
        alt enough capacity
            Client->>+HoldService: CreateHold
            HoldService-->>-Client: Hold (ACTIVE)
            alt hold still ACTIVE
                Client->>+ReservationService: CreateReservation
                Note over Client,ReservationService: the hold becomes CONVERTED
                ReservationService-->>-Client: Reservation (CONFIRMED)
                ReservationService-)Webhooks: freebusy.reservation.confirmed
            else hold expired or released
                Client->>+ReservationService: CreateReservation
                ReservationService--x-Client: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
            end
        else capacity taken
            Client->>+HoldService: CreateHold
            HoldService--x-Client: FAILED_PRECONDITION (CAPACITY_EXHAUSTED)
        end
    ```
