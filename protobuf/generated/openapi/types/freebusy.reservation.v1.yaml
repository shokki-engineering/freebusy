tags:
- description: |-
    ReservationService turns holds into confirmed bookings, updates and cancels
    them.

    It is where HoldService's conversion is driven from: a hold is never
    converted by a caller reaching into HoldService, only by a reservation being
    made of it. UpdateReservation changes only what the engine does not own --
    the customer and the attributes. The window and resources are the hold's,
    and changing either is a new hold and a new reservation, which is exactly
    what RescheduleReservation does.

    ### Flow: Reschedule a reservation

    Moves a booking onto a new hold. The original keeps its resources until
    the replacement is confirmed, so a failure part-way leaves the old
    booking in place.

    ```mermaid
    sequenceDiagram
        participant Client
        participant ReservationService
        participant HoldService
        participant Webhooks
        Client->>+ReservationService: GetReservation
        ReservationService-->>-Client: Reservation (CONFIRMED)
        Client->>+HoldService: CreateHold
        Note over Client,HoldService: hold.replaces = the reservation's hold
        HoldService-->>-Client: Hold (ACTIVE)
        Note right of Client: the original goes RESCHEDULING and keeps its resources meanwhile
        alt new hold still active
            Client->>+ReservationService: RescheduleReservation
            Note over Client,ReservationService: original becomes RESCHEDULED
            ReservationService-->>-Client: replacement Reservation (CONFIRMED)
            ReservationService-)Webhooks: freebusy.reservation.rescheduled
        else new hold lapsed
            Client->>+ReservationService: RescheduleReservation
            Note over Client,ReservationService: original back to CONFIRMED
            ReservationService--x-Client: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
        end
    ```

    ### Flow: Cancel a reservation

    Cancelling frees the resources; repeating it changes nothing.

    ```mermaid
    sequenceDiagram
        participant Client
        participant ReservationService
        participant Webhooks
        Client->>+ReservationService: CancelReservation
        Note over Client,ReservationService: CONFIRMED -> CANCELLING -> CANCELLED
        ReservationService-->>-Client: Reservation (CANCELLED)
        ReservationService-)Webhooks: freebusy.reservation.cancelled
        Client->>+ReservationService: CancelReservation
        Note over Client,ReservationService: idempotent#59; no second event
        ReservationService-->>-Client: Reservation (CANCELLED)
    ```
