components:
  schemas:
    freebusy.reservation.v1.CancelReservationRequest:
      description: Request message for ReservationService.CancelReservation.
      properties:
        etag:
          description: |-
            Opaque version read from the reservation; the cancel is rejected if it
            changed since (AIP-154).
          type: string
        name:
          description: 'Format: reservations/{reservation}'
          type: string
        reason:
          description: Why, in the canceller's words. Recorded, never parsed.
          type: string
      type: object
    freebusy.reservation.v1.CreateReservationRequest:
      description: |-
        Request message for ReservationService.CreateReservation, AIP-133.

        Safe to retry without an idempotency key of its own: a hold can back only
        one reservation, so a retry -- with or without reservation_id -- finds the
        reservation the first attempt made instead of making a second.
      properties:
        reservation:
          description: |-
            The reservation to make. `hold` is required; `customer` and `attributes`
            are optional.
          properties:
            attributes:
              description: |-
                Whatever a vertical needs to keep with the reservation: a party size, a
                payment reference, a licence plate. Opaque to the engine.
              type: object
              x-kubernetes-preserve-unknown-fields: true
            cancelReason:
              description: Why it was cancelled, in the canceller's words. Set by
                CancelReservation.
              type: string
            cancelTime:
              description: When it was cancelled.
              format: date-time
              type: string
            confirmTime:
              description: When it was confirmed.
              format: date-time
              type: string
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            customer:
              description: |-
                Who the reservation is for, by name in the user service. freebusy does
                not keep users: when a resolver for the type is registered (config
                `reference_services`) a create or update checks the name with that service, and a deleted user leaves the
                reservation as it is.
                Format: users/{user}
              type: string
            endTime:
              description: End of the reserved window, exclusive, copied from the
                hold.
              format: date-time
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154); echo
                on cancel.
              type: string
            hold:
              description: |-
                The hold this reservation was made from.
                Format: holds/{hold}
              type: string
            lastChange:
              description: |-
                What the last write to this reservation changed. A webhook is sent
                freebusy.reservation.updated exactly when it is CHANGE_DETAILS, and the
                event of the new state otherwise.
              enum:
              - CHANGE_UNSPECIFIED
              - CHANGE_STATE
              - CHANGE_DETAILS
              type: string
            name:
              description: |-
                The reservation name. Its id is the caller's reservation_id, or else the
                id of the hold it was made from.
                Format: reservations/{reservation}
              type: string
            replacement:
              description: |-
                The reservation replacing this one, set when RescheduleReservation began.
                Format: reservations/{reservation}
              type: string
            replaces:
              description: |-
                The reservation this one replaced, set when it was made by
                RescheduleReservation.
                Format: reservations/{reservation}
              type: string
            resources:
              description: |-
                The resources taken, copied from the hold.
                Format: resources/{resource}
              items:
                type: string
              type: array
            startTime:
              description: Start of the reserved window, copied from the hold.
              format: date-time
              type: string
            state:
              description: Lifecycle state.
              enum:
              - RESERVATION_STATE_UNSPECIFIED
              - RESERVATION_STATE_PENDING
              - RESERVATION_STATE_CONFIRMED
              - RESERVATION_STATE_CANCELLING
              - RESERVATION_STATE_CANCELLED
              - RESERVATION_STATE_FAILED
              - RESERVATION_STATE_RESCHEDULING
              - RESERVATION_STATE_RESCHEDULED
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
          type: object
        reservationId:
          description: |-
            Client-assigned id, becoming the last segment of the reservation name.
            Defaults to the hold's id. A hold backs at most one reservation whatever
            its id, so naming a hold that already has one returns that reservation.
          type: string
      type: object
    freebusy.reservation.v1.ErrorReason:
      description: |-
        The reasons freebusy returns for reservations: the google.rpc.ErrorInfo
        reasons (AIP-193) in the freebusy.dev domain. They are part of the API:
        clients branch on them, never on a message. protoc-gen-service renders them as
        Go constants, sentinels and the tables of docs/errors.md.
      enum:
      - ERROR_REASON_UNSPECIFIED
      - ERROR_REASON_HOLD_NOT_FOUND
      - ERROR_REASON_HOLD_LAPSED
      - ERROR_REASON_RESERVATION_ID_TAKEN
      - ERROR_REASON_RESERVATION_FAILED
      - ERROR_REASON_RESERVATION_MOVED
      - ERROR_REASON_RESERVATION_NOT_CONFIRMED
      - ERROR_REASON_RESCHEDULE_IN_PROGRESS
      - ERROR_REASON_SAME_HOLD
      - ERROR_REASON_REPLACEMENT_FAILED
      - ERROR_REASON_HOLD_FOR_RESCHEDULE
      type: string
    freebusy.reservation.v1.GetReservationRequest:
      description: Request message for ReservationService.GetReservation, AIP-131.
      properties:
        name:
          description: 'Format: reservations/{reservation}'
          type: string
      type: object
    freebusy.reservation.v1.ListReservationsRequest:
      description: Request message for ReservationService.ListReservations, AIP-132.
      properties:
        filter:
          description: |-
            Filter expression, AIP-160, e.g.
            `state = RESERVATION_STATE_CONFIRMED AND start_time >= "2026-11-10T00:00:00Z"`.
          type: string
        orderBy:
          description: Ordering, AIP-132, e.g. `start_time desc`.
          type: string
        pageSize:
          description: Maximum reservations to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListReservationsResponse.next_page_token.
          type: string
      type: object
    freebusy.reservation.v1.ListReservationsResponse:
      description: Response message for ReservationService.ListReservations, AIP-132.
      properties:
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
        reservations:
          description: The reservations on this page.
          items:
            description: |-
              A Reservation is a confirmed booking: a hold made permanent.

              It is the last step of booking, not the first. The caller checks
              availability, takes a hold, settles whatever its vertical needs settled --
              payment, a guest list, a waiver -- and then creates a reservation from the
              hold. The reservation records the outcome; the engine already holds the
              resources.

              Deliberately thin. Price, discount, promo code, refund, guests and occupancy
              are what would tie it to one vertical, and none of them is here: money belongs to the payment service and people to the user
              service, both referenced by name (AIP-215), and anything else a vertical
              needs to remember rides in `attributes`.
            properties:
              attributes:
                description: |-
