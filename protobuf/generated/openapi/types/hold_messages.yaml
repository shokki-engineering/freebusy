components:
  schemas:
    freebusy.allocation.v1.CreateHoldRequest:
      description: Request message for HoldService.CreateHold, AIP-133.
      properties:
        hold:
          description: The hold to take. Its window is required; quantity defaults
            to 1 and candidate_resources empty offers every resource the site holds.
            Supply idempotency_key to make a retry safe.
          properties:
            candidateResources:
              description: 'Candidate resources the allocator may choose from, supplied
                on create. Empty offers every resource the site holds. Immutable:
                the choice is made once, and re-offering a different set is a different
                allocation. Format: resources/{resource}'
              items:
                type: string
              type: array
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154); echo
                on update/delete.
              type: string
            expireTime:
              description: When the hold lapses if nothing confirms it. Extend it
                with ExtendHold; past this instant the hold no longer reserves anything,
                whether or not the sweeper has yet marked it EXPIRED.
              format: date-time
              type: string
            idempotencyKey:
              description: Caller-supplied key making CreateHold safe to retry. A
                repeat with the same key returns the original hold rather than taking
                a second one.
              type: string
            name:
              description: 'The hold name. Nested under the site whose resources it
                takes, so a hold is listed and swept per site without joining through
                every resource. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
              type: string
            quantity:
              description: How many resources to take, supplied on create; defaults
                to 1. Once the hold is ACTIVE this equals the length of `resources`.
              format: int32
              type: integer
            resources:
              description: 'The concrete resources this hold has taken, one per unit
                of `quantity`. Chosen by the server from the candidates the request
                offered. Format: resources/{resource}'
              items:
                type: string
              type: array
            state:
              description: Lifecycle state. New holds start ACTIVE.
              enum:
              - HOLD_STATE_UNSPECIFIED
              - HOLD_STATE_ACTIVE
              - HOLD_STATE_RELEASED
              - HOLD_STATE_EXPIRED
              - HOLD_STATE_CONVERTED
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
            window:
              description: 'The window held. Immutable: moving it is a different allocation,
                so release this hold and take another.'
              properties:
                endTime:
                  description: Optional. Exclusive end of the interval.
                  format: date-time
                  type: string
                startTime:
                  description: Optional. Inclusive start of the interval.
                  format: date-time
                  type: string
              type: object
          type: object
        holdId:
          description: Client-assigned id, becoming the last segment of the hold name.
            The server generates one when empty.
          type: string
        parent:
          description: 'The site whose resources may be taken. Format: organizationalUnits/{organizational_unit}'
          type: string
      type: object
    freebusy.allocation.v1.DeleteHoldRequest:
      description: Request message for HoldService.DeleteHold, AIP-135.
      properties:
        etag:
          description: Opaque version read from the hold; the delete is rejected if
            the hold changed since (AIP-154).
          type: string
        name:
          description: 'Name of the hold to delete. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
      type: object
    freebusy.allocation.v1.ExtendHoldRequest:
      description: Request message for HoldService.ExtendHold.
      properties:
        duration:
          description: How much further out to push expire_time, measured from now
            rather than from the current deadline, so repeated extensions cannot accumulate.
          type: string
        etag:
          description: Opaque version read from the hold; the extension is rejected
            if the hold changed since (AIP-154).
          type: string
        name:
          description: 'Name of the hold to extend. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
      type: object
    freebusy.allocation.v1.GetHoldRequest:
      description: Request message for HoldService.GetHold, AIP-131.
      properties:
        name:
          description: 'Name of the hold to retrieve. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
      type: object
    freebusy.allocation.v1.ListHoldsRequest:
      description: Request message for HoldService.ListHolds, AIP-132.
      properties:
        filter:
          description: Filter expression, AIP-160, over the hold's own fields, e.g.
            `state=HOLD_STATE_ACTIVE`.
          type: string
        pageSize:
          description: Maximum holds to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListHoldsResponse.next_page_token.
          type: string
        parent:
          description: 'The site whose holds to list. Format: organizationalUnits/{organizational_unit}'
          type: string
      type: object
    freebusy.allocation.v1.ListHoldsResponse:
      description: Response message for HoldService.ListHolds, AIP-132.
      properties:
        holds:
          description: The holds on this page.
          items:
            description: A Hold is a temporary, expiring claim on one or more bookable
              resources for a window, taken before payment or confirmation so two
              callers cannot be sold the same thing.
            properties:
              candidateResources:
                description: 'Candidate resources the allocator may choose from, supplied
                  on create. Empty offers every resource the site holds. Immutable:
                  the choice is made once, and re-offering a different set is a different
                  allocation. Format: resources/{resource}'
                items:
                  type: string
                type: array
              createTime:
                description: Creation timestamp.
                format: date-time
                type: string
              etag:
                description: Opaque version for optimistic concurrency (AIP-154);
                  echo on update/delete.
                type: string
              expireTime:
                description: When the hold lapses if nothing confirms it. Extend it
                  with ExtendHold; past this instant the hold no longer reserves anything,
                  whether or not the sweeper has yet marked it EXPIRED.
                format: date-time
                type: string
              idempotencyKey:
                description: Caller-supplied key making CreateHold safe to retry.
                  A repeat with the same key returns the original hold rather than
                  taking a second one.
                type: string
              name:
                description: 'The hold name. Nested under the site whose resources
                  it takes, so a hold is listed and swept per site without joining
                  through every resource. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
                type: string
              quantity:
                description: How many resources to take, supplied on create; defaults
                  to 1. Once the hold is ACTIVE this equals the length of `resources`.
                format: int32
                type: integer
              resources:
                description: 'The concrete resources this hold has taken, one per
                  unit of `quantity`. Chosen by the server from the candidates the
                  request offered. Format: resources/{resource}'
                items:
                  type: string
                type: array
              state:
                description: Lifecycle state. New holds start ACTIVE.
                enum:
                - HOLD_STATE_UNSPECIFIED
                - HOLD_STATE_ACTIVE
                - HOLD_STATE_RELEASED
                - HOLD_STATE_EXPIRED
                - HOLD_STATE_CONVERTED
                type: string
              updateTime:
                description: Last-modification timestamp.
                format: date-time
                type: string
              window:
                description: 'The window held. Immutable: moving it is a different
                  allocation, so release this hold and take another.'
                properties:
                  endTime:
                    description: Optional. Exclusive end of the interval.
                    format: date-time
                    type: string
                  startTime:
                    description: Optional. Inclusive start of the interval.
                    format: date-time
                    type: string
                type: object
            type: object
          type: array
        nextPageToken:
          description: Token for the next page, empty when this is the last page.
          type: string
      type: object
    freebusy.allocation.v1.ReleaseHoldRequest:
      description: Request message for HoldService.ReleaseHold.
      properties:
        etag:
          description: Opaque version read from the hold; the release is rejected
            if the hold changed since (AIP-154).
          type: string
        name:
          description: 'Name of the hold to release. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
      type: object
info:
  title: OpenAPI Spec for Solo APIs.
  version: v1
