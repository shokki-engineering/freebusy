components:
  schemas:
    freebusy.allocation.v1.Allocation:
      description: 'An Allocation is one resource taken by one hold for one span:
        the row the engine counts when it asks what is already claimed.'
      properties:
        createTime:
          description: Creation timestamp.
          format: date-time
          type: string
        endTime:
          description: End of the span taken, exclusive. A copy of the hold's window
            end.
          format: date-time
          type: string
        expireTime:
          description: When this claim stops counting. A copy of the hold's expire_time
            while it is ACTIVE; set to the release instant on release; unset once
            the hold is CONVERTED, which is the one outcome that keeps the resource
            taken. Always the server's to write, never a caller's.
          format: date-time
          type: string
        hold:
          description: 'The hold that took it. Deleting the hold deletes its allocations
            with it. Format: organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
        name:
          description: 'The allocation name, under the site whose resource it takes.
            Format: organizationalUnits/{organizational_unit}/allocations/{allocation}'
          type: string
        resource:
          description: 'The resource taken. Format: resources/{resource}'
          type: string
        startTime:
          description: Start of the span taken, inclusive. A copy of the hold's window
            start.
          format: date-time
          type: string
      type: object
    freebusy.allocation.v1.AvailabilityBucket:
      description: 'One slice of an availability answer: how many resources are free
        across a span, and which ones.'
      properties:
        freeCount:
          description: How many candidate resources are free across the whole span.
          format: int32
          type: integer
        freeResources:
          description: 'Which resources are free, when the request asked for them.
            Omitted by default: a car park with 200 bays would otherwise repeat 200
            names in every bucket of every day. Format: resources/{resource}'
          items:
            type: string
          type: array
        totalCount:
          description: How many candidates were considered. `free_count` out of this
            is the "5 of 12 free" a caller renders.
          format: int32
          type: integer
        window:
          description: 'The span this bucket covers: one slot, or one calendar day
            in the target time zone, per the request''s granularity.'
          properties:
            endTime:
              description: Optional. Exclusive end of the interval.
              format: date-time
              type: string
            startTime:
              description: Optional. Inclusive start of the interval.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.AvailabilityMatch:
      description: One resource that satisfies a search, with the window it is free
        for.
      properties:
        organizationalUnit:
          description: 'The site it belongs to. Format: organizationalUnits/{organizational_unit}'
          type: string
        resource:
          description: 'The free resource. Format: resources/{resource}'
          type: string
        resourceTypes:
          description: RESOURCE-TYPE values carried by the resource, RFC 9073 section
            6.3, echoed so a caller can group results without re-fetching each resource.
          items:
            type: string
          type: array
        window:
          description: The span it is free for, which may be narrower than the searched
            window.
          properties:
            endTime:
              description: Optional. Exclusive end of the interval.
              format: date-time
              type: string
            startTime:
              description: Optional. Inclusive start of the interval.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.Hold:
      description: A Hold is a temporary, expiring claim on one or more bookable resources
        for a window, taken before payment or confirmation so two callers cannot be
        sold the same thing.
      properties:
        candidateResources:
          description: 'Candidate resources the allocator may choose from, supplied
            on create. Empty offers every resource the site holds. Immutable: the
            choice is made once, and re-offering a different set is a different allocation.
            Format: resources/{resource}'
          items:
            type: string
          type: array
        createTime:
          description: Creation timestamp.
          format: date-time
          type: string
        etag:
          description: Opaque version for optimistic concurrency (AIP-154); echo on
            update/delete.
          type: string
        expireTime:
          description: When the hold lapses if nothing confirms it. Extend it with
            ExtendHold; past this instant the hold no longer reserves anything, whether
            or not the sweeper has yet marked it EXPIRED.
          format: date-time
          type: string
        idempotencyKey:
          description: Caller-supplied key making CreateHold safe to retry. A repeat
            with the same key returns the original hold rather than taking a second
            one.
          type: string
        name:
          description: 'The hold name. Nested under the site whose resources it takes,
            so a hold is listed and swept per site without joining through every resource.
            Format: organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
        quantity:
          description: How many resources to take, supplied on create; defaults to
            1. Once the hold is ACTIVE this equals the length of `resources`.
          format: int32
          type: integer
        resources:
          description: 'The concrete resources this hold has taken, one per unit of
            `quantity`. Chosen by the server from the candidates the request offered.
            Format: resources/{resource}'
          items:
            type: string
          type: array
        state:
          description: Lifecycle state. New holds start ACTIVE.
          enum:
          - HOLD_STATE_UNSPECIFIED
          - HOLD_STATE_ACTIVE
          - HOLD_STATE_RELEASED
          - HOLD_STATE_EXPIRED
          - HOLD_STATE_CONVERTED
          type: string
        updateTime:
          description: Last-modification timestamp.
          format: date-time
          type: string
        window:
          description: 'The window held. Immutable: moving it is a different allocation,
            so release this hold and take another.'
          properties:
            endTime:
              description: Optional. Exclusive end of the interval.
              format: date-time
              type: string
            startTime:
              description: Optional. Inclusive start of the interval.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.allocation.v1.UnbookableReason:
      description: Why a requested window is not bookable.
      properties:
        code:
          description: What went wrong, as a code a caller can branch on.
          enum:
          - UNBOOKABLE_REASON_CODE_UNSPECIFIED
          - UNBOOKABLE_REASON_CODE_NO_CAPACITY
          - UNBOOKABLE_REASON_CODE_OUTSIDE_AVAILABILITY
          - UNBOOKABLE_REASON_CODE_HELD
          - UNBOOKABLE_REASON_CODE_BOOKED
          - UNBOOKABLE_REASON_CODE_WINDOW_TOO_SHORT
          - UNBOOKABLE_REASON_CODE_WINDOW_TOO_LONG
          - UNBOOKABLE_REASON_CODE_LEAD_TIME
          - UNBOOKABLE_REASON_CODE_RESOURCE_INACTIVE
          type: string
        message:
          description: Human-readable detail for logs and support, not for parsing.
          type: string
        resource:
          description: 'The resource this reason is about, when it concerns one in
            particular. Format: resources/{resource}'
          type: string
      type: object
info:
  title: OpenAPI Spec for Solo APIs.
  version: v1
openapi: 3.0.1
paths: null
