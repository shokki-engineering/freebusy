components:
  schemas:
    freebusy.guest.v1.AgeGroup:
      description: Which age bracket a guest falls in. Drives occupancy counting and
        child pricing; may be given explicitly or derived from date_of_birth.
      enum:
      - AGE_GROUP_UNSPECIFIED
      - AGE_GROUP_ADULT
      - AGE_GROUP_CHILD
      - AGE_GROUP_INFANT
      type: string
    freebusy.guest.v1.BedPreference:
      description: A guest's bed-type preference for room assignment.
      enum:
      - BED_PREFERENCE_UNSPECIFIED
      - BED_PREFERENCE_NO_PREFERENCE
      - BED_PREFERENCE_KING
      - BED_PREFERENCE_QUEEN
      - BED_PREFERENCE_TWIN
      - BED_PREFERENCE_SINGLE
      type: string
    freebusy.guest.v1.Gender:
      description: A guest's gender, as recorded on a registration card.
      enum:
      - GENDER_UNSPECIFIED
      - GENDER_MALE
      - GENDER_FEMALE
      - GENDER_OTHER
      - GENDER_UNDISCLOSED
      type: string
    freebusy.guest.v1.IdDocumentType:
      description: The kind of government identity document a guest presents at check-in.
      enum:
      - ID_DOCUMENT_TYPE_UNSPECIFIED
      - ID_DOCUMENT_TYPE_PASSPORT
      - ID_DOCUMENT_TYPE_NATIONAL_ID
      - ID_DOCUMENT_TYPE_DRIVING_LICENSE
      - ID_DOCUMENT_TYPE_AADHAAR
      - ID_DOCUMENT_TYPE_VOTER_ID
      - ID_DOCUMENT_TYPE_OTHER
      type: string
    freebusy.guest.v1.SmokingPreference:
      description: A guest's smoking preference for room assignment.
      enum:
      - SMOKING_PREFERENCE_UNSPECIFIED
      - SMOKING_PREFERENCE_NON_SMOKING
      - SMOKING_PREFERENCE_SMOKING
      type: string
info:
  title: OpenAPI Spec for Solo APIs.
  version: v1
openapi: 3.0.1
paths: null
