components:
  schemas:
    freebusy.reservation.v1.Reservation:
      description: 'A Reservation is a confirmed booking: a hold made permanent.'
      properties:
        attributes:
          description: 'Whatever a vertical needs to keep with the reservation: a
            party size, a payment reference, a licence plate. Opaque to the engine.'
          type: object
          x-kubernetes-preserve-unknown-fields: true
        cancelReason:
          description: Why it was cancelled, in the canceller's words. Set by CancelReservation.
          type: string
        cancelTime:
          description: When it was cancelled.
          format: date-time
          type: string
        confirmTime:
          description: When it was confirmed.
          format: date-time
          type: string
        createTime:
          description: Creation timestamp.
          format: date-time
          type: string
        customer:
          description: 'Who the reservation is for, by name in the user service. Format:
            users/{user}'
          type: string
        endTime:
          description: End of the reserved window, exclusive, copied from the hold.
          format: date-time
          type: string
        etag:
          description: Opaque version for optimistic concurrency (AIP-154); echo on
            cancel.
          type: string
        hold:
          description: 'The hold this reservation was made from, at the same site.
            Format: organizationalUnits/{organizational_unit}/holds/{hold}'
          type: string
        name:
          description: 'The reservation name. Its id is the caller''s reservation_id,
            or else the id of the hold it was made from. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
          type: string
        replacement:
          description: 'The reservation replacing this one, set when RescheduleReservation
            began. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
          type: string
        replaces:
          description: 'The reservation this one replaced, set when it was made by
            RescheduleReservation. Format: organizationalUnits/{organizational_unit}/reservations/{reservation}'
          type: string
        resources:
          description: 'The resources taken, copied from the hold. Format: resources/{resource}'
          items:
            type: string
          type: array
        startTime:
          description: Start of the reserved window, copied from the hold.
          format: date-time
          type: string
        state:
          description: Lifecycle state.
          enum:
          - RESERVATION_STATE_UNSPECIFIED
          - RESERVATION_STATE_PENDING
          - RESERVATION_STATE_CONFIRMED
          - RESERVATION_STATE_CANCELLING
          - RESERVATION_STATE_CANCELLED
          - RESERVATION_STATE_FAILED
          - RESERVATION_STATE_RESCHEDULING
          - RESERVATION_STATE_RESCHEDULED
          type: string
        updateTime:
          description: Last-modification timestamp.
          format: date-time
          type: string
      type: object
info:
  title: OpenAPI Spec for Solo APIs.
  version: v1
openapi: 3.0.1
paths: null
