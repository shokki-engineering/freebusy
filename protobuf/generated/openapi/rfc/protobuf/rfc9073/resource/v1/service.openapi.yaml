            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StructuredData:
            type: object
            properties:
                text:
                    type: string
                    description: The data inline, as text.
                uri:
                    type: string
                    description: A URI the data lives at.
                binary:
                    type: string
                    description: |-
                        The data inline, as bytes. Section 6.6 carries this base64-encoded with
                         ENCODING=BASE64 on the wire; it is decoded here, because a protobuf
                         `bytes` field is already binary and re-encoding it would be a second
                         representation of the same thing.
                    format: bytes
                formatType:
                    type: string
                    description: |-
                        FMTTYPE parameter, RFC 5545 section 3.2.8 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.8>. The data's media type,
                         e.g. "application/ld+json".
                schema:
                    type: string
                    description: |-
                        SCHEMA parameter, RFC 9073 section 5.2 <https://www.rfc-editor.org/rfc/rfc9073.html#section-5.2>. A URI naming the schema the
                         data conforms to, e.g. "https://schema.org/Event". Without it the media
                         type alone rarely says enough to parse the payload.
            description: |-
                StructuredData is the STRUCTURED-DATA property, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>.

                 Machine-readable data attached to a resource, with a media type and a schema
                 URI saying how to read it. This is the RFC's own extension point: anything
                 the schema does not model rides here rather than forcing a new field.

                 A copy of `protobuf.rfc5545.event.v1.StructuredData`, not a reference to it.
                 AIP-215 <https://aip.dev/215> permits no cross-package message reference and rule 4 forbids a
                 shared wrapper package, so a value type used by two packages is defined in
                 each. The duplication is the documented cost of that rule; keep the two in
                 step when either changes.

                 Reference: RFC 9073 "Event Publishing Extensions to iCalendar", section 6.6.
                 https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6
        UndeleteResourceRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: Name of the soft-deleted resource to restore.
            description: Request message for Resources.UndeleteResource, AIP-164 <https://aip.dev/164>.
