            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        LatLng:
            type: object
            properties:
                latitude:
                    type: number
                    description: The latitude in degrees. It must be in the range [-90.0, +90.0].
                    format: double
                longitude:
                    type: number
                    description: The longitude in degrees. It must be in the range [-180.0, +180.0].
                    format: double
            description: |-
                An object that represents a latitude/longitude pair. This is expressed as a
                 pair of doubles to represent degrees latitude and degrees longitude. Unless
                 specified otherwise, this object must conform to the
                 <a href="https://en.wikipedia.org/wiki/World_Geodetic_System#1984_version">
                 WGS84 standard</a>. Values must be within normalized ranges.
        ListResourcesResponse:
            type: object
            properties:
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/Resource'
                    description: The resources on this page.
                nextPageToken:
                    type: string
                    description: Token for the next page, empty when this is the last page.
            description: Response message for Resources.ListResources, AIP-132 <https://aip.dev/132>.
        Resource:
            type: object
            properties:
                name:
                    type: string
                    description: Resource name, "resources/{resource}".
                uid:
                    readOnly: true
                    type: string
                    description: Server-assigned unique id.
                icalUid:
                    type: string
                    description: |-
                        UID, RFC 5545 section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. Required by RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>.

                         Interchange identity, distinct from uid above: it arrives inside an
                         imported .ics and must survive a round trip unchanged -- rule 9's
                         `<format>_uid` split, the same as Event.ical_uid.
                displayName:
                    type: string
                    description: |-
                        NAME, RFC 7986 section 5.2 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.2>. What to call this resource, e.g. "Bay
                         L2-014" or "Boardroom".

                         Named display_name, not name: AIP-122 <https://aip.dev/122> reserves `name` for the resource
                         identifier above.
                description:
                    type: string
                    description: DESCRIPTION, RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>.
                resourceTypes:
                    type: array
                    items:
                        type: string
                    description: |-
                        RESOURCE-TYPE, RFC 9073 section 6.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.3>, e.g. "projector", "room",
                         "remote-conference-audio". Free text: section 6.3 points at an IANA
                         registry rather than a closed list, so an enum here would reject values
                         the registry adds later.
                position:
                    allOf:
                        - $ref: '#/components/schemas/LatLng'
                    description: GEO, RFC 5545 section 3.8.1.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.6>. Where the resource is.
                structuredData:
                    type: array
                    items:
                        $ref: '#/components/schemas/StructuredData'
                    description: |-
                        STRUCTURED-DATA, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>. Anything this schema does
                         not model, carried with a SCHEMA URI naming what it conforms to.
                calendar:
                    type: string
                    description: |-
                        The calendar this resource's bookings are kept on.

                         Native: section 7.3 has no calendar property, because a VRESOURCE
                         published inside a VEVENT is already on the event's calendar. A
                         free-standing resource is not, and without this field nothing can ask
                         when it is busy -- RFC 5545 section 3.6.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.4>'s free/busy query is addressed
                         to a calendar. The field exists despite having no RFC property behind it,
                         because a resource no calendar holds cannot be booked.
                createTime:
                    readOnly: true
                    type: string
                    description: When the resource was created.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: When the resource was last modified.
                    format: date-time
                etag:
                    readOnly: true
                    type: string
                    description: |-
                        Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
                         update or delete to make the write conditional: if the resource changed
                         since it was read, the request fails instead of overwriting.
                deleteTime:
                    readOnly: true
                    type: string
                    description: When the resource was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
                    format: date-time
                expireTime:
                    readOnly: true
                    type: string
                    description: When a soft-deleted resource is purged for good. AIP-164 <https://aip.dev/164>.
                    format: date-time
            description: |-
                Resource is the VRESOURCE component, RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>.

                 Something bookable that is not a person and not a place: a projector, a
                 meeting room, a parking bay, a minibus. RFC 5545 section 3.8.1.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.10> had a
                 free-text RESOURCES property; section 7.3 is its structured replacement.

                 A resource of its own, where `protobuf.rfc5545.event.v1.Resource` is a value
                 object on an event. The two are the same component serving the two uses
                 section 7.3 describes: the value object says *this booking needs a room*,
                 and this says *here is the room*, addressable on its own so a catalogue can
                 be listed, amended and retired independently of any booking. That is the
                 test in `docs/adding-data.md` for a package rather than a field, and
                 rule 8's for full CRUD. Neither replaces the other and both stay.

                 A flat collection, "resources/{resource}": section 7.3 defines the
                 component's properties and says nothing about where it sits, so nesting it
                 under a calendar or anything else would assert a containment the RFC does
                 not require. Grouping resources -- by site, operator or tenant -- is the
                 consumer's, with whatever model it has for those.

                 Reference: RFC 9073 "Event Publishing Extensions to iCalendar", section 7.3.
                 https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3
