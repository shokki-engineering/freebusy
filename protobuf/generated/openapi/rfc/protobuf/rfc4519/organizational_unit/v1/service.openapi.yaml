                    type: array
                    items:
                        type: string
                    description: '''description'', section 2.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.5>.'
                businessCategories:
                    type: array
                    items:
                        type: string
                    description: '''businessCategory'', section 2.1 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.1>.'
                seeAlso:
                    type: array
                    items:
                        type: string
                    description: |-
                        'seeAlso', section 2.30 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.30>. Distinguished names of related entries, kept as
                         opaque strings: an LDAP DN is not a resource name and does not resolve
                         through this API.
                organization:
                    type: string
                    description: |-
                        The organization this unit belongs to.

                         Native: section 3.11's MAY list has no 'o' attribute, unlike groupOfNames
                         -- organizationalUnit's placement under an organization is a DIT
                         convention, not a schema attribute. Left unset, this resource is
                         undiscoverable from its organization, which defeats the reason for
                         building it (see the plan's "the one that makes the hierarchy real"),
                         so the field exists despite having no RFC attribute behind it.
                createTime:
                    readOnly: true
                    type: string
                    description: When the organizational unit was created.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: When the organizational unit was last modified.
                    format: date-time
                etag:
                    readOnly: true
                    type: string
                    description: |-
                        Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
                         update or delete to make the write conditional: if the resource changed
                         since it was read, the request fails instead of overwriting.
                deleteTime:
                    readOnly: true
                    type: string
                    description: When the organizational unit was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
                    format: date-time
                expireTime:
                    readOnly: true
                    type: string
                    description: When a soft-deleted organizational unit is purged for good. AIP-164 <https://aip.dev/164>.
                    format: date-time
            description: |-
                OrganizationalUnit is the LDAP 'organizationalUnit' object class, RFC 4519
                 section 3.11 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11>.

                 A flat resource, "organizationalUnits/{organizationalUnit}", not nested
                 under Organization: section 3.11 defines MUST and MAY attributes and says
                 nothing about DIT placement, so "organizations/{o}/organizationalUnits/{ou}"
                 would assert a hierarchy the RFC does not require. Group faced the same
                 question for its own optional 'o' reference and was built flat for the
                 same reason -- this resource follows that precedent instead of inventing a
                 new one.

                 Attributes are repeated because LDAP attribute types are multi-valued by
                 default. Section 3.11 lists twenty MAY attributes; the three modelled here
                 -- description, businessCategory, seeAlso -- are the ones Organization
                 already carries, kept identical rather than picking a different subset for
                 two object classes whose optional attributes overlap this heavily.

                 Reference: RFC 4519 "LDAP: Schema for User Applications", section 3.11.
                 https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11
