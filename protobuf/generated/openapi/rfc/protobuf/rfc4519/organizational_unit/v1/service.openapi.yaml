        OrganizationalUnit:
            required:
                - displayNames
            type: object
            properties:
                name:
                    type: string
                    description: Resource name, "organizationalUnits/{organizationalUnit}".
                uid:
                    readOnly: true
                    type: string
                    description: Server-assigned unique id.
                displayNames:
                    type: array
                    items:
                        type: string
                    description: '''ou'', section 2.20 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.20>. The only attribute section 3.11 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11> makes mandatory.'
