openapi: 3.0.3
info:
    title: Calendars API
    description: |-
        Calendars manages the collections that Events belong to, RFC 5545
         section 3.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.4>.

         Events are managed by protobuf.rfc5545.event.v1.Events, a separate service
         in its own package. Deleting a calendar therefore affects a resource this
         service cannot see, which is why DeleteCalendar requires force rather than
         cascading silently.

         AIP-131..135 also happens to cover most of CalDAV, RFC 4791: MKCALENDAR
         (section 5.3.1 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.3.1>) is CreateCalendar; the calendar-query REPORT's time-range
         filter (section 7.8 <https://www.rfc-editor.org/rfc/rfc4791.html#section-7.8>) is ListEvents' AIP-160 filter over start/end; and
         If-Match concurrency (section 5.3.4 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.3.4>) is the `etag` every resource already
         carries, AIP-154 <https://aip.dev/154>. QueryFreeBusy is the one CalDAV capability with no
         standard-method equivalent.
    version: 0.0.1
paths:
    /v1/calendars:
        get:
            tags:
                - Calendars
            description: |-
                Lists calendars.

                   GET /v1/calendars

                 Paginated per AIP-158: pass `page_size` (defaults to 50, capped at 1000)
                 and the `next_page_token` from the previous response. An empty
                 `next_page_token` means the last page. Page tokens are opaque and may
                 expire; do not construct or store them.

                 Filtering uses the AIP-160 expression language over the resource's own
                 fields. Results carry no guaranteed order.

                   INVALID_ARGUMENT   malformed filter, or page_size out of range
                   PERMISSION_DENIED  caller may not list this collection
            operationId: Calendars_ListCalendars
            parameters:
                - name: pageSize
                  in: query
                  description: Maximum calendars to return. Defaults to 50, capped at 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Page token from a previous ListCalendarsResponse.next_page_token.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: Filter expression, AIP-160 <https://aip.dev/160>.
                  schema:
                    type: string
                - name: showDeleted
                  in: query
                  description: Include soft-deleted calendars in the result. AIP-164 <https://aip.dev/164>.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListCalendarsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - Calendars
            description: |-
                Creates a calendar.

                   POST /v1/calendars
                   body: the calendar itself

                 Server-assigned fields on the request body are ignored: `name`, `uid`,
                 `etag` and the timestamps are set by the server regardless of what is
                 sent. Supply `calendar_id` to choose the final path segment; leave it empty
                 and the server generates one.

                 Not idempotent. Retrying after a timeout may create a second calendar;
                 supply `calendar_id` if the caller needs retry safety.

                   ALREADY_EXISTS     that calendar_id is taken
                   INVALID_ARGUMENT   a field violates its buf.validate constraint
                   PERMISSION_DENIED  caller may not create here
            operationId: Calendars_CreateCalendar
            parameters:
                - name: calendarId
                  in: query
                  description: |-
                    Client-assigned id, becoming the last segment of the resource name. The
                     server generates one when empty.
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Calendar'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Calendar'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/calendars/{calendar}:
        get:
            tags:
                - Calendars
            description: |-
                Retrieves one calendar.

                   GET /v1/{name=calendars/*}

                 Safe and idempotent. Returns the resource as stored; no field is computed
                 per-caller. Read the `etag` here and pass it back on update or delete to
                 make the write conditional.

                   NOT_FOUND          no such calendar, or it is soft-deleted and `show_deleted` was not set
                   INVALID_ARGUMENT   name does not match calendars/*
                   PERMISSION_DENIED  caller may not read it
            operationId: Calendars_GetCalendar
            parameters:
                - name: calendar
                  in: path
                  description: The calendar id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Calendar'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - Calendars
            description: |-
                Deletes a calendar.

                   DELETE /v1/{name=calendars/*}

                 Soft delete: the calendar is marked deleted, disappears from List unless
                 `show_deleted` is set, and is purged at `expire_time`. Recover it with
                 Undelete before then.

                 Idempotent in effect but not in reporting: a second delete returns
                 NOT_FOUND rather than succeeding silently.

                   NOT_FOUND          no such calendar
                   ABORTED            etag does not match
                   FAILED_PRECONDITION  it still has children and `force` was not set
                   PERMISSION_DENIED  caller may not delete it
            operationId: Calendars_DeleteCalendar
            parameters:
                - name: calendar
                  in: path
                  description: The calendar id.
                  required: true
                  schema:
                    type: string
                - name: force
                  in: query
                  description: |-
                    Delete the calendar's events along with it.

                     Required by AIP-135 <https://aip.dev/135> because Event is a child of Calendar. Without it the
                     request fails on a non-empty calendar, which is the safer default:
                     deleting a calendar silently destroying a year of events is not something
                     to do by omission.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - Calendars
            description: |-
                Updates a calendar.

                   PATCH /v1/{calendar.name=calendars/*}
                   body: the calendar itself

                 A partial update: only fields named in `update_mask` are written. An
                 empty mask writes every mutable field, which will clear anything the
                 caller left unset -- pass a mask unless that is the intent. OUTPUT_ONLY
                 and IMMUTABLE fields are rejected rather than silently dropped.

                 Idempotent. Pass the `etag` read from Get to make the write conditional.

                   NOT_FOUND          no such calendar
                   ABORTED            etag does not match the stored resource
                   INVALID_ARGUMENT   mask names an unknown or immutable field
                   PERMISSION_DENIED  caller may not modify it
            operationId: Calendars_UpdateCalendar
            parameters:
                - name: calendar
                  in: path
                  description: The calendar id.
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  description: Fields to update. An empty mask updates all mutable fields.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Calendar'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Calendar'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/calendars/{calendar}:query:
        post:
            tags:
                - Calendars
            description: |-
                Reports busy periods for a calendar over a time window, without
                 returning the events themselves, RFC 4791 section 7.10 <https://www.rfc-editor.org/rfc/rfc4791.html#section-7.10> (the
                 free-busy-query REPORT).

                   POST /v1/{name=calendars/*}:query
                   body: the whole request message

                 A custom method, not List with a projection: RFC 4791 grants
                 CALDAV:read-free-busy independently of read access to the events
                 themselves, section 6.1.1 <https://www.rfc-editor.org/rfc/rfc4791.html#section-6.1.1> -- a caller who may see only availability must
                 never be handed the underlying Event.

                   NOT_FOUND          no such calendar
                   INVALID_ARGUMENT   window.end_time is not after window.start_time
                   PERMISSION_DENIED  caller may not read free/busy for this calendar
            operationId: Calendars_QueryFreeBusy
            parameters:
                - name: calendar
                  in: path
                  description: The calendar id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/QueryFreeBusyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QueryFreeBusyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/calendars/{calendar}:undelete:
        post:
            tags:
                - Calendars
            description: |-
                Restores a soft-deleted calendar.

                   POST /v1/{name=calendars/*}:undelete

                 Valid only before `expire_time`; after that the calendar is gone and this
                 returns NOT_FOUND. Clears `delete_time` and `expire_time` and returns the
                 calendar as it was.

                   NOT_FOUND          no such calendar, or already purged
                   ALREADY_EXISTS     the calendar is not deleted
                   PERMISSION_DENIED  caller may not restore it
            operationId: Calendars_UndeleteCalendar
            parameters:
                - name: calendar
                  in: path
                  description: The calendar id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UndeleteCalendarRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Calendar'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        Calendar:
            required:
                - displayName
            type: object
            properties:
                name:
                    type: string
                    description: Resource name, "calendars/{calendar}".
                uid:
                    readOnly: true
                    type: string
                    description: Server-assigned unique id.
                displayName:
                    type: string
                    description: |-
                        NAME, RFC 7986 section 5.1 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.1>. RFC 5545 gives the calendar object no
                         human-readable name at all; 7986 added one because every client needed
                         to label a calendar in a list.

                         REQUIRED here is ours, not the RFC's: 7986 makes NAME optional, but a
                         calendar with no label is unusable in any list UI, so this API insists.
                description:
                    type: string
                    description: DESCRIPTION, RFC 7986 section 5.2 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.2>.
                scale:
                    type: integer
                    description: CALSCALE, section 3.7.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.1>.
                    format: enum
                timeZone:
                    allOf:
                        - $ref: '#/components/schemas/TimeZone'
                    description: |-
                        Default time zone for events that do not carry their own.

                         google.type.TimeZone rather than a bare string with a regex: it carries
                         the IANA database version alongside the id, and the same zone id can mean
                         different offsets across tzdata releases. Section 3.6.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.5> answers this
                         with an embedded VTIMEZONE component, which restates a database IANA
                         already publishes.
                etag:
                    readOnly: true
                    type: string
                    description: |-
                        Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
                         update or delete to make the write conditional: if the resource changed
                         since it was read, the request fails instead of overwriting.
                deleteTime:
                    readOnly: true
                    type: string
                    description: When the calendar was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
                    format: date-time
                expireTime:
                    readOnly: true
                    type: string
                    description: When a soft-deleted calendar is purged for good. AIP-164 <https://aip.dev/164>.
                    format: date-time
                createTime:
                    readOnly: true
                    type: string
                    description: When the calendar was created.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: When the calendar was last modified.
                    format: date-time
                extensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExtensionProperty'
                    description: |-
                        Properties this schema does not model, section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2>.
                         X-WR-CALNAME and friends live here.
                maxResourceSize:
                    readOnly: true
                    type: string
                    description: |-
                        CALDAV:max-resource-size, RFC 4791 section 5.2.5 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.5>. Largest calendar
                         object resource, in octets, the server accepts on this calendar.

                         This and the three fields after it are CalDAV per-collection limits,
                         RFC 4791 section 5.2 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2>. Server capability rather than calendar content,
                         which is why they waited: a consumer that enforces request bounds against
                         them now exists. Each is OUTPUT_ONLY because section 5.2 requires the
                         properties be protected -- a client reads them and obeys them, and a
                         PROPPATCH on one fails per section 5.2.10 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.10>. Unset means the server
                         declares no limit, which section 5.2 permits: every one of them is MAY.

                         int64 rather than int32: the value is a byte count with no ceiling in the
                         specification, and AIP-141 <https://aip.dev/141> rules out the unsigned types that would
                         otherwise cover the range.
                minDateTime:
                    readOnly: true
                    type: string
                    description: |-
                        CALDAV:min-date-time, RFC 4791 section 5.2.6 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.6>. Earliest DATE or
                         DATE-TIME the server accepts on this calendar, in UTC.
                    format: date-time
                maxDateTime:
                    readOnly: true
                    type: string
                    description: |-
                        CALDAV:max-date-time, RFC 4791 section 5.2.7 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.7>. Latest DATE or
                         DATE-TIME the server accepts on this calendar, in UTC.
                    format: date-time
                maxInstances:
                    readOnly: true
                    type: integer
                    description: |-
                        CALDAV:max-instances, RFC 4791 section 5.2.8 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.8>. Most recurrence
                         instances a single calendar object resource here may generate.
                    format: int32
                maxAttendeesPerInstance:
                    readOnly: true
                    type: integer
                    description: |-
                        CALDAV:max-attendees-per-instance, RFC 4791 section 5.2.9 <https://www.rfc-editor.org/rfc/rfc4791.html#section-5.2.9>. Most
                         ATTENDEE properties allowed in any one instance.
                    format: int32
            description: |-
                Calendar is the iCalendar object, RFC 5545 section 3.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.4>.

                 The collection an Event belongs to. Event's resource name is
                 "calendars/{calendar}/events/{event}", so this is the parent that name
                 refers to; without it every event would live under a collection nothing
                 could create or delete.

                 PRODID (section 3.7.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.3>) and VERSION (section 3.7.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.4>) are deliberately absent.
                 Both describe the iCalendar *stream* rather than the calendar -- which
                 product wrote the file, and which version of the format it used -- so they
                 belong to the codec that produces the stream, not to a stored resource.

                 Reference: RFC 5545 "Internet Calendaring and Scheduling Core Object Specification (iCalendar)", section 3.4.
                 https://www.rfc-editor.org/rfc/rfc5545.html#section-3.4
        ExtensionProperty:
            required:
                - key
            type: object
            properties:
                key:
                    type: string
                    description: |-
                        The property name: an IANA-registered token or an X- name, e.g.
                         "X-WR-CALNAME". Not called `name`, which would make api-linter treat this
                         message as a resource.
                values:
                    type: array
                    items:
                        type: string
                    description: |-
                        The property's values, one entry per comma-separated component. The
                         schema cannot know the structure of a property it does not model, so
                         these stay unparsed.
                parameters:
                    type: object
                    additionalProperties:
                        type: string
                    description: 'Property parameters, section 3.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2>, e.g. {"TZID": "Europe/London"}.'
            description: |-
                CalendarScale is the CALSCALE property, RFC 5545 section 3.7.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.7.1>.

                 ExtensionProperty carries an iCalendar property this schema does not model.

                 Not a hole punched in a typed schema: RFC 5545 section 3.8.8.1 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.1> reserves
                 IANA-registered properties and section 3.8.8.2 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2> non-standard X- properties,
                 and requires that applications ignore what they do not recognise rather than
                 reject it. A calendar that round-trips without them is lossy by
                 construction.

                 It is also what keeps the modelled properties honest. Anything the schema
                 has not earned a typed field for survives here instead of forcing a
                 speculative field table, and a property graduates out of this message when a
                 consumer needs to query it.

                 Reference: RFC 5545 "Internet Calendaring and Scheduling Core Object Specification (iCalendar)", section 3.8.8.2.
                 https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.8.2
        FreeBusyPeriod:
            type: object
            properties:
                period:
                    allOf:
                        - $ref: '#/components/schemas/Interval'
                    description: |-
                        The interval, half-open: busy_type applies from `start_time` up to but
                         not including `end_time`.
                busyType:
                    type: integer
                    description: Why the interval is reported busy.
                    format: enum
            description: |-
                FreeBusyPeriod is one interval from a free/busy query result, structurally
                 what the FREEBUSY property, RFC 5545 section 3.8.4.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3>, carries -- but
                 computed on demand from stored events, not itself stored. VFREEBUSY
                 (section 3.6.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.4>) has no existence independent of the events it
                 summarises, so this schema gives it no resource, only this query result.

                 Reference: RFC 5545 "Internet Calendaring and Scheduling Core Object Specification (iCalendar)", section 3.8.4.3.
                 https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        Interval:
            type: object
            properties:
                startTime:
                    type: string
                    description: |-
                        Optional. Inclusive start of the interval.

                         If specified, a Timestamp matching this interval will have to be the same
                         or after the start.
                    format: date-time
                endTime:
                    type: string
                    description: |-
                        Optional. Exclusive end of the interval.

                         If specified, a Timestamp matching this interval will have to be before the
                         end.
                    format: date-time
            description: |-
                Represents a time interval, encoded as a Timestamp start (inclusive) and a
                 Timestamp end (exclusive).

                 The start must be less than or equal to the end.
                 When the start equals the end, the interval is empty (matches no time).
                 When both start and end are unspecified, the interval matches any time.
        ListCalendarsResponse:
            type: object
            properties:
                calendars:
                    type: array
                    items:
                        $ref: '#/components/schemas/Calendar'
                    description: The calendars on this page.
                nextPageToken:
                    type: string
                    description: Token for the next page, empty when this is the last page.
            description: Response message for Calendars.ListCalendars, AIP-132 <https://aip.dev/132>.
        QueryFreeBusyRequest:
            required:
                - name
                - window
            type: object
            properties:
                name:
                    type: string
                    description: The calendar to query, "calendars/{calendar}".
                window:
                    allOf:
                        - $ref: '#/components/schemas/Interval'
                    description: |-
                        The window to report busy periods within. Required, and both bounds with
                         it, for the same reason as ExpandEventRequest.window: an open-ended query
                         over every event ever scheduled has no sensible default.
            description: |-
                Request message for Calendars.QueryFreeBusy, RFC 4791 section 7.10 <https://www.rfc-editor.org/rfc/rfc4791.html#section-7.10> (the
                 free-busy-query REPORT).
        QueryFreeBusyResponse:
            type: object
            properties:
                periods:
                    type: array
                    items:
                        $ref: '#/components/schemas/FreeBusyPeriod'
                    description: |-
                        The busy periods found within the requested window. Free time is not
                         listed; its absence from this result is what "free" means.
            description: Response message for Calendars.QueryFreeBusy.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        TimeZone:
            type: object
            properties:
                id:
                    type: string
                    description: IANA Time Zone Database time zone. For example "America/New_York".
                version:
                    type: string
                    description: Optional. IANA Time Zone Database version number. For example "2019a".
            description: |-
                Represents a time zone from the
                 [IANA Time Zone Database](https://www.iana.org/time-zones).
        UndeleteCalendarRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: Name of the soft-deleted calendar to restore.
            description: Request message for Calendars.UndeleteCalendar, AIP-164 <https://aip.dev/164>.
tags:
    - name: Calendars
