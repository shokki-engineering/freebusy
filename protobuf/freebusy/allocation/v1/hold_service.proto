syntax = "proto3";

package freebusy.allocation.v1;

import "freebusy/allocation/v1/allocation.proto";
import "freebusy/allocation/v1/hold_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "mcp/v1/annotations.proto";
import "service/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/freebusy/protobuf/generated/go/allocation/v1/allocationpbv1;allocationpbv1";
option java_multiple_files = true;
option java_outer_classname = "HoldServiceProto";
option java_package = "engineering.shokki.freebusy.allocation.v1";

// HoldService takes and releases expiring claims on resources. It is the only
// thing in this API that mutates availability.
//
// Two things are deliberately not RPCs: the sweeper that expires lapsed holds
// is an internal job, not a call, and conversion to a confirmed booking is
// driven by ReservationService, so a hold is never converted by a caller
// reaching in here.
//
// There is no UpdateHold. A hold's window and resources are immutable by
// construction -- changing either is a different allocation -- so the only
// mutations are the two custom methods below.
service HoldService {
  option (google.api.default_host) = "freebusy.shokki.engineering";
  // Hand-written, not generated: every method here runs the engine. Even
  // GetHold and ListHolds are authoritative reads that expire a lapsed hold
  // as they find it, which no generated standard method does.
  option (service.v1.service) = {skip: true};
  option (mcp.v1.service) = {
    app: {
      display_name: "Resource Holds"
      version: "1.0.0"
      description: "Take, extend and release temporary claims on bookable resources."
    }
  };

  // Takes a hold, allocating concrete resources for the window.
  //
  // The server chooses which resources are taken from the candidates offered,
  // under a lock, so two callers racing for the last bay cannot both win.
  // Requires an idempotency key: a retry after a timeout returns the original
  // hold rather than taking a second one.
  rpc CreateHold(CreateHoldRequest) returns (Hold) {
    option (google.api.http) = {
      post: "/v1/holds"
      body: "hold"
    };
    option (google.api.method_signature) = "hold,hold_id";
    option (mcp.v1.tool) = {
      description:
        "Claim resources for a window while the booking is settled (payment, "
        "forms): the second step of booking. hold.window: start_time and "
        "end_time, RFC 3339. hold.quantity defaults to 1; freebusy picks which "
        "resources, from hold.candidate_resources and hold.candidate_filter if "
        "given. Set hold.idempotency_key so a retry "
        "returns the same hold. The hold lasts 15 minutes (expire_time): confirm "
        "it with reservation_service-create_reservation_v1 before then, or hold_service-extend_hold_v1. Fails with "
        "CAPACITY_EXHAUSTED when too few are free. To move or extend a booking, "
        "set hold.replaces to its reservation's hold: the booking's own time then "
        "does not count against the new hold, so it can keep the same resources; "
        "pass the new hold to reservation_service-reschedule_reservation_v1."
    };
  }

  // Retrieves one hold.
  //
  // Authoritative on expiry: a hold whose expire_time has passed is reported
  // EXPIRED here even if the sweeper has not yet written that state, so a
  // caller never sees an ACTIVE hold that no longer reserves anything.
  rpc GetHold(GetHoldRequest) returns (Hold) {
    option (google.api.http) = {get: "/v1/{name=holds/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists holds.
  rpc ListHolds(ListHoldsRequest) returns (ListHoldsResponse) {
    option (google.api.http) = {get: "/v1/holds"};
    option (google.api.method_signature) = "";
  }

  // Pushes a hold's expiry further out.
  //
  // Measured from now rather than from the current deadline, so repeated calls
  // cannot accumulate an unbounded reservation. Fails on a hold that is not
  // ACTIVE -- an expired hold is gone, not extendable.
  rpc ExtendHold(ExtendHoldRequest) returns (Hold) {
    option (google.api.http) = {
      post: "/v1/{name=holds/*}:extend"
      body: "*"
    };
    option (google.api.method_signature) = "name,duration";
    option (mcp.v1.tool) = {
      description:
        "Move a live hold's expire_time to now plus duration (at most 24 hours), "
        "when settling needs longer. name: "
        "holds/{hold}."
    };
  }

  // Gives a hold up before it expires, freeing its resources immediately.
  //
  // Idempotent: releasing an already-released or expired hold succeeds and
  // changes nothing, because the caller's intent is already satisfied.
  rpc ReleaseHold(ReleaseHoldRequest) returns (Hold) {
    option (google.api.http) = {
      post: "/v1/{name=holds/*}:release"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (mcp.v1.tool) = {
      description:
        "Give up a live hold, freeing its resources at once. name: "
        "holds/{hold}. A hold that became a "
        "reservation cannot be released: reservation_service-cancel_reservation_v1 instead."
    };
  }

  // Deletes a hold record.
  //
  // Housekeeping for terminal holds, not a way to free resources -- use
  // ReleaseHold for that. Deleting an ACTIVE hold is rejected, so inventory is
  // never freed by a path that leaves no audit trail.
  rpc DeleteHold(DeleteHoldRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=holds/*}"};
    option (google.api.method_signature) = "name";
  }
}
