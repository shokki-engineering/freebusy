syntax = "proto3";

package freebusy.allocation.v1;

import "buf/validate/validate.proto";
import "entity/v1/annotations.proto";
import "freebusy/allocation/v1/enums.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/interval.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/freebusy/protobuf/generated/go/allocation/v1/allocationpbv1;allocationpbv1";
option java_multiple_files = true;
option java_outer_classname = "AllocationProto";
option java_package = "engineering.shokki.freebusy.allocation.v1";

// A Hold is a temporary, expiring claim on one or more bookable resources for a
// window, taken before payment or confirmation so two callers cannot be sold
// the same thing.
//
// Native, with no RFC behind it, and the comment says why (the same trade
// protobuf.shared.project.v1 records upstream). RFC 5545 section 3.2.12's
// PARTSTAT=TENTATIVE can express that a claim is provisional, and RFC 5546's
// iTIP can carry the request that created it, but neither specifies a lapse
// time, and an expiring claim is the one thing a commercial booking engine
// cannot do without. The resources held are RFC 9073 VRESOURCEs and the window
// is measured against their RFC 7953 availability; only the clock is ours.
//
// Holds are allocated, not requested: CreateHold names candidate resources and
// a quantity, and the server decides which concrete resources are taken. That
// keeps "which bay did I get" a server decision made under a lock, rather than
// a client guess that races.
message Hold {
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  option (google.api.resource) = {
    type: "freebusy.allocation.v1/Hold"
    pattern: "organizationalUnits/{organizational_unit}/holds/{hold}"
    singular: "hold"
    plural: "holds"
  };

  // The hold name. Nested under the site whose resources it takes, so a hold
  // is listed and swept per site without joining through every resource.
  // Format: organizationalUnits/{organizational_unit}/holds/{hold}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^organizationalUnits/[^/]+/holds/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The concrete resources this hold has taken, one per unit of `quantity`.
  // Chosen by the server from the candidates the request offered.
  // Format: resources/{resource}
  repeated string resources = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "the-protobuf-project.org/Resource"
  ];

  // The window held. Immutable: moving it is a different allocation, so
  // release this hold and take another.
  google.type.Interval window = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Candidate resources the allocator may choose from, supplied on create.
  // Empty offers every resource the site holds. Immutable: the choice is made
  // once, and re-offering a different set is a different allocation.
  // Format: resources/{resource}
  repeated string candidate_resources = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "the-protobuf-project.org/Resource"
  ];

  // How many resources to take, supplied on create; defaults to 1. Once the
  // hold is ACTIVE this equals the length of `resources`.
  int32 quantity = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).int32.gte = 0
  ];

  // When the hold lapses if nothing confirms it. Extend it with ExtendHold;
  // past this instant the hold no longer reserves anything, whether or not the
  // sweeper has yet marked it EXPIRED.
  google.protobuf.Timestamp expire_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Lifecycle state. New holds start ACTIVE.
  HoldState state = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "ACTIVE"}
  ];

  reserved 7;

  // Caller-supplied key making CreateHold safe to retry. A repeat with the same
  // key returns the original hold rather than taking a second one.
  string idempotency_key = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (store.v1.query) = {search: true}
  ];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
  string etag = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An Allocation is one resource taken by one hold for one span: the row the
// engine counts when it asks what is already claimed.
//
// Storage-only. No RPC returns it -- callers see a Hold and its `resources` --
// but a Hold cannot answer "who has bay 14 at 10:00" on its own: its window is
// one value and its resources a list, so an overlap query over holds would
// have to unpack both on every row. One row per resource, with the span as two
// indexed instants, makes that query a plain range scan on either backend.
//
// The span and `expire_time` are copies of the hold's, written in the same
// write as the hold. The copy is the point: a claim stops counting the instant
// `expire_time` passes, with no sweeper write needed, because every read
// filters on it.
//
// It sits under the site and names its hold, rather than nesting under the
// hold: the engine asks about allocations by resource and time across a whole
// site, never hold by hold, and a hold with child resources would owe
// DeleteHold a `force` flag guarding rows no caller can see.
message Allocation {
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: [
          "resource",
          "start_time",
          "end_time"
        ]
      }
    ]
  };

  // The engine's one invariant, held by the database rather than by every
  // writer remembering a lock: no two allocations of one resource may cover
  // overlapping time. Two holds racing for the last court both reach the
  // insert; the second fails as a conflict and re-plans.
  option (store.v1.table) = {
    no_overlap: {
      key: ["resource"]
      start: "start_time"
      end: "end_time"
    }
  };

  option (google.api.resource) = {
    type: "freebusy.allocation.v1/Allocation"
    pattern: "organizationalUnits/{organizational_unit}/allocations/{allocation}"
    singular: "allocation"
    plural: "allocations"
  };

  // The allocation name, under the site whose resource it takes.
  // Format: organizationalUnits/{organizational_unit}/allocations/{allocation}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The resource taken.
  // Format: resources/{resource}
  string resource = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "the-protobuf-project.org/Resource"
  ];

  // Start of the span taken, inclusive. A copy of the hold's window start.
  google.protobuf.Timestamp start_time = 3 [(google.api.field_behavior) = REQUIRED];

  // End of the span taken, exclusive. A copy of the hold's window end.
  google.protobuf.Timestamp end_time = 4 [(google.api.field_behavior) = REQUIRED];

  // When this claim stops counting. A copy of the hold's expire_time while it
  // is ACTIVE; set to the release instant on release; unset once the hold is
  // CONVERTED, which is the one outcome that keeps the resource taken. Always
  // the server's to write, never a caller's.
  google.protobuf.Timestamp expire_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The hold that took it. Deleting the hold deletes its allocations with it.
  // Format: organizationalUnits/{organizational_unit}/holds/{hold}
  string hold = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "freebusy.allocation.v1/Hold"
  ];
}

// One slice of an availability answer: how many resources are free across a
// span, and which ones.
//
// This is where pooling happens. No RFC counts inventory -- RFC 5545 and 7953
// are one-calendar-one-timeline -- so a count is produced by asking each
// resource's calendar whether it is free and totalling the answers, rather than
// by storing a capacity number anywhere.
message AvailabilityBucket {
  // The span this bucket covers: one slot, or one calendar day in the target
  // time zone, per the request's granularity.
  google.type.Interval window = 1;

  // How many candidate resources are free across the whole span.
  int32 free_count = 2;

  // How many candidates were considered. `free_count` out of this is the
  // "5 of 12 free" a caller renders.
  int32 total_count = 3;

  // Which resources are free, when the request asked for them. Omitted by
  // default: a car park with 200 bays would otherwise repeat 200 names in
  // every bucket of every day.
  // Format: resources/{resource}
  repeated string free_resources = 4 [(google.api.resource_reference).type = "the-protobuf-project.org/Resource"];
}

// Why a requested window is not bookable.
message UnbookableReason {
  // What went wrong, as a code a caller can branch on.
  UnbookableReasonCode code = 1;

  // Human-readable detail for logs and support, not for parsing.
  string message = 2;

  // The resource this reason is about, when it concerns one in particular.
  // Format: resources/{resource}
  string resource = 3 [(google.api.resource_reference).type = "the-protobuf-project.org/Resource"];
}

// One resource that satisfies a search, with the window it is free for.
message AvailabilityMatch {
  // The free resource.
  // Format: resources/{resource}
  string resource = 1 [(google.api.resource_reference).type = "the-protobuf-project.org/Resource"];

  // The site it belongs to.
  // Format: organizationalUnits/{organizational_unit}
  string organizational_unit = 2 [(google.api.resource_reference).type = "the-protobuf-project.org/OrganizationalUnit"];

  // The span it is free for, which may be narrower than the searched window.
  google.type.Interval window = 3;

  // RESOURCE-TYPE values carried by the resource, RFC 9073 section 6.3, echoed
  // so a caller can group results without re-fetching each resource.
  repeated string resource_types = 4;
}
