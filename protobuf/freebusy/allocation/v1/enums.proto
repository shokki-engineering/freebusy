syntax = "proto3";

package freebusy.allocation.v1;

option go_package = "github.com/oh-tarnished/freebusy/protobuf/generated/go/allocation/v1/allocationpbv1;allocationpbv1";
option java_multiple_files = true;
option java_outer_classname = "EnumsProto";
option java_package = "dev.ohtarnished.freebusy.allocation.v1";

// Lifecycle of a Hold. A hold is the only thing in this API that expires on its
// own: RFC 5545 section 3.2.12's PARTSTAT=TENTATIVE says a tentative claim
// exists, but no RFC says when it lapses, so the clock is ours.
enum HoldState {
  // Default; never persisted.
  HOLD_STATE_UNSPECIFIED = 0;

  // Live and holding its resources against other callers, until expire_time.
  HOLD_STATE_ACTIVE = 1;

  // Given up before expiry, by ReleaseHold or by the booking it backed
  // failing. The resources are free again.
  HOLD_STATE_RELEASED = 2;

  // expire_time passed with no confirmation. Reached by the sweeper, and by
  // any authoritative read that notices the deadline before the sweeper does,
  // so a stale ACTIVE row never hands out a resource twice.
  HOLD_STATE_EXPIRED = 3;

  // Converted into a confirmed booking. Terminal, and the only outcome that
  // keeps the resources allocated.
  HOLD_STATE_CONVERTED = 4;
}

// The slicing of an availability answer over a window.
enum AvailabilityGranularity {
  // Default; the server picks DAY for windows longer than 48 hours and SLOT
  // below that.
  AVAILABILITY_GRANULARITY_UNSPECIFIED = 0;

  // One bucket per slot of slot_duration, for hourly bookings: meeting rooms,
  // courts, equipment.
  AVAILABILITY_GRANULARITY_SLOT = 1;

  // One bucket per calendar day in the target time zone, for overnight
  // bookings: rooms, daily parking, multi-day rentals.
  AVAILABILITY_GRANULARITY_DAY = 2;
}

// Why a window could not be booked. Returned by CheckAvailability so a caller
// can say what to change rather than only that it failed.
enum UnbookableReasonCode {
  // Default; never returned.
  UNBOOKABLE_REASON_CODE_UNSPECIFIED = 0;

  // Fewer free resources than the requested quantity.
  UNBOOKABLE_REASON_CODE_NO_CAPACITY = 1;

  // The window falls outside every AvailablePeriod of the resource's RFC 7953
  // availability pattern -- the time was never on offer.
  UNBOOKABLE_REASON_CODE_OUTSIDE_AVAILABILITY = 2;

  // A live hold covers the window.
  UNBOOKABLE_REASON_CODE_HELD = 3;

  // A confirmed booking covers the window.
  UNBOOKABLE_REASON_CODE_BOOKED = 4;

  // Shorter than the minimum stay or slot the resource accepts.
  UNBOOKABLE_REASON_CODE_WINDOW_TOO_SHORT = 5;

  // Longer than the maximum stay the resource accepts.
  UNBOOKABLE_REASON_CODE_WINDOW_TOO_LONG = 6;

  // Inside the resource's notice period, or beyond how far ahead it opens.
  UNBOOKABLE_REASON_CODE_LEAD_TIME = 7;

  // The resource is soft-deleted or otherwise not accepting bookings.
  UNBOOKABLE_REASON_CODE_RESOURCE_INACTIVE = 8;
}
