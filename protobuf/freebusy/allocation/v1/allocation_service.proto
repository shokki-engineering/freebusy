syntax = "proto3";

package freebusy.allocation.v1;

import "freebusy/allocation/v1/allocation_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "mcp/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/freebusy/protobuf/generated/go/allocation/v1/allocationpbv1;allocationpbv1";
option java_multiple_files = true;
option java_outer_classname = "AllocationServiceProto";
option java_package = "engineering.shokki.freebusy.allocation.v1";

// AllocationService is the read-only half of the engine: it answers how much is
// free, and never changes anything. HoldService is the half that takes.
//
// The counting is done here rather than stored anywhere. No RFC models an
// inventory count -- RFC 5545 and RFC 7953 are one-calendar-one-timeline -- so
// "5 of 12 free" is produced by asking each RFC 9073 resource's calendar
// whether it is free across the window and totalling the answers. RFC 7953's
// VAVAILABILITY says when a resource was on offer at all; bookings on its
// calendar say what has since been taken; the difference is availability.
//
// Every operation is a custom method (AIP-136): they compute rather than fetch,
// so they take neither the standard-method names nor their shapes.
service AllocationService {
  option (google.api.default_host) = "freebusy.shokki.engineering";
  option (mcp.v1.service) = {
    app: {
      display_name: "Resource Availability"
      version: "1.0.0"
      description: "Compute how many bookable resources are free over a window. Read-only."
    }
  };

  // Computes availability across a site's resources, bucketed by slot or day.
  rpc ComputeAvailability(ComputeAvailabilityRequest) returns (ComputeAvailabilityResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizationalUnits/*}:computeAvailability"
      body: "*"
    };
    option (google.api.method_signature) = "parent,window";
    option (mcp.v1.tool) = {
      description:
        "How many resources are free at one site over a window, in buckets of "
        "slot_duration or by day: for showing a schedule. parent: "
        "organizationalUnits/{site}. window: start_time and end_time, RFC 3339. "
        "Read-only; to book, call hold_service-create_hold_v1."
    };
  }

  // Checks one exact window for one exact quantity, with reasons when it fails.
  //
  // Advisory, not a reservation: the answer can be stale the instant it is
  // returned. CreateHold is what actually secures anything.
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizationalUnits/*}:checkAvailability"
      body: "*"
    };
    option (google.api.method_signature) = "parent,window";
    option (mcp.v1.tool) = {
      description:
        "Whether one exact window can be booked at a site now, and if not, each "
        "resource's reason (outside opening hours, held, booked, too short or too "
        "long). parent: organizationalUnits/{site}. window: start_time and "
        "end_time, RFC 3339. quantity defaults to 1. Read-only: it claims "
        "nothing; call hold_service-create_hold_v1 to claim."
    };
  }

  // Runs several availability computations in one round trip.
  //
  // Each entry is independent and may name a different site, window or
  // granularity. Capped at 50 entries, because each one fans out across every
  // candidate resource's calendar.
  rpc BatchComputeAvailability(BatchComputeAvailabilityRequest) returns (BatchComputeAvailabilityResponse) {
    option (google.api.http) = {
      post: "/v1/resources:batchCompute"
      body: "*"
    };
  }

  // Sweeps an operator for resources free across a window.
  //
  // The search entry point, where ComputeAvailability answers for a site the
  // caller has already chosen. Paginated, since a large operator may match
  // thousands of resources.
  rpc SearchAvailability(SearchAvailabilityRequest) returns (SearchAvailabilityResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}:searchAvailability"
      body: "*"
    };
    option (google.api.method_signature) = "parent,window";
    option (mcp.v1.tool) = {
      description:
        "Find resources free for a whole window anywhere in an operator's sites: "
        "the first step of booking. parent: organizations/{organization}. window: "
        "start_time and end_time, RFC 3339. Optional: resource_types (e.g. "
        "padel-court), quantity (defaults to 1; only sites with that many free "
        "match), organizational_units to search only those. Then call hold_service-create_hold_v1 "
        "at the site of a match."
    };
  }
}
