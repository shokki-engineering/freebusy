syntax = "proto3";

package freebusy.shared.v1;

import "service/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/freebusy/protobuf/generated/go/shared/v1/sharedpbv1;sharedpbv1";
option java_multiple_files = true;
option java_outer_classname = "ErrorsProto";
option java_package = "engineering.shokki.freebusy.shared.v1";

// The reasons freebusy returns for the resources, calendars, events and
// availability freebusy serves, and any call: the
// google.rpc.ErrorInfo reasons (AIP-193) in the freebusy.dev domain. They are
// part of the API: clients branch on them, never on a message.
// protoc-gen-service renders them as Go constants, sentinels and the tables of
// docs/errors.md.
enum ErrorReason {
  option (service.v1.error_domain) = {domain: "freebusy.dev"};

  // Unset; never returned.
  ERROR_REASON_UNSPECIFIED = 0;

  reserved 1 to 9;
  reserved "ERROR_REASON_ORGANIZATION_REQUIRED", "ERROR_REASON_ORGANIZATION_NOT_FOUND", "ERROR_REASON_ORGANIZATION_DELETED", "ERROR_REASON_ORGANIZATION_HAS_SITES", "ERROR_REASON_SITE_REQUIRED", "ERROR_REASON_SITE_NOT_FOUND", "ERROR_REASON_SITE_DELETED", "ERROR_REASON_SITE_WITHOUT_ORGANIZATION", "ERROR_REASON_SITE_HAS_RESOURCES";

  // The calendar named does not exist.
  ERROR_REASON_CALENDAR_NOT_FOUND = 10 [(service.v1.error_reason) = {
    code: "NOT_FOUND"
    description: "The calendar named does not exist."
    fix: "Check the parent, or `ListCalendars`."
    detail: DETAIL_KIND_RESOURCE_INFO
  }];

  // Nothing can be added to a deleted calendar.
  ERROR_REASON_CALENDAR_DELETED = 11 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "Nothing can be added to a deleted calendar."
    fix: "`UndeleteCalendar`, or use a live one."
    detail: DETAIL_KIND_PRECONDITION_FAILURE
  }];

  // The calendar still has events or availability.
  ERROR_REASON_CALENDAR_NOT_EMPTY = 12 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "The calendar still has events or availability."
    fix: "Send `force=true`, or delete them first."
    detail: DETAIL_KIND_PRECONDITION_FAILURE
  }];

  // BatchGetEvents was asked for an event of another calendar.
  ERROR_REASON_NAME_NOT_UNDER_PARENT = 13 [(service.v1.error_reason) = {
    code: "INVALID_ARGUMENT"
    description: "`BatchGetEvents` was asked for an event of another calendar."
    fix: "Ask each calendar for its own events."
    detail: DETAIL_KIND_BAD_REQUEST
  }];

  // ExpandEvent on an event without a recurrence rule, or an override with
  // original_start_range whose series has none.
  ERROR_REASON_NOT_RECURRING = 14 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "`ExpandEvent` on an event without a recurrence rule, or an override with `original_start_range` whose series has none."
    fix: "`GetEvent` reads it as it is."
    detail: DETAIL_KIND_PRECONDITION_FAILURE
  }];

  // CreateEvent or UpdateEvent with original_start_range: no recurring event in
  // the calendar has the override's ical_uid.
  ERROR_REASON_SERIES_NOT_FOUND = 15 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "`CreateEvent` or `UpdateEvent` with `original_start_range`: no recurring event in the calendar has the override's `ical_uid`."
    fix: "Send the `ical_uid` of a recurring event in the same calendar."
    detail: DETAIL_KIND_PRECONDITION_FAILURE
  }];

  // original_start with original_start_range names no instance of the series:
  // its rule and added dates do not produce it, or it is excluded.
  ERROR_REASON_NOT_AN_INSTANCE = 16 [(service.v1.error_reason) = {
    code: "INVALID_ARGUMENT"
    description: "`original_start` with `original_start_range` names no instance of the series: its rule and added dates do not produce it, or it is excluded. `BadRequest` names `event.original_start`."
    fix: "Use an instance's start; `ExpandEvent` lists them."
    detail: DETAIL_KIND_BAD_REQUEST
  }];

  // original_start_range (RFC 5545 RANGE=THISANDFUTURE) splits the series at
  // original_start, applying the edit's shift to every later instance; this
  // series cannot be split there -- its rule has BYSETPOS, an ordinal BYDAY or a
  // BYMONTHDAY/BYHOUR the shift would push out of range, or the instance is an
  // added date with more after it.
  ERROR_REASON_RANGE_NOT_SUPPORTED = 17 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "`original_start_range` (RFC 5545 `RANGE=THISANDFUTURE`) splits the series at `original_start`, applying the edit's shift to every later instance; this series cannot be split there -- its rule has `BYSETPOS`, an ordinal `BYDAY` or a `BYMONTHDAY`/`BYHOUR` the shift would push out of range, or the instance is an added date with more after it."
    fix: "Split the series yourself: end it with `UNTIL` or `COUNT` before `original_start`, and create the rest as a new event."
    detail: DETAIL_KIND_PRECONDITION_FAILURE
  }];

  // An event on the calendar cannot be read as time (for example, no start), so
  // the calendar's time cannot be computed.
  ERROR_REASON_INVALID_EVENT = 18 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "An event on the calendar cannot be read as time (for example, no start), so the calendar's time cannot be computed."
    fix: "Fix the event the message names."
    detail: DETAIL_KIND_PRECONDITION_FAILURE
  }];

  // An event recurs by a rule part freebusy does not expand: BYSECOND,
  // BYYEARDAY, BYWEEKNO or RSCALE.
  ERROR_REASON_UNSUPPORTED_RECURRENCE = 19 [(service.v1.error_reason) = {
    code: "UNIMPLEMENTED"
    description: "An event recurs by a rule part freebusy does not expand: BYSECOND, BYYEARDAY, BYWEEKNO or RSCALE."
    fix: "Express the rule without them; the message lists what is supported."
    detail: DETAIL_KIND_RESOURCE_INFO
  }];

  // A window needs both start_time and end_time.
  ERROR_REASON_WINDOW_INCOMPLETE = 20 [(service.v1.error_reason) = {
    code: "INVALID_ARGUMENT"
    description: "A window needs both `start_time` and `end_time`."
    fix: "Send both, RFC 3339."
    detail: DETAIL_KIND_BAD_REQUEST
  }];

  // window.end_time is not after window.start_time.
  ERROR_REASON_WINDOW_BACKWARDS = 21 [(service.v1.error_reason) = {
    code: "INVALID_ARGUMENT"
    description: "`window.end_time` is not after `window.start_time`."
    fix: "Swap them, or check the offsets."
    detail: DETAIL_KIND_BAD_REQUEST
  }];

  // The window is longer than one call answers.
  ERROR_REASON_WINDOW_TOO_LONG = 22 [(service.v1.error_reason) = {
    code: "INVALID_ARGUMENT"
    description: "The window is longer than one call answers."
    fix: "Split it into consecutive windows."
    detail: DETAIL_KIND_BAD_REQUEST
  }];

  // The call, or this use of it, is not implemented.
  ERROR_REASON_UNIMPLEMENTED = 23 [(service.v1.error_reason) = {
    code: "UNIMPLEMENTED"
    description: "The call, or this use of it, is not implemented."
    fix: "Read the message."
    sentinel: true
  }];
}
