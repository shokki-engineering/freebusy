syntax = "proto3";

package freebusy.reservation.v1;

import "buf/validate/validate.proto";
import "cache/v1/annotations.proto";
import "entity/v1/annotations.proto";
import "freebusy/reservation/v1/enums.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "service/v1/annotations.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/freebusy/protobuf/generated/go/reservation/v1/reservationpbv1;reservationpbv1";
option java_multiple_files = true;
option java_outer_classname = "ReservationProto";
option java_package = "engineering.shokki.freebusy.reservation.v1";

// A Reservation is a confirmed booking: a hold made permanent.
//
// It is the last step of booking, not the first. The caller checks
// availability, takes a hold, settles whatever its vertical needs settled --
// payment, a guest list, a waiver -- and then creates a reservation from the
// hold. The reservation records the outcome; the engine already holds the
// resources.
//
// Deliberately thin. Price, discount, promo code, refund, guests and occupancy
// are what would tie it to one vertical, and none of them is here: money belongs to the payment service and people to the user
// service, both referenced by name (AIP-215), and anything else a vertical
// needs to remember rides in `attributes`.
message Reservation {
  // A hold backs at most one reservation: the unique index is what makes a
  // retried or concurrent CreateReservation find the first one instead of
  // making a second. (state, update_time) serves the reconciler, which looks
  // for reservations stuck in a state since before a cutoff; update_time the
  // webhook change feed, which reads them in update order.
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: ["hold"]
        unique: true
      },
      {
        columns: [
          "state",
          "update_time"
        ]
      },
      {
        columns: ["update_time"]
      }
    ]
  };

  // A site's reservations are listed far more often than any one changes, and
  // a site with years of them pays for every page. Pages are cached under the
  // site's version, which every write to one of its reservations moves on, so
  // a page is never served across a write the repositories made. The ttl bounds
  // the rest: a write that bypasses them is served stale for at most a minute.
  option (cache.v1.cache) = {
    list: {
      enabled: true
      ttl: {seconds: 60}
    }
  };

  option (google.api.resource) = {
    type: "freebusy.reservation.v1/Reservation"
    pattern: "organizationalUnits/{organizational_unit}/reservations/{reservation}"
    singular: "reservation"
    plural: "reservations"
  };

  // A reservation's changes are its state changes, and the one write that is
  // not: an UpdateReservation of its details (last_change CHANGE_DETAILS),
  // sent as freebusy.reservation.updated. Scoped by site.
  option (service.v1.event) = {
    type: "freebusy.reservation"
    omit: [
      "created",
      "deleted"
    ]
    scope: "organizational_unit"
  };

  // The reservation name. Its id is the caller's reservation_id, or else the
  // id of the hold it was made from.
  // Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^organizationalUnits/[^/]+/reservations/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The hold this reservation was made from, at the same site.
  // Format: organizationalUnits/{organizational_unit}/holds/{hold}
  string hold = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "freebusy.allocation.v1/Hold",
    (buf.validate.field).string.pattern = "^organizationalUnits/[^/]+/holds/[^/]+$",
    (store.v1.query) = {search: true}
  ];

  // The resources taken, copied from the hold.
  // Format: resources/{resource}
  repeated string resources = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "the-protobuf-project.org/Resource"
  ];

  // Start of the reserved window, copied from the hold.
  google.protobuf.Timestamp start_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // End of the reserved window, exclusive, copied from the hold.
  google.protobuf.Timestamp end_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who the reservation is for, by name in the user service. freebusy does
  // not keep users: when a resolver for the type is registered (config
  // `reference_services`) a create or update checks the name with that service, and a deleted user leaves the
  // reservation as it is.
  // Format: users/{user}
  string customer = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "users.shokki.engineering/User",
    (store.v1.reference) = {on_delete: ON_DELETE_ALLOW},
    (buf.validate.field).string.pattern = "^users/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (store.v1.query) = {search: true}
  ];

  // Lifecycle state.
  ReservationState state = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "PENDING"}
  ];

  // Whatever a vertical needs to keep with the reservation: a party size, a
  // payment reference, a licence plate. Opaque to the engine.
  google.protobuf.Struct attributes = 8 [(google.api.field_behavior) = OPTIONAL];

  // Why it was cancelled, in the canceller's words. Set by CancelReservation.
  string cancel_reason = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was confirmed.
  google.protobuf.Timestamp confirm_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was cancelled.
  google.protobuf.Timestamp cancel_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154); echo on cancel.
  string etag = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The reservation this one replaced, set when it was made by
  // RescheduleReservation.
  // Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
  string replaces = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The reservation replacing this one, set when RescheduleReservation began.
  // Format: organizationalUnits/{organizational_unit}/reservations/{reservation}
  string replacement = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What a write to a reservation changed.
  enum Change {
    // Default; never persisted.
    CHANGE_UNSPECIFIED = 0;

    // Its state: it was created, confirmed, cancelled, rescheduled, or a
    // transition was undone.
    CHANGE_STATE = 1;

    // What is kept with it, through UpdateReservation: its customer or
    // attributes. Its state did not change.
    CHANGE_DETAILS = 2;
  }

  // What the last write to this reservation changed. A webhook is sent
  // freebusy.reservation.updated exactly when it is CHANGE_DETAILS, and the
  // event of the new state otherwise.
  Change last_change = 17 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "STATE"}
  ];
}
