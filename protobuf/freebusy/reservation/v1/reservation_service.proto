syntax = "proto3";

package freebusy.reservation.v1;

import "freebusy/reservation/v1/reservation.proto";
import "freebusy/reservation/v1/reservation_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "mcp/protobuf/annotations.proto";

option go_package = "github.com/oh-tarnished/freebusy/protobuf/generated/go/reservation/v1/reservationpbv1;reservationpbv1";
option java_multiple_files = true;
option java_outer_classname = "ReservationServiceProto";
option java_package = "dev.ohtarnished.freebusy.reservation.v1";

// ReservationService turns holds into confirmed bookings and cancels them.
//
// It is where HoldService's conversion is driven from: a hold is never
// converted by a caller reaching into HoldService, only by a reservation being
// made of it. There is no UpdateReservation -- the window and resources are the
// hold's, and changing either is a new hold and a new reservation, which is
// exactly what RescheduleReservation does.
service ReservationService {
  option (google.api.default_host) = "freebusy.ohtarnished.dev";
  option (mcp.service) = {
    app: {
      name: "Reservations"
      version: "1.0.0"
      description: "Confirm holds as reservations, and cancel them."
    }
  };

  // Makes a reservation from a live hold, converting the hold so its
  // resources stay taken.
  //
  // Idempotent: the reservation's id is the hold's, so a retry returns the
  // reservation the first call made. Fails with FAILED_PRECONDITION when the
  // hold has lapsed or been released.
  rpc CreateReservation(CreateReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{parent=organizationalUnits/*}/reservations"
      body: "reservation"
    };
    option (google.api.method_signature) = "parent,reservation";
    option (mcp.tool) = {description: "Confirm a live hold as a reservation, keeping its resources."};
  }

  // Retrieves one reservation.
  rpc GetReservation(GetReservationRequest) returns (Reservation) {
    option (google.api.http) = {get: "/v1/{name=organizationalUnits/*/reservations/*}"};
    option (google.api.method_signature) = "name";
    option (mcp.tool) = {description: "Get a reservation."};
  }

  // Lists a site's reservations.
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizationalUnits/*}/reservations"};
    option (google.api.method_signature) = "parent";
    option (mcp.tool) = {description: "List a site's reservations, filtered and ordered per AIP-160 and AIP-132."};
  }

  // Cancels a reservation, freeing its resources.
  //
  // Idempotent: cancelling a cancelled reservation succeeds and changes
  // nothing.
  rpc CancelReservation(CancelReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{name=organizationalUnits/*/reservations/*}:cancel"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (mcp.tool) = {description: "Cancel a reservation and free its resources."};
  }

  // Moves a confirmed reservation onto a new hold, returning the reservation
  // that replaces it.
  //
  // The replacement is a new reservation made from the new hold, linked both
  // ways (`replaces`, `replaced_by`); the original ends RESCHEDULED. The
  // original keeps its resources until the replacement is confirmed, so a
  // failure part-way -- the new hold lapsing, a crash -- leaves the customer
  // with their old booking, never with neither. Idempotent: repeating the call
  // with the same hold returns the same replacement.
  rpc RescheduleReservation(RescheduleReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{name=organizationalUnits/*/reservations/*}:reschedule"
      body: "*"
    };
    option (google.api.method_signature) = "name,hold";
    option (mcp.tool) = {description: "Move a confirmed reservation onto a new live hold; the old slot is freed only once the new one is confirmed."};
  }
}
