# Dependabot: version updates for both Go modules and the workflows' actions.
# Security updates are switched on in the repository's settings and arrive
# whatever the schedule says.
#
# Every Dependabot pull request into main is merged by
# workflows/dependabot-auto-merge.yml once the required CI checks pass; a
# failing one leaves it open for a person.
#
# Minor and patch updates are grouped, one pull request per ecosystem a week,
# so a week of bumps is one CI run and one merge. A major update comes alone,
# so its failure names it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # runtime-go's modules in one pull request: they are released from one
      # repository and expect each other's versions.
      runtime-go:
        patterns: ["github.com/the-protobuf-project/runtime-go/*"]
      # Every OpenTelemetry module in one pull request: the SDK and API are
      # released together, and a partial bump does not compile (otel/log and
      # otel/sdk/log must agree).
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      gomod:
        update-types: [minor, patch]
    ignore:
      # The RFC SDKs are pinned to the RFC module in buf.lock and the
      # buf.gen templates, which the generated stores were made from; they
      # move with a regeneration (`just gen`), never alone.
      - dependency-name: "buf.build/gen/go/the-protobuf-project/*"
      # grpc-gateway 2.31+ requires OpenTelemetry 1.47, whose otel/log API
      # the-protobuf-project/telemetry does not build against yet (#3 broke
      # main this way). Lift when telemetry moves.
      - dependency-name: "github.com/grpc-ecosystem/grpc-gateway/v2"
        versions: [">= 2.31.0"]

  # The generated-code module, with its own go.mod.
  - package-ecosystem: gomod
    directory: /protobuf
    schedule:
      interval: weekly
      day: monday
    groups:
      protobuf:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "buf.build/gen/go/the-protobuf-project/*"
      - dependency-name: "github.com/grpc-ecosystem/grpc-gateway/v2"
        versions: [">= 2.31.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
