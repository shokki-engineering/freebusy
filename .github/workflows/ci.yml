# Jobs are independent on purpose. A red lint should not hide a red test, and
# a reviewer reading a failed run should see everything that is wrong in one
# pass rather than one problem per push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format, vet, staticcheck and buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # The recipe is the definition; this job only runs it.
      - run: just lint

  proto:
    name: Protobuf build and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf build -o /dev/null
      # A pull request may not break the published API: FILE-level, so a
      # moved or deleted message counts. On main there is nothing to compare
      # against but the previous push, which already passed.
      - if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The server binary, as `just run` builds it.
      - run: go build -o freebusy .

  bazel:
    name: Bazel build, tests and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # The BUILD files are Gazelle's output: one it would rewrite is stale.
      - name: BUILD files are up to date
        run: |
          bazel run //:gazelle
          git diff --exit-code -- '*.bazel' MODULE.bazel
      - run: bazel build //...
      - run: bazel test //...
      # Both platforms of the image: the static binary and nothing else.
      - run: bazel build //image

  deploy:
    name: Deploy manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      # Every template rendered, the optional parts included, and checked
      # against the Kubernetes schemas.
      - name: Helm chart
        run: |
          set -- --set secrets.postgresPassword=x --set database.postgres.host=db \
            --set database.provider=hasura --set hasura.enabled=true \
            --set cache.enabled=true --set cache.address=redis:6379
          helm lint deploy/helm/freebusy "$@"
          helm template ci deploy/helm/freebusy "$@" |
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary
      - name: Compose stack
        run: |
          docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/.env.example \
            --profile cache --profile hasura --profile observability config -q
      - name: Alert rules
        run: |
          docker run --rm -v "$PWD/deploy/observability:/w" --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules /w/alerts.yaml

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      # Everything that needs no database. The live suites skip here and run
      # in the live job, which requires them.
      - run: just test

  live:
    name: Live suites (Postgres and Hasura DDN)
    runs-on: ubuntu-latest
    # The database the dev overlay (config/freebusy.dev.toml) names, so the
    # migrate tool and the server binary need no configuration of their own.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: freebusydb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # The list cache's suite (internal/database) runs against a real Redis.
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4

      # Schemas and tables, through the versioned migrations production
      # applies, and a check that they still match the generated models.
      - name: Install atlas
        run: |
          curl -sSfL -o /usr/local/bin/atlas https://release.ariga.io/atlas/atlas-community-linux-amd64-v1.3.0
          chmod +x /usr/local/bin/atlas
      - run: just db apply
      - run: just db check

      # The engine serves the committed build (hasura/engine/build), which
      # `just hasura regen` makes from the metadata with a developer's DDN
      # login. Serving it needs none: the engine and the connector are plain
      # images, and hasura/.env.example holds the connector settings the build
      # was made with.
      - name: Start the engine and connector
        working-directory: hasura
        run: |
          cp .env.example .env
          docker compose -f compose.yaml --env-file .env up -d --build --pull always --wait
          for _ in $(seq 60); do
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' http://localhost:3280/graphql && exit 0
            sleep 2
          done
          echo "::error::the engine never answered at http://localhost:3280/graphql"
          exit 1

      # Every test on both backends; a suite that cannot reach its backend
      # fails the job rather than skipping (internal/livetest).
      - run: just test-live

      - name: Engine and connector logs
        if: failure()
        working-directory: hasura
        run: docker compose logs --no-color
