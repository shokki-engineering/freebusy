# Jobs are independent on purpose. A red lint should not hide a red test, and
# a reviewer reading a failed run should see everything that is wrong in one
# pass rather than one problem per push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format, vet and staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Generated code follows its generator, not gofmt -- protoc-gen-mcp's
      # output is not gofmt-clean -- so only hand-written code is held to it.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^protobuf/generated/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"; echo "$unformatted"; exit 1
          fi
      - run: go mod verify
      - run: (cd protobuf && go mod verify)
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

  proto:
    name: Protobuf structure and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # BASIC structure only; API design is api-lint.yml's, and STANDARD's
      # naming rules contradict AIP's (see buf.yaml).
      - run: buf lint
      - run: buf build -o /dev/null
      # A pull request may not break the published API: FILE-level, so a
      # moved or deleted message counts. On main there is nothing to compare
      # against but the previous push, which already passed.
      - if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The server binary, as `just run` builds it.
      - run: go build -o freebusy .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Everything that needs no database. The live suites skip here and run
      # in the live job, which requires them.
      - run: go test -race -count=1 ./...

  live:
    name: Live suites (Postgres and Hasura DDN)
    runs-on: ubuntu-latest
    # The database the dev overlay (config/freebusy.dev.toml) names, so the
    # migrate tool and the server binary need no configuration of their own.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: freebusydb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Every live suite runs, on both backends: an unset variable fails the
      # job instead of skipping the suite (internal/livetest).
      FREEBUSY_TEST_REQUIRE_LIVE: "1"
      FREEBUSY_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgrespassword dbname=freebusydb sslmode=disable
      FREEBUSY_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=postgrespassword dbname=freebusydb sslmode=disable
      FREEBUSY_TEST_GRAPHQL_URL: http://localhost:3280/graphql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Schemas and tables, as `just migrate` makes them.
      - run: go run ./tools/db/gorm/migrate

      # The engine serves the committed metadata (hasura/freebusy), built
      # into engine/build by the DDN CLI -- which will not build without a
      # login, even locally. HASURA_DDN_PAT is a personal access token, set
      # as an Actions secret and, for Dependabot's pull requests, a
      # Dependabot secret too.
      - name: Install the DDN CLI
        env:
          HASURA_DDN_PAT: ${{ secrets.HASURA_DDN_PAT }}
        run: |
          if [ -z "$HASURA_DDN_PAT" ]; then
            echo "::error::The HASURA_DDN_PAT secret is not set; the Hasura suites cannot run."
            exit 1
          fi
          curl -fsSL https://graphql-engine-cdn.hasura.io/ddn/cli/v4/get.sh | VERSION=v3.9.4 bash
          ddn auth login --access-token "$HASURA_DDN_PAT"

      # The connector's environment. The token is minted per run: the engine
      # and the connector only need to agree with each other.
      - name: Build the supergraph
        working-directory: hasura
        run: |
          token=$(openssl rand -hex 24)
          cat > .env <<EOF
          FREEBUSY_FREEBUSY_PGSQL_AUTHORIZATION_HEADER="Bearer $token"
          FREEBUSY_FREEBUSY_PGSQL_HASURA_SERVICE_TOKEN_SECRET="$token"
          FREEBUSY_FREEBUSY_PGSQL_CONNECTION_URI="postgresql://postgres:postgrespassword@local.hasura.dev:5432/freebusydb"
          FREEBUSY_FREEBUSY_PGSQL_HASURA_CONNECTOR_PORT=9794
          FREEBUSY_FREEBUSY_PGSQL_OTEL_EXPORTER_OTLP_ENDPOINT="http://local.hasura.dev:4317"
          FREEBUSY_FREEBUSY_PGSQL_OTEL_SERVICE_NAME="freebusy_freebusy_pgsql"
          FREEBUSY_FREEBUSY_PGSQL_READ_URL="http://local.hasura.dev:9794"
          FREEBUSY_FREEBUSY_PGSQL_WRITE_URL="http://local.hasura.dev:9794"
          EOF
          sed -i 's/^ *//' .env
          ddn supergraph build local

      # As `ddn run docker-start` does locally (hasura/.hasura/context.yaml).
      - name: Start the engine and connector
        working-directory: hasura
        env:
          HASURA_DDN_PAT: ${{ secrets.HASURA_DDN_PAT }}
        run: |
          docker compose -f compose.yaml --env-file .env up -d --build --pull always --wait
          for _ in $(seq 60); do
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' "$FREEBUSY_TEST_GRAPHQL_URL" && exit 0
            sleep 2
          done
          echo "::error::the engine never answered at $FREEBUSY_TEST_GRAPHQL_URL"
          exit 1

      - run: go test -race -count=1 ./...

      - name: Engine and connector logs
        if: failure()
        working-directory: hasura
        run: docker compose logs --no-color
