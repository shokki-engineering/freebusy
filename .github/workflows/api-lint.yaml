# Google AIP lint over the schema tree, strictly.
#
# The one rule freebusy may disable, core::0215::foreign-type-reference, is
# not disabled here: the tree has no finding under it, and a rule switched off
# before it is needed is a rule nobody notices switching back on.
name: API lint

on:
  push:
    branches: [main]
  # No `branches` filter: gate every PR, whatever branch it targets.
  pull_request:

# One run per branch or pull request: a new push cancels the run still going
# for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aip:
    name: Google AIP lint (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # working-directory is protobuf so each file's path matches its proto
      # package. Linting from the repository root instead trips
      # core::0191::proto-package on every file.
      #
      # ignore-comment-disables means a finding cannot be suppressed from
      # inside the schema. An escape hatch in the file being reviewed is not a
      # review.
      - name: Lint
        uses: the-protobuf-project/setup-google-api-linter@d031174de8de0a2166bc929f24e501b914c4a5e9 # v1.1.0
        with:
          version: 2.3.1
          working-directory: protobuf
          paths: "**/*.proto"
          # Resolve googleapis / protovalidate / mcp / store imports from the
          # buf.yaml one level up at the repo root.
          buf: true
          buf-input: ".."
          ignore-comment-disables: true
          fail-on-error: true
