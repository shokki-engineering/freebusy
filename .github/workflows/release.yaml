# A release is a tag: v1.2.3 publishes, under 1.2.3,
#
#   ghcr.io/shokki-engineering/freebusy             the server (amd64 + arm64)
#   ghcr.io/shokki-engineering/freebusy-migrations  atlas and deploy/migrations/
#   ghcr.io/shokki-engineering/freebusy-engine      the Hasura engine, committed build
#   ghcr.io/shokki-engineering/freebusy-connector   the Hasura Postgres connector
#   oci://ghcr.io/shokki-engineering/charts/freebusy  the Helm chart
#
# and a GitHub release whose notes are the tag's CHANGELOG.md section, with
# the chart and the REST API's OpenAPI file attached. Then the API's buf
# module is pushed to the BSR labelled with the tag. The SDKs are
# regenerated by hand from that label. CI's checks are not repeated here:
# tag a commit main already passed.
#
# Everything is signed keylessly with cosign (Sigstore, through this run's
# GitHub OIDC identity): each image and every platform in it, the chart in
# the registry, and the release's files (a .sigstore.json bundle beside each).
#
# A tag with a pre-release part (v1.0.0-rc.1: anything after a `-`) publishes
# the same artifacts under its version, but does not move the images'
# `latest` tag, and its GitHub release is marked as a pre-release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Releases queue rather than cancel: stopping one part-way would leave some
# artifacts published and others not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  # Keyless signing: cosign gets a short-lived certificate for this workflow
  # run from Sigstore through GitHub's OIDC token. No signing key to keep.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version the server reports is config: the tag must match it, and
      # CHANGELOG.md must have the tag's section. The image build below also
      # stamps the tag and commit into the binary (`freebusy --version`).
      - name: Tag matches the release config and the changelog
        run: |
          version="${TAG#v}"
          # Fixed strings: a version's dots and dashes are matched as written.
          grep -qxF "version = \"v$version\"" internal/config/freebusy.release.toml ||
            { echo "::error::internal/config/freebusy.release.toml [app] version is not v$version"; exit 1; }
          awk -v h="## [$version]" 'index($0, h) == 1 {found=1} END {exit !found}' CHANGELOG.md ||
            { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # v1.0.0-rc.1 is a pre-release: no `latest`, a pre-release on GitHub.
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign signs every artifact this release publishes; crane resolves a
      # pushed tag to the digest that gets signed.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Server and migrations images
        env:
          # tools/bazel/status.sh stamps this tag; --config=release turns
          # stamping on.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tags=(--tag "$VERSION")
          if [ "$PRERELEASE" != true ]; then tags+=(--tag latest); fi
          bazel run --config=release //deploy/image:push -- "${tags[@]}"
          bazel run //deploy/image:push_migrations -- "${tags[@]}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Hasura engine and connector images
        run: |
          for part in engine connector; do
            case $part in
              engine) ctx=deploy/hasura/engine; file=deploy/hasura/engine/Dockerfile.engine ;;
              connector) ctx=deploy/hasura/freebusy/connector/freebusy_pgsql; file=$ctx/.hasura-connector/Dockerfile.freebusy_pgsql ;;
            esac
            tags=(-t "ghcr.io/shokki-engineering/freebusy-$part:$VERSION")
            if [ "$PRERELEASE" != true ]; then tags+=(-t "ghcr.io/shokki-engineering/freebusy-$part:latest"); fi
            # The source label links the package to this repository on GHCR,
            # like the server and migrations images' labels do.
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.title=freebusy-$part" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
              "${tags[@]}" -f "$file" "$ctx"
          done

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm chart
        run: |
          # Artifact Hub annotations that depend on the version: images,
          # this version's CHANGELOG entries, and the pre-release flag.
          bash tools/release/chart-annotations.sh "$VERSION"
          helm package deploy/helm/freebusy --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/freebusy-$VERSION.tgz" oci://ghcr.io/shokki-engineering/charts

      # Every image (each platform too, --recursive) and the chart, signed by
      # digest. Artifact Hub shows the chart's signature as "Signed".
      - name: Sign images and chart
        run: |
          for ref in \
            "ghcr.io/shokki-engineering/freebusy:$VERSION" \
            "ghcr.io/shokki-engineering/freebusy-migrations:$VERSION" \
            "ghcr.io/shokki-engineering/freebusy-engine:$VERSION" \
            "ghcr.io/shokki-engineering/freebusy-connector:$VERSION" \
            "ghcr.io/shokki-engineering/charts/freebusy:$VERSION"; do
            digest="$(crane digest "$ref")"
            cosign sign --yes --recursive "${ref%:*}@$digest"
          done

      # Artifact Hub's repository metadata, for the Verified Publisher badge.
      # Skipped until deploy/helm/artifacthub-repo.yaml carries the repository
      # ID Artifact Hub assigns when the repository is added there.
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Artifact Hub repository metadata
        run: |
          id="$(yq '.repositoryID // ""' deploy/helm/artifacthub-repo.yaml)"
          if [ -z "$id" ]; then
            echo "deploy/helm/artifacthub-repo.yaml has no repositoryID yet; skipping"
            exit 0
          fi
          oras login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          # Artifact Hub documents the file as artifacthub-repo.yml; the repo
          # keeps .yaml, so it is copied to that name for the push.
          work="$(mktemp -d)"
          cp deploy/helm/artifacthub-repo.yaml "$work/artifacthub-repo.yml"
          cd "$work"
          oras push ghcr.io/shokki-engineering/charts/freebusy:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cp protobuf/generated/openapi/openapiv3-spec.yaml "dist/freebusy-$VERSION.openapi.yaml"
          # The release's files are signed too: each gets a Sigstore bundle
          # (signature, certificate and transparency-log entry) beside it.
          assets=("dist/freebusy-$VERSION.tgz" "dist/freebusy-$VERSION.openapi.yaml")
          for f in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            assets+=("$f.sigstore.json")
          done
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${flags[@]}" "${assets[@]}"

      # The API's buf module on the BSR, labelled with the tag: what the SDKs
      # are generated from. Skipped until the BUF_TOKEN secret exists.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - name: Push the API to the BSR
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          if [ -z "$BUF_TOKEN" ]; then
            echo "No BUF_TOKEN secret: the API is not pushed."
            exit 0
          fi
          buf push --label "$TAG"
