version: v2
modules:
  - path: protobuf
    name: buf.build/shokki-engineering/freebusy
# BASIC, not STANDARD: STANDARD wants HoldServiceCreateHoldResponse-style
# wrappers that AIP-131..135 forbid, and api-linter (api-lint.yml) is the
# authority on API design. buf checks structure; api-linter checks design.
lint:
  use:
    - BASIC
breaking:
  use:
    - FILE
deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
  - buf.build/the-protobuf-project/mcp
  - buf.build/the-protobuf-project/rfc
  - buf.build/the-protobuf-project/store
  - buf.build/the-protobuf-project/cache