# Lifecycle enums: for each value, how it is reached. A value takes one
# transition or a list of them: {from: [values], rpc: Service.Method or event:
# cause, condition: guard}. Empty from with a trigger is an entry from the
# initial state; a value left as {from: []} is not drawn.
states:
  HoldState:
    # Live and holding its resources against other callers, until expire_time.
    HOLD_STATE_ACTIVE:
      from: []
      rpc: HoldService.CreateHold
    # Given up before expiry, by ReleaseHold or by the booking it backed
    # failing. The resources are free again.
    HOLD_STATE_RELEASED:
      - from: [ACTIVE]
        rpc: HoldService.ReleaseHold
      - from: [ACTIVE]
        event: reservation failed
    # expire_time passed with no confirmation. Reached by the sweeper, and by
    # any authoritative read that notices the deadline before the sweeper does,
    # so a stale ACTIVE row never hands out a resource twice.
    HOLD_STATE_EXPIRED:
      from: [ACTIVE]
      event: sweeper
      condition: expire_time passed
    # Converted into a confirmed booking. Terminal, and the only outcome that
    # keeps the resources allocated.
    HOLD_STATE_CONVERTED:
      from: [ACTIVE]
      rpc: freebusy.reservation.v1.ReservationService.CreateReservation

flows:
  - id: hold-expiry
    title: Hold expiry
    service: HoldService
    description: |-
      A hold nobody confirms lapses at `expire_time`; ExtendHold pushes the
      deadline out while it is still ACTIVE.

      Reads are authoritative on expiry, so a caller never sees an ACTIVE hold
      that no longer holds anything, even before the sweeper runs.
    actors: [Client, HoldService, Sweeper, Webhooks]
    steps:
      - call: freebusy.allocation.v1.HoldService.CreateHold
        returns: Hold (ACTIVE)
      - alternatives:
          - when: the caller needs more time
            steps:
              - call: freebusy.allocation.v1.HoldService.ExtendHold
                returns: Hold (later expire_time)
      - actor: Sweeper
        message: expire lapsed holds
        to: HoldService
        note: expire_time passed; the claims stop counting
      - actor: HoldService
        emits: freebusy.hold.expired
        to: Webhooks
      - call: freebusy.allocation.v1.HoldService.GetHold
        returns: Hold (EXPIRED)
      - call: freebusy.allocation.v1.HoldService.ExtendHold
        error: FAILED_PRECONDITION (HOLD_NOT_ACTIVE)
