# Transport bindings for the RFC schema module: the HTTP gateway and MCP
# servers for the protobuf-rfc services freebusy serves (Resources, Calendars,
# Availabilities, Events, and the rest the module defines).
#
# The messages and gRPC stubs are NOT generated here. freebusy uses the SDK
# the BSR publishes for the module --
#
#   buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go   (messages)
#   buf.build/gen/go/the-protobuf-project/rfc/grpc/go              (gRPC)
#
# -- because those are the types runtime-go/rfc's iCalendar and vCard codecs
# speak. A local copy of the same protos would register the same .proto files
# a second time, which protobuf-go refuses at init, so the two cannot share a
# binary. Keep the module pin below on the commit the SDK versions in go.mod
# were cut from.
#
# go_package_prefix reproduces the SDK's own import paths (buf derives the
# "<leaf>v1" package name from a path ending in a version, as the BSR does), so
# the bindings below import exactly the SDK packages. Each plugin then writes
# into a sub-package of its own beside them -- grpc-gateway's standalone mode,
# protoc-gen-mcp's package_suffix -- since a package of a module freebusy does
# not own cannot gain files. `module=` strips the SDK prefix so the output lands
# under protobuf/generated/go/rfc/.
#
# clean: false because go.buf.gen.yaml cleans protobuf/generated/go; run this
# after it (`just gen go rfc`).
version: v2
clean: false
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go
      module: buf.build/the-protobuf-project/rfc
inputs:
  # Pinned to the commit buf.lock records, and the SDK versions in go.mod.
  - module: buf.build/the-protobuf-project/rfc:cc82b3b15066438ba44e89dad69e9f8a
plugins:
  - remote: buf.build/grpc-ecosystem/gateway:v2.27.4
    out: protobuf/generated/go/rfc
    opt:
      - module=buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go
      - standalone=true
  - local: protoc-gen-mcp
    out: protobuf/generated/go/rfc
    opt:
      - lang=go
      - module=buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go
      - package_suffix=mcp
