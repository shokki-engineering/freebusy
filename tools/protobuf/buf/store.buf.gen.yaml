# protoc-gen-store + protoc-gen-cache: the whole database layer from one proto
# input — prisma and gorm schemas, the proto-facing repositories, the typed
# Hasura client, and the read-through cache decorators over the generated
# stores. Run via `just gen store`.
#
# clean: true wipes every `out` dir before writing. Two things living under
# those paths are NOT generated and are destroyed by it — the prisma migration
# history under protobuf/generated/prisma/freebusy/migrations, and the
# hand-written internal/database/hasura/graphqlx package. Restore both after a
# full run until they are moved outside the cleaned directories.
version: v2
clean: true
managed:
  enabled: true
  override:
    # The RFC messages are the BSR SDK's (buf.build/gen/go/the-protobuf-project/
    # rfc/protocolbuffers/go), so the database layer imports them from there --
    # see rfc.buf.gen.yaml for why freebusy no longer generates its own copy.
    # Each override names the SDK import path and the package's own name
    # (";resourcev1"), which buf cannot infer from a path ending in a version.
    # The names are the SDK's, not freebusy's, so no import is ever aliased.
    - file_option: go_package
      path: protobuf/rfc5545/calendar/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc5545/calendar/v1;calendarv1
    - file_option: go_package
      path: protobuf/rfc5545/event/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc5545/event/v1;eventv1
    - file_option: go_package
      path: protobuf/rfc5545/journal/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc5545/journal/v1;journalv1
    - file_option: go_package
      path: protobuf/rfc5545/todo/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc5545/todo/v1;todov1
    - file_option: go_package
      path: protobuf/rfc5546/scheduling/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc5546/scheduling/v1;schedulingv1
    - file_option: go_package
      path: protobuf/rfc6350/vcard/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc6350/vcard/v1;vcardv1
    - file_option: go_package
      path: protobuf/rfc7643/group/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc7643/group/v1;groupv1
    - file_option: go_package
      path: protobuf/rfc7643/user/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc7643/user/v1;userv1
    - file_option: go_package
      path: protobuf/rfc7953/availability/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc7953/availability/v1;availabilityv1
    - file_option: go_package
      path: protobuf/rfc8428/pack/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc8428/pack/v1;packv1
    - file_option: go_package
      path: protobuf/rfc8428/sensor/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc8428/sensor/v1;sensorv1
    - file_option: go_package
      path: protobuf/rfc8428/stream/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc8428/stream/v1;streamv1
    - file_option: go_package
      path: protobuf/rfc8428/unit/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc8428/unit/v1;unitv1
    - file_option: go_package
      path: protobuf/rfc9073/resource/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc9073/resource/v1;resourcev1
    - file_option: go_package
      path: protobuf/rfc9553/card/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/rfc9553/card/v1;cardv1
    - file_option: go_package
      path: protobuf/shared/interchange/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/shared/interchange/v1;interchangev1
    - file_option: go_package
      path: protobuf/shared/project/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/shared/project/v1;projectv1
    - file_option: go_package
      path: protobuf/shared/search/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/shared/search/v1;searchv1
    - file_option: go_package
      path: protobuf/shared/sync/v1
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go/protobuf/shared/sync/v1;syncv1
inputs:
  # freebusy's own protos and the RFC schema module are generated together, in
  # one invocation, so both land in one tree sharing one repox and one gormx.
  # Generating them separately produced two copies of each runtime package that
  # then drifted apart.
  - directory: protobuf
  # Pinned to the commit buf.lock records: an unpinned module input resolves
  # to the BSR head, and a regen then rewrites every RFC stub to whatever
  # upstream last pushed.
  - module: buf.build/the-protobuf-project/rfc:cc82b3b15066438ba44e89dad69e9f8a
    # freebusy has no organizations, organizational units or LDAP directory:
    # RFC 4519's packages are left out, so no table, repository or binding
    # exists for them.
    exclude_paths:
      - protobuf/rfc4519

plugins:
  # strategy: all is required — store must see every proto file in one
  # invocation to resolve cross-service references and to merge each service's
  # tables into the single `freebusy` database. With buf's default
  # (strategy: directory) the plugin runs once per folder: cross-service FKs
  # degrade to soft FKs and GORM's per-schema models.go files collide and are
  # dropped. config= maps packages to the freebusy DB + per-service schemas.
  - local: protoc-gen-store
    out: protobuf/generated/prisma
    strategy: all
    opt:
      - target=prisma
      - config=tools/protobuf/buf/config/store.backend.yaml
  - local: protoc-gen-store
    out: ./internal/database/gorm
    strategy: all
    opt:
      - target=gorm
      - stores=true
      # Proto↔model converters (<Model>ToProto/<Model>FromProto + enum value
      # mappers) per schema package — the mechanical field mass the app's
      # per-service convert.go files otherwise hand-write.
      - converters=true
      # Import path of the gorm output dir (module path + out). The generated
      # stores import the shared gormx runtime package by this path, so it MUST
      # match the `out` dir above (internal/database/) — otherwise the
      # stores import gormx/common/shared paths that don't exist on disk.
      - go_module=github.com/shokki-engineering/freebusy/internal/database/gorm
      - config=tools/protobuf/buf/config/store.backend.yaml
      # First-party opentelementry instrumentation: instrumented stores, the
      # ormtelemetry adapter/plugin package, a filterx observer (with
      # filters), and Registry.Instrument. Replaces the old otel/pulse opts.
      - telemetry=true
      # AIP-160 filter / AIP-132 order_by specs per schema + the shared filterx
      # engines (backend-neutral core, gorm + hasura engines) — one Spec drives
      # both providers' filter/order/List paths.
      - filters=true
  # Proto-facing repository layer: provider-agnostic CRUD interfaces per
  # resource plus BOTH adapters — GORM (composing the generated models,
  # stores, converters, and filterx specs from gorm_module) and GraphQL
  # (composing the freebusyql client from graphql_module, with generated
  # proto↔row converters in protobuf.go). New(conn) picks the adapter from
  # the live handle: production runs hasura, open source runs gorm.
  - local: protoc-gen-store
    out: ./internal/database/repository
    strategy: all
    opt:
      - target=repository
      - config=tools/protobuf/buf/config/store.backend.yaml
      - go_module=github.com/shokki-engineering/freebusy/internal/database/repository
      - gorm_module=github.com/shokki-engineering/freebusy/internal/database/gorm
      - graphql_module=github.com/shokki-engineering/freebusy/internal/database/hasura/freebusyql
  # OpenSearch copy of the projections ((store.v1.projection), the
  # availability read model allocation.v1.ResourceDay): the runtime (osx/) and
  # one <Model>Index per projection -- generated mapping, index template and
  # alias, the change-feed indexer, PIT search, facets and alias-swap reindex
  # -- on github.com/oh-tarnished/opensearch-go-sdk. Optional at run time:
  # used only with [search] provider = "opensearch". gorm_module and
  # repository_module MUST match the gorm and repository targets above.
  - local: protoc-gen-store
    out: ./internal/database/opensearch
    strategy: all
    opt:
      - target=opensearch
      - config=tools/protobuf/buf/config/store.backend.yaml
      - go_module=github.com/shokki-engineering/freebusy/internal/database/opensearch
      - gorm_module=github.com/shokki-engineering/freebusy/internal/database/gorm
      - repository_module=github.com/shokki-engineering/freebusy/internal/database/repository
  # Read-through cache decorators over the generated stores. protoc-gen-cache
  # reads cache.v1 annotations and emits a <Model>StoreIface implementation that
  # wraps the store from store_module — same interface in, same interface out,
  # so callers are unchanged. store_module MUST match the gorm target's out dir
  # + go_module above; it is a path, not a dependency, and a mismatch produces a
  # decorator that compiles against a package that is not there.
  #
  # This does NOT stack with runtime-go's cached.Wrap: that decorates a
  # store.Driver at the byte level, and running both puts two caches on one read
  # where an invalidation through either leaves the other serving stale rows.
  - local: protoc-gen-cache
    out: ./internal/database/cache
    strategy: all
    opt:
      - store_module=github.com/shokki-engineering/freebusy/internal/database/gorm
      # The list caches ((cache.v1.cache).list) wrap the repositories rather
      # than the gorm stores, so one cache serves both backends. Like
      # store_module, this MUST match the repository target's go_module above.
      - repository_module=github.com/shokki-engineering/freebusy/internal/database/repository
      # The same database/schema layout the store targets use.
      - config=tools/protobuf/buf/config/cache.yaml

  # Typed Hasura/DDN GraphQL client (freebusyql), generated by orm directly —
  # no separate generateql tool. The target introspects the engine named in the
  # config's graphql: block (the local DDN engine must be running; rebuild its
  # metadata first via `just hasura regen` after a schema change) and emits the
  # client under <out>/freebusyql. strategy: all — one invocation, not one per
  # proto directory (the target reads the endpoint, not the protos).
  - local: protoc-gen-store
    out: ./internal/database/hasura
    strategy: all
    opt:
      - target=graphql
      - config=tools/protobuf/buf/config/store.graphql.yaml
