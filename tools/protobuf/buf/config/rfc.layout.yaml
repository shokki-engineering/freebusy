# Layout config for the RFC schema module's generated ORM.
#
# Without this every RFC resource lands in one schema. protoc-gen-store derives a
# schema from the AIP resource-type host when no datasource rule matches, and
# every protobuf-rfc resource declares the same host ("the-protobuf-project.org") — so
# Resource, Calendar, Event and the rest all collapse together, and the generator
# drops colliding files (address_store.go appears in three RFC packages).
#
# Mapping on the proto package instead gives each RFC its own schema, mirroring
# what store.backend.yaml does for freebusy.**.
strip_version: true
dedupe_schema_table: true

datasources:
  # A database of its own, separate from "freebusy". The catalogue is upstream
  # data with its own lifecycle: it is regenerated when protobuf-rfc releases,
  # not when freebusy changes, and keeping it separate means a future split into
  # its own binary moves a database rather than untangling one.
  - match: "protobuf.**"
    database: rfc
    schema: "{leaf}" # rfc9073.resource.v1 -> schema "resource"
