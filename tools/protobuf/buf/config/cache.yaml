# protoc-gen-cache's configuration: which proto packages land in which database
# and schema. It is the layout block of store.backend.yaml, repeated, because
# the cache plugin decodes its config strictly and store.backend.yaml carries
# settings only protoc-gen-store reads. The two must agree -- the cache output
# imports the store's and the repositories' packages by these names -- and
# tools/protobuf/layout's test fails the build when they do not.

strip_version: true
dedupe_schema_table: true

datasources:
  # Shared value objects (imported google.type.* like Money, Date, TimeOfDay)
  # cannot carry a (orm.v1.table) annotation, so route them into one shared
  # "common" schema. Every service that embeds them then references a single
  # deduped common.<type> table cross-schema instead of materializing a copy in
  # its own schema. More specific than the freebusy.** rule, so it wins.
  - match: "google.type"
    database: freebusy
    schema: common

  - match: "freebusy.**" # every freebusy.<service>.<version> package
    database: freebusy
    schema: "{leaf}" # the service segment: schedule, identity, booking, ...

  # The RFC schema module, generated alongside freebusy's own protos. Its own
  # database, because the catalogue is upstream data with its own lifecycle —
  # regenerated when protobuf-rfc releases, not when freebusy changes. Without a
  # rule here every RFC resource collapses into one schema: protoc-gen-store
  # falls back to the AIP resource-type host, and every protobuf-rfc resource
  # declares the same one ("the-protobuf-project.org").

  # RFC 7643's group/v1 keeps the schema it had while RFC 4519's group/v1,
  # now left out, shared the name "group".
  - match: "protobuf.rfc7643.group.**"
    database: rfc
    schema: scimgroup

  - match: "protobuf.**"
    database: rfc
    schema: "{leaf}" # rfc9073.resource.v1 -> schema "resource"
