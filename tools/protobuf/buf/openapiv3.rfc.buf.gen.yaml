# OpenAPI for the RFC services freebusy serves over REST -- Resources,
# Calendars, Events and Availabilities -- and
# none of the rest the module defines. The merge (`just gen openapi`) folds
# them into openapiv3-spec.yaml beside freebusy's own.
#
# Pinned to the same module commit as rfc.buf.gen.yaml.
version: v2
# protoc-gen-openapi is a Go plugin and wants every file's go_package, which
# the module leaves to its consumers: the SDK's own, as rfc.buf.gen.yaml sets.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: buf.build/gen/go/the-protobuf-project/rfc/protocolbuffers/go
      module: buf.build/the-protobuf-project/rfc
inputs:
  - module: buf.build/the-protobuf-project/rfc:ca7aabdffc7b4c9683b653da6de51503
    types:
      - protobuf.rfc9073.resource.v1.Resources
      - protobuf.rfc5545.calendar.v1.Calendars
      - protobuf.rfc5545.event.v1.Events
      - protobuf.rfc7953.availability.v1.Availabilities
plugins:
  - local: protoc-gen-openapi
    out: protobuf/generated/openapi/rfc
    opt:
      - output_mode=source_relative
