# Telemetry configuration for the freebusy service.
#
# This file is embedded in the binary and holds defaults. The values that vary
# per deployment — the OTLP collector endpoint, the environment, and the site
# labels — are overridden at runtime from environment variables (see
# internal/telemetry/telemetry.go), so the same binary serves every deployment without a
# rebuild.

[service]
name = "freebusy"
version = "1.0.0"
environment = "development"
description = "Generic availability and booking engine."

# Attributes added to all telemetry (logs, metrics, traces) come from the
# deployment, not from here: FREEBUSY_SITE and FREEBUSY_SITE_NAME label what
# this instance serves (see internal/telemetry/telemetry.go).

[telemetry]
enabled = true

# OpenTelemetry collector. The endpoint below is the local-dev default (the
# telemetry-core stack's gateway, OTLP over HTTP); in deployment set
# FREEBUSY_OTLP_ENDPOINT=host:port to point at the cluster collector (gRPC).
[telemetry.otlp]
enabled = true
endpoint = "localhost:6009"
use_http = true

# Metrics export interval
[telemetry.metrics]
export_interval_seconds = 5

[tracing]
enabled = true

# Logging Configuration
[logging.log]
report_caller = true    # Include file:line in logs
report_timestamp = true # Include timestamp in logs
caller_offset = 1       # Stack frame offset for caller info
