# Local development overlay for the freebusy service.
#
# NOT embedded in the binary — loaded from disk over the production defaults in
# freebusy.release.toml when present (developer machines only; see
# internal/config/config.go). Safe to hold localhost credentials here. Keys defined here
# win; anything omitted falls through to the release defaults.

[app]
name = "freebusy"
version = "v1.0.0"
description = "Generic availability and booking engine: compute availability, hold and reserve RFC 9073 resources."

[server]
# environment: "development", "debug", "staging", or "production".
environment = "debug"
enable_http = false
enable_health = true
enable_mcp = true
experimental_http3 = false

[server.grpc]
host = "0.0.0.0"
port = 50051

[server.http]
host = "0.0.0.0"
port = 8080

[server.mcp]
host = "0.0.0.0"
port = 8081
# transport: "stdio", "streamable-http", or "sse".
transport = "streamable-http"

[server.tls]
# Dev certificate (mkcert). Required because experimental_http3 = true above.
# Paths are relative to the working directory (repo root for `just run`).
cert_file = ".certs/freebusy-dev+2.pem"
key_file = ".certs/freebusy-dev+2-key.pem"

[database]
provider = "gorm"

[database.postgres]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = "postgrespassword"
dbname = "freebusydb"
sslmode = "disable"
timezone = "UTC"

[database.hasura]
url = "http://localhost:3280/graphql"

# Dev overlay: the cache is on and points at the local Redis container
# (docker: my-redis, 6379). Flip enabled=false to read straight through.
[cache]
enabled = true
address = "127.0.0.1:6379"
prefix = "freebusy-dev"

[caldav]
# CalDAV (RFC 4791) under /dav/ on the HTTP port. Unauthenticated: dev only.
enabled = true

[feeds]
# Read-only iCalendar feeds under /feeds/calendars/{calendar}.ics?token=...,
# for calendar apps that subscribe by URL (Google Calendar: From URL). On when
# a secret is set: 32+ random bytes, through FREEBUSY_FEEDS__SECRET.
secret = ""

[webhooks]
# Webhook delivery. Insecure endpoints: http:// to localhost, for a local receiver.
enabled = true
allow_insecure_endpoints = true
interval_seconds = 5
max_attempts = 8
allow_private_networks = true
retention_days = 30
# Seals signing secrets at rest. Set FREEBUSY_WEBHOOKS__SECRET_KEY to the
# output of `openssl rand -base64 32`; empty stores them unsealed.
secret_key = ""
previous_secret_keys = ""

[retention]
# Soft-deleted organizations, sites, resources, calendars, events and
# availability are purged for good this many days after deletion; until then
# Undelete restores them, and expire_time says when they go.
purge = true
deleted_days = 30
