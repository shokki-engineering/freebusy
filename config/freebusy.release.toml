# Production configuration for the freebusy service.
#
# Compiled into the binary via //go:embed (see config/config.go). Holds
# production-safe, non-secret topology only — secrets (passwords, admin secret)
# are left blank here and injected at deploy time. For local development these
# defaults are overlaid by config/freebusy.dev.toml.

[app]
name = "freebusy"
version = "v1.0.0"
description = "Promo code service for the freebusy booking platform: create, validate, and redeem discount codes."

[server]
# environment: "development", "debug", "staging", or "production".
environment = "production"
enable_http = true
enable_health = true
enable_mcp = true
experimental_http3 = false

[server.grpc]
host = "0.0.0.0"
port = 50051

[server.http]
host = "0.0.0.0"
port = 8080

[server.mcp]
host = "0.0.0.0"
port = 8081
# transport: "stdio", "streamable-http", or "sse".
transport = "streamable-http"

[server.tls]
# Required when experimental_http3 = true. Provide the PEM cert/key at deploy time.
cert_file = ""
key_file = ""

[database]
# provider selects the backend: "gorm" (Postgres) or "hasura".
provider = "gorm"

[database.postgres]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = ""
dbname = "freebusydb"
sslmode = "require"
timezone = "UTC"
# Connection-pool bounds; the pool is the process's backpressure point.
max_open_conns = 25
max_idle_conns = 25
conn_max_lifetime_minutes = 30
conn_max_idle_minutes = 5

[database.hasura]
url = ""
admin_secret = ""

# Startup seeding is a dev convenience; production data is never seeded. The dev
# overlay turns this on. Left explicit here so the default is documented, not
# implied by a zero value.
[seed]
enabled = false

# Read-through cache behind protoc-gen-cache's generated decorators.
#
# Off by default. The service is correct without it, and turning a cache on
# before the read it serves has been measured only adds a way to be stale.
#
# Resources annotated STRATEGY_INDEXED (PromoCode) need server-side sets, so the
# address must be Redis or Dragonfly; memcached is refused at construction.
[cache]
enabled = false
address = "127.0.0.1:6379"
username = ""
password = ""
database = 0
pool_size = 0
# Separates this deployment's keys from another sharing one server. Set it per
# environment — it is config, not schema, which is why cache.v1 has no prefix.
prefix = "freebusy"
