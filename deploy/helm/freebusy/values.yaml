# freebusy on Kubernetes. Postgres (and Redis, when the cache is on) are yours:
# a managed database, or one you run. The chart runs the server, applies the
# migrations before each pod starts, and -- when hasura.enabled -- the Hasura
# engine and connector.
#
# freebusy has no authentication yet: keep the Service internal (ClusterIP)
# and reachable only by your own workloads.

replicaCount: 2

image:
  repository: ghcr.io/shokki-engineering/freebusy
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Applies deploy/migrations/ in an init container before the server starts. atlas
# takes a database lock, so replicas starting together apply them once.
migrations:
  enabled: true
  image:
    repository: ghcr.io/shokki-engineering/freebusy-migrations
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []

database:
  # gorm (Postgres, the production default) or hasura.
  provider: gorm
  postgres:
    host: ""
    port: 5432
    user: freebusy
    dbname: freebusydb
    sslmode: require
  hasura:
    # The engine's GraphQL endpoint. Empty: the chart's own engine when
    # hasura.enabled.
    url: ""

# Secrets. Name an existing Secret (recommended: from your secret store), or
# let the chart create one from the values below. Keys:
#   postgres-password             required
#   webhook-secret-key            seals webhook signing secrets (openssl rand -base64 32)
#   webhook-previous-secret-keys  after a rotation, the old keys, comma-separated
#   redis-password                when cache.enabled
#   connector-token               when hasura.enabled: the engine's bearer token for the connector
#   opensearch-username           when search.provider is opensearch and the cluster wants basic auth
#   opensearch-password
# The migrations' database URL is built from these: keep the Postgres
# password URL-safe (openssl rand -hex 24).
secrets:
  existingSecret: ""
  postgresPassword: ""
  webhookSecretKey: ""
  webhookPreviousSecretKeys: ""
  redisPassword: ""
  connectorToken: ""
  opensearchUsername: ""
  opensearchPassword: ""

# The reservation list cache (Redis or Dragonfly).
cache:
  enabled: false
  address: ""

# The availability read model searches read their candidates from: one row
# per resource per UTC day, in Postgres, kept current in every write. The
# server backfills it as it starts when it is empty ([search]
# rebuild_on_start; set FREEBUSY_SEARCH__REBUILD_ON_START=always in extraEnv
# for one rollout to repair it).
search:
  # postgres (the read model's own table) or opensearch: SearchAvailability
  # served from an external OpenSearch cluster the server indexes into,
  # falling back to Postgres on errors and timeouts. The server loads an
  # empty index from Postgres as it starts ([search.opensearch]
  # reindex_on_start).
  provider: postgres
  # Days ahead the read model covers; the server extends it daily.
  horizonDays: 365
  opensearch:
    # The cluster, e.g. https://opensearch.search.svc:9200. Credentials go
    # in the Secret (opensearch-username / opensearch-password).
    url: ""

telemetry:
  # OTLP collector, host:port (gRPC). Empty exports nothing.
  otlpEndpoint: ""
  # true when the collector serves TLS.
  otlpSecure: false
  environment: production
  # Labels this deployment's telemetry.
  site: ""

webhooks:
  enabled: true

# Any other setting, as FREEBUSY_<SECTION>__<KEY>: value.
extraEnv: {}

service:
  type: ClusterIP
  grpcPort: 50051
  httpPort: 8080
  mcpPort: 8081

# In-flight calls finish on SIGTERM; this is how long they get. The server's
# drain bound (server.shutdown_timeout_seconds) is derived from it: this, less
# preStopSleepSeconds, less 5 s to flush telemetry -- 20 s by default.
terminationGracePeriodSeconds: 30

# Seconds a terminating pod keeps serving before SIGTERM, so the Service's
# endpoints drop it before it stops accepting connections. Without it, calls
# dialled during a rolling restart are refused. 0 turns it off. The pod
# lifecycle sleep action needs Kubernetes 1.30 or later (the image has no shell).
preStopSleepSeconds: 5

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# `helm test <release>`: a Pod that checks /health and a read API through the
# Service (templates/tests/smoke.yaml).
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The Hasura DDN engine and its Postgres connector, for provider: hasura.
#
# The engine image carries its metadata build, and the build carries the
# connector's URL and token. Build one for this release: in deploy/hasura/.env set
# FREEBUSY_FREEBUSY_PGSQL_READ_URL and _WRITE_URL to
# http://<release>-freebusy-connector:9794 and the bearer token, run
# `just hasura regen`, and build deploy/hasura/engine/Dockerfile.engine. The
# committed build points at local.hasura.dev and only suits Compose.
hasura:
  enabled: false
  engine:
    image:
      repository: ghcr.io/shokki-engineering/freebusy-engine
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
  connector:
    image:
      repository: ghcr.io/shokki-engineering/freebusy-connector
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
