apiVersion: v1
kind: Service
metadata:
  name: {{ include "freebusy.fullname" . }}
  labels:
    {{- include "freebusy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "freebusy.selector" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: grpc, port: {{ .Values.service.grpcPort }}, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: {{ .Values.service.httpPort }}, targetPort: http }
    - { name: mcp, port: {{ .Values.service.mcpPort }}, targetPort: mcp }
