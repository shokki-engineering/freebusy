{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freebusy.fullname" . }}
  labels:
    {{- include "freebusy.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword (or secrets.existingSecret) is required" .Values.secrets.postgresPassword | quote }}
  webhook-secret-key: {{ .Values.secrets.webhookSecretKey | quote }}
  webhook-previous-secret-keys: {{ .Values.secrets.webhookPreviousSecretKeys | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  connector-token: {{ .Values.secrets.connectorToken | quote }}
{{- end }}
