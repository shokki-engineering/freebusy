{{- $secret := include "freebusy.secretName" . }}
{{- $pg := .Values.database.postgres }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freebusy.fullname" . }}
  labels:
    {{- include "freebusy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "freebusy.selector" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "freebusy.selector" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "freebusy.image" (dict "image" .Values.migrations.image "root" .) }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: postgres-password }
          args:
            - --url
            - "postgres://{{ $pg.user }}:$(PGPASSWORD)@{{ required "database.postgres.host is required" $pg.host }}:{{ $pg.port }}/{{ $pg.dbname }}?sslmode={{ $pg.sslmode }}"
          securityContext:
            {{- include "freebusy.securityContext" . | nindent 12 }}
      {{- end }}
      containers:
        - name: freebusy
          image: {{ include "freebusy.image" (dict "image" .Values.image "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 8080 }
            - { name: mcp, containerPort: 8081 }
          env:
            # Stop drains within the grace period, less the preStop sleep and
            # 5 s to flush telemetry and close connections.
            - { name: FREEBUSY_SERVER__SHUTDOWN_TIMEOUT_SECONDS, value: {{ max 1 (sub (sub (int .Values.terminationGracePeriodSeconds) (int (default 0 .Values.preStopSleepSeconds))) 5) | quote }} }
            - { name: FREEBUSY_DATABASE__PROVIDER, value: {{ .Values.database.provider | quote }} }
            - { name: FREEBUSY_DATABASE__POSTGRES__HOST, value: {{ $pg.host | quote }} }
            - { name: FREEBUSY_DATABASE__POSTGRES__PORT, value: {{ $pg.port | quote }} }
            - { name: FREEBUSY_DATABASE__POSTGRES__USER, value: {{ $pg.user | quote }} }
            - { name: FREEBUSY_DATABASE__POSTGRES__DBNAME, value: {{ $pg.dbname | quote }} }
            - { name: FREEBUSY_DATABASE__POSTGRES__SSLMODE, value: {{ $pg.sslmode | quote }} }
            - name: FREEBUSY_DATABASE__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: postgres-password }
            {{- if eq .Values.database.provider "hasura" }}
            - { name: FREEBUSY_DATABASE__HASURA__URL, value: {{ include "freebusy.hasuraURL" . | quote }} }
            {{- end }}
            - { name: FREEBUSY_WEBHOOKS__ENABLED, value: {{ .Values.webhooks.enabled | quote }} }
            - name: FREEBUSY_WEBHOOKS__SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: webhook-secret-key, optional: true }
            - name: FREEBUSY_WEBHOOKS__PREVIOUS_SECRET_KEYS
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: webhook-previous-secret-keys, optional: true }
            {{- with .Values.cors }}
            {{- if .enabled }}
            {{- if and .allowCredentials (has "*" .allowedOrigins) }}
            {{- fail "cors.allowCredentials cannot be combined with the \"*\" origin; list the origins" }}
            {{- end }}
            - { name: FREEBUSY_SERVER__CORS__ENABLED, value: "true" }
            - { name: FREEBUSY_SERVER__CORS__ALLOWED_ORIGINS, value: {{ required "cors.allowedOrigins is required when cors.enabled" (join "," .allowedOrigins) | quote }} }
            {{- with .allowedMethods }}
            - { name: FREEBUSY_SERVER__CORS__ALLOWED_METHODS, value: {{ join "," . | quote }} }
            {{- end }}
            {{- with .allowedHeaders }}
            - { name: FREEBUSY_SERVER__CORS__ALLOWED_HEADERS, value: {{ join "," . | quote }} }
            {{- end }}
            {{- with .exposedHeaders }}
            - { name: FREEBUSY_SERVER__CORS__EXPOSED_HEADERS, value: {{ join "," . | quote }} }
            {{- end }}
            - { name: FREEBUSY_SERVER__CORS__ALLOW_CREDENTIALS, value: {{ .allowCredentials | quote }} }
            - { name: FREEBUSY_SERVER__CORS__MAX_AGE_SECONDS, value: {{ .maxAgeSeconds | int | quote }} }
            {{- end }}
            {{- end }}
            {{- if .Values.cache.enabled }}
            - { name: FREEBUSY_CACHE__ENABLED, value: "true" }
            - { name: FREEBUSY_CACHE__ADDRESS, value: {{ required "cache.address is required when cache.enabled" .Values.cache.address | quote }} }
            - name: FREEBUSY_CACHE__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: redis-password, optional: true }
            {{- end }}
            - { name: FREEBUSY_SEARCH__PROVIDER, value: {{ .Values.search.provider | quote }} }
            - { name: FREEBUSY_SEARCH__HORIZON_DAYS, value: {{ .Values.search.horizonDays | quote }} }
            {{- if eq .Values.search.provider "opensearch" }}
            - { name: FREEBUSY_SEARCH__OPENSEARCH__URL, value: {{ required "search.opensearch.url is required when search.provider is opensearch" .Values.search.opensearch.url | quote }} }
            - name: FREEBUSY_SEARCH__OPENSEARCH__USERNAME
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: opensearch-username, optional: true }
            - name: FREEBUSY_SEARCH__OPENSEARCH__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: opensearch-password, optional: true }
            {{- end }}
            # Each replica's own telemetry identity: without it, replicas
            # exporting the same service.name overwrite each other's metrics.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: FREEBUSY_TELEMETRY_INSTANCE_ID, value: "$(POD_NAME)" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name={{ include "freebusy.fullname" . }}" }
            {{- with .Values.telemetry }}
            - { name: FREEBUSY_OTLP_ENDPOINT, value: {{ .otlpEndpoint | quote }} }
            {{- if not .otlpEndpoint }}
            # No collector: the embedded telemetry.toml's local-dev endpoint
            # would otherwise apply, now that /tmp is writable.
            - { name: OTEL_EXPORTER_OTLP_ENABLED, value: "false" }
            {{- end }}
            - { name: FREEBUSY_OTLP_SECURE, value: {{ .otlpSecure | quote }} }
            - { name: FREEBUSY_TELEMETRY_ENVIRONMENT, value: {{ .environment | quote }} }
            - { name: FREEBUSY_SITE, value: {{ .site | quote }} }
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- with .Values.preStopSleepSeconds }}
          lifecycle:
            preStop:
              sleep: { seconds: {{ . }} }
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "freebusy.securityContext" . | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; telemetry writes its config
            # file to the temp directory.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
