# The chart on kind, over deploy/kind/datastores.yaml, with the images
# `bazel run //deploy/image:load` and `//deploy/image:load_migrations` put in the local
# Docker and `kind load docker-image` copied into the cluster.
replicaCount: 2
image:
  repository: ghcr.io/shokki-engineering/freebusy
  tag: latest
  pullPolicy: Never
migrations:
  image:
    repository: ghcr.io/shokki-engineering/freebusy-migrations
    tag: latest
    pullPolicy: Never
database:
  provider: gorm
  postgres:
    host: postgres.freebusy.svc.cluster.local
secrets:
  existingSecret: freebusy-secrets
cache:
  enabled: true
  address: redis.freebusy.svc.cluster.local:6379
telemetry:
  environment: staging
  site: kind
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
