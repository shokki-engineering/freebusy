# The telemetry image's Prometheus configuration with two additions: freebusy's
# alert rules (alerts.yaml, mounted beside the image's own rules) and the
# image's Alertmanager as their destination -- the image runs Alertmanager on
# :9093 but does not point Prometheus at it. Rules evaluate every 15 s: the
# metrics arrive by remote write, so nothing changes faster. The scrape jobs
# are the image's own.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/opentelemetry-stack/prometheus-rules.yaml
  - /etc/opentelemetry-stack/freebusy-alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^(thirdparty_.*|push_time_seconds)$"
        action: keep
      - source_labels: [__name__]
        regex: "^(go_.*|process_.*|prometheus_.*|pushgateway_.*|scrape_.*|promhttp_.*|net_.*|up)$"
        action: drop

  - job_name: "pushgateway"
    static_configs:
      - targets: ["localhost:9091"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^(thirdparty_.*|push_time_seconds)$"
        action: keep
      - source_labels: [__name__]
        regex: "^(go_.*|process_.*|prometheus_.*|pushgateway_.*|scrape_.*|promhttp_.*|net_.*|up)$"
        action: drop
